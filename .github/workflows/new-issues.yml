name: Initialize Issue

on:
  issues:
    types:
      - opened
      - edited

permissions:
  contents: read
  issues: write

concurrency:
  group: initialize-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  initialize:
    runs-on: ubuntu-latest

    steps:
      - name: Initialize Issue
        uses: actions/github-script@v8

        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

          script: |

            const issue = context.payload.issue;
            const issueBody = issue.body ?? "";
            const issueId = issue.node_id;
            const issueNumber = issue.number;

            /*
             * ============================================================
             * Configuration
             * ============================================================
             */

            const ISSUE_FIELDS = {

              product: {

                label: "Product",

                fieldId: "IFSS_kgDOAqu9dA",

                options: {

                  ScriptSure: "IFSSO_kgDOBKyrFQ",
                  VetWay: "IFSSO_kgDOBKyrFg",
                  Exchange: "IFSSO_kgDOBKyrFw"

                }

              },

              priority: {

                label: "Priority",

                fieldId: "IFSS_kgDOAqcSiw",

                options: {

                  "PROD Critical": "IFSSO_kgDOBKR5-Q",
                  P0: "IFSSO_kgDOBKyRWg",
                  P1: "IFSSO_kgDOBKR5-g",
                  P2: "IFSSO_kgDOBKR5-w",
                  P3: "IFSSO_kgDOBKR5_A",
                  P4: "IFSSO_kgDOBKyRWw"

                }

              },

              source: {

                label: "Source",

                fieldId: "IFSS_kgDOAqu99Q",

                options: {

                  Customer: "IFSSO_kgDOBKysHA",
                  QA: "IFSSO_kgDOBKysHQ",
                  Demo: "IFSSO_kgDOBKysHg",
                  Support: "IFSSO_kgDOBKysHw",
                  "Internal Testing": "IFSSO_kgDOBKysIA",
                  Other: "IFSSO_kgDOBKysIQ"

                }

              }

            };
                        /*
             * Returns the answer beneath an Issue Form heading.
             *
             * Example:
             *
             * ### Product
             *
             * ScriptSure
             */
            function getIssueFormAnswer(label) {

              const escapedLabel =
                label.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

              const pattern = new RegExp(
                `(?:^|\\n)###\\s+${escapedLabel}\\s*\\n+([\\s\\S]*?)(?=\\n###\\s+|$)`,
                "i"
              );

              const match = issueBody.match(pattern);

              if (!match) {
                return null;
              }

              const answer = match[1]
                .replace(/<!--[\s\S]*?-->/g, "")
                .trim();

              if (
                answer === "" ||
                /^_No response_$/i.test(answer)
              ) {
                return null;
              }

              return answer;

            }

            /*
             * Read every configured Issue Form field.
             */
            function getIssueFormValues() {

              const values = {};

              for (const [key, field] of Object.entries(ISSUE_FIELDS)) {

                values[key] =
                  getIssueFormAnswer(field.label);

              }

              return values;

            }

            /*
             * Write the parsed values to the Actions log.
             */
            function logIssueFormValues(values) {

              core.startGroup("Issue Form Values");

              for (const [key, value] of Object.entries(values)) {

                core.info(
                  `${key}: ${value ?? "(none)"}`
                );

              }

              core.endGroup();

            }
                        /*
             * Set a single Issue Field.
             */
            async function setIssueField(issueId, field, value) {

              const optionId = field.options[value];

              if (!optionId) {

                throw new Error(
                  `"${value}" is not a configured option for "${field.label}".`
                );

              }

              core.info(
                `Setting ${field.label} → ${value}`
              );

              /*
               * TODO:
               * Replace this GraphQL mutation with the final version.
               */
              await github.graphql(

                `
                mutation(
                  $issueId: ID!
                  $fieldId: ID!
                  $optionId: ID!
                ) {

                  setIssueFieldValue(
                    input: {
                      issueId: $issueId
                      fieldId: $fieldId
                      singleSelectOptionId: $optionId
                    }
                  ) {
                    issue {
                      number
                    }
                  }

                }
                `,

                {
                  issueId,
                  fieldId: field.fieldId,
                  optionId
                }

              );

            }

            /*
             * Update every configured Issue Field.
             */
            async function updateIssueFields(values) {

              core.startGroup("Updating Issue Fields");

              for (const field of Object.values(ISSUE_FIELDS)) {

                const value =
                  values[
                    Object.keys(ISSUE_FIELDS).find(
                      key => ISSUE_FIELDS[key] === field
                    )
                  ];

                if (!value) {

                  core.info(
                    `Skipping ${field.label}`
                  );

                  continue;

                }

                await setIssueField(
                  issueId,
                  field,
                  value
                );

              }

              core.endGroup();

            }
