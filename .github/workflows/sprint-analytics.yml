              // Quality
              // ===========================================

              function renderQuality(
                sprint
              ) {

                const container =
                  document.getElementById(
                    "qualityKpis"
                  );


                container.innerHTML =
                  "";


                const opened =
                  bugsOpened(
                    sprint
                  );


                const closed =
                  bugsClosed(
                    sprint
                  );


                addKpi(
                  container,
                  "Bugs Opened",
                  opened.length,
