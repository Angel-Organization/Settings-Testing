            <script>

              let projectData =
                null;


              const cacheVersion =
                Date.now();


              const TYPE_COLORS = [

                "#2499e8",
                "#49b94f",
                "#0f5f98",
                "#7bc8f6",
                "#8fd694",
                "#506784",
                "#b8dff7",
                "#86a9c4",
                "#a7d9aa",
                "#36566f",
                "#5ab5ef",
                "#72c879"

              ];


              // ===========================================
              // Helpers
              // ===========================================

              function escapeHtml(value) {

                return String(
                  value ?? ""
                )
                .replaceAll(
                  "&",
                  "&amp;"
                )
                .replaceAll(
                  "<",
                  "&lt;"
                )
                .replaceAll(
                  ">",
                  "&gt;"
                )
                .replaceAll(
                  '"',
                  "&quot;"
                )
                .replaceAll(
                  "'",
                  "&#039;"
                );

              }


              function cap(name) {

                return (
                  projectData
                  ?.capabilities
                  ?.[name]
                  ?.available
                  ===
                  true
                );

              }


              function issueId(issue) {

                return (
                  issue.repository
                  +
                  "#"
                  +
                  issue.number
                );

              }


              function within(
                date,
                sprint
              ) {

                return Boolean(
                  date
                  &&
                  date >=
                  sprint.start
                  &&
                  date <=
                  sprint.end
                );

              }


              function localToday() {

                const date =
                  new Date();


                const year =
                  date.getFullYear();


                const month =
                  String(
                    date.getMonth()
                    +
                    1
                  )
                  .padStart(
                    2,
                    "0"
                  );


                const day =
                  String(
                    date.getDate()
                  )
                  .padStart(
                    2,
                    "0"
                  );


                return (
                  `${year}-`
                  +
                  `${month}-`
                  +
                  `${day}`
                );

              }


              function selectedSprint() {

                if (!projectData) {

                  return null;

                }


                const index =
                  Number(
                    document
                    .getElementById(
                      "sprintSelect"
                    )
                    .value
                  );


                return (
                  projectData
                  .sprints[index]
                  ||
                  null
                );

              }


              function sumLoe(issues) {

                return issues.reduce(
                  (
                    total,
                    issue
                  ) => {

                    const value =
                      Number(
                        issue.loe
                      );


                    return (
                      total
                      +
                      (
                        Number.isFinite(
                          value
                        )
                        ?
                        value
                        :
                        0
                      )
                    );

                  },
                  0
                );

              }


              function formatDays(value) {

                const number =
                  Number(value);


                return (
                  (
                    Number.isFinite(number)
                    ?
                    number
                    :
                    0
                  )
                  .toFixed(1)
                  .replace(
                    /\.0$/,
                    ""
                  )
                  +
                  " days"
                );

              }


              // ===========================================
              // Sprint transitions
              // ===========================================

              function transitions(issue) {

                return (
                  issue.sprintTransitions
                  ||
                  []
                )
                .slice()
                .sort(
                  (a,b) =>
                    a.date.localeCompare(
                      b.date
                    )
                );

              }


              function isBacklog(value) {

                return (
                  String(
                    value
                    ||
                    ""
                  )
                  .trim()
                  .toLowerCase()
                  ===
                  "backlog"
                );

              }


              function isSprint(value) {

                return /^sprint\b/i
                  .test(
                    String(
                      value
                      ||
                      ""
                    )
                    .trim()
                  );

              }


              function entriesIntoSprint(
                issue,
                sprint
              ) {

                return transitions(
                  issue
                )
                .filter(
                  event =>
                    event.to
                    ===
                    sprint.name
                );

              }


              function exitsFromSprint(
                issue,
                sprint
              ) {

                return transitions(
                  issue
                )
                .filter(
                  event =>
                    event.from
                    ===
                    sprint.name
                    &&
                    event.to
                    !==
                    sprint.name
                );

              }


              /*
               * An entry on the first calendar day
               * counts as committed.
               */

              function committedEntry(
                issue,
                sprint
              ) {

                const relevant =
                  transitions(
                    issue
                  )
                  .filter(
                    event =>
                      event.date
                      <=
                      sprint.start
                  );


                let inSprint =
                  false;


                let entry =
                  null;


                relevant.forEach(
                  event => {

                    if (
                      event.to
                      ===
                      sprint.name
                    ) {

                      inSprint =
                        true;

                      entry =
                        event;

                    }


                    if (
                      event.from
                      ===
                      sprint.name
                      &&
                      event.to
                      !==
                      sprint.name
                    ) {

                      inSprint =
                        false;

                      entry =
                        null;

                    }

                  }
                );


                return (
                  inSprint
                  ?
                  entry
                  :
                  null
                );

              }


              function committedIssues(
                sprint
              ) {

                return projectData
                  .issues
                  .filter(
                    issue =>
                      Boolean(
                        committedEntry(
                          issue,
                          sprint
                        )
                      )
                  );

              }


              /*
               * Carryover:
               *
               * the entry INTO this sprint came
               * from another Sprint.
               *
               * Backlog resets carryover.
               */

              function carryoverEntry(
                issue,
                sprint
              ) {

                const entries =
                  entriesIntoSprint(
                    issue,
                    sprint
                  );


                if (!entries.length) {

                  return null;

                }


                const entry =
                  entries[
                    entries.length - 1
                  ];


                if (
                  isBacklog(
                    entry.from
                  )
                ) {

                  return null;

                }


                if (
                  isSprint(
                    entry.from
                  )
                  &&
                  entry.from
                  !==
                  sprint.name
                ) {

                  return entry;

                }


                return null;

              }


              function carriedOverIssues(
                sprint
              ) {

                return projectData
                  .issues
                  .filter(
                    issue =>
                      Boolean(
                        carryoverEntry(
                          issue,
                          sprint
                        )
                      )
                  );

              }


              /*
               * Day 1 is NOT late.
               */

              function addedLateIssues(
                sprint
              ) {

                return projectData
                  .issues
                  .filter(
                    issue =>
                      entriesIntoSprint(
                        issue,
                        sprint
                      )
                      .some(
                        event =>
                          event.date
                          >
                          sprint.start
                          &&
                          event.date
                          <=
                          sprint.end
                      )
                  );

              }


              function removedIssues(
                sprint
              ) {

                return projectData
                  .issues
                  .filter(
                    issue =>
                      exitsFromSprint(
                        issue,
                        sprint
                      )
                      .some(
                        event =>
                          within(
                            event.date,
                            sprint
                          )
                      )
                  );

              }


              function sprintEntryLabel(
                issue,
                sprint
              ) {

                const committed =
                  committedEntry(
                    issue,
                    sprint
                  );


                if (committed) {

                  if (
                    isSprint(
                      committed.from
                    )
                  ) {

                    return "Carryover";

                  }


                  return "Committed";

                }


                const lateEntries =
                  entriesIntoSprint(
                    issue,
                    sprint
                  )
                  .filter(
                    event =>
                      event.date
                      >
                      sprint.start
                      &&
                      event.date
                      <=
                      sprint.end
                  );


                if (
                  lateEntries.length
                ) {

                  const last =
                    lateEntries[
                      lateEntries.length
                      -
                      1
                    ];


                  if (
                    isSprint(
                      last.from
                    )
                  ) {

                    return "Late Carryover";

                  }


                  return "Added Late";

                }


                return "";

              }


              function carriedFrom(
                issue,
                sprint
              ) {

                const entry =
                  carryoverEntry(
                    issue,
                    sprint
                  );


                return (
                  entry
                  ?
                  entry.from
                  :
                  ""
                );

              }


              // ===========================================
              // Core metrics
              // ===========================================

              function openedIssues(
                sprint,
                priority = null
              ) {

                return projectData
                  .issues
                  .filter(
                    issue =>
                      (
                        priority
                        ===
                        null
                        ||
                        issue.priority
                        ===
                        priority
                      )
                      &&
                      within(
                        issue.opened,
                        sprint
                      )
                  );

              }


              function closedIssues(
                sprint,
                priority = null
              ) {

                return projectData
                  .issues
                  .filter(
                    issue =>
                      (
                        priority
                        ===
                        null
                        ||
                        issue.priority
                        ===
                        priority
                      )
                      &&
                      within(
                        issue.closed,
                        sprint
                      )
                  );

              }


              function plannedScopeIssues(
                sprint
              ) {

                const ids =
                  new Set();


                committedIssues(
                  sprint
                )
                .forEach(
                  issue =>
                    ids.add(
                      issueId(issue)
                    )
                );


                addedLateIssues(
                  sprint
                )
                .forEach(
                  issue =>
                    ids.add(
                      issueId(issue)
                    )
                );


                return projectData
                  .issues
                  .filter(
                    issue =>
                      ids.has(
                        issueId(issue)
                      )
                  );

              }


              function completedScopeIssues(
                sprint
              ) {

                const scopeIds =
                  new Set(
                    plannedScopeIssues(
                      sprint
                    )
                    .map(
                      issueId
                    )
                  );


                return closedIssues(
                  sprint
                )
                .filter(
                  issue =>
                    scopeIds.has(
                      issueId(issue)
                    )
                );

              }


              function completionRate(
                sprint
              ) {

                const scope =
                  plannedScopeIssues(
                    sprint
                  );


                if (!scope.length) {

                  return 0;

                }


                return (
                  completedScopeIssues(
                    sprint
                  ).length
                  /
                  scope.length
                  *
                  100
                );

              }


              // ===========================================
              // Workflow
              // ===========================================

              function statusIssues(
                sprint,
                status,
                priority = null
              ) {

                return projectData
                  .issues
                  .filter(
                    issue =>
                      (
                        priority
                        ===
                        null
                        ||
                        issue.priority
                        ===
                        priority
                      )
                      &&
                      (
                        issue.statusEvents
                        ||
                        []
                      )
                      .some(
                        event =>
                          event.status
                          ===
                          status
                          &&
                          within(
                            event.date,
                            sprint
                          )
                      )
                  );

              }


              function statusDates(
                issue,
                status
              ) {

                return (
                  issue.statusEvents
                  ||
                  []
                )
                .filter(
                  event =>
                    event.status
                    ===
                    status
                )
                .map(
                  event =>
                    event.date
                )
                .sort();

              }


              function workedIssues(
                sprint
              ) {

                const ids =
                  new Set();


                projectData
                  .issues
                  .forEach(
                    issue => {

                      if (
                        within(
                          issue.closed,
                          sprint
                        )
                      ) {

                        ids.add(
                          issueId(issue)
                        );

                      }


                      (
                        issue.statusEvents
                        ||
                        []
                      )
                      .forEach(
                        event => {

                          if (
                            within(
                              event.date,
                              sprint
                            )
                          ) {

                            ids.add(
                              issueId(issue)
                            );

                          }

                        }
                      );

                    }
                  );


                return projectData
                  .issues
                  .filter(
                    issue =>
                      ids.has(
                        issueId(issue)
                      )
                  );

              }


              // ===========================================
              // Bug helpers
              // ===========================================

              function isBug(issue) {

                return (
                  String(
                    issue.issueType
                    ||
                    ""
                  )
                  .toLowerCase()
                  ===
                  "bug"
                );

              }


              function bugsOpened(
                sprint,
                priority = null
              ) {

                return openedIssues(
                  sprint,
                  priority
                )
                .filter(
                  isBug
                );

              }


              function bugsClosed(
                sprint,
                priority = null
              ) {

                return closedIssues(
                  sprint,
                  priority
                )
                .filter(
                  isBug
                );

              }


              // ===========================================
              // KPI helper
              // ===========================================

              function addKpi(
                container,
                label,
                value,
                issues = null,
                subtext = ""
              ) {

                const card =
                  document
                  .createElement(
                    "div"
                  );


                card.className =
                  issues
                  ?
                  "card clickable"
                  :
                  "card";


                card.innerHTML = `

                  <div
                    class="label">

                    ${
                      escapeHtml(
                        label
                      )
                    }

                  </div>

                  <div
                    class="number">

                    ${
                      escapeHtml(
                        value
                      )
                    }

                  </div>

                  ${
                    subtext
                    ?
                    `
                    <div
                      class="subnumber">

                      ${
                        escapeHtml(
                          subtext
                        )
                      }

                    </div>
                    `
                    :
                    ""
                  }

                `;


                if (issues) {

                  card.onclick =
                    () =>
                      openDrilldown(
                        label,
                        selectedSprint(),
                        issues
                      );

                }


                container.appendChild(
                  card
                );

              }


