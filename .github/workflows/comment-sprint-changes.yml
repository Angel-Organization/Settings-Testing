# This workflow leaves a comment on open issues in the configured GitHub
# Projects when they are added to a Sprint, removed from a Sprint, or moved
# to a different Sprint.
#
# It runs daily at 8:00 AM Eastern Daylight Time (12:00 UTC), or when
# manually triggered.
#
# Comments:
# - Backlog -> Sprint 190
# - Sprint 190 -> Sprint 191
# - Sprint 191 -> Backlog
#
# When an issue belongs to multiple projects:
# - Each project's Sprint is tracked independently
# - A change in one project does not change another project's Sprint
# - Multiple changes are combined into one issue comment
#
# It does not comment when:
# - An issue remains in the same Sprint
# - An issue remains in Backlog
# - An issue is closed
# - An issue is outside all configured projects
#
# Archived, closed, or removed project items are not included.
# Removing an issue from a project is not treated as a Sprint change.

name: Comment Sprint Changes

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: read
  issues: write

# Prevent overlapping runs from posting duplicate comments.
concurrency:
  group: comment-sprint-changes
  cancel-in-progress: false

jobs:
  sprint-tracker:
    runs-on: ubuntu-latest

    env:
      OWNER: angel-organization

      # ------------------------------------------------------------
      # PROJECT CONFIGURATION
      #
      # Add or remove projects here. No other code changes are needed.
      #
      # number: GitHub organization Project number
      # name: Display name used in issue comments
      # legacy: Read/write the original unscoped sprint-tracker marker
      #
      # Only use legacy: true for the project whose existing issue
      # comments use <!-- sprint-tracker:Old -> New -->.
      # ------------------------------------------------------------
      PROJECTS: |
        [
          {"number": 1, "name": "ScriptSure", "legacy": true},
          {"number": 3, "name": "VetWay"},
          {"number": 2, "name": "MedSpa"}
        ]

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ACTIONS_APP_ID }}
          private-key: ${{ secrets.ACTIONS_APP_PRIVATE_KEY }}
          owner: ${{ env.OWNER }}

      - name: Comment on sprint changes
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, re, subprocess
          from collections import defaultdict

          OWNER = os.environ["OWNER"]
          PROJECTS = json.loads(os.environ["PROJECTS"])
          CONFIG = {p["number"]: p for p in PROJECTS}

          def api(*args):
              return json.loads(subprocess.check_output(["gh", "api", *args], text=True))

          # ------------------------------------------------------------
          # FETCH PROJECT ITEMS
          #
          # Retrieve open issues from every configured project.
          # Pagination ensures projects with more than 100 items are
          # fully processed.
          #
          # ------------------------------------------------------------
          QUERY = """
          query($owner:String!, $number:Int!, $cursor:String) {
            organization(login:$owner) {
              projectV2(number:$number) {
                items(first:100, after:$cursor, archivedStates:[NOT_ARCHIVED]) {
                  pageInfo { hasNextPage endCursor }
                  nodes {
                    content {
                      ... on Issue {
                        number state
                        repository { nameWithOwner }
                      }
                    }
                    fieldValues(first:100) {
                      nodes {
                        ... on ProjectV2ItemFieldIterationValue {
                          title
                          field { ... on ProjectV2FieldCommon { name } }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
          """

          # Store each issue once, with a separate Sprint per project.
          # Key: (repository, issue number)
          # Value: {project number: current Sprint}
          issues = defaultdict(dict)

          for project in PROJECTS:
              number, cursor = project["number"], None

              while True:
                  args = ["graphql", "-f", f"query={QUERY}", "-f", f"owner={OWNER}", "-F", f"number={number}"]
                  if cursor: args += ["-f", f"cursor={cursor}"]

                  data = api(*args)["data"]["organization"]["projectV2"]
                  if not data: raise RuntimeError(f"Cannot access Project #{number}")

                  for item in data["items"]["nodes"]:
                      issue = item.get("content") or {}
                      if issue.get("state") != "OPEN" or not issue.get("repository"): continue

                      # Read the current Sprint. An issue without an
                      # assigned iteration is considered to be in Backlog.
                      sprint = next((
                          v["title"] for v in item["fieldValues"]["nodes"]
                          if v and (v.get("field") or {}).get("name", "").lower() in ("sprint", "iteration")
                      ), "Backlog")

                      key = (issue["repository"]["nameWithOwner"], issue["number"])
                      issues[key][number] = sprint

                  page = data["items"]["pageInfo"]
                  if not page["hasNextPage"]: break
                  cursor = page["endCursor"]

          # ------------------------------------------------------------
          # CHECK SPRINT HISTORY
          #
          # Sprint changes are recorded in hidden HTML comments.
          #
          # Original format:
          # <!-- sprint-tracker:Backlog -> Sprint 190 -->
          #
          # Project-specific format:
          # <!-- sprint-tracker-project-11:Backlog -> Sprint 190 -->
          #
          # Each project reads only its own markers. The legacy project
          # also reads the original format to preserve existing history.
          # ------------------------------------------------------------
          def marker(project):
              return "sprint-tracker" if CONFIG[project].get("legacy") else f"sprint-tracker-project-{project}"

          def previous_sprint(comments, project):
              name = marker(project)
              pattern = rf"<!--\s*{re.escape(name)}:\s*(.*?)\s*->\s*(.*?)\s*-->"

              events = [
                  (c["created_at"], c["id"], m.group(2).strip())
                  for c in comments
                  for m in re.finditer(pattern, c.get("body") or "", re.I)
              ]
              return max(events)[2] if events else "Backlog"

          # ------------------------------------------------------------
          # COMMENT ON CHANGES
          #
          # Fetch each issue's comments only once, even if it belongs
          # to several projects.
          #
          # Compare each project's current Sprint against its last
          # recorded Sprint. Only changed assignments are included.
          #
          # Post one consolidated comment per issue to avoid duplicate
          # notifications when multiple projects change simultaneously.
          # ------------------------------------------------------------
          for (repo, number), assignments in issues.items():
              pages = api("--paginate", "--slurp", f"repos/{repo}/issues/{number}/comments?per_page=100")
              comments = [c for page in pages for c in page]

              changes = [
                  (project, previous_sprint(comments, project), current)
                  for project, current in sorted(assignments.items())
              ]
              changes = [(p, old, new) for p, old, new in changes if old != new]

              # No comment if every Sprint is unchanged.
              if not changes: continue

              # Hidden markers are used by future runs to identify the
              # latest Sprint for each project.
              markers = [
                  f"<!-- {marker(p)}:{old} -> {new} -->"
                  for p, old, new in changes
              ]

              # Visible comment identifies which project changed.
              details = [
                  f"**{CONFIG[p]['name']} (#{p}):** {old} -> {new}"
                  for p, old, new in changes
              ]

              body = "\n".join(markers + ["", "**Sprint updated:**", ""] + details)
              api(f"repos/{repo}/issues/{number}/comments", "--method", "POST", "-f", f"body={body}")

              print(f"{repo}#{number}: {len(changes)} Sprint change(s) recorded")

          PY
