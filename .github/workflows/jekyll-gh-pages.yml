name: Engineering Dashboard - Drilldown V2

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ORG: ${{ github.repository_owner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ACTIONS_APP_ID }}
          private-key: ${{ secrets.ACTIONS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build dashboard data
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          mkdir -p site/data

          python3 <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timedelta
          from pathlib import Path

          ORG = os.environ["ORG"]

          PRIORITIES = [
              "PROD Critical",
              "P1",
              "P2",
              "P3",
              "P4",
          ]

          TRACKED_STATUSES = {
              "Scoping",
              "In Development",
              "QA Testing",
              "QA Passed",
              "Test",
              "Stage",
              "Production",
          }


          def graphql(query, variables=None):
              variables = variables or {}

              cmd = [
                  "gh",
                  "api",
                  "graphql",
                  "-f",
                  f"query={query}",
              ]

              for key, value in variables.items():
                  if value is not None:
                      cmd += [
                          "-F",
                          f"{key}={value}",
                      ]

              result = subprocess.run(
                  cmd,
                  check=True,
                  capture_output=True,
                  text=True,
              )

              return json.loads(result.stdout)


          # ==================================================
          # Discover all open projects
          # ==================================================

          PROJECTS_QUERY = """
          query($org: String!) {
            organization(login: $org) {
              projectsV2(first: 100) {
                nodes {
                  number
                  title
                  shortDescription
                  closed
                  url
                }
              }
            }
          }
          """

          result = graphql(
              PROJECTS_QUERY,
              {"org": ORG},
          )

          projects = [
              p
              for p in (
                  result["data"]
                  ["organization"]
                  ["projectsV2"]
                  ["nodes"]
              )
              if not p["closed"]
          ]

          print(
              f"Found {len(projects)} open projects"
          )


          # ==================================================
          # Project items
          # ==================================================

          PROJECT_QUERY = """
          query(
            $org: String!,
            $number: Int!,
            $cursor: String
          ) {
            organization(login: $org) {
              projectV2(number: $number) {

                number
                title
                shortDescription
                url

                fields(first: 100) {
                  nodes {

                    ... on ProjectV2IterationField {
                      name

                      configuration {
                        iterations {
                          title
                          startDate
                          duration
                        }

                        completedIterations {
                          title
                          startDate
                          duration
                        }
                      }
                    }
                  }
                }

                items(
                  first: 100,
                  after: $cursor
                ) {
                  pageInfo {
                    hasNextPage
                    endCursor
                  }

                  nodes {
                    fieldValues(first: 50) {
                      nodes {

                        ... on ProjectV2ItemFieldSingleSelectValue {
                          name

                          field {
                            ... on ProjectV2FieldCommon {
                              name
                            }
                          }
                        }

                        ... on ProjectV2ItemFieldIterationValue {
                          title
                          startDate
                          duration

                          field {
                            ... on ProjectV2FieldCommon {
                              name
                            }
                          }
                        }
                      }
                    }

                    content {

                      ... on Issue {
                        number
                        title
                        state
                        createdAt
                        closedAt
                        url

                        repository {
                          nameWithOwner
                        }

                        issueType {
                          name
                        }

                        issueFieldValues(first: 30) {
                          nodes {

                            ... on IssueFieldSingleSelectValue {
                              name

                              field {
                                ... on IssueFieldSingleSelect {
                                  name
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
          """


          # ==================================================
          # Status history
          # ==================================================

          TIMELINE_QUERY = """
          query(
            $owner: String!,
            $repo: String!,
            $number: Int!
          ) {
            repository(
              owner: $owner,
              name: $repo
            ) {
              issue(number: $number) {

                timelineItems(
                  first: 250,
                  itemTypes: [
                    PROJECT_V2_ITEM_STATUS_CHANGED_EVENT
                  ]
                ) {
                  nodes {

                    ... on ProjectV2ItemStatusChangedEvent {
                      createdAt
                      previousStatus
                      status
                    }
                  }
                }
              }
            }
          }
          """


          def issue_priority(issue, item):

              # Prefer issue custom field
              for value in (
                  issue
                  .get("issueFieldValues", {})
                  .get("nodes", [])
              ):
                  field = value.get("field") or {}

                  if field.get("name") == "Priority":
                      return (
                          value.get("name")
                          or "Unspecified"
                      )

              # Fall back to Project Priority
              for value in (
                  item
                  .get("fieldValues", {})
                  .get("nodes", [])
              ):
                  field = value.get("field") or {}

                  if field.get("name") == "Priority":
                      return (
                          value.get("name")
                          or "Unspecified"
                      )

              return "Unspecified"


          def load_project(project):

              cursor = None
              issues = []
              sprints = {}
              metadata = None

              while True:

                  response = graphql(
                      PROJECT_QUERY,
                      {
                          "org": ORG,
                          "number": project["number"],
                          "cursor": cursor,
                      },
                  )

                  pv2 = (
                      response["data"]
                      ["organization"]
                      ["projectV2"]
                  )

                  if metadata is None:

                      metadata = {
                          "number": pv2["number"],
                          "title": pv2["title"],
                          "description": (
                              pv2.get("shortDescription")
                              or ""
                          ),
                          "url": pv2["url"],
                      }

                      # Discover sprint/iteration definitions
                      for field in pv2["fields"]["nodes"]:

                          config = (
                              field.get("configuration")
                          )

                          if not config:
                              continue

                          iterations = (
                              config.get(
                                  "completedIterations",
                                  []
                              )
                              +
                              config.get(
                                  "iterations",
                                  []
                              )
                          )

                          for sprint in iterations:

                              start = sprint["startDate"]
                              duration = sprint["duration"]

                              end = (
                                  datetime
                                  .fromisoformat(start)
                                  +
                                  timedelta(
                                      days=duration - 1
                                  )
                              ).date().isoformat()

                              sprints[
                                  sprint["title"]
                              ] = {
                                  "name":
                                      sprint["title"],

                                  "start":
                                      start,

                                  "end":
                                      end,

                                  "duration":
                                      duration,
                              }

                  connection = pv2["items"]

                  for item in connection["nodes"]:

                      issue = item.get("content")

                      if not issue:
                          continue

                      if not issue.get("number"):
                          continue

                      repository = (
                          issue
                          .get("repository", {})
                          .get("nameWithOwner")
                      )

                      if not repository:
                          continue

                      issue_type = (
                          (
                              issue.get("issueType")
                              or {}
                          )
                          .get("name")
                          or "Unspecified"
                      )

                      issues.append({
                          "number":
                              issue["number"],

                          "repository":
                              repository,

                          "title":
                              issue["title"],

                          "url":
                              issue["url"],

                          "priority":
                              issue_priority(
                                  issue,
                                  item,
                              ),

                          "issueType":
                              issue_type,

                          "opened":
                              issue["createdAt"][:10],

                          "closed":
                              (
                                  issue["closedAt"][:10]
                                  if issue["closedAt"]
                                  else None
                              ),

                          "events":
                              [],
                      })

                  if not connection[
                      "pageInfo"
                  ][
                      "hasNextPage"
                  ]:
                      break

                  cursor = connection[
                      "pageInfo"
                  ][
                      "endCursor"
                  ]


              # ==============================================
              # Load complete tracked status history
              # ==============================================

              for index, issue in enumerate(
                  issues,
                  start=1,
              ):

                  print(
                      f'Project {project["number"]}: '
                      f'[{index}/{len(issues)}] '
                      f'{issue["repository"]}'
                      f'#{issue["number"]}'
                  )

                  owner, repo = (
                      issue["repository"]
                      .split("/", 1)
                  )

                  try:

                      history = graphql(
                          TIMELINE_QUERY,
                          {
                              "owner": owner,
                              "repo": repo,
                              "number":
                                  issue["number"],
                          },
                      )

                      nodes = (
                          history["data"]
                          ["repository"]
                          ["issue"]
                          ["timelineItems"]
                          ["nodes"]
                      )

                      for event in nodes:

                          status = event.get(
                              "status"
                          )

                          if (
                              status
                              not in TRACKED_STATUSES
                          ):
                              continue

                          issue["events"].append({
                              "status":
                                  status,

                              "date":
                                  event[
                                      "createdAt"
                                  ][:10],
                          })

                  except Exception as exc:

                      print(
                          f'Warning reading '
                          f'{issue["repository"]}'
                          f'#{issue["number"]}: '
                          f'{exc}'
                      )

              return {
                  "project":
                      metadata,

                  "sprints":
                      sorted(
                          sprints.values(),
                          key=lambda x: x["start"],
                      ),

                  "priorities":
                      PRIORITIES,

                  "issues":
                      issues,
              }


          # ==================================================
          # Generate one JSON dataset per project
          # ==================================================

          output_projects = []

          for project in projects:

              data = load_project(
                  project
              )

              slug = (
                  f'project-'
                  f'{project["number"]}'
              )

              Path(
                  f"site/data/{slug}.json"
              ).write_text(
                  json.dumps(
                      data,
                      indent=2,
                  )
              )

              output_projects.append({
                  "number":
                      project["number"],

                  "title":
                      project["title"],

                  "description":
                      (
                          project.get(
                              "shortDescription"
                          )
                          or ""
                      ),

                  "slug":
                      slug,

                  "issueCount":
                      len(data["issues"]),

                  "sprintCount":
                      len(data["sprints"]),
              })

          Path(
              "site/data/projects.json"
          ).write_text(
              json.dumps(
                  output_projects,
                  indent=2,
              )
          )

          print(
              json.dumps(
                  output_projects,
                  indent=2,
              )
          )

          PY


      # ======================================================
      # Dashboard HTML
      # ======================================================

      - name: Create DRILLDOWN V2 dashboard
        run: |
          cat > site/index.html <<'EOF'
          <!doctype html>

          <html lang="en">

          <head>

            <meta charset="utf-8">

            <meta
              name="viewport"
              content="width=device-width,initial-scale=1"
            >

            <title>
              Engineering Dashboards - DRILLDOWN V2
            </title>

            <script
              src="https://cdn.jsdelivr.net/npm/chart.js">
            </script>

            <style>

              :root {
                --bg: #f5f7fb;
                --card: #ffffff;
                --border: #e4e8ef;
                --text: #172033;
                --muted: #697386;
                --blue: #2563eb;
                --blue-light: #eff6ff;
              }

              * {
                box-sizing: border-box;
              }

              body {
                margin: 0;

                background: var(--bg);
                color: var(--text);

                font-family:
                  Inter,
                  system-ui,
                  -apple-system,
                  BlinkMacSystemFont,
                  "Segoe UI",
                  sans-serif;
              }

              main {
                max-width: 1500px;
                margin: auto;
                padding: 32px;
              }

              h1 {
                margin: 0 0 4px;
              }

              h3 {
                margin-top: 0;
              }

              .muted {
                color: var(--muted);
              }

              .version {
                display: inline-block;

                margin-left: 8px;
                padding: 3px 7px;

                border-radius: 5px;

                background: #dbeafe;
                color: #1d4ed8;

                font-size: 11px;
                font-weight: 700;
              }

              .toolbar {
                display: flex;
                gap: 12px;
                margin: 24px 0;
              }

              select {
                padding: 10px 14px;

                background: white;

                border:
                  1px solid var(--border);

                border-radius: 8px;
              }

              .kpis {
                display: grid;

                grid-template-columns:
                  repeat(5, 1fr);

                gap: 15px;

                margin-bottom: 18px;
              }

              .card {
                background: var(--card);

                border:
                  1px solid var(--border);

                border-radius: 14px;

                padding: 18px;
              }

              .clickable {
                cursor: pointer;
              }

              .clickable::after {
                content: "View issue data";

                display: block;

                margin-top: 8px;

                color: var(--blue);

                font-size: 11px;
                font-weight: 600;
              }

              .clickable:hover {
                background: #fafcff;

                box-shadow:
                  0 4px 15px
                  rgba(0,0,0,.06);
              }

              .label {
                color: var(--muted);

                font-size: 11px;
                font-weight: 700;

                text-transform: uppercase;
              }

              .number {
                margin-top: 6px;

                font-size: 30px;
                font-weight: 750;
              }

              .grid {
                display: grid;

                grid-template-columns:
                  2fr 1fr;

                gap: 18px;

                margin-bottom: 18px;
              }

              .chart {
                height: 330px;
              }

              table {
                width: 100%;

                border-collapse: collapse;
              }

              th,
              td {
                padding: 11px;

                border-bottom:
                  1px solid #eef1f5;

                text-align: right;
                vertical-align: top;
              }

              th:first-child,
              td:first-child {
                text-align: left;
              }

              .metric-cell {
                cursor: pointer;

                font-weight: 600;

                text-decoration:
                  underline dotted;

                text-underline-offset: 3px;
              }

              .metric-cell:hover {
                background: #f1f5ff;
                color: var(--blue);
              }

              /* =============================================
                 Drilldown modal
                 ============================================= */

              .modal-backdrop {
                position: fixed;

                inset: 0;

                z-index: 1000;

                display: flex;

                align-items: center;
                justify-content: center;

                padding: 18px;

                background:
                  rgba(15,23,42,.52);
              }

              .modal-backdrop.hidden {
                display: none;
              }

              .modal {
                width: 98vw;

                max-width: 1800px;
                max-height: 92vh;

                background: white;

                border-radius: 16px;

                overflow: hidden;

                box-shadow:
                  0 30px 80px
                  rgba(0,0,0,.3);
              }

              .modal-header {
                display: flex;

                justify-content:
                  space-between;

                align-items:
                  flex-start;

                padding: 20px 24px;

                border-bottom:
                  1px solid var(--border);
              }

              .modal-header h2 {
                margin: 0 0 5px;
              }

              .modal-body {
                max-height: 78vh;

                overflow:
                  auto;
              }

              .close-button {
                border: 0;

                background:
                  transparent;

                font-size: 32px;

                cursor: pointer;
              }

              .drilldown-table {
                min-width: 1650px;
              }

              .drilldown-table th {
                position: sticky;

                top: 0;

                z-index: 3;

                background: #f8fafc;

                white-space: nowrap;

                font-size: 11px;

                text-transform: uppercase;
              }

              .drilldown-table td {
                font-size: 12px;
              }

              .issue-column {
                min-width: 190px;
              }

              .title-column {
                min-width: 280px;

                max-width: 400px;

                text-align: left;
              }

              .date-column {
                min-width: 120px;

                white-space: nowrap;

                line-height: 1.6;
              }

              .issue-link {
                color: var(--blue);

                text-decoration: none;

                font-weight: 600;

                white-space: nowrap;
              }

              .issue-link:hover {
                text-decoration: underline;
              }

              .highlight {
                background:
                  var(--blue-light) !important;
              }

              .empty-state {
                padding: 50px;

                text-align: center;

                color: var(--muted);
              }

              @media(max-width:900px) {

                main {
                  padding: 18px;
                }

                .kpis {
                  grid-template-columns:
                    1fr 1fr;
                }

                .grid {
                  grid-template-columns:
                    1fr;
                }

              }

            </style>

          </head>


          <body>

            <main>

              <h1>
                Engineering Dashboards
                <span class="version">
                  DRILLDOWN V2
                </span>
              </h1>

              <div class="muted">
                Real GitHub Project data
              </div>


              <div class="toolbar">

                <select
                  id="projectSelect">
                </select>

                <select
                  id="sprintSelect">
                </select>

              </div>


              <!-- =========================================
                   KPI cards
                   ========================================= -->

              <section class="kpis">

                <div
                  id="openedCard"
                  class="card clickable">

                  <div class="label">
                    Opened
                  </div>

                  <div
                    id="opened"
                    class="number">
                    -
                  </div>

                </div>


                <div
                  id="developmentCard"
                  class="card clickable">

                  <div class="label">
                    In Development
                  </div>

                  <div
                    id="development"
                    class="number">
                    -
                  </div>

                </div>


                <div
                  id="qaCard"
                  class="card clickable">

                  <div class="label">
                    QA Testing
                  </div>

                  <div
                    id="qa"
                    class="number">
                    -
                  </div>

                </div>


                <div
                  id="passedCard"
                  class="card clickable">

                  <div class="label">
                    QA Passed
                  </div>

                  <div
                    id="passed"
                    class="number">
                    -
                  </div>

                </div>


                <div
                  id="closedCard"
                  class="card clickable">

                  <div class="label">
                    Closed
                  </div>

                  <div
                    id="closed"
                    class="number">
                    -
                  </div>

                </div>

              </section>


              <!-- =========================================
                   Charts
                   ========================================= -->

              <div class="grid">

                <section class="card">

                  <h3>
                    Sprint Flow
                  </h3>

                  <div class="muted">
                    Click a bar to view all issue data
                  </div>

                  <div class="chart">

                    <canvas
                      id="flowChart">
                    </canvas>

                  </div>

                </section>


                <section class="card">

                  <h3>
                    Bugs vs Enhancements
                  </h3>

                  <div class="muted">
                    Click a segment to view all issue data
                  </div>

                  <div class="chart">

                    <canvas
                      id="mixChart">
                    </canvas>

                  </div>

                </section>

              </div>


              <!-- =========================================
                   Priority table
                   ========================================= -->

              <section class="card">

                <h3>
                  Flow by Priority
                </h3>

                <div class="muted">
                  Click any underlined count to drill down
                </div>

                <table>

                  <thead>

                    <tr>

                      <th>Priority</th>
                      <th>Opened</th>
                      <th>In Dev</th>
                      <th>QA</th>
                      <th>QA Passed</th>
                      <th>Closed</th>
                      <th>Bug Opened</th>
                      <th>Bug Closed</th>
                      <th>Bug C/R</th>

                    </tr>

                  </thead>

                  <tbody id="rows"></tbody>

                </table>

              </section>

            </main>


            <!-- ===========================================
                 DRILLDOWN
                 =========================================== -->

            <div
              id="drilldownBackdrop"
              class="modal-backdrop hidden">

              <div class="modal">

                <div class="modal-header">

                  <div>

                    <h2
                      id="drilldownTitle">
                    </h2>

                    <div
                      id="drilldownSubtitle"
                      class="muted">
                    </div>

                  </div>

                  <button
                    id="closeDrilldown"
                    class="close-button"
                    type="button">
                    ×
                  </button>

                </div>


                <div class="modal-body">

                  <table
                    id="drilldownTable"
                    class="drilldown-table">

                    <thead>

                      <tr>

                        <th class="issue-column">
                          Issue
                        </th>

                        <th class="title-column">
                          Title
                        </th>

                        <th>
                          Priority
                        </th>

                        <th>
                          Type
                        </th>

                        <th
                          data-field="opened">
                          Open Date
                        </th>

                        <th
                          data-field="Scoping">
                          Scoping
                        </th>

                        <th
                          data-field="In Development">
                          In Development
                        </th>

                        <th
                          data-field="QA Testing">
                          QA Testing
                        </th>

                        <th
                          data-field="QA Passed">
                          QA Passed
                        </th>

                        <th
                          data-field="Test">
                          Test
                        </th>

                        <th
                          data-field="Stage">
                          Stage
                        </th>

                        <th
                          data-field="Production">
                          Production
                        </th>

                        <th
                          data-field="closed">
                          Close Date
                        </th>

                      </tr>

                    </thead>

                    <tbody
                      id="drilldownRows">
                    </tbody>

                  </table>


                  <div
                    id="drilldownEmpty"
                    class="empty-state"
                    style="display:none">

                    No matching issues.

                  </div>

                </div>

              </div>

            </div>


            <script>

              let projectData = null;


              // ============================================
              // Basic helpers
              // ============================================

              function within(
                date,
                sprint
              ) {

                return (
                  date
                  &&
                  date >= sprint.start
                  &&
                  date <= sprint.end
                );

              }


              function issueId(issue) {

                return (
                  issue.repository
                  + "#"
                  + issue.number
                );

              }


              function isBug(issue) {

                return (
                  (issue.issueType || "")
                  .toLowerCase()
                  === "bug"
                );

              }


              function isEnhancement(issue) {

                return (
                  (issue.issueType || "")
                  .toLowerCase()
                  === "enhancement"
                );

              }


              function escapeHtml(value) {

                return String(value ?? "")
                  .replaceAll(
                    "&",
                    "&amp;"
                  )
                  .replaceAll(
                    "<",
                    "&lt;"
                  )
                  .replaceAll(
                    ">",
                    "&gt;"
                  )
                  .replaceAll(
                    '"',
                    "&quot;"
                  )
                  .replaceAll(
                    "'",
                    "&#039;"
                  );

              }


              function selectedSprint() {

                if (!projectData) {
                  return null;
                }


                const index =
                  Number(
                    document
                    .getElementById(
                      "sprintSelect"
                    )
                    .value
                  );


                return (
                  projectData.sprints[index]
                  ||
                  null
                );

              }


              // ============================================
              // Status dates
              //
              // IMPORTANT:
              // Returns ALL dates, not only first date.
              // ============================================

              function statusDates(
                issue,
                status
              ) {

                return issue.events

                  .filter(event =>
                    event.status === status
                  )

                  .map(event =>
                    event.date
                  )

                  .sort();

              }


              function renderDates(dates) {

                if (!dates.length) {
                  return "";
                }


                return dates

                  .map(date =>
                    escapeHtml(date)
                  )

                  .join("<br>");

              }


              // ============================================
              // Counts
              // ============================================

              function uniqueStatusCount(
                issues,
                status,
                sprint
              ) {

                const ids =
                  new Set();


                issues.forEach(issue => {

                  issue.events
                    .forEach(event => {

                      if (
                        event.status === status
                        &&
                        within(
                          event.date,
                          sprint
                        )
                      ) {

                        ids.add(
                          issueId(issue)
                        );

                      }

                    });

                });


                return ids.size;

              }


              function calculate(
                sprint,
                priority = null
              ) {

                const issues =
                  projectData.issues.filter(
                    issue =>
                      !priority
                      ||
                      issue.priority === priority
                  );


                const opened =
                  issues.filter(issue =>
                    within(
                      issue.opened,
                      sprint
                    )
                  );


                const closed =
                  issues.filter(issue =>
                    within(
                      issue.closed,
                      sprint
                    )
                  );


                return {

                  opened:
                    opened.length,

                  development:
                    uniqueStatusCount(
                      issues,
                      "In Development",
                      sprint
                    ),

                  qa:
                    uniqueStatusCount(
                      issues,
                      "QA Testing",
                      sprint
                    ),

                  passed:
                    uniqueStatusCount(
                      issues,
                      "QA Passed",
                      sprint
                    ),

                  closed:
                    closed.length,

                  bugOpened:
                    opened.filter(
                      isBug
                    ).length,

                  bugClosed:
                    closed.filter(
                      isBug
                    ).length

                };

              }


              // ============================================
              // Get tickets behind selected metric
              // ============================================

              function matchingIssues(
                sprint,
                metric,
                priority = null
              ) {

                const issues =
                  projectData.issues.filter(
                    issue =>
                      !priority
                      ||
                      issue.priority === priority
                  );


                if (metric === "opened") {

                  return issues.filter(
                    issue =>
                      within(
                        issue.opened,
                        sprint
                      )
                  );

                }


                if (metric === "closed") {

                  return issues.filter(
                    issue =>
                      within(
                        issue.closed,
                        sprint
                      )
                  );

                }


                if (metric === "bugOpened") {

                  return issues.filter(
                    issue =>
                      isBug(issue)
                      &&
                      within(
                        issue.opened,
                        sprint
                      )
                  );

                }


                if (metric === "bugClosed") {

                  return issues.filter(
                    issue =>
                      isBug(issue)
                      &&
                      within(
                        issue.closed,
                        sprint
                      )
                  );

                }


                const statuses = {

                  development:
                    "In Development",

                  qa:
                    "QA Testing",

                  passed:
                    "QA Passed"

                };


                const status =
                  statuses[metric];


                if (!status) {
                  return [];
                }


                return issues.filter(issue =>

                  issue.events.some(event =>

                    event.status === status

                    &&

                    within(
                      event.date,
                      sprint
                    )

                  )

                );

              }


              // ============================================
              // Work mix
              // ============================================

              function workedIssues(
                sprint,
                type
              ) {

                const worked =
                  new Set();


                projectData.issues
                  .forEach(issue => {

                    const id =
                      issueId(issue);


                    if (
                      within(
                        issue.closed,
                        sprint
                      )
                    ) {

                      worked.add(id);

                    }


                    issue.events
                      .forEach(event => {

                        if (
                          within(
                            event.date,
                            sprint
                          )
                        ) {

                          worked.add(id);

                        }

                      });

                  });


                return projectData.issues
                  .filter(issue => {

                    if (
                      !worked.has(
                        issueId(issue)
                      )
                    ) {
                      return false;
                    }


                    if (type === "bug") {
                      return isBug(issue);
                    }


                    if (
                      type === "enhancement"
                    ) {
                      return isEnhancement(
                        issue
                      );
                    }


                    return true;

                  });

              }


              // ============================================
              // Drilldown
              // ============================================

              function clearHighlights() {

                document
                  .querySelectorAll(
                    ".highlight"
                  )
                  .forEach(element =>

                    element
                      .classList
                      .remove("highlight")

                  );

              }


              function openDrilldown(
                title,
                sprint,
                issues,
                highlightField = null
              ) {

                document
                  .getElementById(
                    "drilldownTitle"
                  )
                  .textContent =
                    title;


                document
                  .getElementById(
                    "drilldownSubtitle"
                  )
                  .textContent =

                    `${sprint.name} · ` +
                    `${issues.length} issue` +
                    `${issues.length === 1 ? "" : "s"}`;


                const tbody =
                  document.getElementById(
                    "drilldownRows"
                  );


                const empty =
                  document.getElementById(
                    "drilldownEmpty"
                  );


                tbody.innerHTML = "";


                clearHighlights();


                if (!issues.length) {

                  empty.style.display =
                    "block";

                } else {

                  empty.style.display =
                    "none";


                  issues.forEach(issue => {

                    const row =
                      document
                      .createElement("tr");


                    const scoping =
                      statusDates(
                        issue,
                        "Scoping"
                      );


                    const development =
                      statusDates(
                        issue,
                        "In Development"
                      );


                    const qaTesting =
                      statusDates(
                        issue,
                        "QA Testing"
                      );


                    const qaPassed =
                      statusDates(
                        issue,
                        "QA Passed"
                      );


                    const test =
                      statusDates(
                        issue,
                        "Test"
                      );


                    const stage =
                      statusDates(
                        issue,
                        "Stage"
                      );


                    const production =
                      statusDates(
                        issue,
                        "Production"
                      );


                    row.innerHTML = `

                      <td class="issue-column">

                        <a
                          class="issue-link"

                          href="${
                            escapeHtml(
                              issue.url
                            )
                          }"

                          target="_blank"

                          rel="noopener noreferrer">

                          ${
                            escapeHtml(
                              issue.repository
                            )
                          }#${
                            escapeHtml(
                              issue.number
                            )
                          }

                        </a>

                      </td>


                      <td class="title-column">

                        ${
                          escapeHtml(
                            issue.title
                          )
                        }

                      </td>


                      <td>

                        ${
                          escapeHtml(
                            issue.priority
                          )
                        }

                      </td>


                      <td>

                        ${
                          escapeHtml(
                            issue.issueType
                          )
                        }

                      </td>


                      <td
                        class="date-column"
                        data-field="opened">

                        ${
                          escapeHtml(
                            issue.opened
                            || ""
                          )
                        }

                      </td>


                      <td
                        class="date-column"
                        data-field="Scoping">

                        ${
                          renderDates(
                            scoping
                          )
                        }

                      </td>


                      <td
                        class="date-column"
                        data-field="In Development">

                        ${
                          renderDates(
                            development
                          )
                        }

                      </td>


                      <td
                        class="date-column"
                        data-field="QA Testing">

                        ${
                          renderDates(
                            qaTesting
                          )
                        }

                      </td>


                      <td
                        class="date-column"
                        data-field="QA Passed">

                        ${
                          renderDates(
                            qaPassed
                          )
                        }

                      </td>


                      <td
                        class="date-column"
                        data-field="Test">

                        ${
                          renderDates(
                            test
                          )
                        }

                      </td>


                      <td
                        class="date-column"
                        data-field="Stage">

                        ${
                          renderDates(
                            stage
                          )
                        }

                      </td>


                      <td
                        class="date-column"
                        data-field="Production">

                        ${
                          renderDates(
                            production
                          )
                        }

                      </td>


                      <td
                        class="date-column"
                        data-field="closed">

                        ${
                          escapeHtml(
                            issue.closed
                            || ""
                          )
                        }

                      </td>

                    `;


                    tbody.appendChild(
                      row
                    );

                  });

                }


                if (highlightField) {

                  document
                    .querySelectorAll(
                      `[data-field="${highlightField}"]`
                    )
                    .forEach(element =>

                      element
                        .classList
                        .add("highlight")

                    );

                }


                document
                  .getElementById(
                    "drilldownBackdrop"
                  )
                  .classList
                  .remove("hidden");

              }


              function closeDrilldown() {

                document
                  .getElementById(
                    "drilldownBackdrop"
                  )
                  .classList
                  .add("hidden");

              }


              document
                .getElementById(
                  "closeDrilldown"
                )
                .addEventListener(
                  "click",
                  closeDrilldown
                );


              document
                .getElementById(
                  "drilldownBackdrop"
                )
                .addEventListener(
                  "click",
                  event => {

                    if (
                      event.target.id
                      ===
                      "drilldownBackdrop"
                    ) {

                      closeDrilldown();

                    }

                  }
                );


              document
                .addEventListener(
                  "keydown",
                  event => {

                    if (
                      event.key
                      ===
                      "Escape"
                    ) {

                      closeDrilldown();

                    }

                  }
                );


              // ============================================
              // Flow chart
              // ============================================

              const flowMetrics = [
                "opened",
                "development",
                "qa",
                "passed",
                "closed"
              ];


              const flowLabels = [
                "Opened",
                "In Development",
                "QA Testing",
                "QA Passed",
                "Closed"
              ];


              const highlights = {

                opened:
                  "opened",

                development:
                  "In Development",

                qa:
                  "QA Testing",

                passed:
                  "QA Passed",

                closed:
                  "closed",

                bugOpened:
                  "opened",

                bugClosed:
                  "closed"

              };


              const flowChart =
                new Chart(
                  document.getElementById(
                    "flowChart"
                  ),
                  {
                    type: "bar",

                    data: {

                      labels:
                        flowLabels,

                      datasets: [{
                        label:
                          "Issues",

                        data:
                          []
                      }]

                    },

                    options: {

                      responsive:
                        true,

                      maintainAspectRatio:
                        false,

                      onClick:
                        (event,elements) => {

                          if (
                            !elements.length
                          ) {
                            return;
                          }


                          const index =
                            elements[0].index;


                          const metric =
                            flowMetrics[index];


                          const sprint =
                            selectedSprint();


                          openDrilldown(

                            flowLabels[index],

                            sprint,

                            matchingIssues(
                              sprint,
                              metric
                            ),

                            highlights[
                              metric
                            ]

                          );

                        }

                    }
                  }
                );


              // ============================================
              // Work mix
              // ============================================

              const mixChart =
                new Chart(
                  document.getElementById(
                    "mixChart"
                  ),
                  {
                    type:
                      "doughnut",

                    data: {

                      labels: [
                        "Bugs",
                        "Enhancements"
                      ],

                      datasets: [{
                        data: []
                      }]

                    },

                    options: {

                      responsive:
                        true,

                      maintainAspectRatio:
                        false,

                      onClick:
                        (event,elements) => {

                          if (
                            !elements.length
                          ) {
                            return;
                          }


                          const index =
                            elements[0].index;


                          const sprint =
                            selectedSprint();


                          const type =
                            index === 0
                            ?
                            "bug"
                            :
                            "enhancement";


                          openDrilldown(

                            index === 0
                            ?
                            "Bugs Worked On"
                            :
                            "Enhancements Worked On",

                            sprint,

                            workedIssues(
                              sprint,
                              type
                            )

                          );

                        }

                    }
                  }
                );


              // ============================================
              // Render sprint
              // ============================================

              function updateSprint() {

                if (!projectData) {
                  return;
                }


                const sprint =
                  selectedSprint();


                if (!sprint) {
                  return;
                }


                const total =
                  calculate(
                    sprint
                  );


                document
                  .getElementById(
                    "opened"
                  )
                  .textContent =
                    total.opened;


                document
                  .getElementById(
                    "development"
                  )
                  .textContent =
                    total.development;


                document
                  .getElementById(
                    "qa"
                  )
                  .textContent =
                    total.qa;


                document
                  .getElementById(
                    "passed"
                  )
                  .textContent =
                    total.passed;


                document
                  .getElementById(
                    "closed"
                  )
                  .textContent =
                    total.closed;


                // KPI clicks

                document
                  .getElementById(
                    "openedCard"
                  )
                  .onclick = () =>

                    openDrilldown(
                      "Opened",
                      sprint,
                      matchingIssues(
                        sprint,
                        "opened"
                      ),
                      "opened"
                    );


                document
                  .getElementById(
                    "developmentCard"
                  )
                  .onclick = () =>

                    openDrilldown(
                      "In Development",
                      sprint,
                      matchingIssues(
                        sprint,
                        "development"
                      ),
                      "In Development"
                    );


                document
                  .getElementById(
                    "qaCard"
                  )
                  .onclick = () =>

                    openDrilldown(
                      "QA Testing",
                      sprint,
                      matchingIssues(
                        sprint,
                        "qa"
                      ),
                      "QA Testing"
                    );


                document
                  .getElementById(
                    "passedCard"
                  )
                  .onclick = () =>

                    openDrilldown(
                      "QA Passed",
                      sprint,
                      matchingIssues(
                        sprint,
                        "passed"
                      ),
                      "QA Passed"
                    );


                document
                  .getElementById(
                    "closedCard"
                  )
                  .onclick = () =>

                    openDrilldown(
                      "Closed",
                      sprint,
                      matchingIssues(
                        sprint,
                        "closed"
                      ),
                      "closed"
                    );


                // Chart numbers

                flowChart
                  .data
                  .datasets[0]
                  .data = [

                    total.opened,
                    total.development,
                    total.qa,
                    total.passed,
                    total.closed

                  ];


                flowChart.update();


                // Work mix

                const bugs =
                  workedIssues(
                    sprint,
                    "bug"
                  );


                const enhancements =
                  workedIssues(
                    sprint,
                    "enhancement"
                  );


                mixChart
                  .data
                  .datasets[0]
                  .data = [

                    bugs.length,
                    enhancements.length

                  ];


                mixChart.update();


                // Priority table

                const tbody =
                  document.getElementById(
                    "rows"
                  );


                tbody.innerHTML =
                  "";


                projectData
                  .priorities
                  .forEach(priority => {

                    const metrics =
                      calculate(
                        sprint,
                        priority
                      );


                    const ratio =
                      metrics.bugClosed === 0

                      ?
                      "—"

                      :
                      (
                        metrics.bugOpened
                        /
                        metrics.bugClosed
                      ).toFixed(2)
                      +
                      "x";


                    const row =
                      document
                      .createElement(
                        "tr"
                      );


                    row.innerHTML = `

                      <td>
                        <strong>
                          ${
                            escapeHtml(
                              priority
                            )
                          }
                        </strong>
                      </td>

                      <td
                        class="metric-cell"
                        data-metric="opened">

                        ${metrics.opened}

                      </td>

                      <td
                        class="metric-cell"
                        data-metric="development">

                        ${metrics.development}

                      </td>

                      <td
                        class="metric-cell"
                        data-metric="qa">

                        ${metrics.qa}

                      </td>

                      <td
                        class="metric-cell"
                        data-metric="passed">

                        ${metrics.passed}

                      </td>

                      <td
                        class="metric-cell"
                        data-metric="closed">

                        ${metrics.closed}

                      </td>

                      <td
                        class="metric-cell"
                        data-metric="bugOpened">

                        ${metrics.bugOpened}

                      </td>

                      <td
                        class="metric-cell"
                        data-metric="bugClosed">

                        ${metrics.bugClosed}

                      </td>

                      <td>
                        ${ratio}
                      </td>

                    `;


                    const labels = {

                      opened:
                        "Opened",

                      development:
                        "In Development",

                      qa:
                        "QA Testing",

                      passed:
                        "QA Passed",

                      closed:
                        "Closed",

                      bugOpened:
                        "Bugs Opened",

                      bugClosed:
                        "Bugs Closed"

                    };


                    row
                      .querySelectorAll(
                        ".metric-cell"
                      )
                      .forEach(cell => {

                        cell.addEventListener(
                          "click",
                          () => {

                            const metric =
                              cell
                              .dataset
                              .metric;


                            openDrilldown(

                              `${priority} · ${
                                labels[
                                  metric
                                ]
                              }`,

                              sprint,

                              matchingIssues(
                                sprint,
                                metric,
                                priority
                              ),

                              highlights[
                                metric
                              ]

                            );

                          }
                        );

                      });


                    tbody.appendChild(
                      row
                    );

                  });

              }


              // ============================================
              // Project loader
              // ============================================

              function loadProject(
                project
              ) {

                fetch(
                  `data/${project.slug}.json`
                )

                .then(response =>
                  response.json()
                )

                .then(data => {

                  projectData =
                    data;


                  const sprintSelect =
                    document.getElementById(
                      "sprintSelect"
                    );


                  sprintSelect.innerHTML =
                    "";


                  data.sprints
                    .forEach(
                      (sprint,index) => {

                        const option =
                          document
                          .createElement(
                            "option"
                          );


                        option.value =
                          index;


                        option.textContent =

                          `${sprint.name} · ` +
                          `${sprint.start} – ` +
                          `${sprint.end}`;


                        sprintSelect
                          .appendChild(
                            option
                          );

                      }
                    );


                  sprintSelect.value =
                    Math.max(
                      data.sprints.length - 1,
                      0
                    );


                  updateSprint();

                });

              }


              // ============================================
              // Projects
              // ============================================

              fetch(
                "data/projects.json"
              )

              .then(response =>
                response.json()
              )

              .then(projects => {

                const projectSelect =
                  document.getElementById(
                    "projectSelect"
                  );


                projects.forEach(
                  (project,index) => {

                    const option =
                      document
                      .createElement(
                        "option"
                      );


                    option.value =
                      index;


                    option.textContent =

                      `${project.title} ` +
                      `(${project.issueCount} issues)`;


                    projectSelect
                      .appendChild(
                        option
                      );

                  }
                );


                if (projects.length) {

                  loadProject(
                    projects[0]
                  );

                }


                projectSelect
                  .addEventListener(
                    "change",
                    event => {

                      loadProject(
                        projects[
                          Number(
                            event.target.value
                          )
                        ]
                      );

                    }
                  );

              });


              document
                .getElementById(
                  "sprintSelect"
                )
                .addEventListener(
                  "change",
                  updateSprint
                );

            </script>

          </body>

          </html>
          EOF

      - name: Verify DRILLDOWN V2 artifact
        run: |
          echo "Checking generated dashboard..."

          grep -q "DRILLDOWN V2" site/index.html

          grep -q "Open Date" site/index.html
          grep -q "Scoping" site/index.html
          grep -q "In Development" site/index.html
          grep -q "QA Testing" site/index.html
          grep -q "QA Passed" site/index.html
          grep -q "Test" site/index.html
          grep -q "Stage" site/index.html
          grep -q "Production" site/index.html
          grep -q "Close Date" site/index.html

          echo "DRILLDOWN V2 verified."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
