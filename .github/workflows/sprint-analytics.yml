name: Sprint Analytics

on:
  workflow_dispatch:

  schedule:
    # 8:00 AM EDT / 7:00 AM EST
    - cron: "0 12 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true


jobs:

  build:
    runs-on: ubuntu-latest

    env:
      ORG: ${{ github.repository_owner }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Generate GitHub App token
        id: app-token

        uses:
          actions/create-github-app-token@v3

        with:
          app-id: ${{ secrets.ACTIONS_APP_ID }}
          private-key: ${{ secrets.ACTIONS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}


      - name: Configure Pages
        uses: actions/configure-pages@v5


      - name: Build capability-aware dashboard data

        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

        run: |
          mkdir -p site/data

          python3 <<'PY'
          import json
          import os
          import re
          import subprocess

          from datetime import datetime, timedelta
          from pathlib import Path


          ORG = os.environ["ORG"]


          SPRINT_PATTERN = re.compile(
              r"<!--\s*sprint-tracker:\s*(.*?)\s*->\s*(.*?)\s*-->",
              re.IGNORECASE,
          )


          DEFAULT_PRIORITIES = [
              "PROD Critical",
              "P1",
              "P2",
              "P3",
              "P4",
          ]


          # -------------------------------------------------
          # GraphQL helper
          # -------------------------------------------------

          def graphql(query, variables=None):

              variables = variables or {}

              cmd = [
                  "gh",
                  "api",
                  "graphql",
                  "-f",
                  f"query={query}",
              ]

              for key, value in variables.items():

                  if value is not None:

                      cmd += [
                          "-F",
                          f"{key}={value}",
                      ]


              result = subprocess.run(
                  cmd,
                  check=True,
                  capture_output=True,
                  text=True,
              )


              return json.loads(
                  result.stdout
              )


          # -------------------------------------------------
          # Project discovery
          # -------------------------------------------------

          PROJECTS_QUERY = """
          query($org: String!) {

            organization(login: $org) {

              projectsV2(first: 100) {

                nodes {
                  number
                  title
                  shortDescription
                  closed
                  url
                }

              }

            }

          }
          """


          # -------------------------------------------------
          # Project definition + items
          #
          # This deliberately fetches multiple field-value
          # types so different project configurations work.
          # -------------------------------------------------

          PROJECT_QUERY = """
          query(
            $org: String!,
            $number: Int!,
            $cursor: String
          ) {

            organization(login: $org) {

              projectV2(number: $number) {

                number
                title
                shortDescription
                url


                fields(first: 100) {

                  nodes {

                    __typename


                    ... on ProjectV2Field {

                      name
                      dataType

                    }


                    ... on ProjectV2SingleSelectField {

                      name
                      dataType

                      options {
                        name
                      }

                    }


                    ... on ProjectV2IterationField {

                      name
                      dataType

                      configuration {

                        iterations {
                          title
                          startDate
                          duration
                        }

                        completedIterations {
                          title
                          startDate
                          duration
                        }

                      }

                    }

                  }

                }


                items(
                  first: 100,
                  after: $cursor
                ) {

                  pageInfo {
                    hasNextPage
                    endCursor
                  }


                  nodes {

                    fieldValues(first: 100) {

                      nodes {

                        __typename


                        ... on ProjectV2ItemFieldSingleSelectValue {

                          name

                          field {
                            ... on ProjectV2FieldCommon {
                              name
                            }
                          }

                        }


                        ... on ProjectV2ItemFieldNumberValue {

                          number

                          field {
                            ... on ProjectV2FieldCommon {
                              name
                            }
                          }

                        }


                        ... on ProjectV2ItemFieldIterationValue {

                          title
                          startDate
                          duration

                          field {
                            ... on ProjectV2FieldCommon {
                              name
                            }
                          }

                        }


                        ... on ProjectV2ItemFieldDateValue {

                          date

                          field {
                            ... on ProjectV2FieldCommon {
                              name
                            }
                          }

                        }


                        ... on ProjectV2ItemFieldTextValue {

                          text

                          field {
                            ... on ProjectV2FieldCommon {
                              name
                            }
                          }

                        }


                        ... on ProjectV2ItemFieldMultiSelectValue {

                          value

                          field {
                            ... on ProjectV2FieldCommon {
                              name
                            }
                          }

                        }

                      }

                    }


                    content {

                      ... on Issue {

                        number
                        title
                        state
                        createdAt
                        closedAt
                        url


                        repository {
                          nameWithOwner
                        }


                        issueType {
                          name
                        }

                      }

                    }

                  }

                }

              }

            }

          }
          """


          # -------------------------------------------------
          # Status history + sprint tracker comments
          # -------------------------------------------------

          TIMELINE_QUERY = """
          query(
            $owner: String!,
            $repo: String!,
            $number: Int!
          ) {

            repository(
              owner: $owner,
              name: $repo
            ) {

              issue(number: $number) {

                timelineItems(
                  first: 250,
                  itemTypes: [
                    PROJECT_V2_ITEM_STATUS_CHANGED_EVENT,
                    ISSUE_COMMENT
                  ]
                ) {

                  nodes {

                    __typename


                    ... on ProjectV2ItemStatusChangedEvent {

                      createdAt
                      previousStatus
                      status

                      project {
                        number
                      }

                    }


                    ... on IssueComment {

                      createdAt
                      body

                    }

                  }

                }

              }

            }

          }
          """


          # -------------------------------------------------
          # Field-name normalization
          # -------------------------------------------------

          def normalize_name(value):

              return re.sub(
                  r"[^a-z0-9]+",
                  " ",
                  (value or "").lower(),
              ).strip()


          def find_field(
              fields,
              names=None,
              data_type=None,
          ):

              names = {
                  normalize_name(name)
                  for name in (names or [])
              }


              # Prefer explicit semantic aliases.

              for field in fields:

                  field_name = normalize_name(
                      field.get("name")
                  )

                  if names and field_name not in names:
                      continue

                  if (
                      data_type
                      and
                      field.get("dataType")
                      !=
                      data_type
                  ):
                      continue

                  return field


              # If no explicit name is required,
              # return the first field of this type.

              if not names and data_type:

                  for field in fields:

                      if (
                          field.get("dataType")
                          ==
                          data_type
                      ):

                          return field


              return None


          # -------------------------------------------------
          # Capability detection
          # -------------------------------------------------

          def detect_capabilities(fields):

              status = find_field(
                  fields,
                  names=[
                      "Status",
                  ],
                  data_type="SINGLE_SELECT",
              )


              sprint = find_field(
                  fields,
                  names=[
                      "Sprint",
                      "Iteration",
                  ],
                  data_type="ITERATION",
              )

              if not sprint:

                  sprint = find_field(
                      fields,
                      data_type="ITERATION",
                  )


              priority = find_field(
                  fields,
                  names=[
                      "Priority",
                  ],
                  data_type="SINGLE_SELECT",
              )


              size = find_field(
                  fields,
                  names=[
                      "Size",
                      "T-Shirt Size",
                      "T Shirt Size",
                      "Tshirt Size",
                      "Shirt Size",
                  ],
                  data_type="SINGLE_SELECT",
              )


              loe = find_field(
                  fields,
                  names=[
                      "LOE",
                      "Level of Effort",
                      "Level Of Effort",
                      "Effort Days",
                      "Estimated Days",
                  ],
                  data_type="NUMBER",
              )


              def descriptor(field):

                  if not field:

                      return {
                          "available": False,
                          "fieldName": None,
                          "dataType": None,
                      }


                  return {
                      "available": True,
                      "fieldName": field["name"],
                      "dataType": field.get(
                          "dataType"
                      ),
                  }


              return {

                  "status":
                      descriptor(status),

                  "sprint":
                      descriptor(sprint),

                  "priority":
                      descriptor(priority),

                  "size":
                      descriptor(size),

                  "loe":
                      descriptor(loe),

                  # Native GitHub Issue Type is not
                  # a custom Project field.
                  "issueType": {
                      "available": True,
                      "fieldName": "Issue Type",
                      "dataType": "ISSUE_TYPE",
                  },

              }


          # -------------------------------------------------
          # Convert item field-values into a dictionary
          # -------------------------------------------------

          def item_field_values(item):

              values = {}


              for value in (
                  item
                  .get("fieldValues", {})
                  .get("nodes", [])
              ):

                  field = (
                      value.get("field")
                      or {}
                  )

                  field_name = field.get("name")

                  if not field_name:
                      continue


                  typename = value.get(
                      "__typename"
                  )


                  if (
                      typename
                      ==
                      "ProjectV2ItemFieldSingleSelectValue"
                  ):

                      parsed = value.get("name")


                  elif (
                      typename
                      ==
                      "ProjectV2ItemFieldNumberValue"
                  ):

                      parsed = value.get("number")


                  elif (
                      typename
                      ==
                      "ProjectV2ItemFieldIterationValue"
                  ):

                      parsed = value.get("title")


                  elif (
                      typename
                      ==
                      "ProjectV2ItemFieldDateValue"
                  ):

                      parsed = value.get("date")


                  elif (
                      typename
                      ==
                      "ProjectV2ItemFieldTextValue"
                  ):

                      parsed = value.get("text")


                  elif (
                      typename
                      ==
                      "ProjectV2ItemFieldMultiSelectValue"
                  ):

                      parsed = value.get("value")


                  else:

                      continue


                  values[field_name] = parsed


              return values


          # -------------------------------------------------
          # Timeline cache
          # -------------------------------------------------

          history_cache = {}


          def get_issue_timeline(
              repository,
              number,
          ):

              cache_key = (
                  f"{repository}#{number}"
              )


              if cache_key in history_cache:

                  return history_cache[
                      cache_key
                  ]


              owner, repo = (
                  repository.split("/", 1)
              )


              history = graphql(
                  TIMELINE_QUERY,
                  {
                      "owner": owner,
                      "repo": repo,
                      "number": number,
                  },
              )


              nodes = (
                  history["data"]
                  ["repository"]
                  ["issue"]
                  ["timelineItems"]
                  ["nodes"]
              )


              history_cache[
                  cache_key
              ] = nodes


              return nodes


          # -------------------------------------------------
          # Discover open projects
          # -------------------------------------------------

          result = graphql(
              PROJECTS_QUERY,
              {
                  "org": ORG,
              },
          )


          projects = [

              project

              for project in (
                  result["data"]
                  ["organization"]
                  ["projectsV2"]
                  ["nodes"]
              )

              if not project["closed"]

          ]


          print(
              f"Found {len(projects)} open projects"
          )


          # -------------------------------------------------
          # Build one project's data
          # -------------------------------------------------

          def load_project(project):

              cursor = None

              raw_items = []

              metadata = None

              fields = []

              sprints = {}

              status_options = []

              priority_options = []

              size_options = []


              while True:

                  response = graphql(
                      PROJECT_QUERY,
                      {
                          "org":
                              ORG,

                          "number":
                              project["number"],

                          "cursor":
                              cursor,
                      },
                  )


                  pv2 = (
                      response["data"]
                      ["organization"]
                      ["projectV2"]
                  )


                  if metadata is None:

                      metadata = {
                          "number":
                              pv2["number"],

                          "title":
                              pv2["title"],

                          "description":
                              (
                                  pv2.get(
                                      "shortDescription"
                                  )
                                  or ""
                              ),

                          "url":
                              pv2["url"],
                      }


                      # Normalize field definitions.

                      for raw_field in (
                          pv2["fields"]["nodes"]
                      ):

                          field = {
                              "name":
                                  raw_field.get(
                                      "name"
                                  ),

                              "dataType":
                                  raw_field.get(
                                      "dataType"
                                  ),

                              "kind":
                                  raw_field.get(
                                      "__typename"
                                  ),

                              "options":
                                  [
                                      option["name"]
                                      for option in (
                                          raw_field.get(
                                              "options",
                                              []
                                          )
                                      )
                                  ],
                          }


                          fields.append(field)


                      capabilities = (
                          detect_capabilities(
                              fields
                          )
                      )


                      # Status options

                      if (
                          capabilities[
                              "status"
                          ][
                              "available"
                          ]
                      ):

                          field_name = (
                              capabilities[
                                  "status"
                              ][
                                  "fieldName"
                              ]
                          )

                          field = next(
                              (
                                  item
                                  for item in fields
                                  if item["name"]
                                  ==
                                  field_name
                              ),
                              None,
                          )

                          status_options = (
                              field.get(
                                  "options",
                                  []
                              )
                              if field
                              else []
                          )


                      # Priority options

                      if (
                          capabilities[
                              "priority"
                          ][
                              "available"
                          ]
                      ):

                          field_name = (
                              capabilities[
                                  "priority"
                              ][
                                  "fieldName"
                              ]
                          )

                          field = next(
                              (
                                  item
                                  for item in fields
                                  if item["name"]
                                  ==
                                  field_name
                              ),
                              None,
                          )

                          priority_options = (
                              field.get(
                                  "options",
                                  []
                              )
                              if field
                              else []
                          )


                      # Size options

                      if (
                          capabilities[
                              "size"
                          ][
                              "available"
                          ]
                      ):

                          field_name = (
                              capabilities[
                                  "size"
                              ][
                                  "fieldName"
                              ]
                          )

                          field = next(
                              (
                                  item
                                  for item in fields
                                  if item["name"]
                                  ==
                                  field_name
                              ),
                              None,
                          )

                          size_options = (
                              field.get(
                                  "options",
                                  []
                              )
                              if field
                              else []
                          )


                      # Sprint configuration.

                      if (
                          capabilities[
                              "sprint"
                          ][
                              "available"
                          ]
                      ):

                          sprint_field_name = (
                              capabilities[
                                  "sprint"
                              ][
                                  "fieldName"
                              ]
                          )


                          raw_sprint_field = next(
                              (
                                  raw_field
                                  for raw_field in (
                                      pv2[
                                          "fields"
                                      ][
                                          "nodes"
                                      ]
                                  )
                                  if (
                                      raw_field.get(
                                          "name"
                                      )
                                      ==
                                      sprint_field_name
                                  )
                              ),
                              None,
                          )


                          if raw_sprint_field:

                              config = (
                                  raw_sprint_field.get(
                                      "configuration"
                                  )
                                  or {}
                              )


                              iterations = (
                                  config.get(
                                      "completedIterations",
                                      []
                                  )
                                  +
                                  config.get(
                                      "iterations",
                                      []
                                  )
                              )


                              for sprint in iterations:

                                  start = (
                                      sprint[
                                          "startDate"
                                      ]
                                  )

                                  duration = (
                                      sprint[
                                          "duration"
                                      ]
                                  )


                                  end = (
                                      datetime
                                      .fromisoformat(
                                          start
                                      )
                                      +
                                      timedelta(
                                          days=
                                              duration
                                              -
                                              1
                                      )
                                  ).date().isoformat()


                                  sprints[
                                      sprint["title"]
                                  ] = {
                                      "name":
                                          sprint[
                                              "title"
                                          ],

                                      "start":
                                          start,

                                      "end":
                                          end,

                                      "duration":
                                          duration,
                                  }


                  connection = pv2["items"]


                  raw_items.extend(
                      connection["nodes"]
                  )


                  if not (
                      connection[
                          "pageInfo"
                      ][
                          "hasNextPage"
                      ]
                  ):

                      break


                  cursor = (
                      connection[
                          "pageInfo"
                      ][
                          "endCursor"
                      ]
                  )


              capabilities = (
                  detect_capabilities(
                      fields
                  )
              )


              issues = []


              # -------------------------------------------------
              # Convert raw Project items into issue records
              # -------------------------------------------------

              for item in raw_items:

                  issue = item.get("content")


                  if (
                      not issue
                      or
                      not issue.get("number")
                  ):

                      continue


                  repository = (
                      issue
                      .get(
                          "repository",
                          {},
                      )
                      .get(
                          "nameWithOwner"
                      )
                  )


                  if not repository:

                      continue


                  values = (
                      item_field_values(
                          item
                      )
                  )


                  def capability_value(
                      capability_name
                  ):

                      capability = (
                          capabilities[
                              capability_name
                          ]
                      )


                      if not capability[
                          "available"
                      ]:

                          return None


                      return values.get(
                          capability[
                              "fieldName"
                          ]
                      )


                  issues.append({

                      "number":
                          issue["number"],

                      "repository":
                          repository,

                      "title":
                          issue["title"],

                      "url":
                          issue["url"],

                      "state":
                          issue["state"],

                      "issueType":
                          (
                              (
                                  issue.get(
                                      "issueType"
                                  )
                                  or {}
                              )
                              .get("name")
                              or
                              "Unspecified"
                          ),

                      "opened":
                          issue[
                              "createdAt"
                          ][:10],

                      "closed":
                          (
                              issue[
                                  "closedAt"
                              ][:10]

                              if issue[
                                  "closedAt"
                              ]

                              else None
                          ),

                      "priority":
                          (
                              capability_value(
                                  "priority"
                              )
                              or
                              "Unspecified"
                          ),

                      "size":
                          capability_value(
                              "size"
                          ),

                      "loe":
                          capability_value(
                              "loe"
                          ),

                      # Preserve every project field-value.
                      "fieldValues":
                          values,

                      "events":
                          [],

                      "sprintTransitions":
                          [],

                  })


              # -------------------------------------------------
              # Read timeline history
              # -------------------------------------------------

              sprint_names = set(
                  sprints.keys()
              )


              for index, issue in enumerate(
                  issues,
                  start=1,
              ):

                  print(
                      f'Project '
                      f'{project["number"]}: '
                      f'[{index}/{len(issues)}] '
                      f'{issue["repository"]}'
                      f'#{issue["number"]}'
                  )


                  try:

                      nodes = (
                          get_issue_timeline(
                              issue[
                                  "repository"
                              ],
                              issue[
                                  "number"
                              ],
                          )
                      )


                      for event in nodes:

                          typename = (
                              event.get(
                                  "__typename"
                              )
                          )


                          # -------------------------------------
                          # Project-specific status event
                          # -------------------------------------

                          if (
                              typename
                              ==
                              "ProjectV2ItemStatusChangedEvent"
                          ):

                              event_project = (
                                  event.get(
                                      "project"
                                  )
                                  or {}
                              )


                              if (
                                  event_project.get(
                                      "number"
                                  )
                                  !=
                                  project[
                                      "number"
                                  ]
                              ):

                                  continue


                              status = (
                                  event.get(
                                      "status"
                                  )
                              )


                              if not status:

                                  continue


                              issue[
                                  "events"
                              ].append({

                                  "status":
                                      status,

                                  "date":
                                      event[
                                          "createdAt"
                                      ][:10],

                              })


                          # -------------------------------------
                          # sprint-tracker comment
                          # -------------------------------------

                          elif (
                              typename
                              ==
                              "IssueComment"
                          ):

                              body = (
                                  event.get(
                                      "body"
                                  )
                                  or ""
                              )


                              for match in (
                                  SPRINT_PATTERN
                                  .finditer(body)
                              ):

                                  from_value = (
                                      match
                                      .group(1)
                                      .strip()
                                  )


                                  to_value = (
                                      match
                                      .group(2)
                                      .strip()
                                  )


                                  # Ignore unrelated tracker data
                                  # when neither side references
                                  # this project's known sprints
                                  # or Backlog.

                                  relevant_values = {
                                      "Backlog",
                                      *sprint_names,
                                  }


                                  if (
                                      from_value
                                      not in
                                      relevant_values
                                      and
                                      to_value
                                      not in
                                      relevant_values
                                  ):

                                      continue


                                  issue[
                                      "sprintTransitions"
                                  ].append({

                                      "from":
                                          from_value,

                                      "to":
                                          to_value,

                                      "date":
                                          event[
                                              "createdAt"
                                          ][:10],

                                  })


                      issue[
                          "events"
                      ].sort(
                          key=lambda x:
                              x["date"]
                      )


                      issue[
                          "sprintTransitions"
                      ].sort(
                          key=lambda x:
                              x["date"]
                      )


                  except Exception as exc:

                      print(
                          f'Warning reading '
                          f'{issue["repository"]}'
                          f'#{issue["number"]}: '
                          f'{exc}'
                      )


              # -------------------------------------------------
              # Priority list
              # -------------------------------------------------

              priorities = []


              if (
                  capabilities[
                      "priority"
                  ][
                      "available"
                  ]
              ):

                  for priority in (
                      DEFAULT_PRIORITIES
                  ):

                      if (
                          priority
                          in
                          priority_options
                          or
                          any(
                              issue[
                                  "priority"
                              ]
                              ==
                              priority
                              for issue in issues
                          )
                      ):

                          priorities.append(
                              priority
                          )


                  for priority in (
                      priority_options
                  ):

                      if (
                          priority
                          not in priorities
                      ):

                          priorities.append(
                              priority
                          )


                  extras = sorted({

                      issue["priority"]

                      for issue in issues

                      if (
                          issue["priority"]
                          not in priorities
                      )

                  })


                  priorities.extend(
                      extras
                  )


              return {

                  "project":
                      metadata,

                  "fields":
                      fields,

                  "capabilities":
                      capabilities,

                  "sprints":
                      sorted(
                          sprints.values(),
                          key=lambda x:
                              x["start"],
                      ),

                  "statuses":
                      status_options,

                  "priorities":
                      priorities,

                  "sizes":
                      size_options,

                  "issues":
                      issues,

              }


          # -------------------------------------------------
          # Write each project JSON
          # -------------------------------------------------

          output_projects = []


          for project in projects:

              data = load_project(
                  project
              )


              slug = (
                  f'project-'
                  f'{project["number"]}'
              )


              Path(
                  f"site/data/{slug}.json"
              ).write_text(
                  json.dumps(
                      data,
                      indent=2,
                  )
              )


              output_projects.append({

                  "number":
                      project["number"],

                  "title":
                      project["title"],

                  "description":
                      (
                          project.get(
                              "shortDescription"
                          )
                          or ""
                      ),

                  "slug":
                      slug,

                  "issueCount":
                      len(
                          data["issues"]
                      ),

                  "sprintCount":
                      len(
                          data["sprints"]
                      ),

                  "capabilities":
                      data[
                          "capabilities"
                      ],

              })


          Path(
              "site/data/projects.json"
          ).write_text(
              json.dumps(
                  output_projects,
                  indent=2,
              )
          )


          print(
              json.dumps(
                  output_projects,
                  indent=2,
              )
          )

          PY


      - name: Create capability-aware Sprint Analytics dashboard

        run: |
          cat > site/index.html <<'EOF'
          <!doctype html>

          <html lang="en">

          <head>

            <meta charset="utf-8">

            <meta
              name="viewport"
              content="width=device-width,initial-scale=1"
