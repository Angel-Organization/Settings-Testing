name: Test Engineering Dashboard

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ORG: ${{ github.repository_owner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ACTIONS_APP_ID }}
          private-key: ${{ secrets.ACTIONS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Discover projects and build dashboard data
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          mkdir -p site/data

          python3 <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timedelta
          from pathlib import Path

          ORG = os.environ["ORG"]

          PRIORITIES = [
              "PROD Critical",
              "P1",
              "P2",
              "P3",
              "P4",
          ]

          TRACKED_STATUSES = {
              "In Development",
              "QA Testing",
              "QA Passed",
          }


          def graphql(query, variables=None):
              variables = variables or {}

              cmd = [
                  "gh",
                  "api",
                  "graphql",
                  "-f",
                  f"query={query}",
              ]

              for key, value in variables.items():
                  if value is None:
                      continue

                  cmd += [
                      "-F",
                      f"{key}={value}",
                  ]

              result = subprocess.run(
                  cmd,
                  check=True,
                  capture_output=True,
                  text=True,
              )

              return json.loads(result.stdout)


          # ==============================================
          # Discover all open Project V2 projects
          # ==============================================

          PROJECTS_QUERY = """
          query($org: String!) {
            organization(login: $org) {
              projectsV2(first: 100) {
                nodes {
                  number
                  title
                  shortDescription
                  closed
                  url
                }
              }
            }
          }
          """

          result = graphql(
              PROJECTS_QUERY,
              {"org": ORG},
          )

          projects = [
              p
              for p in (
                  result["data"]
                  ["organization"]
                  ["projectsV2"]
                  ["nodes"]
              )
              if not p["closed"]
          ]

          print(f"Found {len(projects)} open projects")


          PROJECT_QUERY = """
          query(
            $org: String!,
            $number: Int!,
            $cursor: String
          ) {
            organization(login: $org) {
              projectV2(number: $number) {

                number
                title
                shortDescription
                url

                fields(first: 100) {
                  nodes {

                    ... on ProjectV2IterationField {
                      name

                      configuration {
                        iterations {
                          title
                          startDate
                          duration
                        }

                        completedIterations {
                          title
                          startDate
                          duration
                        }
                      }
                    }
                  }
                }

                items(
                  first: 100,
                  after: $cursor
                ) {
                  pageInfo {
                    hasNextPage
                    endCursor
                  }

                  nodes {
                    fieldValues(first: 50) {
                      nodes {

                        ... on ProjectV2ItemFieldSingleSelectValue {
                          name

                          field {
                            ... on ProjectV2FieldCommon {
                              name
                            }
                          }
                        }

                        ... on ProjectV2ItemFieldIterationValue {
                          title
                          startDate
                          duration

                          field {
                            ... on ProjectV2FieldCommon {
                              name
                            }
                          }
                        }
                      }
                    }

                    content {
                      ... on Issue {
                        number
                        title
                        state
                        createdAt
                        closedAt
                        url

                        repository {
                          nameWithOwner
                        }

                        issueType {
                          name
                        }

                        issueFieldValues(first: 30) {
                          nodes {

                            ... on IssueFieldSingleSelectValue {
                              name

                              field {
                                ... on IssueFieldSingleSelect {
                                  name
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
          """


          TIMELINE_QUERY = """
          query(
            $owner: String!,
            $repo: String!,
            $number: Int!
          ) {
            repository(
              owner: $owner,
              name: $repo
            ) {
              issue(number: $number) {
                timelineItems(
                  first: 250,
                  itemTypes: [
                    PROJECT_V2_ITEM_STATUS_CHANGED_EVENT
                  ]
                ) {
                  nodes {
                    ... on ProjectV2ItemStatusChangedEvent {
                      createdAt
                      previousStatus
                      status
                    }
                  }
                }
              }
            }
          }
          """


          def issue_priority(issue, item):
              # Prefer issue-level custom Priority
              for value in (
                  issue
                  .get("issueFieldValues", {})
                  .get("nodes", [])
              ):
                  field = value.get("field") or {}

                  if field.get("name") == "Priority":
                      return value.get("name") or "Unspecified"

              # Fall back to project-level Priority
              for value in (
                  item
                  .get("fieldValues", {})
                  .get("nodes", [])
              ):
                  field = value.get("field") or {}

                  if field.get("name") == "Priority":
                      return value.get("name") or "Unspecified"

              return "Unspecified"


          def load_project(project):
              cursor = None
              issues = []
              sprints = {}
              metadata = None

              while True:
                  response = graphql(
                      PROJECT_QUERY,
                      {
                          "org": ORG,
                          "number": project["number"],
                          "cursor": cursor,
                      },
                  )

                  pv2 = (
                      response["data"]
                      ["organization"]
                      ["projectV2"]
                  )

                  if metadata is None:
                      metadata = {
                          "number": pv2["number"],
                          "title": pv2["title"],
                          "description": (
                              pv2.get("shortDescription")
                              or ""
                          ),
                          "url": pv2["url"],
                      }

                      for field in pv2["fields"]["nodes"]:
                          if not field.get("configuration"):
                              continue

                          config = field["configuration"]

                          for sprint in (
                              config.get(
                                  "completedIterations",
                                  []
                              )
                              +
                              config.get(
                                  "iterations",
                                  []
                              )
                          ):
                              start = sprint["startDate"]
                              duration = sprint["duration"]

                              end = (
                                  datetime.fromisoformat(start)
                                  + timedelta(days=duration - 1)
                              ).date().isoformat()

                              sprints[sprint["title"]] = {
                                  "name": sprint["title"],
                                  "start": start,
                                  "end": end,
                                  "duration": duration,
                              }

                  connection = pv2["items"]

                  for item in connection["nodes"]:
                      issue = item.get("content")

                      if not issue:
                          continue

                      if not issue.get("number"):
                          continue

                      repo = (
                          issue
                          .get("repository", {})
                          .get("nameWithOwner")
                      )

                      if not repo:
                          continue

                      issue_type = (
                          (issue.get("issueType") or {})
                          .get("name")
                          or "Unspecified"
                      )

                      issues.append({
                          "number": issue["number"],
                          "repository": repo,
                          "title": issue["title"],
                          "url": issue["url"],
                          "priority": issue_priority(
                              issue,
                              item,
                          ),
                          "issueType": issue_type,
                          "opened": issue["createdAt"][:10],
                          "closed": (
                              issue["closedAt"][:10]
                              if issue["closedAt"]
                              else None
                          ),
                          "events": [],
                      })

                  if not connection["pageInfo"]["hasNextPage"]:
                      break

                  cursor = connection["pageInfo"]["endCursor"]

              # Load status events
              for index, issue in enumerate(issues, 1):
                  print(
                      f'Project {project["number"]}: '
                      f'[{index}/{len(issues)}] '
                      f'{issue["repository"]}'
                      f'#{issue["number"]}'
                  )

                  owner, repo = issue["repository"].split("/", 1)

                  try:
                      history = graphql(
                          TIMELINE_QUERY,
                          {
                              "owner": owner,
                              "repo": repo,
                              "number": issue["number"],
                          },
                      )

                      nodes = (
                          history["data"]
                          ["repository"]
                          ["issue"]
                          ["timelineItems"]
                          ["nodes"]
                      )

                      for event in nodes:
                          if (
                              event.get("status")
                              not in TRACKED_STATUSES
                          ):
                              continue

                          issue["events"].append({
                              "status": event["status"],
                              "date": event["createdAt"][:10],
                          })

                  except Exception as exc:
                      print(
                          f'Warning reading '
                          f'{issue["repository"]}'
                          f'#{issue["number"]}: '
                          f'{exc}'
                      )

              return {
                  "project": metadata,
                  "sprints": sorted(
                      sprints.values(),
                      key=lambda x: x["start"],
                  ),
                  "priorities": PRIORITIES,
                  "issues": issues,
              }


          output_projects = []

          for project in projects:
              data = load_project(project)

              slug = f'project-{project["number"]}'

              Path(
                  f"site/data/{slug}.json"
              ).write_text(
                  json.dumps(data, indent=2)
              )

              output_projects.append({
                  "number": project["number"],
                  "title": project["title"],
                  "description": (
                      project.get("shortDescription")
                      or ""
                  ),
                  "slug": slug,
                  "issueCount": len(data["issues"]),
                  "sprintCount": len(data["sprints"]),
              })

          Path(
              "site/data/projects.json"
          ).write_text(
              json.dumps(
                  output_projects,
                  indent=2,
              )
          )

          print(
              json.dumps(
                  output_projects,
                  indent=2,
              )
          )

          PY

      - name: Create dashboard page
        run: |
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">

          <head>
            <meta charset="utf-8">

            <meta
              name="viewport"
              content="width=device-width,initial-scale=1"
            >

            <title>
              Engineering Dashboards
            </title>

            <script
              src="https://cdn.jsdelivr.net/npm/chart.js">
            </script>

            <style>
              :root {
                --bg: #f5f7fb;
                --card: #fff;
                --border: #e4e8ef;
                --text: #172033;
                --muted: #697386;
              }

              * {
                box-sizing: border-box;
              }

              body {
                margin: 0;
                background: var(--bg);
                color: var(--text);
                font-family:
                  Inter,
                  system-ui,
                  -apple-system,
                  BlinkMacSystemFont,
                  "Segoe UI",
                  sans-serif;
              }

              main {
                max-width: 1450px;
                margin: auto;
                padding: 32px;
              }

              h1 {
                margin: 0 0 4px;
              }

              .muted {
                color: var(--muted);
              }

              .toolbar {
                display: flex;
                gap: 12px;
                margin: 24px 0;
              }

              select {
                padding: 10px 14px;
                background: white;
                border: 1px solid var(--border);
                border-radius: 8px;
              }

              .kpis {
                display: grid;
                grid-template-columns:
                  repeat(5,1fr);
                gap: 15px;
                margin-bottom: 18px;
              }

              .card {
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 14px;
                padding: 18px;
              }

              .label {
                font-size: 11px;
                text-transform: uppercase;
                color: var(--muted);
                font-weight: 700;
              }

              .number {
                font-size: 30px;
                font-weight: 750;
                margin-top: 6px;
              }

              .grid {
                display: grid;
                grid-template-columns: 2fr 1fr;
                gap: 18px;
                margin-bottom: 18px;
              }

              .chart {
                height: 330px;
              }

              table {
                width: 100%;
                border-collapse: collapse;
              }

              th,
              td {
                padding: 11px;
                border-bottom:
                  1px solid #eef1f5;
                text-align: right;
              }

              th:first-child,
              td:first-child {
                text-align: left;
              }

              @media(max-width:900px) {
                .kpis {
                  grid-template-columns:
                    1fr 1fr;
                }

                .grid {
                  grid-template-columns: 1fr;
                }
              }
            </style>
          </head>

          <body>

            <main>

              <h1>
                Engineering Dashboards
              </h1>

              <div class="muted">
                Real GitHub Project data
              </div>

              <div class="toolbar">

                <select id="projectSelect"></select>

                <select id="sprintSelect"></select>

              </div>

              <section class="kpis">

                <div class="card">
                  <div class="label">Opened</div>
                  <div
                    class="number"
                    id="opened">
                    -
                  </div>
                </div>

                <div class="card">
                  <div class="label">
                    In Development
                  </div>
                  <div
                    class="number"
                    id="development">
                    -
                  </div>
                </div>

                <div class="card">
                  <div class="label">
                    QA Testing
                  </div>
                  <div
                    class="number"
                    id="qa">
                    -
                  </div>
                </div>

                <div class="card">
                  <div class="label">
                    QA Passed
                  </div>
                  <div
                    class="number"
                    id="passed">
                    -
                  </div>
                </div>

                <div class="card">
                  <div class="label">Closed</div>
                  <div
                    class="number"
                    id="closed">
                    -
                  </div>
                </div>

              </section>


              <div class="grid">

                <section class="card">

                  <h3>Sprint Flow</h3>

                  <div class="chart">
                    <canvas id="flowChart"></canvas>
                  </div>

                </section>


                <section class="card">

                  <h3>
                    Bugs vs Enhancements
                  </h3>

                  <div class="chart">
                    <canvas id="mixChart"></canvas>
                  </div>

                </section>

              </div>


              <section class="card">

                <h3>Flow by Priority</h3>

                <table>

                  <thead>
                    <tr>
                      <th>Priority</th>
                      <th>Opened</th>
                      <th>In Dev</th>
                      <th>QA</th>
                      <th>QA Passed</th>
                      <th>Closed</th>
                      <th>Bug Opened</th>
                      <th>Bug Closed</th>
                      <th>Bug C/R</th>
                    </tr>
                  </thead>

                  <tbody id="rows"></tbody>

                </table>

              </section>

            </main>


            <script>

              let projectData = null;


              function within(date,sprint) {
                return (
                  date
                  &&
                  date >= sprint.start
                  &&
                  date <= sprint.end
                );
              }


              function isBug(issue) {
                return (
                  (issue.issueType || "")
                  .toLowerCase()
                  === "bug"
                );
              }


              function isEnhancement(issue) {
                return (
                  (issue.issueType || "")
                  .toLowerCase()
                  === "enhancement"
                );
              }


              function uniqueStatus(
                issues,
                status,
                sprint
              ) {

                const result = new Set();

                issues.forEach(issue => {

                  issue.events.forEach(event => {

                    if (
                      event.status === status
                      &&
                      within(
                        event.date,
                        sprint
                      )
                    ) {

                      result.add(
                        issue.repository
                        + "#"
                        + issue.number
                      );

                    }

                  });

                });

                return result.size;
              }


              function calculate(
                sprint,
                priority = null
              ) {

                const issues =
                  projectData.issues.filter(
                    issue =>
                      !priority
                      ||
                      issue.priority === priority
                  );


                const opened =
                  issues.filter(issue =>
                    within(
                      issue.opened,
                      sprint
                    )
                  );


                const closed =
                  issues.filter(issue =>
                    within(
                      issue.closed,
                      sprint
                    )
                  );


                return {
                  opened: opened.length,

                  development:
                    uniqueStatus(
                      issues,
                      "In Development",
                      sprint
                    ),

                  qa:
                    uniqueStatus(
                      issues,
                      "QA Testing",
                      sprint
                    ),

                  passed:
                    uniqueStatus(
                      issues,
                      "QA Passed",
                      sprint
                    ),

                  closed: closed.length,

                  bugOpened:
                    opened.filter(
                      isBug
                    ).length,

                  bugClosed:
                    closed.filter(
                      isBug
                    ).length
                };
              }


              const flowChart =
                new Chart(
                  document.getElementById(
                    "flowChart"
                  ),
                  {
                    type: "bar",

                    data: {
                      labels: [
                        "Opened",
                        "In Development",
                        "QA Testing",
                        "QA Passed",
                        "Closed"
                      ],

                      datasets: [{
                        label: "Issues",
                        data: []
                      }]
                    },

                    options: {
                      responsive: true,
                      maintainAspectRatio: false
                    }
                  }
                );


              const mixChart =
                new Chart(
                  document.getElementById(
                    "mixChart"
                  ),
                  {
                    type: "doughnut",

                    data: {
                      labels: [
                        "Bugs",
                        "Enhancements"
                      ],

                      datasets: [{
                        data: []
                      }]
                    },

                    options: {
                      responsive: true,
                      maintainAspectRatio: false
                    }
                  }
                );


              function updateSprint() {

                if (!projectData) {
                  return;
                }


                const sprintIndex =
                  Number(
                    document
                    .getElementById(
                      "sprintSelect"
                    )
                    .value
                  );


                const sprint =
                  projectData
                  .sprints[
                    sprintIndex
                  ];


                if (!sprint) {
                  return;
                }


                const total =
                  calculate(sprint);


                opened.textContent =
                  total.opened;

                development.textContent =
                  total.development;

                qa.textContent =
                  total.qa;

                passed.textContent =
                  total.passed;

                closed.textContent =
                  total.closed;


                flowChart
                  .data
                  .datasets[0]
                  .data = [
                    total.opened,
                    total.development,
                    total.qa,
                    total.passed,
                    total.closed
                  ];

                flowChart.update();


                const worked =
                  new Set();


                projectData
                  .issues
                  .forEach(issue => {

                    const id =
                      issue.repository
                      + "#"
                      + issue.number;


                    if (
                      within(
                        issue.closed,
                        sprint
                      )
                    ) {
                      worked.add(id);
                    }


                    issue.events.forEach(event => {

                      if (
                        within(
                          event.date,
                          sprint
                        )
                      ) {
                        worked.add(id);
                      }

                    });

                  });


                let bugs = 0;
                let enhancements = 0;


                projectData
                  .issues
                  .forEach(issue => {

                    const id =
                      issue.repository
                      + "#"
                      + issue.number;


                    if (!worked.has(id)) {
                      return;
                    }


                    if (isBug(issue)) {
                      bugs++;
                    }

                    if (
                      isEnhancement(issue)
                    ) {
                      enhancements++;
                    }

                  });


                mixChart
                  .data
                  .datasets[0]
                  .data = [
                    bugs,
                    enhancements
                  ];

                mixChart.update();


                const tbody =
                  document.getElementById(
                    "rows"
                  );

                tbody.innerHTML = "";


                projectData
                  .priorities
                  .forEach(priority => {

                    const m =
                      calculate(
                        sprint,
                        priority
                      );


                    const ratio =
                      m.bugClosed === 0
                      ? "—"
                      : (
                          m.bugOpened
                          /
                          m.bugClosed
                        ).toFixed(2)
                        + "x";


                    const row =
                      document.createElement(
                        "tr"
                      );


                    row.innerHTML = `
                      <td>
                        <strong>
                          ${priority}
                        </strong>
                      </td>

                      <td>${m.opened}</td>
                      <td>${m.development}</td>
                      <td>${m.qa}</td>
                      <td>${m.passed}</td>
                      <td>${m.closed}</td>
                      <td>${m.bugOpened}</td>
                      <td>${m.bugClosed}</td>
                      <td>${ratio}</td>
                    `;


                    tbody.appendChild(row);

                  });

              }


              function loadProject(project) {

                fetch(
                  `data/${project.slug}.json`
                )
                .then(r => r.json())
                .then(data => {

                  projectData = data;


                  const sprintSelect =
                    document.getElementById(
                      "sprintSelect"
                    );


                  sprintSelect.innerHTML = "";


                  data.sprints.forEach(
                    (sprint,index) => {

                      const option =
                        document.createElement(
                          "option"
                        );


                      option.value = index;

                      option.textContent =
                        `${sprint.name} · ` +
                        `${sprint.start} – ` +
                        `${sprint.end}`;


                      sprintSelect.appendChild(
                        option
                      );

                    }
                  );


                  sprintSelect.value =
                    Math.max(
                      data.sprints.length - 1,
                      0
                    );


                  updateSprint();

                });

              }


              fetch("data/projects.json")
              .then(r => r.json())
              .then(projects => {

                const select =
                  document.getElementById(
                    "projectSelect"
                  );


                projects.forEach(
                  (project,index) => {

                    const option =
                      document.createElement(
                        "option"
                      );


                    option.value = index;

                    option.textContent =
                      `${project.title} ` +
                      `(${project.issueCount} issues)`;


                    select.appendChild(
                      option
                    );

                  }
                );


                if (projects.length) {
                  loadProject(projects[0]);
                }


                select.addEventListener(
                  "change",
                  event => {

                    loadProject(
                      projects[
                        Number(
                          event.target.value
                        )
                      ]
                    );

                  }
                );

              });


              document
                .getElementById(
                  "sprintSelect"
                )
                .addEventListener(
                  "change",
                  updateSprint
                );

            </script>

          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
