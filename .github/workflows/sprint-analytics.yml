              // ===========================================
              // Priority
              // ===========================================

              function renderPriorityTable(
                sprint
              ) {

                const card =
                  document.getElementById(
                    "priorityCard"
                  );


                /*
                 * Do NOT require capability discovery alone.
                 *
                 * Actual observed priority values are enough
                 * to display the table.
                 */

                const priorityAvailable =
                  (
                    cap("priority")
                    ||
                    projectData
                    .issues
                    .some(
                      issue =>
                        issue.priority
                        &&
                        issue.priority
                        !==
                        "Unspecified"
                    )
                  );


                if (
                  !priorityAvailable
                  ||
                  !cap("status")
                ) {

                  card.classList.add(
                    "hidden"
                  );

                  return;

                }


                card.classList.remove(
                  "hidden"
                );


                const priorities =
                  projectData
                  .priorities
                  .length
                  ?
                  projectData.priorities
                  :
                  [
                    ...new Set(
                      projectData
                      .issues
                      .map(
                        issue =>
                          issue.priority
                      )
                      .filter(Boolean)
                    )
                  ];


                const header =
                  document.getElementById(
                    "priorityHeader"
                  );


                header.innerHTML =
                  "";


                [
                  "Priority",
                  "Opened",
                  ...projectData.statuses,
                  "Closed"
                ]
                .forEach(
                  heading => {

                    const th =
                      document
                      .createElement(
                        "th"
                      );


                    th.textContent =
                      heading;


                    header.appendChild(
                      th
                    );

                  }
                );


                const body =
                  document.getElementById(
                    "priorityRows"
                  );


                body.innerHTML =
                  "";


                priorities.forEach(
                  priority => {

                    const row =
                      document
                      .createElement(
                        "tr"
                      );


                    const first =
                      document
                      .createElement(
                        "td"
                      );


                    first.innerHTML =
                      `<strong>${
                        escapeHtml(
                          priority
                        )
                      }</strong>`;


                    row.appendChild(
                      first
                    );


                    function metric(
                      issues,
                      label
                    ) {

                      const td =
                        document
                        .createElement(
                          "td"
                        );


                      td.className =
                        "metric-cell";


                      td.textContent =
                        issues.length;


                      td.onclick =
                        () =>
                          openDrilldown(
                            `${priority} · ${label}`,
                            sprint,
                            issues
                          );


                      row.appendChild(
                        td
                      );

                    }


                    metric(
                      openedIssues(
                        sprint,
                        priority
                      ),
                      "Opened"
                    );


                    projectData
                      .statuses
                      .forEach(
                        status => {

                          metric(
                            statusIssues(
                              sprint,
                              status,
                              priority
                            ),
                            status
                          );

                        }
                      );


                    metric(
                      closedIssues(
                        sprint,
                        priority
                      ),
                      "Closed"
                    );


                    body.appendChild(
                      row
                    );

                  }
                );

              }


