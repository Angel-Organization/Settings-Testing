name: Sprint Analytics

on:
  workflow_dispatch:

  schedule:
    # Runs daily at 12:00 UTC.
    # This is 8:00 AM EDT / 7:00 AM EST.
    - cron: "0 12 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true


jobs:

  build:

    runs-on: ubuntu-latest

    env:
      ORG: ${{ github.repository_owner }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Generate GitHub App token

        id: app-token

        uses: actions/create-github-app-token@v3

        with:
          app-id: ${{ secrets.ACTIONS_APP_ID }}
          private-key: ${{ secrets.ACTIONS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}


      - name: Configure Pages
        uses: actions/configure-pages@v5


      - name: Build dashboard data

        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

        run: |

          mkdir -p site/data

          python3 <<'PY'

          import json
          import os
          import re
          import subprocess

          from datetime import datetime, timedelta
          from pathlib import Path


          ORG = os.environ["ORG"]


          SPRINT_PATTERN = re.compile(
              r"<!--\s*sprint-tracker:\s*(.*?)\s*->\s*(.*?)\s*-->",
              re.IGNORECASE,
          )


          # --------------------------------------------------
          # GitHub GraphQL helper
          # --------------------------------------------------

          def graphql(query, variables=None):

              variables = variables or {}

              cmd = [
                  "gh",
                  "api",
                  "graphql",
                  "-f",
                  f"query={query}",
              ]

              for key, value in variables.items():

                  if value is not None:

                      cmd.extend([
                          "-F",
                          f"{key}={value}",
                      ])


              result = subprocess.run(
                  cmd,
                  check=True,
                  capture_output=True,
                  text=True,
              )


              return json.loads(
                  result.stdout
              )


          # --------------------------------------------------
          # Queries
          # --------------------------------------------------

          PROJECTS_QUERY = """
          query($org: String!) {

            organization(login: $org) {

              projectsV2(first: 100) {

                nodes {
                  number
                  title
                  shortDescription
                  closed
                  url
                }

              }

            }

          }
          """


          PROJECT_QUERY = """
          query(
            $org: String!,
            $number: Int!,
            $cursor: String
          ) {

            organization(login: $org) {

              projectV2(number: $number) {

                number
                title
                shortDescription
                url


                fields(first: 100) {

                  nodes {

                    __typename


                    ... on ProjectV2Field {

                      name
                      dataType

                    }


                    ... on ProjectV2SingleSelectField {

                      name
                      dataType

                      options {
                        name
                      }

                    }


                    ... on ProjectV2IterationField {

                      name
                      dataType

                      configuration {

                        iterations {
                          title
                          startDate
                          duration
                        }

                        completedIterations {
                          title
                          startDate
                          duration
                        }

                      }

                    }

                  }

                }


                items(
                  first: 100,
                  after: $cursor
                ) {

                  pageInfo {
                    hasNextPage
                    endCursor
                  }


                  nodes {

                    fieldValues(first: 100) {

                      nodes {

                        __typename


                        ... on ProjectV2ItemFieldSingleSelectValue {

                          name

                          field {
                            ... on ProjectV2FieldCommon {
                              name
                            }
                          }

                        }


                        ... on ProjectV2ItemFieldNumberValue {

                          number

                          field {
                            ... on ProjectV2FieldCommon {
                              name
                            }
                          }

                        }


                        ... on ProjectV2ItemFieldIterationValue {

                          title
                          startDate
                          duration

                          field {
                            ... on ProjectV2FieldCommon {
                              name
                            }
                          }

                        }


                        ... on ProjectV2ItemFieldDateValue {

                          date

                          field {
                            ... on ProjectV2FieldCommon {
                              name
                            }
                          }

                        }


                        ... on ProjectV2ItemFieldTextValue {

                          text

                          field {
                            ... on ProjectV2FieldCommon {
                              name
                            }
                          }

                        }

                      }

                    }


                    content {

                      ... on Issue {

                        number
                        title
                        state
                        createdAt
                        closedAt
                        url


                        repository {
                          nameWithOwner
                        }


                        issueType {
                          name
                        }

                      }

                    }

                  }

                }

              }

            }

          }
          """


          TIMELINE_QUERY = """
          query(
            $owner: String!,
            $repo: String!,
            $number: Int!
          ) {

            repository(
              owner: $owner,
              name: $repo
            ) {

              issue(number: $number) {

                timelineItems(
                  first: 250,
                  itemTypes: [
                    PROJECT_V2_ITEM_STATUS_CHANGED_EVENT,
                    ISSUE_COMMENT
                  ]
                ) {

                  nodes {

                    __typename


                    ... on ProjectV2ItemStatusChangedEvent {

                      createdAt
                      previousStatus
                      status

                      project {
                        number
                      }

                    }


                    ... on IssueComment {

                      createdAt
                      body

                    }

                  }

                }

              }

            }

          }
          """


          # --------------------------------------------------
          # Helpers
          # --------------------------------------------------

          def normalize(value):

              return re.sub(
                  r"[^a-z0-9]+",
                  " ",
                  str(value or "").lower(),
              ).strip()


          def field_by_alias(
              fields,
              aliases,
              expected_type=None,
          ):

              alias_set = {
                  normalize(alias)
                  for alias in aliases
              }


              for field in fields:

                  if (
                      normalize(
                          field.get("name")
                      )
                      not in alias_set
                  ):

                      continue


                  if (
                      expected_type
                      and
                      field.get("dataType")
                      !=
                      expected_type
                  ):

                      continue


                  return field


              return None


          def iteration_field(fields):

              field = field_by_alias(
                  fields,
                  [
                      "Sprint",
                      "Iteration",
                  ],
                  "ITERATION",
              )


              if field:

                  return field


              for candidate in fields:

                  if (
                      candidate.get("dataType")
                      ==
                      "ITERATION"
                  ):

                      return candidate


              return None


          def item_values(item):

              output = {}


              for value in (
                  item
                  .get("fieldValues", {})
                  .get("nodes", [])
              ):

                  field = (
                      value.get("field")
                      or {}
                  )

                  name = field.get("name")


                  if not name:

                      continue


                  typename = value.get(
                      "__typename"
                  )


                  if (
                      typename
                      ==
                      "ProjectV2ItemFieldSingleSelectValue"
                  ):

                      output[name] = (
                          value.get("name")
                      )


                  elif (
                      typename
                      ==
                      "ProjectV2ItemFieldNumberValue"
                  ):

                      output[name] = (
                          value.get("number")
                      )


                  elif (
                      typename
                      ==
                      "ProjectV2ItemFieldIterationValue"
                  ):

                      output[name] = (
                          value.get("title")
                      )


                  elif (
                      typename
                      ==
                      "ProjectV2ItemFieldDateValue"
                  ):

                      output[name] = (
                          value.get("date")
                      )


                  elif (
                      typename
                      ==
                      "ProjectV2ItemFieldTextValue"
                  ):

                      output[name] = (
                          value.get("text")
                      )


              return output


          timeline_cache = {}


          def issue_timeline(
              repository,
              issue_number,
          ):

              key = (
                  f"{repository}"
                  f"#{issue_number}"
              )


              if key in timeline_cache:

                  return timeline_cache[key]


              owner, repo = (
                  repository.split("/", 1)
              )


              response = graphql(
                  TIMELINE_QUERY,
                  {
                      "owner": owner,
                      "repo": repo,
                      "number": issue_number,
                  },
              )


              nodes = (
                  response["data"]
                  ["repository"]
                  ["issue"]
                  ["timelineItems"]
                  ["nodes"]
              )


              timeline_cache[key] = nodes


              return nodes


          # --------------------------------------------------
          # Projects
          # --------------------------------------------------

          result = graphql(
              PROJECTS_QUERY,
              {
                  "org": ORG,
              },
          )


          projects = [

              project

              for project in (
                  result["data"]
                  ["organization"]
                  ["projectsV2"]
                  ["nodes"]
              )

              if not project["closed"]

          ]


          print(
              f"Found {len(projects)} open projects"
          )


          # --------------------------------------------------
          # Load one project
          # --------------------------------------------------

          def load_project(project):

              cursor = None

              raw_items = []

              raw_field_nodes = []

              metadata = None


              while True:

                  response = graphql(
                      PROJECT_QUERY,
                      {
                          "org":
                              ORG,

                          "number":
                              project["number"],

                          "cursor":
                              cursor,
                      },
                  )


                  pv2 = (
                      response["data"]
                      ["organization"]
                      ["projectV2"]
                  )


                  if metadata is None:

                      metadata = {

                          "number":
                              pv2["number"],

                          "title":
                              pv2["title"],

                          "description":
                              (
                                  pv2.get(
                                      "shortDescription"
                                  )
                                  or ""
                              ),

                          "url":
                              pv2["url"],

                      }


                      raw_field_nodes = (
                          pv2["fields"]["nodes"]
                      )


                  connection = pv2["items"]


                  raw_items.extend(
                      connection["nodes"]
                  )


                  if not (
                      connection[
                          "pageInfo"
                      ][
                          "hasNextPage"
                      ]
                  ):

                      break


                  cursor = (
                      connection[
                          "pageInfo"
                      ][
                          "endCursor"
                      ]
                  )


              # ------------------------------------------------
              # Normalize project field definitions
              # ------------------------------------------------

              fields = []


              for raw in raw_field_nodes:

                  fields.append({

                      "name":
                          raw.get("name"),

                      "dataType":
                          raw.get("dataType"),

                      "kind":
                          raw.get("__typename"),

                      "options": [
                          option["name"]
                          for option in (
                              raw.get(
                                  "options",
                                  []
                              )
                          )
                      ],

                  })


              status_field = field_by_alias(
                  fields,
                  ["Status"],
                  "SINGLE_SELECT",
              )


              sprint_field = iteration_field(
                  fields
              )


              priority_field = field_by_alias(
                  fields,
                  [
                      "Priority",
                      "Initial Priority",
                  ],
                  "SINGLE_SELECT",
              )


              size_field = field_by_alias(
                  fields,
                  [
                      "Size",
                      "T-Shirt Size",
                      "T Shirt Size",
                      "Tshirt Size",
                      "Shirt Size",
                  ],
                  "SINGLE_SELECT",
              )


              loe_field = field_by_alias(
                  fields,
                  [
                      "LOE",
                      "Level of Effort",
                      "Level Of Effort",
                      "Effort Days",
                      "Estimated Days",
                  ],
                  "NUMBER",
              )


              # ------------------------------------------------
              # Sprints
              # ------------------------------------------------

              sprints = {}


              if sprint_field:

                  raw_sprint_field = next(
                      (
                          field
                          for field in raw_field_nodes
                          if (
                              field.get("name")
                              ==
                              sprint_field["name"]
                          )
                      ),
                      None,
                  )


                  if raw_sprint_field:

                      config = (
                          raw_sprint_field.get(
                              "configuration"
                          )
                          or {}
                      )


                      iterations = (
                          config.get(
                              "completedIterations",
                              [],
                          )
                          +
                          config.get(
                              "iterations",
                              [],
                          )
                      )


                      for sprint in iterations:

                          start = (
                              sprint["startDate"]
                          )

                          duration = int(
                              sprint["duration"]
                          )

                          end = (
                              datetime
                              .fromisoformat(start)
                              +
                              timedelta(
                                  days=
                                      duration
                                      -
                                      1
                              )
                          ).date().isoformat()


                          sprints[
                              sprint["title"]
                          ] = {

                              "name":
                                  sprint["title"],

                              "start":
                                  start,

                              "end":
                                  end,

                              "duration":
                                  duration,

                          }


              # ------------------------------------------------
              # Issues + observed field data
              # ------------------------------------------------

              issues = []

              observed_priorities = set()
              observed_sizes = set()


              for item in raw_items:

                  issue = item.get("content")


                  if (
                      not issue
                      or
                      not issue.get("number")
                  ):

                      continue


                  repository = (
                      issue
                      .get("repository", {})
                      .get("nameWithOwner")
                  )


                  if not repository:

                      continue


                  values = item_values(
                      item
                  )


                  priority = None


                  if priority_field:

                      priority = values.get(
                          priority_field["name"]
                      )


                  # Resilient fallback:
                  # if capability discovery missed Priority,
                  # inspect actual field-value names.

                  if priority is None:

                      for field_name, value in (
                          values.items()
                      ):

                          if normalize(
                              field_name
                          ) in {
                              "priority",
                              "initial priority",
                          }:

                              priority = value
                              break


                  if priority is not None:

                      observed_priorities.add(
                          str(priority)
                      )


                  size = None


                  if size_field:

                      size = values.get(
                          size_field["name"]
                      )


                  if size is not None:

                      observed_sizes.add(
                          str(size)
                      )


                  loe = None


                  if loe_field:

                      loe = values.get(
                          loe_field["name"]
                      )


                  current_sprint = None


                  if sprint_field:

                      current_sprint = (
                          values.get(
                              sprint_field["name"]
                          )
                      )


                  issues.append({

                      "number":
                          issue["number"],

                      "repository":
                          repository,

                      "title":
                          issue["title"],

                      "url":
                          issue["url"],

                      "state":
                          issue["state"],

                      "issueType":
                          (
                              (
                                  issue.get(
                                      "issueType"
                                  )
                                  or {}
                              )
                              .get("name")
                              or
                              "Unspecified"
                          ),

                      "priority":
                          (
                              priority
                              if priority
                              is not None
                              else
                              "Unspecified"
                          ),

                      "size":
                          size,

                      "loe":
                          loe,

                      "currentSprint":
                          current_sprint,

                      "opened":
                          issue[
                              "createdAt"
                          ][:10],

                      "closed":
                          (
                              issue[
                                  "closedAt"
                              ][:10]
                              if issue[
                                  "closedAt"
                              ]
                              else None
                          ),

                      "fieldValues":
                          values,

                      "statusEvents":
                          [],

                      "sprintTransitions":
                          [],

                  })


              # ------------------------------------------------
              # Timeline data
              # ------------------------------------------------

              known_sprints = set(
                  sprints.keys()
              )


              for index, issue in enumerate(
                  issues,
                  start=1,
              ):

                  print(
                      f'Project '
                      f'{project["number"]}: '
                      f'[{index}/{len(issues)}] '
                      f'{issue["repository"]}'
                      f'#{issue["number"]}'
                  )


                  try:

                      nodes = issue_timeline(
                          issue["repository"],
                          issue["number"],
                      )


                      for node in nodes:

                          typename = node.get(
                              "__typename"
                          )


                          # ------------------------------------
                          # Project-specific status events
                          # ------------------------------------

                          if (
                              typename
                              ==
                              "ProjectV2ItemStatusChangedEvent"
                          ):

                              event_project = (
                                  node.get("project")
                                  or {}
                              )


                              if (
                                  event_project.get(
                                      "number"
                                  )
                                  !=
                                  project["number"]
                              ):

                                  continue


                              status = node.get(
                                  "status"
                              )


                              if not status:

                                  continue


                              issue[
                                  "statusEvents"
                              ].append({

                                  "status":
                                      status,

                                  "date":
                                      node[
                                          "createdAt"
                                      ][:10],

                              })


                          # ------------------------------------
                          # Sprint tracker comments
                          # ------------------------------------

                          elif (
                              typename
                              ==
                              "IssueComment"
                          ):

                              body = (
                                  node.get("body")
                                  or ""
                              )


                              for match in (
                                  SPRINT_PATTERN
                                  .finditer(body)
                              ):

                                  from_value = (
                                      match
                                      .group(1)
                                      .strip()
                                  )

                                  to_value = (
                                      match
                                      .group(2)
                                      .strip()
                                  )


                                  # Keep a transition when at least
                                  # one side clearly relates to this
                                  # project's sprint configuration.
                                  #
                                  # This allows:
                                  #
                                  # Sprint 197 -> Sprint 199
                                  #
                                  # even if Sprint 197 is older and
                                  # no longer in iteration config.

                                  destination_relevant = (
                                      to_value
                                      in known_sprints
                                      or
                                      to_value.lower()
                                      ==
                                      "backlog"
                                  )


                                  source_relevant = (
                                      from_value
                                      in known_sprints
                                      or
                                      from_value.lower()
                                      ==
                                      "backlog"
                                  )


                                  if not (
                                      destination_relevant
                                      or
                                      source_relevant
                                  ):

                                      continue


                                  issue[
                                      "sprintTransitions"
                                  ].append({

                                      "from":
                                          from_value,

                                      "to":
                                          to_value,

                                      "date":
                                          node[
                                              "createdAt"
                                          ][:10],

                                  })


                      issue[
                          "statusEvents"
                      ].sort(
                          key=lambda event:
                              event["date"]
                      )


                      issue[
                          "sprintTransitions"
                      ].sort(
                          key=lambda event:
                              event["date"]
                      )


                  except Exception as exc:

                      print(
                          f'Warning reading '
                          f'{issue["repository"]}'
                          f'#{issue["number"]}: '
                          f'{exc}'
                      )


              # ------------------------------------------------
              # Status options
              # ------------------------------------------------

              statuses = []


              if status_field:

                  statuses.extend(
                      status_field.get(
                          "options",
                          []
                      )
                  )


              # Keep observed historical statuses too.

              for issue in issues:

                  for event in (
                      issue["statusEvents"]
                  ):

                      status = event["status"]


                      if status not in statuses:

                          statuses.append(
                              status
                          )


              # ------------------------------------------------
              # Priority options
              # ------------------------------------------------

              priorities = []


              if priority_field:

                  priorities.extend(
                      priority_field.get(
                          "options",
                          []
                      )
                  )


              for priority in sorted(
                  observed_priorities
              ):

                  if priority not in priorities:

                      priorities.append(
                          priority
                      )


              if any(
                  issue["priority"]
                  ==
                  "Unspecified"
                  for issue in issues
              ):

                  if (
                      "Unspecified"
                      not in priorities
                  ):

                      priorities.append(
                          "Unspecified"
                      )


              # ------------------------------------------------
              # Size options
              # ------------------------------------------------

              sizes = []


              if size_field:

                  sizes.extend(
                      size_field.get(
                          "options",
                          []
                      )
                  )


              for size in sorted(
                  observed_sizes
              ):

                  if size not in sizes:

                      sizes.append(size)


              # ------------------------------------------------
              # Capabilities
              # ------------------------------------------------

              priority_available = (
                  priority_field is not None
                  or
                  len(observed_priorities) > 0
              )


              capabilities = {

                  "status": {
                      "available":
                          (
                              status_field
                              is not None
                              or
                              len(statuses)
                              >
                              0
                          ),

                      "fieldName":
                          (
                              status_field[
                                  "name"
                              ]
                              if status_field
                              else None
                          ),
                  },

                  "sprint": {
                      "available":
                          sprint_field
                          is not None,

                      "fieldName":
                          (
                              sprint_field[
                                  "name"
                              ]
                              if sprint_field
                              else None
                          ),
                  },

                  "priority": {
                      "available":
                          priority_available,

                      "fieldName":
                          (
                              priority_field[
                                  "name"
                              ]
                              if priority_field
                              else None
                          ),
                  },

                  "size": {
                      "available":
                          (
                              size_field
                              is not None
                          ),

                      "fieldName":
                          (
                              size_field[
                                  "name"
                              ]
                              if size_field
                              else None
                          ),
                  },

                  "loe": {
                      "available":
                          (
                              loe_field
                              is not None
                          ),

                      "fieldName":
                          (
                              loe_field[
                                  "name"
                              ]
                              if loe_field
                              else None
                          ),
                  },

                  "issueType": {
                      "available":
                          True,
                  },

              }


              return {

                  "project":
                      metadata,

                  "fields":
                      fields,

                  "capabilities":
                      capabilities,

                  "sprints":
                      sorted(
                          sprints.values(),
                          key=lambda sprint:
                              sprint["start"],
                      ),

                  "statuses":
                      statuses,

                  "priorities":
                      priorities,

                  "sizes":
                      sizes,

                  "issues":
                      issues,

              }


          # --------------------------------------------------
          # Write project data
          # --------------------------------------------------

          project_index = []


          for project in projects:

              data = load_project(
                  project
              )


              slug = (
                  f'project-'
                  f'{project["number"]}'
              )


              Path(
                  f"site/data/{slug}.json"
              ).write_text(
                  json.dumps(
                      data,
                      indent=2,
                  )
              )


              project_index.append({

                  "number":
                      project["number"],

                  "title":
                      project["title"],

                  "description":
                      (
                          project.get(
                              "shortDescription"
                          )
                          or ""
                      ),

                  "slug":
                      slug,

                  "issueCount":
                      len(
                          data["issues"]
                      ),

                  "capabilities":
                      data[
                          "capabilities"
                      ],

              })


          Path(
              "site/data/projects.json"
          ).write_text(
              json.dumps(
                  project_index,
                  indent=2,
              )
          )


          print("")
          print("Projects generated:")
          print(
              json.dumps(
                  project_index,
                  indent=2,
              )
          )

          PY


      - name: Create Sprint Analytics application

        run: |

          cat > site/index.html <<'EOF'

          <!doctype html>

          <html lang="en">

          <head>

            <meta charset="utf-8">

            <meta
              name="viewport"
              content="width=device-width, initial-scale=1"
            >

            <meta
              http-equiv="Cache-Control"
              content="no-cache, no-store, must-revalidate"
            >

            <meta
              http-equiv="Pragma"
              content="no-cache"
            >

            <meta
              http-equiv="Expires"
              content="0"
            >


            <title>
              Sprint Analytics
            </title>


            <script
              src="https://cdn.jsdelivr.net/npm/chart.js">
            </script>


            <style>

              :root {

                --brand-blue:
                  #2499e8;

                --brand-blue-deep:
                  #0f5f98;

                --brand-blue-light:
                  #eaf6fd;

                --brand-green:
                  #49b94f;

                --navy:
                  #172033;

                --text:
                  #172033;

                --muted:
                  #667085;

                --border:
                  #d7e0e7;

                --page-bg:
                  #f4f6f8;

                --card:
                  #ffffff;

              }


              * {
                box-sizing:
                  border-box;
              }


              html,
              body {

                width:
                  100%;

                min-height:
                  100%;

                margin:
                  0;

              }


              body {

                overflow-x:
                  hidden;

                background:
                  var(--page-bg);

                color:
                  var(--text);

                font-family:
                  Inter,
                  system-ui,
                  -apple-system,
                  BlinkMacSystemFont,
                  "Segoe UI",
                  sans-serif;

              }


              main {

                width:
                  100%;

                max-width:
                  1600px;

                margin:
                  0 auto;

                padding:
                  0 32px 40px;

              }


              .header {

                margin:
                  0 -32px;

                padding:
                  26px 32px 0;

                background:
                  var(--brand-blue-deep);

                color:
                  #ffffff;

              }


              .header h1 {

                margin:
                  0;

                padding-bottom:
                  20px;

                font-size:
                  30px;

                font-weight:
                  800;

              }


              .nav {

                display:
                  flex;

                gap:
                  6px;

                overflow-x:
                  auto;

              }


              .nav-button {

                border:
                  0;

                border-radius:
                  8px 8px 0 0;

                padding:
                  11px 16px;

                background:
                  transparent;

                color:
                  rgba(
                    255,
                    255,
                    255,
                    .78
                  );

                font-size:
                  13px;

                font-weight:
                  750;

                cursor:
                  pointer;

                white-space:
                  nowrap;

              }


              .nav-button:hover {

                background:
                  rgba(
                    255,
                    255,
                    255,
                    .10
                  );

                color:
                  #ffffff;

              }


              .nav-button.active {

                background:
                  var(--page-bg);

                color:
                  var(--brand-blue-deep);

              }


              .toolbar {

                display:
                  flex;

                flex-wrap:
                  wrap;

                gap:
                  12px;

                margin:
                  0 -32px 24px;

                padding:
                  18px 32px;

                border-bottom:
                  1px solid
                  var(--border);

              }


              select {

                min-width:
                  240px;

                max-width:
                  100%;

                padding:
                  10px 14px;

                background:
                  #ffffff;

                color:
                  var(--navy);

                border:
                  1px solid
                  var(--border);

                border-radius:
                  8px;

                font-weight:
                  700;

              }


              .view {

                display:
                  none;

              }


              .view.active {

                display:
                  block;

              }


              .section-title {

                margin:
                  4px 0 16px;

                font-size:
                  20px;

                font-weight:
                  800;

                color:
                  var(--navy);

              }


              .kpis {

                display:
                  grid;

                grid-template-columns:
                  repeat(
                    auto-fit,
                    minmax(
                      150px,
                      1fr
                    )
                  );

                gap:
                  14px;

                margin-bottom:
                  18px;

              }


              .card {

                min-width:
                  0;

                background:
                  var(--card);

                border:
                  1px solid
                  var(--border);

                border-radius:
                  14px;

                padding:
                  18px;

                box-shadow:
                  0 3px 10px
                  rgba(
                    23,
                    32,
                    51,
                    .07
                  );

              }


              .clickable {

                cursor:
                  pointer;

              }


              .clickable:hover {

                box-shadow:
                  0 7px 20px
                  rgba(
                    23,
                    32,
                    51,
                    .13
                  );

              }


              .label {

                color:
                  #586577;

                font-size:
                  11px;

                font-weight:
                  800;

                letter-spacing:
                  .045em;

                text-transform:
                  uppercase;

              }


              .number {

                margin-top:
                  6px;

                color:
                  var(--navy);

                font-size:
                  31px;

                font-weight:
                  800;

              }


              .subnumber {

                margin-top:
                  5px;

                color:
                  var(--muted);

                font-size:
                  12px;

              }


              .grid-two {

                display:
                  grid;

                grid-template-columns:
                  minmax(
                    0,
                    2fr
                  )
                  minmax(
                    320px,
                    1fr
                  );

                gap:
                  18px;

                margin-bottom:
                  18px;

              }


              .grid-equal {

                display:
                  grid;

                grid-template-columns:
                  repeat(
                    2,
                    minmax(
                      0,
                      1fr
                    )
                  );

                gap:
                  18px;

                margin-bottom:
                  18px;

              }


              .chart {

                position:
                  relative;

                width:
                  100%;

                height:
                  330px;

                min-width:
                  0;

              }


              .chart canvas {

                display:
                  block;

                width:
                  100% !important;

                max-width:
                  100% !important;

                height:
                  100% !important;

              }


              h3 {

                margin:
                  0 0 16px;

                color:
                  var(--navy);

              }


              .status-row {

                display:
                  flex;

                flex-wrap:
                  wrap;

                gap:
