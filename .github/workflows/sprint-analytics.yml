              // ===========================================
              // Type doughnut
              // ===========================================

              const typeChart =
                new Chart(
                  document.getElementById(
                    "typeChart"
                  ),
                  {

                    type:
                      "doughnut",

                    data: {

                      labels:
                        [],

                      datasets: [{

                        data:
                          [],

                        backgroundColor:
                          [],

                        borderColor:
                          "#ffffff",

                        borderWidth:
                          2,

                        hoverOffset:
                          8

                      }]

                    },

                    options: {

                      responsive:
                        true,

                      maintainAspectRatio:
                        false,

                      resizeDelay:
                        100,

                      cutout:
                        "58%",

                      plugins: {

                        legend: {

                          position:
                            "bottom",

                          labels: {

                            usePointStyle:
                              true,

                            pointStyle:
                              "circle",

                            padding:
                              14

                          }

                        }

                      },

                      onClick(
                        event,
                        elements
                      ) {

                        if (
                          !elements.length
                        ) {

                          return;

                        }


                        const sprint =
                          selectedSprint();


                        const type =
                          typeChart
                          .data
                          .labels[
                            elements[0]
                            .index
                          ];


                        const issues =
                          workedIssues(
                            sprint
                          )
                          .filter(
                            issue =>
                              (
                                issue.issueType
                                ||
                                "Unspecified"
                              )
                              ===
                              type
                          );


                        openDrilldown(
                          type,
                          sprint,
                          issues
                        );

                      }

                    }

                  }
                );


              function renderTypeChart(
                sprint
              ) {

                const counts =
                  {};


                workedIssues(
                  sprint
                )
                .forEach(
                  issue => {

                    const type =
                      issue.issueType
                      ||
                      "Unspecified";


                    counts[type] =
                      (
                        counts[type]
                        ||
                        0
                      )
                      +
                      1;

                  }
                );


                const rows =
                  Object
                  .entries(
                    counts
                  )
                  .sort(
                    (a,b) =>
                      b[1]
                      -
                      a[1]
                  );


                typeChart.data.labels =
                  rows.map(
                    row =>
                      row[0]
                  );


                typeChart
                  .data
                  .datasets[0]
                  .data =
                    rows.map(
                      row =>
                        row[1]
                    );


                typeChart
                  .data
                  .datasets[0]
                  .backgroundColor =
                    rows.map(
                      (
                        row,
                        index
                      ) =>
                        TYPE_COLORS[
                          index
                          %
                          TYPE_COLORS.length
                        ]
                    );


                typeChart.update();

              }


              // ===========================================
              // Flow
              // ===========================================

              const flowChart =
                new Chart(
                  document.getElementById(
                    "flowChart"
                  ),
                  {

                    type:
                      "bar",

                    data: {

                      labels:
                        [],

                      datasets: [{

                        label:
                          "Issues",

                        data:
                          [],

                        backgroundColor:
                          "#2499e8",

                        borderWidth:
                          0

                      }]

                    },

                    options: {

                      responsive:
                        true,

                      maintainAspectRatio:
