name: Initialize Issue Fields

on:
  issues:
    types:
      - opened
      - edited

permissions:
  contents: read
  issues: write

jobs:
  initialize:
    runs-on: ubuntu-latest

    steps:
      - name: Initialize Issue Fields
        uses: actions/github-script@v8

        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

          script: |

            /*
             * ============================================================
             * Issue Information
             * ============================================================
             */

            const issue = context.payload.issue;
            const issueBody = issue.body ?? "";
            const issueId = issue.node_id;
            const issueNumber = issue.number;

            /*
             * ============================================================
             * Repository Issue Fields
             * ============================================================
             *
             * Add additional fields by appending another object to this array.
             */

            const ISSUE_FIELDS = [

              {
                key: "product",

                label: "Product",

                fieldId: "IFSS_kgDOAqu9dA",

                options: {

                  ScriptSure: "IFSSO_kgDOBKyrFQ",
                  VetWay: "IFSSO_kgDOBKyrFg",
                  Exchange: "IFSSO_kgDOBKyrFw"

                }

              },

              {
                key: "priority",

                label: "Priority",

                fieldId: "IFSS_kgDOAqcSiw",

                options: {

                  "PROD Critical": "IFSSO_kgDOBKR5-Q",
                  P0: "IFSSO_kgDOBKyRWg",
                  P1: "IFSSO_kgDOBKR5-g",
                  P2: "IFSSO_kgDOBKR5-w",
                  P3: "IFSSO_kgDOBKR5_A",
                  P4: "IFSSO_kgDOBKyRWw"

                }

              },

              {
                key: "source",

                label: "Source",

                fieldId: "IFSS_kgDOAqu99Q",

                options: {

                  Customer: "IFSSO_kgDOBKysHA",
                  QA: "IFSSO_kgDOBKysHQ",
                  Demo: "IFSSO_kgDOBKysHg",
                  Support: "IFSSO_kgDOBKysHw",
                  "Internal Testing": "IFSSO_kgDOBKysIA",
                  Other: "IFSSO_kgDOBKysIQ"

                }
              }

            ];
                            /*
             * ============================================================
             * Helper Functions
             * ============================================================
             */

            /*
             * Returns the answer beneath an Issue Form heading.
             */
            function getIssueFormAnswer(label) {

              const escapedLabel =
                label.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

              const pattern = new RegExp(
                `(?:^|\\n)###\\s+${escapedLabel}\\s*\\n+([\\s\\S]*?)(?=\\n###\\s+|$)`,
                "i"
              );

              const match = issueBody.match(pattern);

              if (!match) {
                return null;
              }

              const answer = match[1]
                .replace(/<!--[\s\S]*?-->/g, "")
                .trim();

              if (
                answer === "" ||
                /^_No response_$/i.test(answer)
              ) {
                return null;
              }

              return answer;

            }

            /*
             * Read all configured Issue Form values.
             */
            function getIssueFormValues() {

              const values = {};

              for (const field of ISSUE_FIELDS) {

                values[field.key] =
                  getIssueFormAnswer(field.label);

              }

              return values;

            }

            /*
             * Look up the GitHub option ID for a selected value.
             */
            function getOptionId(field, value) {

              const optionId = field.options[value];

              if (!optionId) {

                throw new Error(
                  `"${value}" is not a valid option for "${field.label}".`
                );

              }

              return optionId;

            }

            /*
             * Log the parsed Issue Form values.
             */
            function logIssueFormValues(values) {

              core.startGroup("Issue Form Values");

              for (const field of ISSUE_FIELDS) {

                core.info(
                  `${field.label}: ${values[field.key] ?? "(none)"}`
                );

              }

              core.endGroup();

            }
                        /*
             * ============================================================
             * GitHub Issue Field Updates
             * ============================================================
             */

            /*
             * Set a single GitHub Issue Field.
             */
            async function setIssueField(field, value) {

              const optionId = getOptionId(
                field,
                value
              );

              core.info(
                `Setting ${field.label} → ${value}`
              );

              await github.graphql(

                `
                mutation(
                  $issueId: ID!
                  $fieldId: ID!
                  $optionId: ID!
                ) {

                  setIssueFieldValue(
                    input: {
                      issueId: $issueId
                      issueFields: [
                        {
                          fieldId: $fieldId
                          singleSelectOptionId: $optionId
                        }
                      ]
                    }
                  ) {

                    issue {
                      number
                    }

                  }

                }
                `,

                {
                  issueId,
                  fieldId: field.fieldId,
                  optionId
                }

              );

            }

            /*
             * Update every configured Issue Field.
             */
            async function updateIssueFields(values) {

              core.startGroup("Updating Issue Fields");

              for (const field of ISSUE_FIELDS) {

                const value = values[field.key];

                if (!value) {

                  core.info(
                    `Skipping ${field.label} (no value)`
                  );

                  continue;

                }

                await setIssueField(
                  field,
                  value
                );

              }

              core.endGroup();

            }
                        /*
             * ============================================================
             * Main
             * ============================================================
             */

            async function main() {

              core.info(
                `Initializing Issue #${issueNumber}`
              );

              const values =
                getIssueFormValues();

              logIssueFormValues(
                values
              );

              await updateIssueFields(
                values
              );

              core.notice(
                `Issue #${issueNumber} initialized successfully.`
              );

            }

            /*
             * ============================================================
             * Execute
             * ============================================================
             */

            try {

              await main();

            } catch (error) {

              core.error(error);

              core.setFailed(
                error.message ?? String(error)
              );

            }
