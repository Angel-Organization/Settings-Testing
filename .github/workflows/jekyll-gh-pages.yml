name: Engineering Project Dashboards

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    # Rebuild every weekday at 7 AM UTC
    - cron: "0 7 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  ORG: ${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Authenticate as GitHub App
      # ------------------------------------------------------

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ACTIONS_APP_ID }}
          private-key: ${{ secrets.ACTIONS_APP_PRIVATE_KEY }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # ------------------------------------------------------
      # Build all project JSON files + Jekyll pages
      # ------------------------------------------------------

      - name: Generate dashboards
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          mkdir -p dashboard/data
          mkdir -p dashboard/projects
          mkdir -p dashboard/_layouts
          mkdir -p dashboard/assets

          python3 <<'PY'
          import json
          import os
          import re
          import subprocess
          from datetime import datetime, timedelta
          from pathlib import Path

          ORG = os.environ["ORG"]

          PRIORITIES = [
              "PROD Critical",
              "P1",
              "P2",
              "P3",
              "P4",
          ]

          TRACKED_STATUSES = {
              "In Development",
              "QA Testing",
              "QA Passed",
          }


          # ==================================================
          # Helpers
          # ==================================================

          def graphql(query, variables=None):
              variables = variables or {}

              cmd = [
                  "gh",
                  "api",
                  "graphql",
                  "-f",
                  f"query={query}",
              ]

              for key, value in variables.items():
                  if value is None:
                      continue

                  cmd += [
                      "-F",
                      f"{key}={value}",
                  ]

              result = subprocess.run(
                  cmd,
                  check=True,
                  capture_output=True,
                  text=True,
              )

              return json.loads(result.stdout)


          def slugify(value):
              value = value.lower().strip()
              value = re.sub(r"[^a-z0-9]+", "-", value)
              return value.strip("-")


          def issue_priority(issue):
              values = (
                  issue
                  .get("issueFieldValues", {})
                  .get("nodes", [])
              )

              for value in values:
                  field = value.get("field") or {}

                  if field.get("name") == "Priority":
                      return value.get("name") or "Unspecified"

              return "Unspecified"


          # ==================================================
          # Discover ALL organization projects
          # ==================================================

          PROJECT_LIST_QUERY = """
          query(
            $org: String!,
            $cursor: String
          ) {
            organization(login: $org) {
              projectsV2(
                first: 100,
                after: $cursor
              ) {
                pageInfo {
                  hasNextPage
                  endCursor
                }

                nodes {
                  id
                  number
                  title
                  shortDescription
                  closed
                  public
                  url
                }
              }
            }
          }
          """


          projects = []
          cursor = None

          while True:
              result = graphql(
                  PROJECT_LIST_QUERY,
                  {
                      "org": ORG,
                      "cursor": cursor,
                  },
              )

              connection = (
                  result["data"]
                  ["organization"]
                  ["projectsV2"]
              )

              for project in connection["nodes"]:
                  # Skip archived/closed projects.
                  if project.get("closed"):
                      continue

                  projects.append(project)

              if not connection["pageInfo"]["hasNextPage"]:
                  break

              cursor = connection["pageInfo"]["endCursor"]


          print(f"Discovered {len(projects)} open projects.")


          # ==================================================
          # Project data
          # ==================================================

          PROJECT_QUERY = """
          query(
            $org: String!,
            $number: Int!,
            $cursor: String
          ) {
            organization(login: $org) {
              projectV2(number: $number) {
                id
                number
                title
                shortDescription
                url

                fields(first: 100) {
                  nodes {
                    ... on ProjectV2IterationField {
                      name

                      configuration {
                        iterations {
                          id
                          title
                          startDate
                          duration
                        }

                        completedIterations {
                          id
                          title
                          startDate
                          duration
                        }
                      }
                    }
                  }
                }

                items(
                  first: 100,
                  after: $cursor
                ) {
                  pageInfo {
                    hasNextPage
                    endCursor
                  }

                  nodes {
                    id

                    content {
                      ... on Issue {
                        number
                        title
                        createdAt
                        closedAt
                        state
                        url

                        repository {
                          nameWithOwner
                        }

                        issueType {
                          name
                        }

                        issueFieldValues(first: 30) {
                          nodes {
                            ... on IssueFieldSingleSelectValue {
                              name

                              field {
                                ... on IssueFieldSingleSelect {
                                  name
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
          """


          # ==================================================
          # Project status history
          #
          # The event contains its Project V2 reference,
          # so we can safely filter events to the dashboard's
          # specific project.
          # ==================================================

          TIMELINE_QUERY = """
          query(
            $owner: String!,
            $repo: String!,
            $number: Int!,
            $cursor: String
          ) {
            repository(
              owner: $owner,
              name: $repo
            ) {
              issue(number: $number) {
                timelineItems(
                  first: 100,
                  after: $cursor,
                  itemTypes: [
                    PROJECT_V2_ITEM_STATUS_CHANGED_EVENT
                  ]
                ) {
                  pageInfo {
                    hasNextPage
                    endCursor
                  }

                  nodes {
                    ... on ProjectV2ItemStatusChangedEvent {
                      createdAt
                      previousStatus
                      status

                      project {
                        number
                      }
                    }
                  }
                }
              }
            }
          }
          """


          def get_status_events(issue, project_number):
              owner, repo = issue["repository"].split("/", 1)

              cursor = None
              events = []

              while True:
                  response = graphql(
                      TIMELINE_QUERY,
                      {
                          "owner": owner,
                          "repo": repo,
                          "number": issue["number"],
                          "cursor": cursor,
                      },
                  )

                  issue_node = (
                      response
                      .get("data", {})
                      .get("repository", {})
                      .get("issue")
                  )

                  if not issue_node:
                      break

                  connection = issue_node["timelineItems"]

                  for event in connection["nodes"]:
                      project = event.get("project") or {}

                      # Critical: only events from THIS project.
                      if project.get("number") != project_number:
                          continue

                      status = event.get("status")

                      if status not in TRACKED_STATUSES:
                          continue

                      events.append({
                          "status": status,
                          "date": event["createdAt"][:10],
                      })

                  if not connection["pageInfo"]["hasNextPage"]:
                      break

                  cursor = connection["pageInfo"]["endCursor"]

              return events


          # ==================================================
          # Load one project
          # ==================================================

          def load_project(project):
              project_number = project["number"]

              print()
              print(
                  f'Project {project_number}: '
                  f'{project["title"]}'
              )

              cursor = None
              project_meta = None
              sprint_map = {}
              issues = []

              while True:
                  response = graphql(
                      PROJECT_QUERY,
                      {
                          "org": ORG,
                          "number": project_number,
                          "cursor": cursor,
                      },
                  )

                  pv2 = (
                      response["data"]
                      ["organization"]
                      ["projectV2"]
                  )

                  if pv2 is None:
                      return None

                  if project_meta is None:
                      project_meta = {
                          "number": pv2["number"],
                          "title": pv2["title"],
                          "description": (
                              pv2.get("shortDescription") or ""
                          ),
                          "url": pv2["url"],
                      }

                      # --------------------------------------
                      # Pull real iteration definitions from
                      # the field actually named "Sprint".
                      # --------------------------------------

                      for field in pv2["fields"]["nodes"]:
                          if field.get("name") != "Sprint":
                              continue

                          configuration = (
                              field.get("configuration") or {}
                          )

                          iterations = (
                              configuration.get(
                                  "completedIterations",
                                  []
                              )
                              +
                              configuration.get(
                                  "iterations",
                                  []
                              )
                          )

                          for sprint in iterations:
                              start = sprint["startDate"]
                              duration = sprint["duration"]

                              start_dt = datetime.fromisoformat(start)

                              end_dt = (
                                  start_dt
                                  + timedelta(days=duration - 1)
                              )

                              sprint_map[sprint["id"]] = {
                                  "id": sprint["id"],
                                  "name": sprint["title"],
                                  "start": start,
                                  "end": end_dt.date().isoformat(),
                                  "duration": duration,
                              }

                  connection = pv2["items"]

                  for item in connection["nodes"]:
                      issue = item.get("content")

                      # Drafts and PRs won't contain this shape.
                      if not issue:
                          continue

                      if not issue.get("number"):
                          continue

                      repository = (
                          (issue.get("repository") or {})
                          .get("nameWithOwner")
                      )

                      if not repository:
                          continue

                      issue_type = (
                          (issue.get("issueType") or {})
                          .get("name")
                          or "Unspecified"
                      )

                      issues.append({
                          "number": issue["number"],
                          "repository": repository,
                          "title": issue["title"],
                          "url": issue["url"],
                          "priority": issue_priority(issue),
                          "issueType": issue_type,
                          "state": issue["state"],
                          "opened": issue["createdAt"][:10],
                          "closed": (
                              issue["closedAt"][:10]
                              if issue["closedAt"]
                              else None
                          ),
                          "events": [],
                      })

                  if not connection["pageInfo"]["hasNextPage"]:
                      break

                  cursor = connection["pageInfo"]["endCursor"]


              # ----------------------------------------------
              # Load status history for all Project issues.
              # ----------------------------------------------

              for i, issue in enumerate(issues, 1):
                  print(
                      f'  [{i}/{len(issues)}] '
                      f'{issue["repository"]}'
                      f'#{issue["number"]}'
                  )

                  try:
                      issue["events"] = get_status_events(
                          issue,
                          project_number,
                      )

                  except Exception as exc:
                      print(
                          f'    Warning: '
                          f'could not load timeline: {exc}'
                      )


              sprints = sorted(
                  sprint_map.values(),
                  key=lambda x: x["start"],
              )

              return {
                  "project": project_meta,
                  "sprints": sprints,
                  "priorities": PRIORITIES,
                  "issues": issues,
              }


          # ==================================================
          # Create dashboard data/page per project
          # ==================================================

          index = []

          for project in projects:
              slug = (
                  f'project-{project["number"]}-'
                  f'{slugify(project["title"])}'
              )

              try:
                  data = load_project(project)

              except Exception as exc:
                  print(
                      f'ERROR loading Project '
                      f'{project["number"]}: {exc}'
                  )
                  continue

              if not data:
                  continue

              data["project"]["slug"] = slug

              # JSON
              Path(
                  f"dashboard/data/{slug}.json"
              ).write_text(
                  json.dumps(data, indent=2)
              )

              # Jekyll page
              project_dir = Path(
                  f"dashboard/projects/{slug}"
              )

              project_dir.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              safe_title = (
                  project["title"].replace('"', "'")
              )

              page = f"""---
          layout: dashboard
          title: "{safe_title}"
          project_slug: "{slug}"
          ---

          <div
            id="dashboard"
            data-project="{slug}">
          </div>
          """

              (
                  project_dir / "index.html"
              ).write_text(page)

              index.append({
                  "number": project["number"],
                  "title": project["title"],
                  "description": (
                      project.get("shortDescription") or ""
                  ),
                  "url": project["url"],
                  "slug": slug,
                  "issueCount": len(data["issues"]),
                  "sprintCount": len(data["sprints"]),
              })


          Path(
              "dashboard/data/projects.json"
          ).write_text(
              json.dumps(index, indent=2)
          )

          print()
          print(
              f"Generated {len(index)} dashboards."
          )

          PY

      # ------------------------------------------------------
      # Jekyll layout shared by every project
      # ------------------------------------------------------

      - name: Create dashboard layout
        run: |
          cat > dashboard/_layouts/dashboard.html <<'EOF'
          <!doctype html>
          <html lang="en">

          <head>
            <meta charset="utf-8">

            <meta
              name="viewport"
              content="width=device-width,initial-scale=1"
            >

            <title>
              {{ page.title }} · Engineering Delivery
            </title>

            <script
              src="https://cdn.jsdelivr.net/npm/chart.js">
            </script>

            <style>
              :root {
                --bg: #f5f7fb;
                --card: #ffffff;
                --border: #e4e8ef;
                --text: #172033;
                --muted: #697386;
                --blue: #2563eb;
                --green: #16a34a;
                --purple: #7c3aed;
                --orange: #ea580c;
                --red: #dc2626;
              }

              * {
                box-sizing: border-box;
              }

              body {
                margin: 0;
                background: var(--bg);
                color: var(--text);

                font-family:
                  Inter,
                  system-ui,
                  -apple-system,
                  BlinkMacSystemFont,
                  "Segoe UI",
                  sans-serif;
              }

              main {
                max-width: 1500px;
                margin: auto;
                padding: 32px;
              }

              header {
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
                gap: 20px;
                margin-bottom: 28px;
              }

              h1 {
                margin: 3px 0;
                font-size: 30px;
                letter-spacing: -.03em;
              }

              h2 {
                margin: 0 0 5px;
                font-size: 15px;
              }

              .muted {
                color: var(--muted);
                font-size: 13px;
              }

              a {
                color: var(--blue);
                text-decoration: none;
              }

              .back {
                background: white;
                border: 1px solid var(--border);
                border-radius: 9px;
                padding: 9px 13px;
              }

              select {
                padding: 10px 14px;
                border: 1px solid var(--border);
                border-radius: 9px;
                background: white;
                margin-bottom: 20px;
              }

              .kpis {
                display: grid;
                grid-template-columns:
                  repeat(5, minmax(140px,1fr));
                gap: 16px;
                margin-bottom: 18px;
              }

              .card {
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 14px;
                padding: 18px;
                box-shadow:
                  0 1px 2px rgba(0,0,0,.03);
              }

              .kpi-label {
                color: var(--muted);
                font-size: 11px;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: .04em;
              }

              .kpi-value {
                margin-top: 7px;
                font-size: 30px;
                font-weight: 750;
              }

              .grid {
                display: grid;
                grid-template-columns: 2fr 1fr;
                gap: 18px;
                margin-bottom: 18px;
              }

              .grid-half {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 18px;
                margin-bottom: 18px;
              }

              .chart {
                height: 320px;
              }

              table {
                width: 100%;
                border-collapse: collapse;
                font-size: 13px;
              }

              th {
                color: var(--muted);
                font-size: 11px;
                text-transform: uppercase;
                text-align: right;
                padding: 11px;
                border-bottom:
                  1px solid var(--border);
              }

              td {
                text-align: right;
                padding: 12px 11px;
                border-bottom:
                  1px solid #eff1f5;
              }

              th:first-child,
              td:first-child {
                text-align: left;
              }

              .empty {
                text-align: center;
                padding: 60px 20px;
              }

              @media(max-width: 950px) {
                .kpis {
                  grid-template-columns:
                    repeat(2,1fr);
                }

                .grid,
                .grid-half {
                  grid-template-columns: 1fr;
                }
              }
            </style>
          </head>

          <body>

            <main>

              <header>
                <div>
                  <div class="muted">
                    Engineering Delivery
                  </div>

                  <h1>{{ page.title }}</h1>
                </div>

                <a
                  class="back"
                  href="{{ '/' | relative_url }}">
                  All Projects
                </a>
              </header>

              {{ content }}

              <script
                src="{{ '/assets/dashboard.js' | relative_url }}">
              </script>

            </main>

          </body>
          </html>
          EOF

      # ------------------------------------------------------
      # Shared dashboard logic
      # ------------------------------------------------------

      - name: Create dashboard JavaScript
        run: |
          cat > dashboard/assets/dashboard.js <<'EOF'

          const root =
            document.getElementById("dashboard");


          function within(date, sprint) {
            return !!date &&
              date >= sprint.start &&
              date <= sprint.end;
          }


          function isBug(issue) {
            return (
              (issue.issueType || "")
              .toLowerCase()
              === "bug"
            );
          }


          function isEnhancement(issue) {
            return (
              (issue.issueType || "")
              .toLowerCase()
              === "enhancement"
            );
          }


          function uniqueStatusCount(
            issues,
            status,
            sprint
          ) {
            const ids = new Set();

            issues.forEach(issue => {
              issue.events.forEach(event => {
                if (
                  event.status === status
                  &&
                  within(event.date, sprint)
                ) {
                  ids.add(
                    issue.repository
                    + "#"
                    + issue.number
                  );
                }
              });
            });

            return ids.size;
          }


          if (root) {
            const slug =
              root.dataset.project;

            fetch(
              `../../data/${slug}.json`
            )
            .then(r => r.json())
            .then(render);
          }


          function render(data) {

            if (!data.sprints.length) {
              root.innerHTML = `
                <div class="card empty">
                  <h2>No Sprint field found</h2>

                  <p class="muted">
                    This Project does not have an
                    iteration field named Sprint.
                  </p>
                </div>
              `;

              return;
            }


            root.innerHTML = `

              <select id="sprint"></select>

              <section class="kpis">

                <div class="card">
                  <div class="kpi-label">
                    Opened
                  </div>
                  <div
                    id="opened"
                    class="kpi-value">
                  </div>
                </div>

                <div class="card">
                  <div class="kpi-label">
                    In Development
                  </div>
                  <div
                    id="dev"
                    class="kpi-value">
                  </div>
                </div>

                <div class="card">
                  <div class="kpi-label">
                    QA Testing
                  </div>
                  <div
                    id="qa"
                    class="kpi-value">
                  </div>
                </div>

                <div class="card">
                  <div class="kpi-label">
                    QA Passed
                  </div>
                  <div
                    id="passed"
                    class="kpi-value">
                  </div>
                </div>

                <div class="card">
                  <div class="kpi-label">
                    Closed
                  </div>
                  <div
                    id="closed"
                    class="kpi-value">
                  </div>
                </div>

              </section>


              <div class="grid">

                <section class="card">

                  <h2>Sprint Flow</h2>

                  <div class="muted">
                    Unique issues reaching each stage
                  </div>

                  <div class="chart">
                    <canvas id="flowChart"></canvas>
                  </div>

                </section>


                <section class="card">

                  <h2>Work Mix</h2>

                  <div class="muted">
                    Bugs vs enhancements worked on
                  </div>

                  <div class="chart">
                    <canvas id="mixChart"></canvas>
                  </div>

                </section>

              </div>


              <div class="grid-half">

                <section class="card">

                  <h2>
                    Bugs Created vs Resolved
                  </h2>

                  <div class="muted">
                    By Priority
                  </div>

                  <div class="chart">
                    <canvas id="bugChart"></canvas>
                  </div>

                </section>


                <section class="card">

                  <h2>Opened vs Closed Trend</h2>

                  <div class="muted">
                    Sprint over sprint
                  </div>

                  <div class="chart">
                    <canvas id="trendChart"></canvas>
                  </div>

                </section>

              </div>


              <section class="card">

                <h2>Flow by Priority</h2>

                <table>
                  <thead>
                    <tr>
                      <th>Priority</th>
                      <th>Opened</th>
                      <th>In Dev</th>
                      <th>QA Testing</th>
                      <th>QA Passed</th>
                      <th>Closed</th>
                      <th>Bug Opened</th>
                      <th>Bug Closed</th>
                      <th>Bug C/R</th>
                    </tr>
                  </thead>

                  <tbody id="rows"></tbody>
                </table>

              </section>
            `;


            const sprintSelect =
              document.getElementById("sprint");


            data.sprints.forEach(
              (sprint,index) => {

                const option =
                  document.createElement(
                    "option"
                  );

                option.value = index;

                option.textContent =
                  `${sprint.name} · ` +
                  `${sprint.start} – ` +
                  `${sprint.end}`;

                sprintSelect.appendChild(
                  option
                );
              }
            );


            function metrics(
              sprint,
              priority = null
            ) {

              const subset =
                data.issues.filter(issue =>
                  !priority
                  ||
                  issue.priority === priority
                );


              const opened =
                subset.filter(issue =>
                  within(issue.opened, sprint)
                );


              const closed =
                subset.filter(issue =>
                  within(issue.closed, sprint)
                );


              return {
                opened: opened.length,

                development:
                  uniqueStatusCount(
                    subset,
                    "In Development",
                    sprint
                  ),

                testing:
                  uniqueStatusCount(
                    subset,
                    "QA Testing",
                    sprint
                  ),

                passed:
                  uniqueStatusCount(
                    subset,
                    "QA Passed",
                    sprint
                  ),

                closed: closed.length,

                bugOpened:
                  opened.filter(isBug).length,

                bugClosed:
                  closed.filter(isBug).length,
              };
            }


            const flowChart =
              new Chart(
                document.getElementById(
                  "flowChart"
                ),
                {
                  type: "bar",

                  data: {
                    labels: [
                      "Opened",
                      "In Development",
                      "QA Testing",
                      "QA Passed",
                      "Closed"
                    ],

                    datasets: [{
                      label: "Issues",
                      data: []
                    }]
                  },

                  options: {
                    responsive: true,
                    maintainAspectRatio: false
                  }
                }
              );


            const mixChart =
              new Chart(
                document.getElementById(
                  "mixChart"
                ),
                {
                  type: "doughnut",

                  data: {
                    labels: [
                      "Bugs",
                      "Enhancements"
                    ],

                    datasets: [{
                      data: []
                    }]
                  },

                  options: {
                    responsive: true,
                    maintainAspectRatio: false
                  }
                }
              );


            const bugChart =
              new Chart(
                document.getElementById(
                  "bugChart"
                ),
                {
                  type: "bar",

                  data: {
                    labels: data.priorities,

                    datasets: [
                      {
                        label: "Created",
                        data: []
                      },
                      {
                        label: "Resolved",
                        data: []
                      }
                    ]
                  },

                  options: {
                    responsive: true,
                    maintainAspectRatio: false
                  }
                }
              );


            const trendChart =
              new Chart(
                document.getElementById(
                  "trendChart"
                ),
                {
                  type: "line",

                  data: {
                    labels:
                      data.sprints.map(
                        sprint => sprint.name
                      ),

                    datasets: [
                      {
                        label: "Opened",

                        data:
                          data.sprints.map(
                            sprint =>
                              metrics(sprint).opened
                          )
                      },
                      {
                        label: "Closed",

                        data:
                          data.sprints.map(
                            sprint =>
                              metrics(sprint).closed
                          )
                      }
                    ]
                  },

                  options: {
                    responsive: true,
                    maintainAspectRatio: false
                  }
                }
              );


            function update(index) {

              const sprint =
                data.sprints[index];

              const total =
                metrics(sprint);


              document.getElementById(
                "opened"
              ).textContent =
                total.opened;

              document.getElementById(
                "dev"
              ).textContent =
                total.development;

              document.getElementById(
                "qa"
              ).textContent =
                total.testing;

              document.getElementById(
                "passed"
              ).textContent =
                total.passed;

              document.getElementById(
                "closed"
              ).textContent =
                total.closed;


              flowChart
                .data
                .datasets[0]
                .data = [
                  total.opened,
                  total.development,
                  total.testing,
                  total.passed,
                  total.closed
                ];

              flowChart.update();


              // --------------------------------------------
              // Work Mix
              //
              // Worked on =
              // In Development OR QA Testing OR
              // QA Passed OR Closed in this sprint.
              //
              // Each issue counts once.
              // --------------------------------------------

              const worked = new Set();

              data.issues.forEach(issue => {

                const id =
                  issue.repository
                  + "#"
                  + issue.number;


                if (
                  within(issue.closed, sprint)
                ) {
                  worked.add(id);
                }


                issue.events.forEach(event => {
                  if (
                    within(event.date, sprint)
                  ) {
                    worked.add(id);
                  }
                });
              });


              let bugs = 0;
              let enhancements = 0;


              data.issues.forEach(issue => {

                const id =
                  issue.repository
                  + "#"
                  + issue.number;


                if (!worked.has(id)) {
                  return;
                }


                if (isBug(issue)) {
                  bugs++;
                }


                if (isEnhancement(issue)) {
                  enhancements++;
                }
              });


              mixChart
                .data
                .datasets[0]
                .data = [
                  bugs,
                  enhancements
                ];

              mixChart.update();


              const priorityMetrics =
                data.priorities.map(
                  priority =>
                    metrics(
                      sprint,
                      priority
                    )
                );


              bugChart
                .data
                .datasets[0]
                .data =
                  priorityMetrics.map(
                    x => x.bugOpened
                  );


              bugChart
                .data
                .datasets[1]
                .data =
                  priorityMetrics.map(
                    x => x.bugClosed
                  );

              bugChart.update();


              const tbody =
                document.getElementById(
                  "rows"
                );

              tbody.innerHTML = "";


              data.priorities.forEach(
                (priority,index) => {

                  const m =
                    priorityMetrics[index];


                  const ratio =
                    m.bugClosed === 0
                    ? "—"
                    : (
                        m.bugOpened
                        /
                        m.bugClosed
                      ).toFixed(2)
                      + "x";


                  const row =
                    document.createElement(
                      "tr"
                    );


                  row.innerHTML = `
                    <td>
                      <strong>${priority}</strong>
                    </td>

                    <td>${m.opened}</td>

                    <td>
                      ${m.development}
                    </td>

                    <td>${m.testing}</td>

                    <td>${m.passed}</td>

                    <td>${m.closed}</td>

                    <td>
                      ${m.bugOpened}
                    </td>

                    <td>
                      ${m.bugClosed}
                    </td>

                    <td>${ratio}</td>
                  `;


                  tbody.appendChild(row);
                }
              );
            }


            sprintSelect.addEventListener(
              "change",
              event => {
                update(
                  Number(event.target.value)
                );
              }
            );


            sprintSelect.value =
              data.sprints.length - 1;

            update(
              data.sprints.length - 1
            );
          }

          EOF

      # ------------------------------------------------------
      # Homepage: auto-generated project picker
      # ------------------------------------------------------

      - name: Create project index
        run: |
          cat > dashboard/index.html <<'EOF'
          ---
          layout: null
          ---

          <!doctype html>
          <html lang="en">

          <head>
            <meta charset="utf-8">

            <meta
              name="viewport"
              content="width=device-width,initial-scale=1"
            >

            <title>
              Engineering Dashboards
            </title>

            <style>
              body {
                margin: 0;
                background: #f5f7fb;
                color: #172033;

                font-family:
                  Inter,
                  system-ui,
                  -apple-system,
                  BlinkMacSystemFont,
                  "Segoe UI",
                  sans-serif;
              }

              main {
                max-width: 1050px;
                margin: auto;
                padding: 60px 30px;
              }

              h1 {
                margin-bottom: 5px;
              }

              .subtitle {
                color: #697386;
                margin-bottom: 30px;
              }

              .projects {
                display: grid;

                grid-template-columns:
                  repeat(
                    auto-fill,
                    minmax(280px,1fr)
                  );

                gap: 16px;
              }

              .project {
                display: block;
                padding: 20px;
                background: white;
                border: 1px solid #e4e8ef;
                border-radius: 14px;
                text-decoration: none;
                color: inherit;
              }

              .project:hover {
                border-color: #2563eb;
              }

              .project h2 {
                margin: 0 0 7px;
                font-size: 17px;
              }

              .description {
                color: #697386;
                min-height: 38px;
                font-size: 13px;
              }

              .meta {
                margin-top: 16px;
                color: #697386;
                font-size: 12px;
              }
            </style>
          </head>

          <body>

            <main>

              <h1>
                Engineering Dashboards
              </h1>

              <div class="subtitle">
                Delivery metrics by GitHub Project
              </div>

              <div
                class="projects"
                id="projects">
              </div>

            </main>


            <script>
              fetch("data/projects.json")
              .then(r => r.json())
              .then(projects => {

                const container =
                  document.getElementById(
                    "projects"
                  );


                projects.forEach(project => {

                  const link =
                    document.createElement(
                      "a"
                    );

                  link.className =
                    "project";

                  link.href =
                    `projects/${project.slug}/`;


                  link.innerHTML = `

                    <h2>
                      ${project.title}
                    </h2>

                    <div class="description">
                      ${
                        project.description
                        ||
                        "GitHub Project"
                      }
                    </div>

                    <div class="meta">
                      Project ${project.number}
                      ·
                      ${project.issueCount} issues
                      ·
                      ${project.sprintCount} sprints
                    </div>

                  `;


                  container.appendChild(link);
                });
              });
            </script>

          </body>
          </html>
          EOF

      # ------------------------------------------------------
      # Jekyll config
      # ------------------------------------------------------

      - name: Create Jekyll config
        run: |
          cat > dashboard/_config.yml <<'EOF'
          title: Engineering Dashboards
          EOF

      # ------------------------------------------------------
      # Build / deploy
      # ------------------------------------------------------

      - name: Build Pages
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./dashboard
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
