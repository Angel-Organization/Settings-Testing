name: Bug Report
description: Report a bug or unexpected behavior.
body:
  - type: markdown
    attributes:
      value: |
        Please complete the information below. This information will be used to automatically classify and triage the issue.

  - type: checkboxes
    id: product
    attributes:
      label: Product
      description: Which product is affected?
      options:
        - label: ScriptSure
        - label: VetWay
        - label: Exchange
    validations:
      required: true

  - type: checkboxes
    id: product_area
    attributes:
      label: Product Area
      description: Which area of the product is affected?
      options:
        - label: Allergy
        - label: API
        - label: Billing
        - label: Compound
        - label: Drug History
        - label: Formulary
        - label: Patients
        - label: Prescriptions
        - label: Reporting
        - label: Med Cart
        - label: Messages
        - label: Notifications
        - label: Administration
        - label: Integrations
        - label: Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Initial Priority
      description: |
        Select the initial priority for this issue.
        • Use Prod Critical for ScriptSure critical issues.
        • Use P0 for VetWay critical issues.
        • Priority may be adjusted during triage.
      options:
        - Prod Critical 
        - P0 
        - P1
        - P2
        - P3
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: Source
      description: How was this issue discovered?
      options:
        - Customer
        - QA
        - Demo
        - Support
        - Internal Testing
        - Other
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Briefly describe the issue.
      placeholder: A concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Provide the steps needed to reproduce the issue.
      placeholder: |
        1. Go to...
        2. Click...
        3. Enter...
        4. Observe...
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Provide any relevant environment information.
      placeholder: |
        Environment:
        User Type
        User Email:

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Include screenshots, recordings, logs, stack traces, or any other information that may help diagnose the issue.
