name: Test Engineering Dashboard

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ORG: ${{ github.repository_owner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ACTIONS_APP_ID }}
          private-key: ${{ secrets.ACTIONS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Discover projects and build dashboard data
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          mkdir -p site/data

          python3 <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timedelta
          from pathlib import Path

          ORG = os.environ["ORG"]

          PRIORITIES = [
              "PROD Critical",
              "P1",
              "P2",
              "P3",
              "P4",
          ]

          TRACKED_STATUSES = {
              "In Development",
              "QA Testing",
              "QA Passed",
          }


          def graphql(query, variables=None):
              variables = variables or {}

              cmd = [
                  "gh",
                  "api",
                  "graphql",
                  "-f",
                  f"query={query}",
              ]

              for key, value in variables.items():
                  if value is None:
                      continue

                  cmd += [
                      "-F",
                      f"{key}={value}",
                  ]

              result = subprocess.run(
                  cmd,
                  check=True,
                  capture_output=True,
                  text=True,
              )

              return json.loads(result.stdout)


          # ==================================================
          # Discover open Project V2 projects
          # ==================================================

          PROJECTS_QUERY = """
          query($org: String!) {
            organization(login: $org) {
              projectsV2(first: 100) {
                nodes {
                  number
                  title
                  shortDescription
                  closed
                  url
                }
              }
            }
          }
          """

          result = graphql(
              PROJECTS_QUERY,
              {"org": ORG},
          )

          projects = [
              p
              for p in (
                  result["data"]
                  ["organization"]
                  ["projectsV2"]
                  ["nodes"]
              )
              if not p["closed"]
          ]

          print(f"Found {len(projects)} open projects")


          # ==================================================
          # Project + Issue data
          # ==================================================

          PROJECT_QUERY = """
          query(
            $org: String!,
            $number: Int!,
            $cursor: String
          ) {
            organization(login: $org) {
              projectV2(number: $number) {

                number
                title
                shortDescription
                url

                fields(first: 100) {
                  nodes {

                    ... on ProjectV2IterationField {
                      name

                      configuration {
                        iterations {
                          title
                          startDate
                          duration
                        }

                        completedIterations {
                          title
                          startDate
                          duration
                        }
                      }
                    }
                  }
                }

                items(
                  first: 100,
                  after: $cursor
                ) {
                  pageInfo {
                    hasNextPage
                    endCursor
                  }

                  nodes {
                    fieldValues(first: 50) {
                      nodes {

                        ... on ProjectV2ItemFieldSingleSelectValue {
                          name

                          field {
                            ... on ProjectV2FieldCommon {
                              name
                            }
                          }
                        }

                        ... on ProjectV2ItemFieldIterationValue {
                          title
                          startDate
                          duration

                          field {
                            ... on ProjectV2FieldCommon {
                              name
                            }
                          }
                        }
                      }
                    }

                    content {
                      ... on Issue {
                        number
                        title
                        state
                        createdAt
                        closedAt
                        url

                        repository {
                          nameWithOwner
                        }

                        issueType {
                          name
                        }

                        issueFieldValues(first: 30) {
                          nodes {

                            ... on IssueFieldSingleSelectValue {
                              name

                              field {
                                ... on IssueFieldSingleSelect {
                                  name
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
          """


          # ==================================================
          # Workflow history
          # ==================================================

          TIMELINE_QUERY = """
          query(
            $owner: String!,
            $repo: String!,
            $number: Int!
          ) {
            repository(
              owner: $owner,
              name: $repo
            ) {
              issue(number: $number) {
                timelineItems(
                  first: 250,
                  itemTypes: [
                    PROJECT_V2_ITEM_STATUS_CHANGED_EVENT
                  ]
                ) {
                  nodes {
                    ... on ProjectV2ItemStatusChangedEvent {
                      createdAt
                      previousStatus
                      status
                    }
                  }
                }
              }
            }
          }
          """


          def issue_priority(issue, item):
              # Prefer issue custom field.
              for value in (
                  issue
                  .get("issueFieldValues", {})
                  .get("nodes", [])
              ):
                  field = value.get("field") or {}

                  if field.get("name") == "Priority":
                      return (
                          value.get("name")
                          or "Unspecified"
                      )

              # Fall back to Project field.
              for value in (
                  item
                  .get("fieldValues", {})
                  .get("nodes", [])
              ):
                  field = value.get("field") or {}

                  if field.get("name") == "Priority":
                      return (
                          value.get("name")
                          or "Unspecified"
                      )

              return "Unspecified"


          def load_project(project):
              cursor = None
              issues = []
              sprints = {}
              metadata = None

              while True:
                  response = graphql(
                      PROJECT_QUERY,
                      {
                          "org": ORG,
                          "number": project["number"],
                          "cursor": cursor,
                      },
                  )

                  pv2 = (
                      response["data"]
                      ["organization"]
                      ["projectV2"]
                  )

                  if metadata is None:
                      metadata = {
                          "number": pv2["number"],
                          "title": pv2["title"],
                          "description": (
                              pv2.get("shortDescription")
                              or ""
                          ),
                          "url": pv2["url"],
                      }

                      # Detect iteration configuration.
                      for field in pv2["fields"]["nodes"]:
                          if not field.get("configuration"):
                              continue

                          config = field["configuration"]

                          for sprint in (
                              config.get(
                                  "completedIterations",
                                  []
                              )
                              +
                              config.get(
                                  "iterations",
                                  []
                              )
                          ):
                              start = sprint["startDate"]
                              duration = sprint["duration"]

                              end = (
                                  datetime.fromisoformat(start)
                                  + timedelta(
                                      days=duration - 1
                                  )
                              ).date().isoformat()

                              sprints[sprint["title"]] = {
                                  "name": sprint["title"],
                                  "start": start,
                                  "end": end,
                                  "duration": duration,
                              }

                  connection = pv2["items"]

                  for item in connection["nodes"]:
                      issue = item.get("content")

                      if not issue:
                          continue

                      if not issue.get("number"):
                          continue

                      repo = (
                          issue
                          .get("repository", {})
                          .get("nameWithOwner")
                      )

                      if not repo:
                          continue

                      issue_type = (
                          (issue.get("issueType") or {})
                          .get("name")
                          or "Unspecified"
                      )

                      issues.append({
                          "number": issue["number"],
                          "repository": repo,
                          "title": issue["title"],
                          "url": issue["url"],
                          "priority": issue_priority(
                              issue,
                              item,
                          ),
                          "issueType": issue_type,
                          "opened": issue["createdAt"][:10],
                          "closed": (
                              issue["closedAt"][:10]
                              if issue["closedAt"]
                              else None
                          ),
                          "events": [],
                      })

                  if not connection["pageInfo"]["hasNextPage"]:
                      break

                  cursor = connection["pageInfo"]["endCursor"]

              # ==============================================
              # Load timeline/status events
              # ==============================================

              for index, issue in enumerate(issues, 1):
                  print(
                      f'Project {project["number"]}: '
                      f'[{index}/{len(issues)}] '
                      f'{issue["repository"]}'
                      f'#{issue["number"]}'
                  )

                  owner, repo = (
                      issue["repository"]
                      .split("/", 1)
                  )

                  try:
                      history = graphql(
                          TIMELINE_QUERY,
                          {
                              "owner": owner,
                              "repo": repo,
                              "number": issue["number"],
                          },
                      )

                      nodes = (
                          history["data"]
                          ["repository"]
                          ["issue"]
                          ["timelineItems"]
                          ["nodes"]
                      )

                      for event in nodes:
                          if (
                              event.get("status")
                              not in TRACKED_STATUSES
                          ):
                              continue

                          issue["events"].append({
                              "status": event["status"],
                              "date": event["createdAt"][:10],
                          })

                  except Exception as exc:
                      print(
                          f'Warning reading '
                          f'{issue["repository"]}'
                          f'#{issue["number"]}: '
                          f'{exc}'
                      )

              return {
                  "project": metadata,
                  "sprints": sorted(
                      sprints.values(),
                      key=lambda x: x["start"],
                  ),
                  "priorities": PRIORITIES,
                  "issues": issues,
              }


          output_projects = []

          for project in projects:
              data = load_project(project)

              slug = f'project-{project["number"]}'

              Path(
                  f"site/data/{slug}.json"
              ).write_text(
                  json.dumps(
                      data,
                      indent=2,
                  )
              )

              output_projects.append({
                  "number": project["number"],
                  "title": project["title"],
                  "description": (
                      project.get("shortDescription")
                      or ""
                  ),
                  "slug": slug,
                  "issueCount": len(data["issues"]),
                  "sprintCount": len(data["sprints"]),
              })

          Path(
              "site/data/projects.json"
          ).write_text(
              json.dumps(
                  output_projects,
                  indent=2,
              )
          )

          print(
              json.dumps(
                  output_projects,
                  indent=2,
              )
          )

          PY


      # ======================================================
      # Dashboard
      # ======================================================

      - name: Create dashboard page
        run: |
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">

          <head>
            <meta charset="utf-8">

            <meta
              name="viewport"
              content="width=device-width,initial-scale=1"
            >

            <title>
              Engineering Dashboards
            </title>

            <script
              src="https://cdn.jsdelivr.net/npm/chart.js">
            </script>

            <style>
              :root {
                --bg: #f5f7fb;
                --card: #ffffff;
                --border: #e4e8ef;
                --text: #172033;
                --muted: #697386;
                --blue: #2563eb;
                --green: #16a34a;
                --orange: #ea580c;
                --red: #dc2626;
                --purple: #7c3aed;
              }

              * {
                box-sizing: border-box;
              }

              body {
                margin: 0;
                background: var(--bg);
                color: var(--text);

                font-family:
                  Inter,
                  system-ui,
                  -apple-system,
                  BlinkMacSystemFont,
                  "Segoe UI",
                  sans-serif;
              }

              main {
                max-width: 1450px;
                margin: auto;
                padding: 32px;
              }

              h1 {
                margin: 0 0 4px;
              }

              h3 {
                margin-top: 0;
              }

              .muted {
                color: var(--muted);
              }

              .toolbar {
                display: flex;
                gap: 12px;
                margin: 24px 0;
              }

              select {
                padding: 10px 14px;
                background: white;
                border: 1px solid var(--border);
                border-radius: 8px;
              }

              .kpis {
                display: grid;
                grid-template-columns:
                  repeat(5,1fr);
                gap: 15px;
                margin-bottom: 18px;
              }

              .card {
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 14px;
                padding: 18px;
              }

              .clickable {
                cursor: pointer;
                transition:
                  transform .12s ease,
                  box-shadow .12s ease,
                  background .12s ease;
              }

              .clickable:hover {
                background: #fafcff;
                box-shadow:
                  0 4px 15px rgba(0,0,0,.06);
                transform: translateY(-1px);
              }

              .label {
                font-size: 11px;
                text-transform: uppercase;
                color: var(--muted);
                font-weight: 700;
              }

              .number {
                font-size: 30px;
                font-weight: 750;
                margin-top: 6px;
              }

              .grid {
                display: grid;
                grid-template-columns: 2fr 1fr;
                gap: 18px;
                margin-bottom: 18px;
              }

              .chart {
                height: 330px;
              }

              table {
                width: 100%;
                border-collapse: collapse;
              }

              th,
              td {
                padding: 11px;
                border-bottom:
                  1px solid #eef1f5;
                text-align: right;
              }

              th:first-child,
              td:first-child {
                text-align: left;
              }

              .metric-cell {
                cursor: pointer;
                font-weight: 600;
              }

              .metric-cell:hover {
                background: #f1f5ff;
                color: var(--blue);
              }

              /* ============================================
                 Drilldown
                 ============================================ */

              .modal-backdrop {
                position: fixed;
                inset: 0;
                z-index: 1000;

                background:
                  rgba(15,23,42,.48);

                display: flex;
                justify-content: center;
                align-items: center;

                padding: 28px;
              }

              .modal-backdrop.hidden {
                display: none;
              }

              .modal {
                width: min(1200px,96vw);
                max-height: 88vh;

                background: white;
                border-radius: 16px;

                box-shadow:
                  0 30px 80px
                  rgba(0,0,0,.25);

                overflow: hidden;
              }

              .modal-header {
                display: flex;
                justify-content: space-between;
                align-items: flex-start;

                padding: 20px 24px;

                border-bottom:
                  1px solid var(--border);
              }

              .modal-title {
                margin: 0 0 4px;
              }

              .modal-body {
                max-height: 70vh;
                overflow: auto;
                padding: 0 24px 24px;
              }

              .close-button {
                border: 0;
                background: transparent;

                font-size: 30px;
                line-height: 1;

                cursor: pointer;

                color: var(--muted);
              }

              .issue-link {
                color: var(--blue);
                text-decoration: none;
                white-space: nowrap;
              }

              .issue-link:hover {
                text-decoration: underline;
              }

              .issue-title {
                text-align: left;
              }

              .drilldown-count {
                color: var(--muted);
                font-size: 13px;
              }

              .empty-state {
                padding: 35px;
                text-align: center;
                color: var(--muted);
              }

              @media(max-width:900px) {
                .kpis {
                  grid-template-columns:
                    1fr 1fr;
                }

                .grid {
                  grid-template-columns: 1fr;
                }

                main {
                  padding: 18px;
                }

                .modal-backdrop {
                  padding: 8px;
                }
              }
            </style>
          </head>

          <body>

            <main>

              <h1>
                Engineering Dashboards
              </h1>

              <div class="muted">
                Real GitHub Project data
              </div>

              <div class="toolbar">

                <select id="projectSelect"></select>

                <select id="sprintSelect"></select>

              </div>


              <!-- ===========================================
                   KPI cards
                   =========================================== -->

              <section class="kpis">

                <div
                  class="card clickable"
                  id="openedCard">

                  <div class="label">
                    Opened
                  </div>

                  <div
                    class="number"
                    id="opened">
                    -
                  </div>

                </div>


                <div
                  class="card clickable"
                  id="developmentCard">

                  <div class="label">
                    In Development
                  </div>

                  <div
                    class="number"
                    id="development">
                    -
                  </div>

                </div>


                <div
                  class="card clickable"
                  id="qaCard">

                  <div class="label">
                    QA Testing
                  </div>

                  <div
                    class="number"
                    id="qa">
                    -
                  </div>

                </div>


                <div
                  class="card clickable"
                  id="passedCard">

                  <div class="label">
                    QA Passed
                  </div>

                  <div
                    class="number"
                    id="passed">
                    -
                  </div>

                </div>


                <div
                  class="card clickable"
                  id="closedCard">

                  <div class="label">
                    Closed
                  </div>

                  <div
                    class="number"
                    id="closed">
                    -
                  </div>

                </div>

              </section>


              <!-- ===========================================
                   Charts
                   =========================================== -->

              <div class="grid">

                <section class="card">

                  <h3>
                    Sprint Flow
                  </h3>

                  <div class="muted">
                    Click a bar to view the issues
                  </div>

                  <div class="chart">
                    <canvas id="flowChart"></canvas>
                  </div>

                </section>


                <section class="card">

                  <h3>
                    Bugs vs Enhancements
                  </h3>

                  <div class="muted">
                    Unique issues worked on this sprint
                  </div>

                  <div class="chart">
                    <canvas id="mixChart"></canvas>
                  </div>

                </section>

              </div>


              <!-- ===========================================
                   Priority table
                   =========================================== -->

              <section class="card">

                <h3>
                  Flow by Priority
                </h3>

                <div class="muted">
                  Click any count to view the underlying issues
                </div>

                <table>

                  <thead>
                    <tr>
                      <th>Priority</th>
                      <th>Opened</th>
                      <th>In Dev</th>
                      <th>QA</th>
                      <th>QA Passed</th>
                      <th>Closed</th>
                      <th>Bug Opened</th>
                      <th>Bug Closed</th>
                      <th>Bug C/R</th>
                    </tr>
                  </thead>

                  <tbody id="rows"></tbody>

                </table>

              </section>

            </main>


            <!-- =============================================
                 Drilldown modal
                 ============================================= -->

            <div
              id="drilldownBackdrop"
              class="modal-backdrop hidden">

              <div class="modal">

                <div class="modal-header">

                  <div>
                    <h2
                      id="drilldownTitle"
                      class="modal-title">
                    </h2>

                    <div
                      id="drilldownSubtitle"
                      class="drilldown-count">
                    </div>
                  </div>

                  <button
                    id="closeDrilldown"
                    class="close-button"
                    type="button"
                    aria-label="Close">
                    ×
                  </button>

                </div>


                <div class="modal-body">

                  <table>

                    <thead>
                      <tr>
                        <th>Issue</th>
                        <th>Title</th>
                        <th>Priority</th>
                        <th>Type</th>
                        <th>Date</th>
                      </tr>
                    </thead>

                    <tbody
                      id="drilldownRows">
                    </tbody>

                  </table>

                  <div
                    id="drilldownEmpty"
                    class="empty-state"
                    style="display:none">
                    No matching issues.
                  </div>

                </div>

              </div>

            </div>


            <script>

              let projectData = null;


              // =============================================
              // General helpers
              // =============================================

              function within(date,sprint) {

                return (
                  date
                  &&
                  date >= sprint.start
                  &&
                  date <= sprint.end
                );

              }


              function issueId(issue) {

                return (
                  issue.repository
                  + "#"
                  + issue.number
                );

              }


              function isBug(issue) {

                return (
                  (issue.issueType || "")
                  .toLowerCase()
                  === "bug"
                );

              }


              function isEnhancement(issue) {

                return (
                  (issue.issueType || "")
                  .toLowerCase()
                  === "enhancement"
                );

              }


              function escapeHtml(value) {

                return String(value ?? "")
                  .replaceAll("&","&amp;")
                  .replaceAll("<","&lt;")
                  .replaceAll(">","&gt;")
                  .replaceAll('"',"&quot;")
                  .replaceAll("'","&#039;");

              }


              function selectedSprint() {

                if (!projectData) {
                  return null;
                }

                const index =
                  Number(
                    document
                    .getElementById(
                      "sprintSelect"
                    )
                    .value
                  );

                return (
                  projectData.sprints[index]
                  || null
                );

              }


              // =============================================
              // Status count
              // =============================================

              function uniqueStatus(
                issues,
                status,
                sprint
              ) {

                const result = new Set();

                issues.forEach(issue => {

                  issue.events.forEach(event => {

                    if (
                      event.status === status
                      &&
                      within(
                        event.date,
                        sprint
                      )
                    ) {

                      result.add(
                        issueId(issue)
                      );

                    }

                  });

                });

                return result.size;
              }


              // =============================================
              // Metrics
              // =============================================

              function calculate(
                sprint,
                priority = null
              ) {

                const issues =
                  projectData.issues.filter(
                    issue =>
                      !priority
                      ||
                      issue.priority === priority
                  );


                const opened =
                  issues.filter(issue =>
                    within(
                      issue.opened,
                      sprint
                    )
                  );


                const closed =
                  issues.filter(issue =>
                    within(
                      issue.closed,
                      sprint
                    )
                  );


                return {

                  opened:
                    opened.length,

                  development:
                    uniqueStatus(
                      issues,
                      "In Development",
                      sprint
                    ),

                  qa:
                    uniqueStatus(
                      issues,
                      "QA Testing",
                      sprint
                    ),

                  passed:
                    uniqueStatus(
                      issues,
                      "QA Passed",
                      sprint
                    ),

                  closed:
                    closed.length,

                  bugOpened:
                    opened.filter(
                      isBug
                    ).length,

                  bugClosed:
                    closed.filter(
                      isBug
                    ).length

                };

              }


              // =============================================
              // Get issues behind a metric
              // =============================================

              function matchingIssues(
                sprint,
                metric,
                priority = null
              ) {

                const issues =
                  projectData.issues.filter(
                    issue =>
                      !priority
                      ||
                      issue.priority === priority
                  );


                if (metric === "opened") {

                  return issues
                    .filter(issue =>
                      within(
                        issue.opened,
                        sprint
                      )
                    )
                    .map(issue => ({
                      ...issue,
                      metricDate:
                        issue.opened
                    }));

                }


                if (metric === "closed") {

                  return issues
                    .filter(issue =>
                      within(
                        issue.closed,
                        sprint
                      )
                    )
                    .map(issue => ({
                      ...issue,
                      metricDate:
                        issue.closed
                    }));

                }


                if (metric === "bugOpened") {

                  return issues
                    .filter(issue =>
                      isBug(issue)
                      &&
                      within(
                        issue.opened,
                        sprint
                      )
                    )
                    .map(issue => ({
                      ...issue,
                      metricDate:
                        issue.opened
                    }));

                }


                if (metric === "bugClosed") {

                  return issues
                    .filter(issue =>
                      isBug(issue)
                      &&
                      within(
                        issue.closed,
                        sprint
                      )
                    )
                    .map(issue => ({
                      ...issue,
                      metricDate:
                        issue.closed
                    }));

                }


                const statusMap = {
                  development:
                    "In Development",

                  qa:
                    "QA Testing",

                  passed:
                    "QA Passed"
                };


                const status =
                  statusMap[metric];


                if (!status) {
                  return [];
                }


                /*
                  The KPI counts unique issues,
                  so the drilldown must do the same.

                  If an issue entered QA twice during
                  the sprint, show it only once and
                  use the earliest matching date.
                */

                const matches =
                  new Map();


                issues.forEach(issue => {

                  const dates =
                    issue.events
                    .filter(event =>
                      event.status === status
                      &&
                      within(
                        event.date,
                        sprint
                      )
                    )
                    .map(event =>
                      event.date
                    )
                    .sort();


                  if (!dates.length) {
                    return;
                  }


                  matches.set(
                    issueId(issue),
                    {
                      ...issue,
                      metricDate:
                        dates[0]
                    }
                  );

                });


                return [
                  ...matches.values()
                ];

              }


              // =============================================
              // Worked-on issue list for Work Mix
              // =============================================

              function workedIssues(
                sprint,
                issueType
              ) {

                const worked =
                  new Set();


                projectData
                  .issues
                  .forEach(issue => {

                    const id =
                      issueId(issue);


                    if (
                      within(
                        issue.closed,
                        sprint
                      )
                    ) {

                      worked.add(id);

                    }


                    issue.events.forEach(event => {

                      if (
                        within(
                          event.date,
                          sprint
                        )
                      ) {

                        worked.add(id);

                      }

                    });

                  });


                return projectData
                  .issues
                  .filter(issue => {

                    if (
                      !worked.has(
                        issueId(issue)
                      )
                    ) {
                      return false;
                    }


                    if (
                      issueType === "bug"
                    ) {
                      return isBug(issue);
                    }


                    if (
                      issueType ===
                      "enhancement"
                    ) {
                      return isEnhancement(
                        issue
                      );
                    }


                    return true;

                  })
                  .map(issue => {

                    const eventDates =
                      issue.events
                      .filter(event =>
                        within(
                          event.date,
                          sprint
                        )
                      )
                      .map(event =>
                        event.date
                      );


                    if (
                      within(
                        issue.closed,
                        sprint
                      )
                    ) {

                      eventDates.push(
                        issue.closed
                      );

                    }


                    eventDates.sort();


                    return {
                      ...issue,

                      metricDate:
                        eventDates[0]
                        || ""
                    };

                  });

              }


              // =============================================
              // Drilldown modal
              // =============================================

              function openDrilldown(
                title,
                sprint,
                issues
              ) {

                document
                  .getElementById(
                    "drilldownTitle"
                  )
                  .textContent =
                    title;


                document
                  .getElementById(
                    "drilldownSubtitle"
                  )
                  .textContent =
                    `${sprint.name} · ` +
                    `${issues.length} issue` +
                    `${issues.length === 1 ? "" : "s"}`;


                const tbody =
                  document.getElementById(
                    "drilldownRows"
                  );


                const empty =
                  document.getElementById(
                    "drilldownEmpty"
                  );


                tbody.innerHTML = "";


                if (!issues.length) {

                  empty.style.display =
                    "block";

                } else {

                  empty.style.display =
                    "none";


                  issues
                    .sort((a,b) => {

                      return (
                        (a.metricDate || "")
                        .localeCompare(
                          b.metricDate || ""
                        )
                      );

                    })
                    .forEach(issue => {

                      const row =
                        document
                        .createElement("tr");


                      row.innerHTML = `

                        <td>

                          <a
                            class="issue-link"
                            href="${escapeHtml(issue.url)}"
                            target="_blank"
                            rel="noopener noreferrer">

                            ${escapeHtml(
                              issue.repository
                            )}#${escapeHtml(
                              issue.number
                            )}

                          </a>

                        </td>

                        <td class="issue-title">
                          ${escapeHtml(
                            issue.title
                          )}
                        </td>

                        <td>
                          ${escapeHtml(
                            issue.priority
                          )}
                        </td>

                        <td>
                          ${escapeHtml(
                            issue.issueType
                          )}
                        </td>

                        <td>
                          ${escapeHtml(
                            issue.metricDate
                            || ""
                          )}
                        </td>

                      `;


                      tbody.appendChild(row);

                    });

                }


                document
                  .getElementById(
                    "drilldownBackdrop"
                  )
                  .classList
                  .remove("hidden");

              }


              function closeDrilldown() {

                document
                  .getElementById(
                    "drilldownBackdrop"
                  )
                  .classList
                  .add("hidden");

              }


              document
                .getElementById(
                  "closeDrilldown"
                )
                .addEventListener(
                  "click",
                  closeDrilldown
                );


              document
                .getElementById(
                  "drilldownBackdrop"
                )
                .addEventListener(
                  "click",
                  event => {

                    if (
                      event.target.id ===
                      "drilldownBackdrop"
                    ) {

                      closeDrilldown();

                    }

                  }
                );


              document
                .addEventListener(
                  "keydown",
                  event => {

                    if (
                      event.key === "Escape"
                    ) {

                      closeDrilldown();

                    }

                  }
                );


              // =============================================
              // Charts
              // =============================================

              const flowMetrics = [
                "opened",
                "development",
                "qa",
                "passed",
                "closed"
              ];


              const flowLabels = [
                "Opened",
                "In Development",
                "QA Testing",
                "QA Passed",
                "Closed"
              ];


              const flowChart =
                new Chart(
                  document.getElementById(
                    "flowChart"
                  ),
                  {
                    type: "bar",

                    data: {
                      labels:
                        flowLabels,

                      datasets: [{
                        label: "Issues",
                        data: []
                      }]
                    },

                    options: {

                      responsive: true,

                      maintainAspectRatio:
                        false,

                      onClick:
                        (event,elements) => {

                          if (
                            !elements.length
                          ) {
                            return;
                          }


                          const index =
                            elements[0].index;


                          const sprint =
                            selectedSprint();


                          const metric =
                            flowMetrics[index];


                          openDrilldown(
                            flowLabels[index],
                            sprint,
                            matchingIssues(
                              sprint,
                              metric
                            )
                          );

                        }

                    }
                  }
                );


              const mixChart =
                new Chart(
                  document.getElementById(
                    "mixChart"
                  ),
                  {
                    type: "doughnut",

                    data: {

                      labels: [
                        "Bugs",
                        "Enhancements"
                      ],

                      datasets: [{
                        data: []
                      }]

                    },

                    options: {

                      responsive: true,

                      maintainAspectRatio:
                        false,

                      onClick:
                        (event,elements) => {

                          if (
                            !elements.length
                          ) {
                            return;
                          }


                          const index =
                            elements[0].index;


                          const sprint =
                            selectedSprint();


                          const type =
                            index === 0
                            ? "bug"
                            : "enhancement";


                          openDrilldown(
                            index === 0
                              ? "Bugs Worked On"
                              : "Enhancements Worked On",

                            sprint,

                            workedIssues(
                              sprint,
                              type
                            )
                          );

                        }

                    }
                  }
                );


              // =============================================
              // Render selected sprint
              // =============================================

              function updateSprint() {

                if (!projectData) {
                  return;
                }


                const sprint =
                  selectedSprint();


                if (!sprint) {
                  return;
                }


                const total =
                  calculate(sprint);


                document
                  .getElementById(
                    "opened"
                  )
                  .textContent =
                    total.opened;


                document
                  .getElementById(
                    "development"
                  )
                  .textContent =
                    total.development;


                document
                  .getElementById(
                    "qa"
                  )
                  .textContent =
                    total.qa;


                document
                  .getElementById(
                    "passed"
                  )
                  .textContent =
                    total.passed;


                document
                  .getElementById(
                    "closed"
                  )
                  .textContent =
                    total.closed;


                // KPI drilldowns

                document
                  .getElementById(
                    "openedCard"
                  )
                  .onclick = () =>

                    openDrilldown(
                      "Opened",
                      sprint,
                      matchingIssues(
                        sprint,
                        "opened"
                      )
                    );


                document
                  .getElementById(
                    "developmentCard"
                  )
                  .onclick = () =>

                    openDrilldown(
                      "In Development",
                      sprint,
                      matchingIssues(
                        sprint,
                        "development"
                      )
                    );


                document
                  .getElementById(
                    "qaCard"
                  )
                  .onclick = () =>

                    openDrilldown(
                      "QA Testing",
                      sprint,
                      matchingIssues(
                        sprint,
                        "qa"
                      )
                    );


                document
                  .getElementById(
                    "passedCard"
                  )
                  .onclick = () =>

                    openDrilldown(
                      "QA Passed",
                      sprint,
                      matchingIssues(
                        sprint,
                        "passed"
                      )
                    );


                document
                  .getElementById(
                    "closedCard"
                  )
                  .onclick = () =>

                    openDrilldown(
                      "Closed",
                      sprint,
                      matchingIssues(
                        sprint,
                        "closed"
                      )
                    );


                // Flow chart

                flowChart
                  .data
                  .datasets[0]
                  .data = [

                    total.opened,
                    total.development,
                    total.qa,
                    total.passed,
                    total.closed

                  ];


                flowChart.update();


                // Work mix

                const bugs =
                  workedIssues(
                    sprint,
                    "bug"
                  );


                const enhancements =
                  workedIssues(
                    sprint,
                    "enhancement"
                  );


                mixChart
                  .data
                  .datasets[0]
                  .data = [

                    bugs.length,
                    enhancements.length

                  ];


                mixChart.update();


                // Priority table

                const tbody =
                  document.getElementById(
                    "rows"
                  );


                tbody.innerHTML = "";


                projectData
                  .priorities
                  .forEach(priority => {

                    const m =
                      calculate(
                        sprint,
                        priority
                      );


                    const ratio =
                      m.bugClosed === 0

                      ? "—"

                      : (
                          m.bugOpened
                          /
                          m.bugClosed
                        ).toFixed(2)
                        + "x";


                    const row =
                      document
                      .createElement("tr");


                    row.innerHTML = `

                      <td>
                        <strong>
                          ${escapeHtml(priority)}
                        </strong>
                      </td>

                      <td
                        class="metric-cell"
                        data-metric="opened">
                        ${m.opened}
                      </td>

                      <td
                        class="metric-cell"
                        data-metric="development">
                        ${m.development}
                      </td>

                      <td
                        class="metric-cell"
                        data-metric="qa">
                        ${m.qa}
                      </td>

                      <td
                        class="metric-cell"
                        data-metric="passed">
                        ${m.passed}
                      </td>

                      <td
                        class="metric-cell"
                        data-metric="closed">
                        ${m.closed}
                      </td>

                      <td
                        class="metric-cell"
                        data-metric="bugOpened">
                        ${m.bugOpened}
                      </td>

                      <td
                        class="metric-cell"
                        data-metric="bugClosed">
                        ${m.bugClosed}
                      </td>

                      <td>
                        ${ratio}
                      </td>

                    `;


                    row
                      .querySelectorAll(
                        ".metric-cell"
                      )
                      .forEach(cell => {

                        cell.addEventListener(
                          "click",
                          () => {

                            const metric =
                              cell.dataset.metric;


                            const labels = {

                              opened:
                                "Opened",

                              development:
                                "In Development",

                              qa:
                                "QA Testing",

                              passed:
                                "QA Passed",

                              closed:
                                "Closed",

                              bugOpened:
                                "Bugs Opened",

                              bugClosed:
                                "Bugs Closed"

                            };


                            openDrilldown(

                              `${priority} · ` +
                              `${labels[metric]}`,

                              sprint,

                              matchingIssues(
                                sprint,
                                metric,
                                priority
                              )

                            );

                          }
                        );

                      });


                    tbody.appendChild(row);

                  });

              }


              // =============================================
              // Load project
              // =============================================

              function loadProject(project) {

                fetch(
                  `data/${project.slug}.json`
                )
                .then(r => r.json())
                .then(data => {

                  projectData = data;


                  const sprintSelect =
                    document.getElementById(
                      "sprintSelect"
                    );


                  sprintSelect.innerHTML =
                    "";


                  data.sprints.forEach(
                    (sprint,index) => {

                      const option =
                        document
                        .createElement(
                          "option"
                        );


                      option.value = index;


                      option.textContent =

                        `${sprint.name} · ` +
                        `${sprint.start} – ` +
                        `${sprint.end}`;


                      sprintSelect
                        .appendChild(
                          option
                        );

                    }
                  );


                  sprintSelect.value =
                    Math.max(
                      data.sprints.length - 1,
                      0
                    );


                  updateSprint();

                });

              }


              // =============================================
              // Project selector
              // =============================================

              fetch("data/projects.json")
              .then(r => r.json())
              .then(projects => {

                const select =
                  document.getElementById(
                    "projectSelect"
                  );


                projects.forEach(
                  (project,index) => {

                    const option =
                      document
                      .createElement(
                        "option"
                      );


                    option.value = index;


                    option.textContent =

                      `${project.title} ` +
                      `(${project.issueCount} issues)`;


                    select.appendChild(
                      option
                    );

                  }
                );


                if (projects.length) {

                  loadProject(
                    projects[0]
                  );

                }


                select.addEventListener(
                  "change",
                  event => {

                    loadProject(
                      projects[
                        Number(
                          event.target.value
                        )
                      ]
                    );

                  }
                );

              });


              document
                .getElementById(
                  "sprintSelect"
                )
                .addEventListener(
                  "change",
                  updateSprint
                );

            </script>

          </body>
          </html>
          EOF


      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site


  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
