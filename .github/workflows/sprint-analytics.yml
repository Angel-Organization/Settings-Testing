                );


                const header =
                  document.getElementById(
                    "priorityHeader"
                  );


                header.innerHTML =
                  "";


                [
                  "Priority",
                  "Opened",
                  ...projectData.statuses,
                  "Closed"
                ]
                .forEach(
                  heading => {

                    const th =
                      document
                      .createElement(
                        "th"
                      );


                    th.textContent =
                      heading;


                    header.appendChild(
                      th
                    );

                  }
                );


                const body =
                  document.getElementById(
                    "priorityRows"
                  );


