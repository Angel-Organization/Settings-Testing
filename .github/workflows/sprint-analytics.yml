                  BlinkMacSystemFont,
                  "Segoe UI",
                  sans-serif;

              }


              main {

                width:
                  100%;

                max-width:
                  1600px;

                margin:
                  0 auto;

                padding:
                  0 32px 40px;

              }


              h1 {

                margin:
                  0 -32px;

                padding:
                  28px 32px 24px;

                background:
                  var(--blue-deep);

                color:
                  #ffffff;

                font-size:
                  30px;

                font-weight:
                  800;

              }


              h3 {

                margin-top:
                  0;

                color:
                  var(--navy);

              }


              .toolbar {

                display:
                  flex;

                flex-wrap:
                  wrap;

                gap:
                  12px;

                margin:
                  0 -32px 24px;

                padding:
                  18px 32px;

