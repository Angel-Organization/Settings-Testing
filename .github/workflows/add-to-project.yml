name: Add to Issue to Project

on:
  workflow_call:
    inputs:
      project-owner:
        required: true
        type: string
      project-number:
        required: true
        type: number
      project-id:
        required: true
        type: string
      sprint-field-id:
        required: true
        type: string
      prod-critical-priority-id:
        required: true
        type: number

jobs:
  add-to-project:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ACTIONS_APP_ID }}
          private-key: ${{ secrets.ACTIONS_APP_PRIVATE_KEY }}

      - name: Add to project
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const issue = context.payload.issue;

            // Configuration
            const Config = {
              projectOwner: "${{ inputs.project-owner }}",
              projectNumber: Number("${{ inputs.project-number }}"),
              projectId: "${{ inputs.project-id }}",
              sprintFieldId: "${{ inputs.sprint-field-id }}",
              prodCriticalPriorityId: Number("${{ inputs.prod-critical-priority-id }}")
            };

            // Add issue to project
            async function addToProject() {
              const response = await github.graphql(`
                mutation($projectId: ID!, $contentId: ID!) {
                  addProjectV2ItemById(input: {
                    projectId: $projectId
                    contentId: $contentId
                  }) {
                    item {
                      id
                    }
                  }
                }
              `, {
                projectId: Config.projectId,
                contentId: issue.node_id
              });

              return response.addProjectV2ItemById.item.id;
            }

            // Priority field
            async function getPriority() {
              const response = await github.request(
                "GET /repos/{owner}/{repo}/issues/{issue_number}/issue-field-values",
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  headers: {
                    "X-GitHub-Api-Version": "2022-11-28"
                  }
                }
              );

              return response.data.find(
                field => field.issue_field_name === "Priority"
              )?.single_select_option?.id ?? null;
            }

            // Active sprint
            async function getCurrentIteration() {
              const response = await github.graphql(`
                query($owner:String!, $number:Int!) {
                  organization(login:$owner) {
                    projectV2(number:$number) {
                      field(name:"Sprint") {
                        ... on ProjectV2IterationField {
                          configuration {
                            iterations {
                              id
                              title
                              startDate
                              duration
                            }
                          }
                        }
                      }
                    }
                  }
                }
              `, {
                owner: Config.projectOwner,
                number: Config.projectNumber
              });

              const today = new Date();

              return response.organization.projectV2.field.configuration.iterations.find(
                iteration => {
                  const start = new Date(iteration.startDate);
                  const end = new Date(start);
                  end.setDate(end.getDate() + iteration.duration);

                  return today >= start && today < end;
                }
              );
            }

            // Update sprint
            async function setSprint(projectItemId, iterationId) {
              await github.graphql(`
                mutation($input: UpdateProjectV2ItemFieldValueInput!) {
                  updateProjectV2ItemFieldValue(input: $input) {
                    projectV2Item {
                      id
                    }
                  }
                }
              `, {
                input: {
                  projectId: Config.projectId,
                  itemId: projectItemId,
                  fieldId: Config.sprintFieldId,
                  value: {
                    iterationId
                  }
                }
              });
            }

            async function run() {
              core.info(`Adding Issue #${issue.number} to project`);

              const projectItemId = await addToProject();

              const priority = await getPriority();

              if (priority !== Config.prodCriticalPriorityId) {
                core.info("Not PROD Critical");
                return;
              }

              const currentIteration = await getCurrentIteration();

              if (!currentIteration) {
                throw new Error("No active sprint found");
              }

              await setSprint(projectItemId, currentIteration.id);

              core.info(`Assigned to ${currentIteration.title}`);
            }

            run().catch(core.setFailed);
