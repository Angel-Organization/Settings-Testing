name: Sprint Analytics

on:
  workflow_dispatch:

  schedule:
    # 12:00 UTC = 8 AM EDT / 7 AM EST
    - cron: "0 12 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true


jobs:

  build:
    runs-on: ubuntu-latest

    env:
      ORG: ${{ github.repository_owner }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ACTIONS_APP_ID }}
          private-key: ${{ secrets.ACTIONS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}


      - name: Configure Pages
        uses: actions/configure-pages@v5


      - name: Build dashboard data
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

        run: |
          mkdir -p site/data

          python3 <<'PY'

          import json
          import os
          import re
          import subprocess

          from datetime import datetime, timedelta
          from pathlib import Path


          ORG = os.environ["ORG"]


          SPRINT_PATTERN = re.compile(
              r"<!--\s*sprint-tracker:\s*(.*?)\s*->\s*(.*?)\s*-->",
              re.IGNORECASE,
          )


          # ==================================================
          # GraphQL helper
          # ==================================================

          def graphql(query, variables=None):

              variables = variables or {}

              cmd = [
                  "gh",
                  "api",
                  "graphql",
                  "-f",
                  f"query={query}",
              ]

              for key, value in variables.items():

                  if value is not None:

                      cmd.extend([
                          "-F",
                          f"{key}={value}",
                      ])


              result = subprocess.run(
                  cmd,
                  check=True,
                  capture_output=True,
                  text=True,
              )


              return json.loads(
                  result.stdout
              )


          # ==================================================
          # Queries
          # ==================================================

          PROJECTS_QUERY = """
          query($org: String!) {

            organization(login: $org) {

              projectsV2(first: 100) {

                nodes {
                  number
                  title
                  shortDescription
                  closed
                  url
                }

              }

            }

          }
          """


          PROJECT_QUERY = """
          query(
            $org: String!,
            $number: Int!,
            $cursor: String
          ) {

            organization(login: $org) {

              projectV2(number: $number) {

                number
                title
                shortDescription
                url


                fields(first: 100) {

                  nodes {

                    __typename


                    ... on ProjectV2Field {

                      name
                      dataType

                    }


                    ... on ProjectV2SingleSelectField {

                      name
                      dataType

                      options {
                        name
                      }

                    }


                    ... on ProjectV2IterationField {

                      name
                      dataType

                      configuration {

                        iterations {
                          title
                          startDate
                          duration
                        }

                        completedIterations {
                          title
                          startDate
                          duration
                        }

                      }

                    }

                  }

                }


                items(
                  first: 100,
                  after: $cursor
                ) {

                  pageInfo {
                    hasNextPage
                    endCursor
                  }


                  nodes {

                    fieldValues(first: 100) {

                      nodes {

                        __typename


                        ... on ProjectV2ItemFieldSingleSelectValue {

                          name

                          field {
                            ... on ProjectV2FieldCommon {
                              name
                            }
                          }

                        }


                        ... on ProjectV2ItemFieldNumberValue {

                          number

                          field {
                            ... on ProjectV2FieldCommon {
                              name
                            }
                          }

                        }


                        ... on ProjectV2ItemFieldIterationValue {

                          title
                          startDate
                          duration

                          field {
                            ... on ProjectV2FieldCommon {
                              name
                            }
                          }

                        }


                        ... on ProjectV2ItemFieldDateValue {

                          date

                          field {
                            ... on ProjectV2FieldCommon {
                              name
                            }
                          }

                        }


                        ... on ProjectV2ItemFieldTextValue {

                          text

                          field {
                            ... on ProjectV2FieldCommon {
                              name
                            }
                          }

                        }

                      }

                    }


                    content {

                      ... on Issue {

                        number
                        title
                        state
                        createdAt
                        closedAt
                        url


                        repository {
                          nameWithOwner
                        }


                        issueType {
                          name
                        }


                        issueFieldValues(first: 30) {

                          nodes {

                            ... on IssueFieldSingleSelectValue {

                              name

                              field {

                                ... on IssueFieldSingleSelect {
                                  name
                                }

                              }

                            }

                          }

                        }

                      }

                    }

                  }

                }

              }

            }

          }
          """


          TIMELINE_QUERY = """
          query(
            $owner: String!,
            $repo: String!,
            $number: Int!
          ) {

            repository(
              owner: $owner,
              name: $repo
            ) {

              issue(number: $number) {

                timelineItems(
                  first: 250,
                  itemTypes: [
                    PROJECT_V2_ITEM_STATUS_CHANGED_EVENT,
                    ISSUE_COMMENT
                  ]
                ) {

                  nodes {

                    __typename


                    ... on ProjectV2ItemStatusChangedEvent {

                      createdAt
                      previousStatus
                      status

                      project {
                        number
                      }

                    }


                    ... on IssueComment {

                      createdAt
                      body

                    }

                  }

                }

              }

            }

          }
          """


          # ==================================================
          # Helpers
          # ==================================================

          def normalize(value):

              return re.sub(
                  r"[^a-z0-9]+",
                  " ",
                  str(value or "").lower(),
              ).strip()


          def project_field_by_alias(
              fields,
              aliases,
              expected_type=None,
          ):

              aliases = {
                  normalize(value)
                  for value in aliases
              }


              for field in fields:

                  if (
                      normalize(
                          field.get("name")
                      )
                      not in aliases
                  ):

                      continue


                  if (
                      expected_type
                      and
                      field.get("dataType")
                      !=
                      expected_type
                  ):

                      continue


                  return field


              return None


          def find_iteration_field(fields):

              preferred = project_field_by_alias(
                  fields,
                  [
                      "Sprint",
                      "Iteration",
                  ],
                  "ITERATION",
              )


              if preferred:

                  return preferred


              for field in fields:

                  if (
                      field.get("dataType")
                      ==
                      "ITERATION"
                  ):

                      return field


              return None


          def project_item_values(item):

              output = {}


              for value in (
                  item
                  .get("fieldValues", {})
                  .get("nodes", [])
              ):

                  field = (
                      value.get("field")
                      or {}
                  )

                  field_name = (
                      field.get("name")
                  )


                  if not field_name:

                      continue


                  typename = value.get(
                      "__typename"
                  )


                  if (
                      typename
                      ==
                      "ProjectV2ItemFieldSingleSelectValue"
                  ):

                      output[field_name] = (
                          value.get("name")
                      )


                  elif (
                      typename
                      ==
                      "ProjectV2ItemFieldNumberValue"
                  ):

                      output[field_name] = (
                          value.get("number")
                      )


                  elif (
                      typename
                      ==
                      "ProjectV2ItemFieldIterationValue"
                  ):

                      output[field_name] = (
                          value.get("title")
                      )


                  elif (
                      typename
                      ==
                      "ProjectV2ItemFieldDateValue"
                  ):

                      output[field_name] = (
                          value.get("date")
                      )


                  elif (
                      typename
                      ==
                      "ProjectV2ItemFieldTextValue"
                  ):

                      output[field_name] = (
                          value.get("text")
                      )


              return output


          def issue_single_select_values(issue):

              output = {}


              for value in (
                  issue
                  .get("issueFieldValues", {})
                  .get("nodes", [])
              ):

                  field = (
                      value.get("field")
                      or {}
                  )

                  name = field.get("name")


                  if not name:

                      continue


                  output[name] = (
                      value.get("name")
                  )


              return output


          def find_semantic_value(
              values,
              aliases,
          ):

              aliases = {
                  normalize(alias)
                  for alias in aliases
              }


              for field_name, value in (
                  values.items()
              ):

                  if (
                      normalize(field_name)
                      in aliases
                  ):

                      return value


              return None


          # ==================================================
          # Timeline cache
          # ==================================================

          timeline_cache = {}


          def get_timeline(
              repository,
              issue_number,
          ):

              key = (
                  f"{repository}"
                  f"#{issue_number}"
              )


              if key in timeline_cache:

                  return timeline_cache[key]


              owner, repo = (
                  repository.split("/", 1)
              )


              result = graphql(
                  TIMELINE_QUERY,
                  {
                      "owner":
                          owner,

                      "repo":
                          repo,

                      "number":
                          issue_number,
                  },
              )


              nodes = (
                  result["data"]
                  ["repository"]
                  ["issue"]
                  ["timelineItems"]
                  ["nodes"]
              )


              timeline_cache[key] = (
                  nodes
              )


              return nodes


          # ==================================================
          # Projects
          # ==================================================

          result = graphql(
              PROJECTS_QUERY,
              {
                  "org":
                      ORG,
              },
          )


          projects = [

              project

              for project in (
                  result["data"]
                  ["organization"]
                  ["projectsV2"]
                  ["nodes"]
              )

              if not project["closed"]

          ]


          print(
              f"Found {len(projects)} open projects"
          )


          # ==================================================
          # Build one project
          # ==================================================

          def load_project(project):

              cursor = None

              raw_items = []

              raw_field_nodes = []

              metadata = None


              while True:

                  result = graphql(
                      PROJECT_QUERY,
                      {
                          "org":
                              ORG,

                          "number":
                              project["number"],

                          "cursor":
                              cursor,
                      },
                  )


                  pv2 = (
                      result["data"]
                      ["organization"]
                      ["projectV2"]
                  )


                  if metadata is None:

                      metadata = {

                          "number":
                              pv2["number"],

                          "title":
                              pv2["title"],

                          "description":
                              (
                                  pv2.get(
                                      "shortDescription"
                                  )
                                  or ""
                              ),

                          "url":
                              pv2["url"],

                      }


                      raw_field_nodes = (
                          pv2["fields"]["nodes"]
                      )


                  connection = (
                      pv2["items"]
                  )


                  raw_items.extend(
                      connection["nodes"]
                  )


                  if not (
                      connection[
                          "pageInfo"
                      ][
                          "hasNextPage"
                      ]
                  ):

                      break


                  cursor = (
                      connection[
                          "pageInfo"
                      ][
                          "endCursor"
                      ]
                  )


              # ==============================================
              # Normalize project fields
              # ==============================================

              fields = []


              for raw in raw_field_nodes:

                  fields.append({

                      "name":
                          raw.get("name"),

                      "dataType":
                          raw.get("dataType"),

                      "kind":
                          raw.get("__typename"),

                      "options": [
                          option["name"]
                          for option in (
                              raw.get(
                                  "options",
                                  []
                              )
                          )
                      ],

                  })


              status_field = (
                  project_field_by_alias(
                      fields,
                      ["Status"],
                      "SINGLE_SELECT",
                  )
              )


              sprint_field = (
                  find_iteration_field(
                      fields
                  )
              )


              project_priority_field = (
                  project_field_by_alias(
                      fields,
                      [
                          "Priority",
                          "Initial Priority",
                      ],
                      "SINGLE_SELECT",
                  )
              )


              size_field = (
                  project_field_by_alias(
                      fields,
                      [
                          "Size",
                          "T-Shirt Size",
                          "T Shirt Size",
                          "Tshirt Size",
                          "Shirt Size",
                      ],
                      "SINGLE_SELECT",
                  )
              )


              loe_field = (
                  project_field_by_alias(
                      fields,
                      [
                          "LOE",
                          "Level of Effort",
                          "Level Of Effort",
                          "Effort Days",
                          "Estimated Days",
                      ],
                      "NUMBER",
                  )
              )


              # ==============================================
              # Sprint definitions
              # ==============================================

              sprints = {}


              if sprint_field:

                  raw_sprint_field = next(
                      (
                          raw
                          for raw in raw_field_nodes
                          if (
                              raw.get("name")
                              ==
                              sprint_field[
                                  "name"
                              ]
                          )
                      ),
                      None,
                  )


                  if raw_sprint_field:

                      config = (
                          raw_sprint_field.get(
                              "configuration"
                          )
                          or {}
                      )


                      iterations = (
                          config.get(
                              "completedIterations",
                              [],
                          )
                          +
                          config.get(
                              "iterations",
                              [],
                          )
                      )


                      for sprint in iterations:

                          start = (
                              sprint[
                                  "startDate"
                              ]
                          )

                          duration = int(
                              sprint[
                                  "duration"
                              ]
                          )


                          end = (
                              datetime
                              .fromisoformat(
                                  start
                              )
                              +
                              timedelta(
                                  days=
                                      duration
                                      -
                                      1
                              )
                          ).date().isoformat()


                          sprints[
                              sprint["title"]
                          ] = {

                              "name":
                                  sprint["title"],

                              "start":
                                  start,

                              "end":
                                  end,

                              "duration":
                                  duration,

                          }


              # ==============================================
              # Issues
              # ==============================================

              issues = []

              observed_priorities = set()
              observed_sizes = set()


              for item in raw_items:

                  issue = (
                      item.get("content")
                  )


                  if (
                      not issue
                      or
                      not issue.get("number")
                  ):

                      continue


                  repository = (
                      issue
                      .get(
                          "repository",
                          {},
                      )
                      .get(
                          "nameWithOwner"
                      )
                  )


                  if not repository:

                      continue


                  project_values = (
                      project_item_values(
                          item
                      )
                  )


                  issue_values = (
                      issue_single_select_values(
                          issue
                      )
                  )


                  # ==========================================
                  # PRIORITY
                  #
                  # IMPORTANT:
                  # Issue-level Priority is checked FIRST.
                  #
                  # This restores the behavior from the
                  # earlier working dashboard.
                  # ==========================================

                  priority = (
                      find_semantic_value(
                          issue_values,
                          [
                              "Priority",
                              "Initial Priority",
                          ],
                      )
                  )


                  # Fall back to Project item fields.

                  if priority is None:

                      priority = (
                          find_semantic_value(
                              project_values,
                              [
                                  "Priority",
                                  "Initial Priority",
                              ],
                          )
                      )


                  if priority is None:

                      priority = (
                          "Unspecified"
                      )


                  observed_priorities.add(
                      str(priority)
                  )


                  # ==========================================
                  # Size
                  # ==========================================

                  size = (
                      find_semantic_value(
                          project_values,
                          [
                              "Size",
                              "T-Shirt Size",
                              "T Shirt Size",
                              "Tshirt Size",
                              "Shirt Size",
                          ],
                      )
                  )


                  if size is not None:

                      observed_sizes.add(
                          str(size)
                      )


                  # ==========================================
                  # LOE
                  # ==========================================

                  loe = (
                      find_semantic_value(
                          project_values,
                          [
                              "LOE",
                              "Level of Effort",
                              "Level Of Effort",
                              "Effort Days",
                              "Estimated Days",
                          ],
                      )
                  )


                  current_sprint = None


                  if sprint_field:

                      current_sprint = (
                          project_values.get(
                              sprint_field[
                                  "name"
                              ]
                          )
                      )


                  issues.append({

                      "number":
                          issue["number"],

                      "repository":
                          repository,

                      "title":
                          issue["title"],

                      "url":
                          issue["url"],

                      "state":
                          issue["state"],

                      "issueType":
                          (
                              (
                                  issue.get(
                                      "issueType"
                                  )
                                  or {}
                              )
                              .get("name")
                              or
                              "Unspecified"
                          ),

                      "priority":
                          priority,

                      "size":
                          size,

                      "loe":
                          loe,

                      "currentSprint":
                          current_sprint,

                      "opened":
                          issue[
                              "createdAt"
                          ][:10],

                      "closed":
                          (
                              issue[
                                  "closedAt"
                              ][:10]
                              if issue[
                                  "closedAt"
                              ]
                              else None
                          ),

                      "projectFieldValues":
                          project_values,

                      "issueFieldValues":
                          issue_values,

                      "statusEvents":
                          [],

                      "sprintTransitions":
                          [],

                  })


              # ==============================================
              # Timeline
              # ==============================================

              known_sprints = (
                  set(
                      sprints.keys()
                  )
              )


              for index, issue in enumerate(
                  issues,
                  start=1,
              ):

                  print(
                      f'Project '
                      f'{project["number"]}: '
                      f'[{index}/{len(issues)}] '
                      f'{issue["repository"]}'
                      f'#{issue["number"]} '
                      f'Priority={issue["priority"]}'
                  )


                  try:

                      nodes = get_timeline(
                          issue[
                              "repository"
                          ],
                          issue[
                              "number"
                          ],
                      )


                      for node in nodes:

                          typename = (
                              node.get(
                                  "__typename"
                              )
                          )


                          # ==================================
                          # Status
                          # ==================================

                          if (
                              typename
                              ==
                              "ProjectV2ItemStatusChangedEvent"
                          ):

                              event_project = (
                                  node.get(
                                      "project"
                                  )
                                  or {}
                              )


                              if (
                                  event_project.get(
                                      "number"
                                  )
                                  !=
                                  project[
                                      "number"
                                  ]
                              ):

                                  continue


                              status = (
                                  node.get(
                                      "status"
                                  )
                              )


                              if not status:

                                  continue


                              issue[
                                  "statusEvents"
                              ].append({

                                  "status":
                                      status,

                                  "date":
                                      node[
                                          "createdAt"
                                      ][:10],

                              })


                          # ==================================
                          # Sprint tracker
                          # ==================================

                          elif (
                              typename
                              ==
                              "IssueComment"
                          ):

                              body = (
                                  node.get(
                                      "body"
                                  )
                                  or ""
                              )


                              for match in (
                                  SPRINT_PATTERN
                                  .finditer(
                                      body
                                  )
                              ):

                                  from_value = (
                                      match
                                      .group(1)
                                      .strip()
                                  )


                                  to_value = (
                                      match
                                      .group(2)
                                      .strip()
                                  )


                                  source_relevant = (
                                      from_value
                                      in known_sprints
                                      or
                                      from_value
                                      .lower()
                                      ==
                                      "backlog"
                                      or
                                      bool(
                                          re.match(
                                              r"^sprint\b",
                                              from_value,
                                              re.I,
                                          )
                                      )
                                  )


                                  destination_relevant = (
                                      to_value
                                      in known_sprints
                                      or
                                      to_value
                                      .lower()
                                      ==
                                      "backlog"
                                      or
                                      bool(
                                          re.match(
                                              r"^sprint\b",
                                              to_value,
                                              re.I,
                                          )
                                      )
                                  )


                                  if not (
                                      source_relevant
                                      or
                                      destination_relevant
                                  ):

                                      continue


                                  issue[
                                      "sprintTransitions"
                                  ].append({

                                      "from":
                                          from_value,

                                      "to":
                                          to_value,

                                      "date":
                                          node[
                                              "createdAt"
                                          ][:10],

                                  })


                      issue[
                          "statusEvents"
                      ].sort(
                          key=lambda event:
                              event["date"]
                      )


                      issue[
                          "sprintTransitions"
                      ].sort(
                          key=lambda event:
                              event["date"]
                      )


                  except Exception as exc:

                      print(
                          f'Warning reading '
                          f'{issue["repository"]}'
                          f'#{issue["number"]}: '
                          f'{exc}'
                      )


              # ==============================================
              # Status values
              # ==============================================

              statuses = []


              if status_field:

                  statuses.extend(
                      status_field.get(
                          "options",
                          []
                      )
                  )


              for issue in issues:

                  for event in (
                      issue[
                          "statusEvents"
                      ]
                  ):

                      status = (
                          event["status"]
                      )


                      if (
                          status
                          not in statuses
                      ):

                          statuses.append(
                              status
                          )


              # ==============================================
              # Priority values
              # ==============================================

              priorities = []


              # Preserve expected ordering first.

              preferred_priority_order = [
                  "PROD Critical",
                  "P0",
                  "P1",
                  "P2",
                  "P3",
                  "P4",
              ]


              project_priority_options = []


              if project_priority_field:

                  project_priority_options = (
                      project_priority_field
                      .get(
                          "options",
                          []
                      )
                  )


              all_priority_values = (
                  set(
                      project_priority_options
                  )
                  |
                  observed_priorities
              )


              for priority in (
                  preferred_priority_order
              ):

                  if (
                      priority
                      in all_priority_values
                  ):

                      priorities.append(
                          priority
                      )


              for priority in sorted(
                  all_priority_values
              ):

                  if (
                      priority
                      not in priorities
                  ):

                      priorities.append(
                          priority
                      )


              # ==============================================
              # Size values
              # ==============================================

              sizes = []


              if size_field:

                  sizes.extend(
                      size_field.get(
                          "options",
                          []
                      )
                  )


              for size in sorted(
                  observed_sizes
              ):

                  if size not in sizes:

                      sizes.append(
                          size
                      )


              # ==============================================
              # Capabilities
              # ==============================================

              has_real_priority = any(
                  issue["priority"]
                  !=
                  "Unspecified"
                  for issue in issues
              )


              capabilities = {

                  "status": {

                      "available":
                          bool(
                              statuses
                          ),

                  },

                  "sprint": {

                      "available":
                          bool(
                              sprints
                          ),

                  },

                  "priority": {

                      "available":
                          has_real_priority,

                  },

                  "size": {

                      "available":
                          (
                              size_field
                              is not None
                              or
                              bool(
                                  observed_sizes
                              )
                          ),

                  },

                  "loe": {

                      "available":
                          (
                              loe_field
                              is not None
                              or
                              any(
                                  issue["loe"]
                                  is not None
                                  for issue in issues
                              )
                          ),

                  },

                  "issueType": {

                      "available":
                          True,

                  },

              }


              print("")
              print(
                  f'Project '
                  f'{project["number"]} '
                  f'priorities: '
                  f'{priorities}'
              )


              print(
                  f'Project '
                  f'{project["number"]} '
                  f'capabilities: '
                  f'{capabilities}'
              )


              return {

                  "project":
                      metadata,

                  "fields":
                      fields,

                  "capabilities":
                      capabilities,

                  "sprints":
                      sorted(
                          sprints.values(),
                          key=lambda sprint:
                              sprint["start"],
                      ),

                  "statuses":
                      statuses,

                  "priorities":
                      priorities,

                  "sizes":
                      sizes,

                  "issues":
                      issues,

              }


          # ==================================================
          # Write output
          # ==================================================

          project_index = []


          for project in projects:

              data = load_project(
                  project
              )


              slug = (
                  f'project-'
                  f'{project["number"]}'
              )


              Path(
                  f"site/data/{slug}.json"
              ).write_text(
                  json.dumps(
                      data,
                      indent=2,
                  )
              )


              project_index.append({

                  "number":
                      project["number"],

                  "title":
                      project["title"],

                  "description":
                      (
                          project.get(
                              "shortDescription"
                          )
                          or ""
                      ),

                  "slug":
                      slug,

                  "issueCount":
                      len(
                          data["issues"]
                      ),

                  "capabilities":
                      data[
                          "capabilities"
                      ],

              })


          Path(
              "site/data/projects.json"
          ).write_text(
              json.dumps(
                  project_index,
                  indent=2,
              )
          )


          print("")
          print("Generated projects:")

          print(
              json.dumps(
                  project_index,
                  indent=2,
              )
          )

