            <script
              src="https://cdn.jsdelivr.net/npm/chart.js">
            </script>


            <style>

              :root {

                --blue:
                  #2499e8;

                --blue-deep:
                  #0f5f98;

                --blue-light:
                  #eaf6fd;

                --green:
                  #49b94f;

