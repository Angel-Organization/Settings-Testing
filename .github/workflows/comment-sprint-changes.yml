# This workflow leaves a comment on open issues in the configured GitHub
# Project when they are added to a Sprint, removed from a Sprint, or moved
# to a different Sprint
#
# It runs daily at 9:00 AM Eastern Daylight Time (13:00 UTC), or when
# manually triggered
#
# Comments:
# - Backlog -> Sprint 190
# - Sprint 190 -> Sprint 191
# - Sprint 191 -> Backlog
#
# It does not comment when:
# - An issue remains in the same Sprint
# - An issue remains in Backlog
# - An issue is closed
# - An issue is outside the configured project

# Records sprint changes for open issues across multiple GitHub Projects.
# Posts one comment per issue, even when multiple project assignments change.
# Includes archived project items and ignores removed project items.

name: Comment Sprint Changes

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: comment-sprint-changes
  cancel-in-progress: false

jobs:
  sprint-tracker:
    runs-on: ubuntu-latest
    env:
      OWNER: Angel-Organization
      PROJECT_NUMBERS: "1"
      LEGACY_PROJECT_NUMBER: "1"

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ACTIONS_APP_ID }}
          private-key: ${{ secrets.ACTIONS_APP_PRIVATE_KEY }}
          owner: ${{ env.OWNER }}

      - name: Comment on sprint changes
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, re, subprocess
          from collections import defaultdict

          OWNER = os.environ["OWNER"]
          PROJECTS = [int(n) for n in os.environ["PROJECT_NUMBERS"].split(",")]
          LEGACY = int(os.environ["LEGACY_PROJECT_NUMBER"])

          def api(*args):
              return json.loads(subprocess.check_output(["gh", "api", *args], text=True))

          QUERY = """
          query($owner:String!, $number:Int!, $cursor:String) {
            organization(login:$owner) {
              projectV2(number:$number) {
                title
                items(first:100, after:$cursor, archivedStates:[ARCHIVED,NOT_ARCHIVED]) {
                  pageInfo { hasNextPage endCursor }
                  nodes {
                    content {
                      ... on Issue {
                        number state
                        repository { nameWithOwner }
                      }
                    }
                    fieldValues(first:100) {
                      nodes {
                        ... on ProjectV2ItemFieldIterationValue {
                          title
                          field { ... on ProjectV2FieldCommon { name } }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
          """

          issues = defaultdict(dict)
          names = {}

          for number in PROJECTS:
              cursor = None
              while True:
                  args = ["graphql", "-f", f"query={QUERY}", "-f", f"owner={OWNER}", "-F", f"number={number}"]
                  if cursor: args += ["-f", f"cursor={cursor}"]
                  project = api(*args)["data"]["organization"]["projectV2"]
                  if not project: raise RuntimeError(f"Cannot access Project #{number}")

                  names[number] = project["title"]
                  for item in project["items"]["nodes"]:
                      issue = item.get("content") or {}
                      if issue.get("state") != "OPEN" or not issue.get("repository"): continue

                      sprint = next((
                          v["title"] for v in item["fieldValues"]["nodes"]
                          if v and (v.get("field") or {}).get("name", "").lower() in ("sprint", "iteration")
                      ), "Backlog")

                      key = (issue["repository"]["nameWithOwner"], issue["number"])
                      issues[key][number] = sprint

                  page = project["items"]["pageInfo"]
                  if not page["hasNextPage"]: break
                  cursor = page["endCursor"]

          for (repo, number), assignments in issues.items():
              pages = api("--paginate", "--slurp", f"repos/{repo}/issues/{number}/comments?per_page=100")
              comments = [c for page in pages for c in page]
              changes = []

              for project, current in sorted(assignments.items()):
                  markers = [f"sprint-tracker-project-{project}"]
                  if project == LEGACY: markers.append("sprint-tracker")

                  events = []
                  for comment in comments:
                      for marker in markers:
                          pattern = rf"<!--\s*{re.escape(marker)}:\s*(.*?)\s*->\s*(.*?)\s*-->"
                          for match in re.finditer(pattern, comment.get("body") or "", re.I):
                              events.append((comment["created_at"], comment["id"], match.group(2).strip()))

                  previous = max(events)[2] if events else "Backlog"
                  if previous != current: changes.append((project, previous, current))

              if not changes: continue

              markers = [
                  f"<!-- {'sprint-tracker' if p == LEGACY else f'sprint-tracker-project-{p}'}:{old} -> {new} -->"
                  for p, old, new in changes
              ]
              details = [
                  f"**{names[p]} (#{p}):** {old} -> {new}"
                  for p, old, new in changes
              ]
              body = "\n".join(markers + ["", "**Sprint updated:**", ""] + details)

              api(f"repos/{repo}/issues/{number}/comments", "--method", "POST", "-f", f"body={body}")
              print(f"{repo}#{number}: {len(changes)} sprint change(s) recorded")

          PY
