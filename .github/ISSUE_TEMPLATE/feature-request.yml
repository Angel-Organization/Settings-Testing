name: Feature Request
description: Request a new feature or enhancement.
type: Feature

body:
  - type: markdown
    attributes:
      value: |
        Please complete the information below. This information will be used to automatically classify and triage the request.

  - type: checkboxes
    id: product
    attributes:
      label: Product
      description: Which product is this request for?
      options:
        - label: ScriptSure
        - label: VetWay
        - label: Exchange
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Initial Priority
      description: |
        Select the initial priority for this request.
        Priority may be adjusted during triage.
      options:
        - Prod Critical
        - P0
        - P1
        - P2
        - P3
    validations:
      required: false

  - type: dropdown
    id: source
    attributes:
      label: Source
      description: Where did this request originate?
      options:
        - Customer
        - QA
        - Demo
        - Support
        - Internal Request
        - Other
    validations:
      required: false

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Briefly describe the requested feature.
      placeholder: A concise description of the feature request.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / Opportunity
      description: What problem does this solve or what opportunity does it address?
      placeholder: |
        Describe the current pain point or opportunity.
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: Describe the desired functionality.
      placeholder: |
        What would you like the product to do?
    validations:
      required: true

  - type: textarea
    id: business_value
    attributes:
      label: Business Value
      description: Why is this important?
      placeholder: |
        Examples:
        • Saves users time
        • Improves workflow
        • Supports a customer request
        • Required for compliance
        • Reduces support tickets
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: What would need to be true for this request to be considered complete?
      placeholder: |
        • User can...
        • System displays...
        • Data is...
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Include mockups, screenshots, examples, links, or any other supporting information.
