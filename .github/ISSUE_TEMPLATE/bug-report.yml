name: Bug Report
description: Report a bug or unexpected behavior.
type: Bug

body:
  - type: markdown
    attributes:
      value: |
        <h2>Initial Classification</h2>

        <table>
          <tr>
            <th style="padding-right: 40px;">Product</th>
            <th style="padding-right: 40px;">Priority</th>
            <th>Source</th>
          </tr>
        </table>

        Please complete the information below. This information will be used to automatically classify and triage the issue.

  - type: dropdown
    id: product
    attributes:
      label: Product
      description: Which product is affected?
      options:
        - ScriptSure
        - VetWay
        - Exchange
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Initial Priority
      description: |
        Select the initial priority for this issue.
        • Use Prod Critical for ScriptSure critical issues.
        • Use P0 for VetWay critical issues.
        • Priority may be adjusted during triage.
      options:
        - Prod Critical
        - P0
        - P1
        - P2
        - P3
    validations:
      required: false

  - type: dropdown
    id: source
    attributes:
      label: Source
      description: How was this issue discovered?
      options:
        - Customer
        - QA
        - Demo
        - Support
        - Internal Testing
        - Other
    validations:
      required: false

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Briefly describe the issue.
      placeholder: A concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Provide the steps needed to reproduce the issue.
      placeholder: |
        1. Go to...
        2. Click...
        3. Enter...
        4. Observe...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Provide any relevant environment information.
      placeholder: |
        Environment:
        User Type:
        User Email:
        Browser:
        OS:
        Version:

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Include screenshots, recordings, logs, stack traces, or any other information that may help diagnose the issue.
