name: Feature Request
description: Request a new feature or enhancement.
type: Feature

body:
  - type: markdown
    attributes:
      value: |
        Please provide enough information for someone else to understand, scope, and prioritize this request.

  - type: markdown
    attributes:
      value: "## Feature Details"

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: |
        Briefly describe the requested feature or enhancement.

        If available, attach any existing specifications, mockups, or other supporting documents to this issue.
      placeholder: |
        Example:
        Allow supporting users to save frequently used pharmacies as favorites.
    validations:
      required: true

  - type: dropdown
    id: feature-type
    attributes:
      label: Feature Type
      multiple: false
      description: |
        Is this request for a completely new feature or an enhancement that improves an existing one?
      options:
        - New Feature
        - Enhancement
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or Opportunity
      description: What problem are you trying to solve, or what opportunity does this address?
      placeholder: |
        Example:

        Supporting users spend time searching for the same pharmacies multiple times each day.
        Saving favorite pharmacies would reduce repetitive work and speed up prescription processing.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: Describe what must be true for this request to be considered complete.
      placeholder: |
        Example:

        - Supporting users can save pharmacies as favorites.
        - Favorite pharmacies are available when creating a prescription.
        - Users can remove a pharmacy from their favorites.
        - Only the current user's favorites are displayed.
    validations:
      required: true

  - type: markdown
    attributes:
      value: "## Classification"

  - type: dropdown
    id: product
    attributes:
      label: Product
      multiple: false
      description: Which product is this request for?
      options:
        - ScriptSure
        - VetWay
        - Exchange
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      multiple: false
      description: Select your best estimate. This may be updated during triage.
      options:
        - Prod Critical
        - P0
        - P1
        - P2
        - P3
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: Source
      multiple: false
      description: Where did this request originate?
      options:
        - Customer
        - QA
        - Demo
        - Support
        - Internal Testing
        - Other
    validations:
      required: true

  - type: markdown
    attributes:
      value: "## Supporting Information"

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Include any additional information that may help evaluate this request.
      placeholder: |
        Examples:
        - Related issue: #1234
        - Link to documentation or specification
        - Screenshots or mockups
        - Regulatory or business requirements
        - Additional implementation considerations
