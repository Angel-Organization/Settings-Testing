                color:
                  var(--navy);

                border:
                  1px solid
                  var(--border);

                border-radius:
                  8px;

                font-weight:
                  700;

              }


              .kpis {

                display:
                  grid;

                grid-template-columns:
                  repeat(
                    auto-fit,
                    minmax(
                      150px,
                      1fr
                    )
                  );

                gap:
                  15px;

                margin-bottom:
                  18px;

              }


              .card {

                min-width:
                  0;

                background:
                  #ffffff;

                border:
                  1px solid
                  var(--border);

                border-radius:
                  14px;

                padding:
                  18px;

                box-shadow:
                  0 3px 10px
                  rgba(
                    23,
                    32,
                    51,
                    .08
                  );

              }


              .clickable {

                cursor:
                  pointer;

              }


              .clickable:hover {

                box-shadow:
                  0 8px 22px
                  rgba(
                    0,
                    0,
                    0,
                    .14
                  );

              }


              .label {

                color:
                  #536174;

                font-size:
                  11px;

                font-weight:
                  800;

                text-transform:
                  uppercase;

                letter-spacing:
                  .04em;

              }


              .number {

                margin-top:
                  6px;

                color:
                  var(--navy);

                font-size:
                  32px;

                font-weight:
                  800;

              }


              .subnumber {

                margin-top:
                  5px;

                color:
                  var(--muted);

                font-size:
                  12px;

              }


              .status-row {

                display:
                  flex;

                flex-wrap:
                  wrap;

                gap:
                  8px;

                margin:
                  0 0 20px;

              }


              .status-chip {

                padding:
                  7px 11px;

                border:
                  1px solid
                  var(--border);

                border-radius:
                  999px;

                background:
                  #ffffff;

                color:
                  var(--navy);

                font-size:
                  12px;

                cursor:
                  pointer;

              }


              .status-chip strong {

                margin-left:
                  6px;

                color:
                  var(--blue-deep);

              }


              .grid {

                display:
                  grid;

                grid-template-columns:
                  minmax(
                    0,
                    2fr
                  )
                  minmax(
                    320px,
                    1fr
                  );

                gap:
                  18px;

                margin-bottom:
                  18px;

              }


              .optional-grid {

                display:
                  grid;

                grid-template-columns:
                  repeat(
                    auto-fit,
                    minmax(
                      320px,
                      1fr
                    )
                  );

                gap:
                  18px;

                margin-bottom:
                  18px;

              }


              .chart {

                position:
                  relative;

                width:
                  100%;

                height:
                  330px;

                min-width:
                  0;

              }


              .chart canvas {

                display:
                  block;

                width:
                  100% !important;

                max-width:
                  100% !important;

                height:
                  100% !important;

              }


              .hidden {

                display:
                  none !important;

              }


              .table-wrap {

                width:
                  100%;

                overflow-x:
                  auto;

              }


              table {

                width:
                  100%;

                border-collapse:
                  collapse;

              }


              th,
              td {

                padding:
                  11px;

                border-bottom:
                  1px solid
                  #eef1f5;

                text-align:
                  right;

                white-space:
                  nowrap;

              }


              th {

                background:
                  var(--blue-light);

                color:
                  var(--blue-deep);

                font-size:
                  11px;

                font-weight:
                  800;

                text-transform:
                  uppercase;

              }


              th:first-child,
              td:first-child {

                text-align:
                  left;

              }


              .metric-cell {

                color:
                  var(--blue-deep);

                font-weight:
                  750;

                cursor:
                  pointer;

                text-decoration:
                  underline dotted;

              }


              .modal-backdrop {

                position:
                  fixed;

                inset:
                  0;

                z-index:
                  1000;

                display:
                  flex;

                align-items:
                  center;

                justify-content:
                  center;

                padding:
                  18px;

                background:
                  rgba(
                    15,
                    23,
                    42,
                    .58
                  );

              }


              .modal {

                width:
                  min(
                    98vw,
                    1900px
                  );

                max-height:
                  92vh;

                overflow:
                  hidden;

                background:
                  #ffffff;

                border-radius:
                  16px;

              }


              .modal-header {

                display:
                  flex;

                justify-content:
                  space-between;

                align-items:
                  center;

                padding:
                  20px 24px;

                background:
                  var(--blue-deep);

                color:
                  #ffffff;

              }


              .modal-header h2 {

                margin:
                  0;

              }


              .modal-body {

                max-height:
                  78vh;

                overflow:
                  auto;

              }


              .close-button {

                border:
                  0;

                background:
                  transparent;

                color:
                  #ffffff;

                font-size:
                  32px;

                cursor:
                  pointer;

              }


              .drilldown-table {

                width:
                  max-content;

                min-width:
                  100%;

              }


              .drilldown-table th {

                position:
                  sticky;

                top:
                  0;

                z-index:
                  3;

              }


              .issue-link {

                color:
                  var(--blue-deep);

                text-decoration:
                  none;

                font-weight:
                  750;

              }


              .title-column {

                min-width:
                  280px;

                max-width:
                  400px;

                white-space:
                  normal;

                text-align:
                  left;

              }


              @media(
                max-width:900px
              ) {

                main {

                  padding:
                    0 18px 30px;

                }


                h1 {

                  margin:
                    0 -18px;

                }


                .toolbar {

                  margin:
                    0 -18px 20px;

                  padding:
                    15px 18px;

                }


                .grid {

                  grid-template-columns:
                    minmax(
                      0,
                      1fr
                    );

                }


                select {

                  width:
                    100%;

                  min-width:
                    0;

                }

              }

            </style>

          </head>


          <body>

            <main>


              <h1>
                Sprint Analytics
              </h1>


              <div class="toolbar">

                <select
                  id="projectSelect">
                </select>

                <select
                  id="sprintSelect">
                </select>

              </div>


              <section
                id="headlineKpis"
                class="kpis">
              </section>


              <div
                id="statusRow"
                class="status-row">
              </div>


              <div class="grid">


                <section
                  id="flowCard"
                  class="card">

                  <h3>
                    Sprint Flow
                  </h3>

                  <div class="chart">

                    <canvas
                      id="flowChart">
                    </canvas>

                  </div>

                </section>


                <section
                  id="typeCard"
                  class="card">

                  <h3>
                    Work by Type
                  </h3>

                  <div class="chart">

                    <canvas
                      id="typeChart">
                    </canvas>

                  </div>

                </section>


              </div>


              <div class="optional-grid">


                <section
                  id="sizeCard"
                  class="card hidden">

                  <h3>
                    Work by Size
                  </h3>

                  <div class="chart">

                    <canvas
                      id="sizeChart">
                    </canvas>

                  </div>

                </section>


                <section
                  id="loeCard"
                  class="card hidden">

                  <h3>
                    LOE
                  </h3>

                  <div
                    id="loeKpis"
                    class="kpis">
                  </div>

                </section>


              </div>


              <section
                id="priorityCard"
                class="card">

                <h3>
                  Flow by Priority
                </h3>

                <div class="table-wrap">

                  <table>

                    <thead>
                      <tr
                        id="priorityHeader">
                      </tr>
                    </thead>

                    <tbody
                      id="priorityRows">
                    </tbody>

                  </table>

                </div>

              </section>


            </main>


            <div
              id="drilldownBackdrop"
              class="modal-backdrop hidden">

              <div class="modal">


                <div class="modal-header">

                  <div>

                    <h2
                      id="drilldownTitle">
                    </h2>

                    <div
                      id="drilldownSubtitle">
                    </div>

                  </div>


                  <button
                    id="closeDrilldown"
                    class="close-button">
                    ×
                  </button>

                </div>


                <div class="modal-body">

                  <table
                    class="drilldown-table">

                    <thead>

                      <tr
                        id="drilldownHeader">
                      </tr>

                    </thead>

                    <tbody
                      id="drilldownRows">
                    </tbody>

                  </table>

                </div>


              </div>

            </div>


            <script>

              let projectData =
                null;


              const cacheVersion =
                Date.now();


              // --------------------------------------------
              // Utility
              // --------------------------------------------

              function cap(name) {

                return (
                  projectData
                  ?.capabilities
                  ?.[name]
                  ?.available
                  ===
                  true
                );

              }


              function within(
                date,
                sprint
              ) {

                return (
                  date
                  &&
                  date
                  >=
                  sprint.start
                  &&
                  date
                  <=
                  sprint.end
                );

              }


              function issueId(issue) {

                return (
                  issue.repository
                  +
                  "#"
                  +
                  issue.number
                );

              }


              function escapeHtml(value) {

                return String(
                  value ?? ""
                )
                .replaceAll(
                  "&",
                  "&amp;"
                )
                .replaceAll(
                  "<",
                  "&lt;"
                )
                .replaceAll(
                  ">",
                  "&gt;"
                )
                .replaceAll(
                  '"',
                  "&quot;"
                )
                .replaceAll(
                  "'",
                  "&#039;"
                );

              }


              function selectedSprint() {

                if (!projectData) {

                  return null;

                }


                const index =
                  Number(
                    document
                    .getElementById(
                      "sprintSelect"
                    )
                    .value
                  );


                return (
                  projectData
                  .sprints[index]
                  ||
                  null
                );

              }


              // --------------------------------------------
              // Sprint entry / carryover
              // --------------------------------------------

              function sprintEntries(
                issue,
                sprint
              ) {

                return (
                  issue
                  .sprintTransitions
                  ||
                  []
                )
                .filter(
                  transition =>
                    transition.to
                    ===
                    sprint.name
                )
                .sort(
                  (a,b) =>
                    a.date
                    .localeCompare(
                      b.date
                    )
                );

              }


              function latestEntry(
                issue,
                sprint
              ) {

                const entries =
                  sprintEntries(
                    issue,
                    sprint
                  );


                return (
                  entries.length
                  ?
                  entries[
                    entries.length
                    -
                    1
                  ]
                  :
                  null
                );

              }


              function committedIssues(
                sprint
              ) {

                return projectData
                  .issues
                  .filter(
                    issue => {

                      const entry =
                        latestEntry(
                          issue,
                          sprint
                        );


                      return (
                        entry
                        &&
                        entry.date
                        <=
                        sprint.start
                      );

                    }
                  );

              }


              function carriedOverIssues(
                sprint
              ) {

                return projectData
                  .issues
                  .filter(
                    issue => {

                      const entry =
                        latestEntry(
                          issue,
                          sprint
                        );


                      return (
                        entry
                        &&
                        entry.from
                        !==
                        "Backlog"
                        &&
                        entry.from
                        !==
                        sprint.name
                      );

                    }
                  );

              }


              function addedIssues(
                sprint
              ) {

                return projectData
                  .issues
                  .filter(
                    issue => {

                      const entry =
                        latestEntry(
                          issue,
                          sprint
                        );


                      return (
                        entry
                        &&
                        entry.from
                        ===
                        "Backlog"
                        &&
                        entry.date
                        >
                        sprint.start
                        &&
                        entry.date
                        <=
                        sprint.end
                      );

                    }
                  );

              }


              function removedIssues(
                sprint
              ) {

                return projectData
                  .issues
                  .filter(
                    issue =>
                      (
                        issue
                        .sprintTransitions
                        ||
                        []
                      )
                      .some(
                        transition =>
                          transition.from
                          ===
                          sprint.name
                          &&
                          transition.to
                          !==
                          sprint.name
                          &&
                          within(
                            transition.date,
                            sprint
                          )
                      )
                  );

              }


              function closedIssues(
                sprint,
                priority = null
              ) {

                return projectData
                  .issues
                  .filter(
                    issue =>
                      (
                        !priority
                        ||
                        issue.priority
                        ===
                        priority
                      )
                      &&
                      within(
                        issue.closed,
                        sprint
                      )
                  );

              }


              function openedIssues(
                sprint,
                priority = null
              ) {

                return projectData
                  .issues
                  .filter(
                    issue =>
                      (
                        !priority
                        ||
                        issue.priority
                        ===
                        priority
                      )
                      &&
                      within(
                        issue.opened,
                        sprint
                      )
                  );

              }


              function completionRate(
                sprint
              ) {

                const scope =
                  new Set(
                    [
                      ...committedIssues(
                        sprint
                      ),
                      ...addedIssues(
                        sprint
                      )
                    ]
                    .map(issueId)
                  );


                if (!scope.size) {

                  return 0;

                }


                const closed =
                  closedIssues(
                    sprint
                  )
                  .filter(
                    issue =>
                      scope.has(
                        issueId(issue)
                      )
                  );


                return (
                  closed.length
                  /
                  scope.size
                  *
                  100
                );

              }


              // --------------------------------------------
              // Status analytics
              // --------------------------------------------

              function statusIssues(
                sprint,
                status,
                priority = null
              ) {

                return projectData
                  .issues
                  .filter(
                    issue =>
                      (
                        !priority
                        ||
                        issue.priority
                        ===
                        priority
                      )
                      &&
                      issue.events
                      .some(
                        event =>
                          event.status
                          ===
                          status
                          &&
                          within(
                            event.date,
                            sprint
                          )
                      )
                  );

              }


              function statusDates(
                issue,
                status
              ) {

                return issue.events
                  .filter(
                    event =>
                      event.status
                      ===
                      status
                  )
                  .map(
                    event =>
                      event.date
                  )
                  .sort();

              }


              // --------------------------------------------
              // "Worked" definition
              // --------------------------------------------

              function workedIssues(
                sprint
              ) {

                const ids =
                  new Set();


                projectData
                  .issues
                  .forEach(
                    issue => {

                      if (
                        within(
                          issue.closed,
                          sprint
                        )
                      ) {

                        ids.add(
                          issueId(issue)
                        );

                      }


                      issue.events
                        .forEach(
                          event => {

                            if (
                              within(
                                event.date,
                                sprint
                              )
                            ) {

                              ids.add(
                                issueId(issue)
                              );

                            }

                          }
                        );

                    }
                  );


                return projectData
                  .issues
                  .filter(
                    issue =>
                      ids.has(
                        issueId(issue)
                      )
                  );

              }


              // --------------------------------------------
              // LOE
              // --------------------------------------------

              function sumLoe(issues) {

                return issues
                  .reduce(
                    (
                      total,
                      issue
                    ) => {

                      const value =
                        Number(
                          issue.loe
                        );


                      return (
                        total
                        +
                        (
                          Number.isFinite(
                            value
                          )
                          ?
                          value
                          :
                          0
                        )
                      );

                    },
                    0
                  );

              }


              function formatDays(value) {

                return (
                  Number(value)
                  .toFixed(1)
                  .replace(
                    /\.0$/,
                    ""
                  )
                  +
                  " days"
                );

              }


              // --------------------------------------------
              // Headline KPI cards
              // --------------------------------------------

              function renderHeadlineKpis(
                sprint
              ) {

                const container =
                  document
                  .getElementById(
                    "headlineKpis"
                  );


                container.innerHTML =
                  "";


                const metrics = [

                  {
                    label:
                      "Committed",

                    issues:
                      committedIssues(
                        sprint
                      )
                  },

                  {
                    label:
                      "Carried Over",

                    issues:
                      carriedOverIssues(
                        sprint
                      )
                  },

                  {
                    label:
                      "Added",

                    issues:
                      addedIssues(
                        sprint
                      )
                  },

                  {
                    label:
                      "Removed",

                    issues:
                      removedIssues(
                        sprint
                      )
                  },

                  {
                    label:
                      "Closed",

                    issues:
                      closedIssues(
                        sprint
                      )
                  }

                ];


                metrics.forEach(
                  metric => {

                    const card =
                      document
                      .createElement(
                        "div"
                      );


                    card.className =
                      "card clickable";


                    const loe =
                      cap("loe")
                      ?
                      sumLoe(
                        metric.issues
                      )
                      :
                      null;


                    card.innerHTML = `

                      <div
                        class="label">

                        ${
                          escapeHtml(
                            metric.label
                          )
                        }

                      </div>

                      <div
                        class="number">

                        ${
                          metric
                          .issues
                          .length
                        }

                      </div>

                      ${
                        cap("loe")
                        ?
                        `
                        <div
                          class="subnumber">

                          ${
                            formatDays(
                              loe
                            )
                          }
                          LOE

                        </div>
                        `
                        :
                        ""
                      }

                    `;


                    card.onclick =
                      () =>
                        openDrilldown(
                          metric.label,
                          sprint,
                          metric.issues
                        );


                    container
                      .appendChild(
                        card
                      );

                  }
                );


                const completion =
                  document
                  .createElement(
                    "div"
                  );


                completion.className =
                  "card";


                completion.innerHTML = `

                  <div
                    class="label">

                    Completion

                  </div>

                  <div
                    class="number">

                    ${
                      completionRate(
                        sprint
                      )
                      .toFixed(0)
                    }%

                  </div>

                `;


                container
                  .appendChild(
                    completion
                  );

              }


              // --------------------------------------------
              // Status chips
              // --------------------------------------------

              function renderStatuses(
                sprint
              ) {

                const row =
                  document
                  .getElementById(
                    "statusRow"
                  );


                row.innerHTML =
                  "";


                if (!cap("status")) {

                  row.classList.add(
                    "hidden"
                  );

                  return;

                }


                row.classList.remove(
                  "hidden"
                );


                projectData
                  .statuses
                  .forEach(
                    status => {

                      const issues =
                        statusIssues(
                          sprint,
                          status
                        );


                      const button =
                        document
                        .createElement(
                          "button"
                        );


                      button.className =
                        "status-chip";


                      button.innerHTML =
                        `${
                          escapeHtml(
                            status
                          )
                        }
                        <strong>
                          ${
                            issues.length
                          }
                        </strong>`;


                      button.onclick =
                        () =>
                          openDrilldown(
                            status,
                            sprint,
                            issues
                          );


                      row.appendChild(
                        button
                      );

                    }
                  );

              }


              // --------------------------------------------
              // Sprint Flow chart
              // --------------------------------------------

              const flowChart =
                new Chart(
                  document
                  .getElementById(
                    "flowChart"
                  ),
                  {

                    type:
                      "bar",

                    data: {

                      labels:
                        [],

                      datasets: [{

                        label:
                          "Issues",

                        data:
                          [],

                        backgroundColor:
                          "#2499e8",

                        borderWidth:
                          0

                      }]

                    },

                    options: {

                      responsive:
                        true,

                      maintainAspectRatio:
                        false,

                      resizeDelay:
                        100,

                      onClick(
                        event,
                        elements
                      ) {

                        if (
                          !elements.length
                        ) {

                          return;

                        }


                        const descriptor =
                          flowChart
                          ._descriptors[
                            elements[0]
                            .index
                          ];


                        if (!descriptor) {

                          return;

                        }


                        openDrilldown(
                          descriptor.label,
                          selectedSprint(),
                          descriptor.issues
                        );

                      }

                    }

                  }
                );


              function renderFlow(
                sprint
              ) {

                const card =
                  document
                  .getElementById(
                    "flowCard"
                  );


                if (!cap("status")) {

                  card.classList.add(
                    "hidden"
                  );

                  return;

                }


                card.classList.remove(
                  "hidden"
                );


                const descriptors = [

                  {
                    label:
                      "Opened",

                    issues:
                      openedIssues(
                        sprint
                      )
                  },

                  ...projectData
                  .statuses
                  .map(
                    status => ({

                      label:
                        status,

                      issues:
                        statusIssues(
                          sprint,
                          status
                        )

                    })
                  ),

                  {
                    label:
                      "Closed",

                    issues:
                      closedIssues(
                        sprint
                      )
                  }

                ];


                flowChart
                  ._descriptors =
                    descriptors;


                flowChart
                  .data
                  .labels =
                    descriptors
                    .map(
                      item =>
                        item.label
                    );


                flowChart
                  .data
                  .datasets[0]
                  .data =
                    descriptors
                    .map(
                      item =>
                        item.issues.length
                    );


                flowChart.update();

              }


              // --------------------------------------------
              // Type doughnut
              // --------------------------------------------

              const TYPE_COLORS = [

                "#2499e8",
                "#49b94f",
                "#0f5f98",
                "#7bc8f6",
                "#8fd694",
                "#506784",
                "#b8dff7",
                "#86a9c4",
                "#a7d9aa",
                "#36566f",
                "#5ab5ef",
                "#72c879"

              ];


              const typeChart =
                new Chart(
                  document
                  .getElementById(
                    "typeChart"
                  ),
                  {

                    type:
                      "doughnut",

                    data: {

                      labels:
                        [],

                      datasets: [{

                        data:
                          [],

                        backgroundColor:
                          [],

                        borderColor:
                          "#ffffff",

                        borderWidth:
                          2

                      }]

                    },

                    options: {

                      responsive:
                        true,

                      maintainAspectRatio:
                        false,

                      resizeDelay:
                        100,

                      cutout:
                        "58%",

                      plugins: {

                        legend: {

                          position:
                            "bottom"

                        }

                      },

                      onClick(
                        event,
                        elements
                      ) {

                        if (
                          !elements.length
                        ) {

                          return;

                        }


                        const type =
                          typeChart
                          .data
                          .labels[
                            elements[0]
                            .index
                          ];


                        const sprint =
                          selectedSprint();


                        const issues =
                          workedIssues(
                            sprint
                          )
                          .filter(
                            issue =>
                              issue.issueType
                              ===
                              type
                          );


                        openDrilldown(
                          type,
                          sprint,
                          issues
                        );

                      }

                    }

                  }
                );


              function renderType(
                sprint
              ) {

                const counts =
                  {};


                workedIssues(
                  sprint
                )
                .forEach(
                  issue => {

                    const type =
                      issue.issueType
                      ||
                      "Unspecified";


                    counts[type] =
                      (
                        counts[type]
                        ||
                        0
                      )
                      +
                      1;

                  }
                );


                const breakdown =
                  Object
                  .entries(
                    counts
                  )
                  .sort(
                    (
                      a,
                      b
                    ) =>
                      b[1]
                      -
                      a[1]
                  );


                typeChart
                  .data
                  .labels =
                    breakdown
                    .map(
                      item =>
                        item[0]
                    );


                typeChart
                  .data
                  .datasets[0]
                  .data =
                    breakdown
                    .map(
                      item =>
                        item[1]
                    );


                typeChart
                  .data
                  .datasets[0]
                  .backgroundColor =
                    breakdown
                    .map(
                      (
                        item,
                        index
                      ) =>
                        TYPE_COLORS[
                          index
                          %
                          TYPE_COLORS.length
                        ]
                    );


                typeChart.update();

              }


              // --------------------------------------------
              // Size chart — only if project has Size
              // --------------------------------------------

              const sizeChart =
                new Chart(
                  document
                  .getElementById(
                    "sizeChart"
                  ),
                  {

                    type:
                      "bar",

                    data: {

                      labels:
                        [],

                      datasets: [{

                        label:
                          "Issues",

                        data:
                          [],

                        backgroundColor:
                          "#2499e8",

                        borderWidth:
                          0

                      }]

                    },

                    options: {

                      responsive:
                        true,

                      maintainAspectRatio:
                        false,

                      resizeDelay:
                        100

                    }

                  }
                );


              function renderSize(
                sprint
              ) {

                const card =
                  document
                  .getElementById(
                    "sizeCard"
                  );


                if (!cap("size")) {

                  card.classList.add(
                    "hidden"
                  );

                  return;

                }


                card.classList.remove(
                  "hidden"
                );


                const counts =
                  {};


                projectData
                  .sizes
                  .forEach(
                    size => {

                      counts[size] =
                        0;

                    }
                  );


                workedIssues(
                  sprint
                )
                .forEach(
                  issue => {

                    const size =
                      issue.size
                      ||
                      "Unspecified";


                    counts[size] =
                      (
                        counts[size]
                        ||
                        0
                      )
                      +
                      1;

                  }
                );


                sizeChart
                  .data
                  .labels =
                    Object.keys(
                      counts
                    );


                sizeChart
                  .data
                  .datasets[0]
                  .data =
                    Object.values(
                      counts
                    );


                sizeChart.update();

              }


              // --------------------------------------------
              // LOE analytics — only if numeric LOE exists
              // --------------------------------------------

              function renderLoe(
                sprint
              ) {

                const card =
                  document
                  .getElementById(
                    "loeCard"
                  );


                if (!cap("loe")) {

                  card.classList.add(
                    "hidden"
                  );

                  return;

                }


                card.classList.remove(
                  "hidden"
                );


                const committed =
                  committedIssues(
                    sprint
                  );


                const carried =
                  carriedOverIssues(
                    sprint
                  );


                const added =
                  addedIssues(
                    sprint
                  );


                const removed =
                  removedIssues(
                    sprint
                  );


                const closed =
                  closedIssues(
                    sprint
                  );


                const metrics = [

                  [
                    "Committed",
                    sumLoe(
                      committed
                    )
                  ],

                  [
                    "Carried Over",
                    sumLoe(
                      carried
                    )
                  ],

                  [
                    "Added",
                    sumLoe(
                      added
                    )
                  ],

                  [
                    "Removed",
                    sumLoe(
                      removed
                    )
                  ],

                  [
                    "Closed",
                    sumLoe(
                      closed
                    )
                  ]

                ];


                const container =
                  document
                  .getElementById(
                    "loeKpis"
                  );


                container.innerHTML =
                  "";


                metrics.forEach(
                  (
                    [
                      label,
                      value
                    ]
                  ) => {

                    const item =
                      document
                      .createElement(
                        "div"
                      );


                    item.className =
                      "card";


                    item.innerHTML = `

                      <div
                        class="label">

                        ${
                          escapeHtml(
                            label
                          )
                        }

                      </div>

                      <div
                        class="number">

                        ${
                          formatDays(
                            value
                          )
                        }

                      </div>

                    `;


                    container
                      .appendChild(
                        item
                      );

                  }
                );

              }


              // --------------------------------------------
              // Priority table — hidden if no Priority
              // --------------------------------------------

              function renderPriority(
                sprint
              ) {

                const card =
                  document
                  .getElementById(
                    "priorityCard"
                  );


                if (
                  !cap("priority")
                  ||
                  !cap("status")
                ) {

                  card.classList.add(
                    "hidden"
                  );

                  return;

                }


                card.classList.remove(
                  "hidden"
                );


                const header =
                  document
                  .getElementById(
                    "priorityHeader"
                  );


                header.innerHTML =
                  "";


                const headings = [

                  "Priority",

                  "Opened",

                  ...projectData
                  .statuses,

                  "Closed"

                ];


                headings.forEach(
                  heading => {

                    const th =
                      document
                      .createElement(
                        "th"
                      );


                    th.textContent =
                      heading;


                    header.appendChild(
                      th
                    );

                  }
                );


                const body =
                  document
                  .getElementById(
                    "priorityRows"
                  );


                body.innerHTML =
                  "";


                projectData
                  .priorities
                  .forEach(
                    priority => {

                      const row =
                        document
                        .createElement(
                          "tr"
                        );


                      const first =
                        document
                        .createElement(
                          "td"
                        );


                      first.textContent =
                        priority;


                      row.appendChild(
                        first
                      );


                      function metric(
                        issues
                      ) {

                        const td =
                          document
                          .createElement(
                            "td"
                          );


                        td.className =
                          "metric-cell";


                        td.textContent =
                          issues.length;


                        td.onclick =
                          () =>
                            openDrilldown(
                              priority,
                              sprint,
                              issues
                            );


                        row.appendChild(
                          td
                        );

                      }


                      metric(
                        openedIssues(
                          sprint,
                          priority
                        )
                      );


                      projectData
                        .statuses
                        .forEach(
                          status => {

                            metric(
                              statusIssues(
                                sprint,
                                status,
                                priority
                              )
                            );

                          }
                        );


                      metric(
                        closedIssues(
                          sprint,
                          priority
                        )
                      );


                      body.appendChild(
                        row
                      );

                    }
                  );

              }


              // --------------------------------------------
              // Drilldown
              //
              // Optional columns appear based on capability.
              // --------------------------------------------

              function openDrilldown(
                title,
                sprint,
                issues
              ) {

                document
                  .getElementById(
                    "drilldownTitle"
                  )
                  .textContent =
                    title;


                document
                  .getElementById(
                    "drilldownSubtitle"
                  )
                  .textContent =
                    `${sprint.name} · ` +
                    `${issues.length} issues`;


                const columns = [

                  {
                    label:
                      "Issue",

                    render:
                      issue =>
                        `
                        <a
                          class="issue-link"
                          href="${
                            escapeHtml(
                              issue.url
                            )
                          }"
                          target="_blank">

                          ${
                            escapeHtml(
                              issue.repository
                            )
                          }#${
                            issue.number
                          }

                        </a>
                        `
                  },

                  {
                    label:
                      "Title",

                    className:
                      "title-column",

                    render:
                      issue =>
                        escapeHtml(
                          issue.title
                        )
                  },

                  {
                    label:
                      "Type",

                    render:
                      issue =>
                        escapeHtml(
                          issue.issueType
                        )
                  }

                ];


                if (cap("priority")) {

                  columns.push({

                    label:
                      "Priority",

                    render:
                      issue =>
                        escapeHtml(
                          issue.priority
                        )

                  });

                }


                if (cap("size")) {

                  columns.push({

                    label:
                      "Size",

                    render:
                      issue =>
                        escapeHtml(
                          issue.size
                          ||
                          ""
                        )

                  });

                }


                if (cap("loe")) {

                  columns.push({

                    label:
                      "LOE",

                    render:
                      issue =>
                        (
                          issue.loe
                          ===
                          null
                          ||
                          issue.loe
                          ===
                          undefined
                          ?
                          ""
                          :
                          formatDays(
                            issue.loe
                          )
                        )

                  });

                }


                columns.push({

                  label:
                    "Sprint Entry",

                  render:
                    issue => {

                      const entry =
                        latestEntry(
                          issue,
                          sprint
                        );


                      if (!entry) {

                        return "";

                      }


                      return (
                        entry.from
                        ===
                        "Backlog"
                        ?
                        (
                          entry.date
                          >
                          sprint.start
                          ?
                          "Added"
                          :
                          "Committed"
                        )
                        :
                        "Carryover"
                      );

                    }

                });


                columns.push({

                  label:
                    "Carried From",

                  render:
                    issue => {

                      const entry =
                        latestEntry(
                          issue,
                          sprint
                        );


                      if (
                        !entry
                        ||
                        entry.from
                        ===
                        "Backlog"
                      ) {

                        return "";

                      }


                      return escapeHtml(
                        entry.from
                      );

                    }

                });


                columns.push({

                  label:
                    "Open Date",

                  render:
                    issue =>
                      escapeHtml(
                        issue.opened
                        ||
                        ""
                      )

                });


                if (cap("status")) {

                  projectData
                    .statuses
                    .forEach(
                      status => {

                        columns.push({

                          label:
                            status,

                          render:
                            issue =>
                              statusDates(
                                issue,
                                status
                              )
                              .map(
                                escapeHtml
                              )
                              .join(
                                "<br>"
                              )

                        });

                      }
                    );

                }


                columns.push({

                  label:
                    "Close Date",

                  render:
                    issue =>
                      escapeHtml(
                        issue.closed
                        ||
                        ""
                      )

                });


                const header =
                  document
                  .getElementById(
                    "drilldownHeader"
                  );


                header.innerHTML =
                  "";


                columns.forEach(
                  column => {

                    const th =
                      document
                      .createElement(
                        "th"
                      );


                    th.textContent =
                      column.label;


                    header.appendChild(
                      th
                    );

                  }
                );


                const body =
                  document
                  .getElementById(
                    "drilldownRows"
                  );


                body.innerHTML =
                  "";


                issues.forEach(
                  issue => {

                    const row =
                      document
                      .createElement(
                        "tr"
                      );


                    columns.forEach(
                      column => {

                        const td =
                          document
                          .createElement(
                            "td"
                          );


                        if (
                          column.className
                        ) {

                          td.className =
                            column.className;

                        }


                        td.innerHTML =
                          column.render(
                            issue
                          );


                        row.appendChild(
                          td
                        );

                      }
                    );


                    body.appendChild(
                      row
                    );

                  }
                );


                document
                  .getElementById(
                    "drilldownBackdrop"
                  )
                  .classList
                  .remove(
                    "hidden"
                  );

              }


              function closeDrilldown() {

                document
                  .getElementById(
                    "drilldownBackdrop"
                  )
                  .classList
                  .add(
                    "hidden"
                  );

              }


              document
                .getElementById(
                  "closeDrilldown"
                )
                .onclick =
                  closeDrilldown;


              document
                .getElementById(
                  "drilldownBackdrop"
                )
                .addEventListener(
                  "click",
                  event => {

                    if (
                      event.target.id
                      ===
                      "drilldownBackdrop"
                    ) {

                      closeDrilldown();

                    }

                  }
                );


              // --------------------------------------------
              // Main render
              // --------------------------------------------

              function render() {

                const sprint =
                  selectedSprint();


                if (!sprint) {

                  return;

                }


                renderHeadlineKpis(
                  sprint
                );


                renderStatuses(
                  sprint
                );


                renderFlow(
                  sprint
                );


                renderType(
                  sprint
                );


                renderSize(
                  sprint
                );


                renderLoe(
                  sprint
                );


                renderPriority(
                  sprint
                );

              }


              // --------------------------------------------
              // Project loading
              // --------------------------------------------

              function loadProject(
                project
              ) {

                fetch(
                  `data/${project.slug}.json?v=${cacheVersion}`,
                  {
                    cache:
                      "no-store"
                  }
                )

                .then(
                  response =>
                    response.json()
                )

                .then(
                  data => {

                    projectData =
                      data;


                    const sprintSelect =
                      document
                      .getElementById(
                        "sprintSelect"
                      );


                    sprintSelect.innerHTML =
                      "";


                    if (
                      !cap("sprint")
                      ||
                      !data.sprints.length
                    ) {

                      const option =
                        document
                        .createElement(
                          "option"
                        );


                      option.textContent =
                        "No Sprint field";


                      sprintSelect
                        .appendChild(
                          option
                        );


                      return;

                    }


                    data.sprints
                      .forEach(
                        (
                          sprint,
                          index
                        ) => {

                          const option =
                            document
                            .createElement(
                              "option"
                            );


                          option.value =
                            index;


                          option.textContent =
                            `${sprint.name} · ` +
                            `${sprint.start} – ` +
                            `${sprint.end}`;


                          sprintSelect
                            .appendChild(
                              option
                            );

                        }
                      );


                    const today =
                      new Date()
                      .toISOString()
                      .slice(
                        0,
                        10
                      );


                    const current =
                      data.sprints
                      .findIndex(
                        sprint =>
                          today
                          >=
                          sprint.start
                          &&
                          today
                          <=
                          sprint.end
                      );


                    sprintSelect.value =
                      current
                      >=
                      0
                      ?
                      current
                      :
                      Math.max(
                        data.sprints.length
                        -
                        1,
                        0
                      );


                    render();

                  }
                );

              }


              // --------------------------------------------
              // Project discovery
              // --------------------------------------------

              fetch(
                `data/projects.json?v=${cacheVersion}`,
                {
                  cache:
                    "no-store"
                }
              )

              .then(
                response =>
                  response.json()
              )

              .then(
                projects => {

                  const select =
                    document
                    .getElementById(
                      "projectSelect"
                    );


                  projects.forEach(
                    (
                      project,
                      index
                    ) => {

                      const option =
                        document
                        .createElement(
                          "option"
                        );


                      option.value =
                        index;


                      option.textContent =
                        `${project.title} ` +
                        `(${project.issueCount} issues)`;


                      select.appendChild(
                        option
                      );

                    }
                  );


                  if (projects.length) {

                    loadProject(
                      projects[0]
                    );

                  }


                  select.addEventListener(
                    "change",
                    event => {

                      loadProject(
                        projects[
                          Number(
                            event.target.value
                          )
                        ]
                      );

                    }
                  );

                }
              );


              document
                .getElementById(
                  "sprintSelect"
                )
                .addEventListener(
                  "change",
                  render
                );


              let resizeTimer =
                null;


              window.addEventListener(
                "resize",
                () => {

                  clearTimeout(
                    resizeTimer
                  );


                  resizeTimer =
                    setTimeout(
                      () => {

                        flowChart.resize();
                        typeChart.resize();
                        sizeChart.resize();

                      },
                      150
                    );

                }
              );

            </script>


          </body>

          </html>
          EOF


      - name: Verify dashboard

        run: |
          echo "Checking generated dashboard..."

          grep -q "Sprint Analytics" site/index.html
          grep -q "capabilities" site/index.html
          grep -q "Carried Over" site/index.html
          grep -q "Work by Type" site/index.html
          grep -q "Work by Size" site/index.html
          grep -q "LOE" site/index.html

          echo
          echo "Generated project data:"
          ls -la site/data

          echo
          echo "Projects:"
          cat site/data/projects.json


      - name: Upload Pages artifact

        uses:
          actions/upload-pages-artifact@v3

        with:
          path: ./site


  deploy:

    environment:

      name:
        github-pages

      url:
        ${{ steps.deployment.outputs.page_url }}


    runs-on:
      ubuntu-latest


    needs:
      build


    steps:

      - name: Deploy Pages

        id:
          deployment

        uses:
          actions/deploy-pages@v4
