name: Sprint Analytics

on:
  workflow_dispatch:

  schedule:
    # 12:00 UTC = 8:00 AM EDT / 7:00 AM EST
    - cron: "0 12 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true


jobs:

  build:
    runs-on: ubuntu-latest

    env:
      ORG: ${{ github.repository_owner }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Generate GitHub App token
        id: app-token

        uses: actions/create-github-app-token@v3

        with:
          app-id: ${{ secrets.ACTIONS_APP_ID }}
          private-key: ${{ secrets.ACTIONS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}


      - name: Configure Pages
        uses: actions/configure-pages@v5


      - name: Build dashboard data

        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

        shell: bash

        run: |

          set -euo pipefail

          mkdir -p site/data


          python3 <<'PY'

          import json
          import os
          import re
          import subprocess

          from datetime import datetime, timedelta
          from pathlib import Path


          ORG = os.environ["ORG"]


          SPRINT_PATTERN = re.compile(
              r"<!--\s*sprint-tracker:\s*(.*?)\s*->\s*(.*?)\s*-->",
              re.IGNORECASE,
          )


          # ==================================================
          # Command helpers
          # ==================================================

          def run_json(cmd):

              result = subprocess.run(
                  cmd,
                  check=True,
                  capture_output=True,
                  text=True,
              )

              return json.loads(
                  result.stdout
              )


          def graphql(
              query,
              variables=None,
          ):

              variables = (
                  variables
                  or {}
              )

              cmd = [
                  "gh",
                  "api",
                  "graphql",
                  "-f",
                  f"query={query}",
              ]


              for key, value in (
                  variables.items()
              ):

                  if value is not None:

                      cmd.extend([
                          "-F",
                          f"{key}={value}",
                      ])


              return run_json(
                  cmd
              )


          # ==================================================
          # GraphQL
          # ==================================================

          PROJECTS_QUERY = """
          query($org: String!) {

            organization(login: $org) {

              projectsV2(first: 100) {

                nodes {
                  number
                  title
                  shortDescription
                  closed
                  url
                }

              }

            }

          }
          """


          PROJECT_QUERY = """
          query(
            $org: String!,
            $number: Int!,
            $cursor: String
          ) {

            organization(login: $org) {

              projectV2(number: $number) {

                number
                title
                shortDescription
                url


                fields(first: 100) {

                  nodes {

                    __typename


                    ... on ProjectV2Field {

                      name
                      dataType

                    }


                    ... on ProjectV2SingleSelectField {

                      name
                      dataType

                      options {
                        name
                      }

                    }


                    ... on ProjectV2IterationField {

                      name
                      dataType

                      configuration {

                        iterations {
                          title
                          startDate
                          duration
                        }

                        completedIterations {
                          title
                          startDate
                          duration
                        }

                      }

                    }

                  }

                }


                items(
                  first: 100,
                  after: $cursor
                ) {

                  pageInfo {
                    hasNextPage
                    endCursor
                  }


                  nodes {

                    fieldValues(first: 100) {

                      nodes {

                        __typename


                        ... on ProjectV2ItemFieldSingleSelectValue {

                          name

                          field {
                            ... on ProjectV2FieldCommon {
                              name
                            }
                          }

                        }


                        ... on ProjectV2ItemFieldNumberValue {

                          number

                          field {
                            ... on ProjectV2FieldCommon {
                              name
                            }
                          }

                        }


                        ... on ProjectV2ItemFieldIterationValue {

                          title
                          startDate
                          duration

                          field {
                            ... on ProjectV2FieldCommon {
                              name
                            }
                          }

                        }


                        ... on ProjectV2ItemFieldDateValue {

                          date

                          field {
                            ... on ProjectV2FieldCommon {
                              name
                            }
                          }

                        }


                        ... on ProjectV2ItemFieldTextValue {

                          text

                          field {
                            ... on ProjectV2FieldCommon {
                              name
                            }
                          }

                        }

                      }

                    }


                    content {

                      ... on Issue {

                        number
                        title
                        state
                        createdAt
                        closedAt
                        url


                        repository {
                          nameWithOwner
                        }


                        issueType {
                          name
                        }


                        issueFieldValues(first: 30) {

                          nodes {

                            ... on IssueFieldSingleSelectValue {

                              name

                              field {

                                ... on IssueFieldSingleSelect {
                                  name
                                }

                              }

                            }

                          }

                        }

                      }

                    }

                  }

                }

              }

            }

          }
          """


          STATUS_QUERY = """
          query(
            $owner: String!,
            $repo: String!,
            $number: Int!
          ) {

            repository(
              owner: $owner,
              name: $repo
            ) {

              issue(number: $number) {

                timelineItems(
                  first: 250,
                  itemTypes: [
                    PROJECT_V2_ITEM_STATUS_CHANGED_EVENT
                  ]
                ) {

                  nodes {

                    ... on ProjectV2ItemStatusChangedEvent {

                      createdAt
                      previousStatus
                      status

                      project {
                        number
                      }

                    }

                  }

                }

              }

            }

          }
          """


          # ==================================================
          # Field helpers
          # ==================================================

          def normalize(value):

              return re.sub(
                  r"[^a-z0-9]+",
                  " ",
                  str(
                      value
                      or ""
                  ).lower(),
              ).strip()


          def find_field(
              fields,
              aliases,
              data_type=None,
          ):

              aliases = {
                  normalize(alias)
                  for alias in aliases
              }


              for field in fields:

                  if (
                      normalize(
                          field.get(
                              "name"
                          )
                      )
                      not in aliases
                  ):

                      continue


                  if (
                      data_type
                      and
                      field.get(
                          "dataType"
                      )
                      !=
                      data_type
                  ):

                      continue


                  return field


              return None


          def find_sprint_field(
              fields
          ):

              field = find_field(
                  fields,
                  [
                      "Sprint",
                      "Iteration",
                  ],
                  "ITERATION",
              )


              if field:

                  return field


              for candidate in fields:

                  if (
                      candidate.get(
                          "dataType"
                      )
                      ==
                      "ITERATION"
                  ):

                      return candidate


              return None


          def project_values(item):

              output = {}


              for value in (
                  item
                  .get(
                      "fieldValues",
                      {},
                  )
                  .get(
                      "nodes",
                      [],
                  )
              ):

                  field = (
                      value.get(
                          "field"
                      )
                      or {}
                  )

                  name = field.get(
                      "name"
                  )


                  if not name:

                      continue


                  typename = (
                      value.get(
                          "__typename"
                      )
                  )


                  if (
                      typename
                      ==
                      "ProjectV2ItemFieldSingleSelectValue"
                  ):

                      output[name] = (
                          value.get(
                              "name"
                          )
                      )


                  elif (
                      typename
                      ==
                      "ProjectV2ItemFieldNumberValue"
                  ):

                      output[name] = (
                          value.get(
                              "number"
                          )
                      )


                  elif (
                      typename
                      ==
                      "ProjectV2ItemFieldIterationValue"
                  ):

                      output[name] = (
                          value.get(
                              "title"
                          )
                      )


                  elif (
                      typename
                      ==
                      "ProjectV2ItemFieldDateValue"
                  ):

                      output[name] = (
                          value.get(
                              "date"
                          )
                      )


                  elif (
                      typename
                      ==
                      "ProjectV2ItemFieldTextValue"
                  ):

                      output[name] = (
                          value.get(
                              "text"
                          )
                      )


              return output


          def issue_values(issue):

              output = {}


              for value in (
                  issue
                  .get(
                      "issueFieldValues",
                      {},
                  )
                  .get(
                      "nodes",
                      [],
                  )
              ):

                  field = (
                      value.get(
                          "field"
                      )
                      or {}
                  )

                  name = field.get(
                      "name"
                  )


                  if not name:

                      continue


                  output[name] = (
                      value.get(
                          "name"
                      )
                  )


              return output


          def semantic_value(
              values,
              aliases,
          ):

              aliases = {
                  normalize(alias)
                  for alias in aliases
              }


              for name, value in (
                  values.items()
              ):

                  if (
                      normalize(name)
                      in aliases
                  ):

                      return value


              return None


          # ==================================================
          # GitHub issue history
          # ==================================================

          status_cache = {}
          comment_cache = {}


          def get_status_events(
              repository,
              number,
          ):

              key = (
                  f"{repository}"
                  f"#{number}"
              )


              if key in status_cache:

                  return status_cache[
                      key
                  ]


              owner, repo = (
                  repository.split(
                      "/",
                      1,
                  )
              )


              result = graphql(
                  STATUS_QUERY,
                  {
                      "owner":
                          owner,

                      "repo":
                          repo,

                      "number":
                          number,
                  },
              )


              issue = (
                  result
                  .get(
                      "data",
                      {},
                  )
                  .get(
                      "repository",
                      {},
                  )
                  .get(
                      "issue"
                  )
              )


              if issue:

                  nodes = (
                      issue
                      .get(
                          "timelineItems",
                          {},
                      )
                      .get(
                          "nodes",
                          [],
                      )
                  )

              else:

                  nodes = []


              status_cache[key] = (
                  nodes
              )


              return nodes


          def get_issue_comments(
              repository,
              number,
          ):

              key = (
                  f"{repository}"
                  f"#{number}"
              )


              if key in comment_cache:

                  return comment_cache[
                      key
                  ]


              # IMPORTANT:
              #
              # Explicit GET is required because passing -f
              # parameters can otherwise make gh api choose
              # POST automatically.
              #
              # --paginate makes historical tracking safe if
              # an issue eventually exceeds 100 comments.

              result = subprocess.run(
                  [
                      "gh",
                      "api",
                      "--method",
                      "GET",
                      "--paginate",
                      "--slurp",
                      f"repos/{repository}/issues/{number}/comments",
                      "-f",
                      "per_page=100",
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              )


              pages = json.loads(
                  result.stdout
              )


              comments = []


              for page in pages:

                  if isinstance(
                      page,
                      list,
                  ):

                      comments.extend(
                          page
                      )


              comment_cache[key] = (
                  comments
              )


              return comments


          def parse_sprint_transitions(
              comments
          ):

              transitions = []


              for comment in comments:

                  body = (
                      comment.get(
                          "body"
                      )
                      or ""
                  )


                  created_at = (
                      comment.get(
                          "created_at"
                      )
                  )


                  if not created_at:

                      continue


                  for match in (
                      SPRINT_PATTERN
                      .finditer(
                          body
                      )
                  ):

                      transitions.append({

                          "from":
                              match
                              .group(1)
                              .strip(),

                          "to":
                              match
                              .group(2)
                              .strip(),

                          "date":
                              created_at[
                                  :10
                              ],

                          "createdAt":
                              created_at,

                      })


              transitions.sort(
                  key=lambda event:
                      event[
                          "createdAt"
                      ]
              )


              return transitions


          # ==================================================
          # Discover Projects
          # ==================================================

          projects_result = graphql(
              PROJECTS_QUERY,
              {
                  "org":
                      ORG,
              },
          )


          projects = [

              project

              for project in (
                  projects_result[
                      "data"
                  ][
                      "organization"
                  ][
                      "projectsV2"
                  ][
                      "nodes"
                  ]
              )

              if not project[
                  "closed"
              ]

          ]


          print(
              f"Found "
              f"{len(projects)} "
              f"open projects"
          )


          # ==================================================
          # Build one project
          # ==================================================

          def load_project(project):

              cursor = None

              raw_items = []

              raw_field_nodes = []

              metadata = None


              while True:

                  result = graphql(
                      PROJECT_QUERY,
                      {
                          "org":
                              ORG,

                          "number":
                              project[
                                  "number"
                              ],

                          "cursor":
                              cursor,
                      },
                  )


                  pv2 = (
                      result[
                          "data"
                      ][
                          "organization"
                      ][
                          "projectV2"
                      ]
                  )


                  if metadata is None:

                      metadata = {

                          "number":
                              pv2[
                                  "number"
                              ],

                          "title":
                              pv2[
                                  "title"
                              ],

                          "description":
                              (
                                  pv2.get(
                                      "shortDescription"
                                  )
                                  or ""
                              ),

                          "url":
                              pv2[
                                  "url"
                              ],

                      }


                      raw_field_nodes = (
                          pv2[
                              "fields"
                          ][
                              "nodes"
                          ]
                      )


                  connection = (
                      pv2[
                          "items"
                      ]
                  )


                  raw_items.extend(
                      connection[
                          "nodes"
                      ]
                  )


                  if not (
                      connection[
                          "pageInfo"
                      ][
                          "hasNextPage"
                      ]
                  ):

                      break


                  cursor = (
                      connection[
                          "pageInfo"
                      ][
                          "endCursor"
                      ]
                  )


              # ==============================================
              # Project fields
              # ==============================================

              fields = []


              for raw in (
                  raw_field_nodes
              ):

                  fields.append({

                      "name":
                          raw.get(
                              "name"
                          ),

                      "dataType":
                          raw.get(
                              "dataType"
                          ),

                      "kind":
                          raw.get(
                              "__typename"
                          ),

                      "options":
                          [
                              option[
                                  "name"
                              ]

                              for option in (
                                  raw.get(
                                      "options",
                                      [],
                                  )
                              )
                          ],

                  })


              status_field = find_field(
                  fields,
                  [
                      "Status",
                  ],
                  "SINGLE_SELECT",
              )


              sprint_field = (
                  find_sprint_field(
                      fields
                  )
              )


              priority_field = find_field(
                  fields,
                  [
                      "Priority",
                      "Initial Priority",
                  ],
                  "SINGLE_SELECT",
              )


              size_field = find_field(
                  fields,
                  [
                      "Size",
                      "T-Shirt Size",
                      "T Shirt Size",
                      "Tshirt Size",
                      "Shirt Size",
                  ],
                  "SINGLE_SELECT",
              )


              loe_field = find_field(
                  fields,
                  [
                      "LOE",
                      "Level of Effort",
                      "Effort Days",
                      "Estimated Days",
                  ],
                  "NUMBER",
              )


              # ==============================================
              # Sprint definitions
              # ==============================================

              sprints = {}


              if sprint_field:

                  raw_sprint_field = next(
                      (
                          raw

                          for raw in (
                              raw_field_nodes
                          )

                          if (
                              raw.get(
                                  "name"
                              )
                              ==
                              sprint_field[
                                  "name"
                              ]
                          )
                      ),
                      None,
                  )


                  if raw_sprint_field:

                      config = (
                          raw_sprint_field
                          .get(
                              "configuration"
                          )
                          or {}
                      )


                      iterations = (
                          config.get(
                              "completedIterations",
                              [],
                          )
                          +
                          config.get(
                              "iterations",
                              [],
                          )
                      )


                      for sprint in (
                          iterations
                      ):

                          start = (
                              sprint[
                                  "startDate"
                              ]
                          )


                          duration = int(
                              sprint[
                                  "duration"
                              ]
                          )


                          end = (
                              datetime
                              .fromisoformat(
                                  start
                              )
                              +
                              timedelta(
                                  days=
                                      duration
                                      -
                                      1
                              )
                          ).date().isoformat()


                          sprints[
                              sprint[
                                  "title"
                              ]
                          ] = {

                              "name":
                                  sprint[
                                      "title"
                                  ],

                              "start":
                                  start,

                              "end":
                                  end,

                              "duration":
                                  duration,

                          }


              # ==============================================
              # Issues
              # ==============================================

              issues = []

              observed_priorities = set()

              observed_sizes = set()


              for item in (
                  raw_items
              ):

                  issue = (
                      item.get(
                          "content"
                      )
                  )


                  if (
                      not issue
                      or
                      not issue.get(
                          "number"
                      )
                  ):

                      continue


                  repository = (
                      issue
                      .get(
                          "repository",
                          {},
                      )
                      .get(
                          "nameWithOwner"
                      )
                  )


                  if not repository:

                      continue


                  pv = (
                      project_values(
                          item
                      )
                  )


                  iv = (
                      issue_values(
                          issue
                      )
                  )


                  # ------------------------------------------
                  # Priority
                  # ------------------------------------------

                  priority = semantic_value(
                      iv,
                      [
                          "Priority",
                          "Initial Priority",
                      ],
                  )


                  if priority is None:

                      priority = semantic_value(
                          pv,
                          [
                              "Priority",
                              "Initial Priority",
                          ],
                      )


                  if priority is None:

                      priority = (
                          "Unspecified"
                      )


                  observed_priorities.add(
                      str(
                          priority
                      )
                  )


                  # ------------------------------------------
                  # Size
                  # ------------------------------------------

                  size = semantic_value(
                      pv,
                      [
                          "Size",
                          "T-Shirt Size",
                          "T Shirt Size",
                          "Tshirt Size",
                          "Shirt Size",
                      ],
                  )


                  if size is not None:

                      observed_sizes.add(
                          str(size)
                      )


                  # ------------------------------------------
                  # LOE
                  # ------------------------------------------

                  loe = semantic_value(
                      pv,
                      [
                          "LOE",
                          "Level of Effort",
                          "Effort Days",
                          "Estimated Days",
                      ],
                  )


                  # ------------------------------------------
                  # Current Sprint
                  #
                  # Debug / validation only.
                  # Historical KPIs do NOT use this value.
                  # ------------------------------------------

                  current_sprint = None


                  if sprint_field:

                      current_sprint = (
                          pv.get(
                              sprint_field[
                                  "name"
                              ]
                          )
                      )


                  issues.append({

                      "number":
                          issue[
                              "number"
                          ],

                      "repository":
                          repository,

                      "title":
                          issue[
                              "title"
                          ],

                      "url":
                          issue[
                              "url"
                          ],

                      "state":
                          issue[
                              "state"
                          ],

                      "issueType":
                          (
                              (
                                  issue.get(
                                      "issueType"
                                  )
                                  or {}
                              )
                              .get(
                                  "name"
                              )
                              or
                              "Unspecified"
                          ),

                      "priority":
                          priority,

                      "size":
                          size,

                      "loe":
                          loe,

                      "currentSprint":
                          current_sprint,

                      "opened":
                          issue[
                              "createdAt"
                          ][
                              :10
                          ],

                      "closed":
                          (
                              issue[
                                  "closedAt"
                              ][
                                  :10
                              ]

                              if issue[
                                  "closedAt"
                              ]

                              else None
                          ),

                      "statusEvents":
                          [],

                      "sprintTransitions":
                          [],

                  })


              # ==============================================
              # Historical events
              # ==============================================

              for index, issue in enumerate(
                  issues,
                  start=1,
              ):

                  print(
                      f'Project '
                      f'{project["number"]}: '
                      f'[{index}/{len(issues)}] '
                      f'{issue["repository"]}'
                      f'#{issue["number"]} '
                      f'Priority='
                      f'{issue["priority"]} '
                      f'CurrentSprint='
                      f'{issue["currentSprint"]}'
                  )


                  try:

                      status_nodes = (
                          get_status_events(
                              issue[
                                  "repository"
                              ],
                              issue[
                                  "number"
                              ],
                          )
                      )


                      for event in (
                          status_nodes
                      ):

                          event_project = (
                              event.get(
                                  "project"
                              )
                              or {}
                          )


                          if (
                              event_project.get(
                                  "number"
                              )
                              !=
                              project[
                                  "number"
                              ]
                          ):

                              continue


                          status = (
                              event.get(
                                  "status"
                              )
                          )


                          created_at = (
                              event.get(
                                  "createdAt"
                              )
                          )


                          if (
                              not status
                              or
                              not created_at
                          ):

                              continue


                          issue[
                              "statusEvents"
                          ].append({

                              "status":
                                  status,

                              "date":
                                  created_at[
                                      :10
                                  ],

                          })


                      comments = (
                          get_issue_comments(
                              issue[
                                  "repository"
                              ],
                              issue[
                                  "number"
                              ],
                          )
                      )


                      issue[
                          "sprintTransitions"
                      ] = (
                          parse_sprint_transitions(
                              comments
                          )
                      )


                      issue[
                          "statusEvents"
                      ].sort(
                          key=lambda event:
                              event[
                                  "date"
                              ]
                      )


                      print(
                          "  Sprint history:",
                          [
                              (
                                  event[
                                      "from"
                                  ],
                                  event[
                                      "to"
                                  ],
                                  event[
                                      "date"
                                  ],
                              )

                              for event in (
                                  issue[
                                      "sprintTransitions"
                                  ]
                              )
                          ],
                      )


                  except Exception as exc:

                      print(
                          f'WARNING '
                          f'{issue["repository"]}'
                          f'#{issue["number"]}: '
                          f'{exc}'
                      )


              # ==============================================
              # Status list
              # ==============================================

              statuses = []


              if status_field:

                  statuses.extend(
                      status_field.get(
                          "options",
                          [],
                      )
                  )


              for issue in issues:

                  for event in (
                      issue[
                          "statusEvents"
                      ]
                  ):

                      status = (
                          event[
                              "status"
                          ]
                      )


                      if (
                          status
                          not in statuses
                      ):

                          statuses.append(
                              status
                          )


              # ==============================================
              # Priority list
              # ==============================================

              preferred_order = [
                  "PROD Critical",
                  "P0",
                  "P1",
                  "P2",
                  "P3",
                  "P4",
              ]


              project_priority_options = []


              if priority_field:

                  project_priority_options = (
                      priority_field
                      .get(
                          "options",
                          [],
                      )
                  )


              all_priorities = (
                  set(
                      project_priority_options
                  )
                  |
                  observed_priorities
              )


              priorities = []


              for priority in (
                  preferred_order
              ):

                  if (
                      priority
                      in all_priorities
                  ):

                      priorities.append(
                          priority
                      )


              for priority in sorted(
                  all_priorities
              ):

                  if (
                      priority
                      not in priorities
                  ):

                      priorities.append(
                          priority
                      )


              # ==============================================
              # Size list
              # ==============================================

              sizes = []


              if size_field:

                  sizes.extend(
                      size_field.get(
                          "options",
                          [],
                      )
                  )


              for size in sorted(
                  observed_sizes
              ):

                  if size not in sizes:

                      sizes.append(
                          size
                      )


              # ==============================================
              # Capabilities
              # ==============================================

              capabilities = {

                  "status": {
                      "available":
                          bool(
                              statuses
                          ),
                  },

                  "sprint": {
                      "available":
                          bool(
                              sprints
                          ),
                  },

                  "priority": {
                      "available":
                          any(
                              issue[
                                  "priority"
                              ]
                              !=
                              "Unspecified"

                              for issue in (
                                  issues
                              )
                          ),
                  },

                  "size": {
                      "available":
                          (
                              size_field
                              is not None
                              or
                              bool(
                                  observed_sizes
                              )
                          ),
                  },

                  "loe": {
                      "available":
                          (
                              loe_field
                              is not None
                              or
                              any(
                                  issue[
                                      "loe"
                                  ]
                                  is not None

                                  for issue in (
                                      issues
                                  )
                              )
                          ),
                  },

              }


              return {

                  "project":
                      metadata,

                  "fields":
                      fields,

                  "capabilities":
                      capabilities,

                  "sprints":
                      sorted(
                          sprints.values(),
                          key=lambda sprint:
                              sprint[
                                  "start"
                              ],
                      ),

                  "statuses":
                      statuses,

                  "priorities":
                      priorities,

                  "sizes":
                      sizes,

                  "issues":
                      issues,

              }


          # ==================================================
          # Write data
          # ==================================================

          project_index = []


          for project in projects:

              data = load_project(
                  project
              )


              slug = (
                  f'project-'
                  f'{project["number"]}'
              )


              Path(
                  f"site/data/"
                  f"{slug}.json"
              ).write_text(
                  json.dumps(
                      data,
                      indent=2,
                  )
              )


              project_index.append({

                  "number":
                      project[
                          "number"
                      ],

                  "title":
                      project[
                          "title"
                      ],

                  "description":
                      (
                          project.get(
                              "shortDescription"
                          )
                          or ""
                      ),

                  "slug":
                      slug,

                  "issueCount":
                      len(
                          data[
                              "issues"
                          ]
                      ),

                  "capabilities":
                      data[
                          "capabilities"
                      ],

              })


          Path(
              "site/data/projects.json"
          ).write_text(
              json.dumps(
                  project_index,
                  indent=2,
              )
          )


          print("")
          print(
              "Generated projects:"
          )

          print(
              json.dumps(
                  project_index,
                  indent=2,
              )
          )

          PY


