                  #172033;

                --text:
                  #172033;

                --muted:
                  #5f6b7a;

                --border:
                  #d7e0e7;

                --page-bg:
                  #f4f6f8;

              }


              * {
                box-sizing:
                  border-box;
              }


              html,
              body {
                width:
                  100%;

                min-height:
