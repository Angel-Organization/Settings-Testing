              // ===========================================
              // Drilldown
              // ===========================================

              function openDrilldown(
                title,
                sprint,
                issues
              ) {

                document.getElementById(
                  "drilldownTitle"
                ).textContent =
                  title;


                document.getElementById(
                  "drilldownSubtitle"
                ).textContent =
                  (
                    `${sprint.name} · `
                    +
                    `${issues.length} issue`
                    +
                    (
                      issues.length
                      ===
                      1
                      ?
                      ""
                      :
                      "s"
                    )
                  );


                const columns = [

                  {
                    label:
                      "Issue",

                    render:
                      issue =>
                        `
                        <a
                          class="issue-link"
                          href="${
                            escapeHtml(
                              issue.url
                            )
                          }"
                          target="_blank"
                          rel="noopener noreferrer">

                          ${
                            escapeHtml(
                              issue.repository
                            )
                          }#${
                            issue.number
                          }

                        </a>
                        `
                  },

                  {
                    label:
                      "Title",

                    className:
                      "title-column",

                    render:
                      issue =>
                        escapeHtml(
                          issue.title
                        )
                  },

                  {
                    label:
                      "Type",

                    render:
                      issue =>
                        escapeHtml(
                          issue.issueType
                        )
                  },

                  {
                    label:
                      "Priority",

                    render:
                      issue =>
                        escapeHtml(
                          issue.priority
                        )
                  }

                ];


                if (cap("size")) {

                  columns.push({

                    label:
                      "Size",

                    render:
                      issue =>
                        escapeHtml(
                          issue.size
                          ||
                          ""
                        )

                  });

                }


                if (cap("loe")) {

                  columns.push({

                    label:
                      "LOE",

                    render:
                      issue =>
                        (
                          issue.loe
                          ===
                          null
                          ||
                          issue.loe
                          ===
                          undefined
                          ?
                          ""
                          :
                          formatDays(
                            issue.loe
                          )
                        )

                  });

                }


                columns.push({

                  label:
                    "Sprint Entry",

                  render:
                    issue =>
                      escapeHtml(
                        sprintEntryLabel(
                          issue,
                          sprint
                        )
                      )

                });


                columns.push({

                  label:
                    "Carried From",

                  render:
                    issue =>
                      escapeHtml(
                        carriedFrom(
                          issue,
                          sprint
                        )
                      )

                });


                columns.push({

                  label:
                    "Open Date",

                  render:
                    issue =>
                      escapeHtml(
                        issue.opened
                        ||
                        ""
                      )

                });


                projectData
                  .statuses
                  .forEach(
                    status => {

                      columns.push({

                        label:
                          status,

                        render:
                          issue =>
                            statusDates(
                              issue,
                              status
                            )
                            .map(
                              escapeHtml
                            )
                            .join(
                              "<br>"
                            )

                      });

                    }
                  );


                columns.push({

                  label:
                    "Close Date",

                  render:
                    issue =>
                      escapeHtml(
                        issue.closed
                        ||
                        ""
                      )

                });


                const header =
                  document.getElementById(
                    "drilldownHeader"
                  );


                header.innerHTML =
                  "";


                columns.forEach(
                  column => {

                    const th =
                      document
                      .createElement(
                        "th"
                      );


                    th.textContent =
                      column.label;


                    header.appendChild(
                      th
                    );

                  }
                );


                const body =
                  document.getElementById(
                    "drilldownRows"
                  );


                body.innerHTML =
                  "";


                issues.forEach(
                  issue => {

                    const row =
                      document
                      .createElement(
                        "tr"
                      );


                    columns.forEach(
                      column => {

                        const td =
                          document
                          .createElement(
                            "td"
                          );


                        if (
                          column.className
                        ) {

                          td.className =
                            column.className;

                        }


                        td.innerHTML =
                          column.render(
                            issue
                          );


                        row.appendChild(
                          td
                        );

                      }
                    );


                    body.appendChild(
                      row
                    );

                  }
                );


                document.getElementById(
                  "drilldownBackdrop"
                )
                .classList
                .remove(
                  "hidden"
                );

              }


              function closeDrilldown() {

                document.getElementById(
                  "drilldownBackdrop"
                )
                .classList
                .add(
                  "hidden"
                );

              }


              document.getElementById(
                "closeDrilldown"
              )
              .onclick =
                closeDrilldown;


              document.getElementById(
                "drilldownBackdrop"
              )
              .addEventListener(
                "click",
                event => {

                  if (
                    event.target.id
                    ===
                    "drilldownBackdrop"
                  ) {

                    closeDrilldown();

                  }

                }
              );


              document.addEventListener(
                "keydown",
                event => {

                  if (
                    event.key
                    ===
                    "Escape"
                  ) {

                    closeDrilldown();

                  }

                }
              );


              // ===========================================
              // Render everything
              // ===========================================

              function renderAll() {

                const sprint =
                  selectedSprint();


                if (!sprint) {

                  return;

                }


                renderOverview(
                  sprint
                );


                renderFlow(
                  sprint
                );


                renderScope(
                  sprint
                );


                renderQuality(
                  sprint
                );

              }


              // ===========================================
              // Project loading
              // ===========================================

              function loadProject(
                project
              ) {

                fetch(
                  `data/${project.slug}.json?v=${cacheVersion}`,
                  {
                    cache:
                      "no-store"
                  }
                )

                .then(
                  response =>
                    response.json()
                )

                .then(
                  data => {

                    projectData =
                      data;


                    const sprintSelect =
                      document.getElementById(
                        "sprintSelect"
                      );


                    sprintSelect.innerHTML =
                      "";


                    data.sprints.forEach(
                      (
                        sprint,
                        index
                      ) => {

                        const option =
                          document
                          .createElement(
                            "option"
                          );


                        option.value =
                          index;


                        option.textContent =
                          (
                            `${sprint.name} · `
                            +
                            `${sprint.start} – `
                            +
                            `${sprint.end}`
                          );


                        sprintSelect.appendChild(
                          option
                        );

                      }
                    );


                    const today =
                      localToday();


                    let current =
                      data.sprints
                      .findIndex(
                        sprint =>
                          today >=
                          sprint.start
                          &&
                          today <=
                          sprint.end
                      );


                    if (current < 0) {

                      current =
                        Math.max(
                          data.sprints.length
                          -
                          1,
                          0
                        );

                    }


                    sprintSelect.value =
                      current;


                    renderAll();

                  }
                );

              }


              // ===========================================
              // Bootstrap
              // ===========================================

              fetch(
                `data/projects.json?v=${cacheVersion}`,
                {
                  cache:
                    "no-store"
                }
              )

              .then(
                response =>
                  response.json()
              )

              .then(
                projects => {

                  const select =
                    document.getElementById(
                      "projectSelect"
                    );


                  projects.forEach(
                    (
                      project,
                      index
                    ) => {

                      const option =
                        document
                        .createElement(
                          "option"
                        );


                      option.value =
                        index;


                      option.textContent =
                        (
                          `${project.title} `
                          +
                          `(${project.issueCount} issues)`
                        );


                      select.appendChild(
                        option
                      );

                    }
                  );


                  if (projects.length) {

                    loadProject(
                      projects[0]
                    );

                  }


                  select.addEventListener(
                    "change",
                    event => {

                      loadProject(
                        projects[
                          Number(
                            event.target.value
                          )
                        ]
                      );

                    }
                  );

                }
              );


              document.getElementById(
                "sprintSelect"
              )
              .addEventListener(
                "change",
                renderAll
              );


              let resizeTimer =
                null;


              window.addEventListener(
                "resize",
                () => {

                  clearTimeout(
                    resizeTimer
                  );


                  resizeTimer =
                    setTimeout(
                      () => {

                        flowChart.resize();
                        typeChart.resize();

                      },
                      150
                    );

                }
              );

            </script>

          </body>

          </html>

          EOF


      - name: Verify dashboard

        run: |

          echo "Checking dashboard..."

          grep -q "Sprint Analytics" site/index.html
          grep -q "Overview" site/index.html
          grep -q "Scope &amp; Carryover" site/index.html
          grep -q "Flow by Priority" site/index.html
          grep -q "Added Late" site/index.html
          grep -q "Work by Type" site/index.html

          echo
          echo "Project data:"
          cat site/data/projects.json

          echo
          echo "Priority sanity check:"

          python3 <<'PY'

          import glob
          import json

          for filename in glob.glob(
              "site/data/project-*.json"
          ):

              with open(filename) as handle:
                  data = json.load(handle)

              print(
                  filename,
                  "priorities=",
                  data.get(
                      "priorities"
                  ),
              )

              samples = [
                  (
                      issue["number"],
                      issue.get(
                          "priority"
                      )
                  )
                  for issue in (
                      data.get(
                          "issues",
                          []
                      )
                  )
              ][:10]

              print(
                  "sample priorities=",
                  samples,
              )

          PY


      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site


  deploy:

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs:
      build

    steps:

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
