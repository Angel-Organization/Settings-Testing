name: Populate Issue Fields

on:
  issues:
    types:
      - opened
      - edited

permissions:
  contents: read
  issues: write

jobs:
  initialize:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ACTIONS_APP_ID }}
          private-key: ${{ secrets.ACTIONS_APP_PRIVATE_KEY }}
          
      - name: Populate Issue Fields
        uses: actions/github-script@v8

        with:
          github-token: ${{ steps.app-token.outputs.token }}

          script: |

            /*
             * ============================================================
             * Issue
             * ============================================================
             */

            const issue = context.payload.issue;
            const issueBody = issue.body ?? "";
            const issueId = issue.node_id;
            const issueNumber = issue.number;

            /*
             * ============================================================
             * Repository Issue Fields
             * ============================================================
             *
             * Each object maps:
             *   - Issue Form heading
             *   - GitHub Issue Field
             *   - Option IDs
             *
             * To support another field, simply add another object.
             */

            const ISSUE_FIELDS = [
              
              {
                key: "product",
                label: "Product",
                fieldId: "IFSS_kgDOAqu9dA",

                options: {
                  ScriptSure: "IFSSO_kgDOBKyrFQ",
                  VetWay: "IFSSO_kgDOBKyrFg",
                  Exchange: "IFSSO_kgDOBKyrFw"
                }
              },

              {
                key: "priority",
                label: "Priority",
                fieldId: "IFSS_kgDOAqcSiw",

                options: {
                  "PROD Critical": "IFSSO_kgDOBKR5-Q",
                  P0: "IFSSO_kgDOBKyRWg",
                  P1: "IFSSO_kgDOBKR5-g",
                  P2: "IFSSO_kgDOBKR5-w",
                  P3: "IFSSO_kgDOBKR5_A",
                  P4: "IFSSO_kgDOBKyRWw"
                }
              },

              {
                key: "source",
                label: "Source",
                fieldId: "IFSS_kgDOAqu99Q",

                options: {
                  Customer: "IFSSO_kgDOBKysHA",
                  QA: "IFSSO_kgDOBKysHQ",
                  Demo: "IFSSO_kgDOBKysHg",
                  Support: "IFSSO_kgDOBKysHw",
                  "Internal Testing": "IFSSO_kgDOBKysIA",
                  Other: "IFSSO_kgDOBKysIQ"
                }
              }

            ];
            
            /*
             * ============================================================
             * Helper Functions
             * ============================================================
             */

            /*
             * Parse the Issue Form into a dictionary of values.
             *
             * Example:
             *
             * {
             *   Product: "ScriptSure",
             *   Priority: "P2",
             *   Source: "Demo"
             * }
             */
            function parseIssueForm() {
              const values = {};
              const sections = issueBody
                .split(/\n(?=### )/);

              for (const section of sections) {
                const lines = section.trim().split("\n");

                if (!lines[0]?.startsWith("### ")) {
                  continue;
                }

                const label = lines[0]
                  .replace(/^### /, "")
                  .trim();

                const value = lines
                  .slice(1)
                  .join("\n")
                  .replace(/<!--[\s\S]*?-->/g, "")
                  .trim();

                if (
                  value === "" ||
                  /^_No response_$/i.test(value)
                ) {
                  continue;
                }
                values[label] = value;
              }
              
              return values;
            }

            /*
             * Return the configured option ID.
             */
            function getOptionId(field, value) {
              const optionId = field.options[value];

              if (!optionId) {
                throw new Error(
                  `"${value}" is not a valid option for "${field.label}".`
                );
              }

              return optionId;
            }

            /*
             * Log parsed Issue Form values.
             */
            function logIssueFormValues(values) {
              core.startGroup("Issue Form Values");
              
              for (const field of ISSUE_FIELDS) {
                core.info(
                  `${field.label}: ${values[field.label] ?? "(none)"}`
                );
              }

              core.endGroup();
            }
            
            /*
             * ============================================================
             * Build GraphQL Payload
             * ============================================================
             */

            /*
             * Build the Issue Field payload for GraphQL.
             */
            function buildIssueFields(values) {
              const issueFields = [];

              for (const field of ISSUE_FIELDS) {
                const value = values[field.label];

                if (!value) {
                  core.info(
                    `Skipping ${field.label} (no value)`
                  );
                  continue;
                }

                issueFields.push({
                  fieldId: field.fieldId,
                  singleSelectOptionId:
                    getOptionId(field, value)
                });
              }

              return issueFields;
            }

            /*
             * Update all configured Issue Fields.
             */
            async function updateIssueFields(issueFields) {

              if (issueFields.length === 0) {
                core.info(
                  "No Issue Fields to update."
                );
                return;
              }

              core.info(
                `Updating ${issueFields.length} Issue Field(s)...`
              );

              await github.graphql(
                `
                mutation(
                  $issueId: ID!
                  $issueFields: [IssueFieldCreateOrUpdateInput!]!
                ) {
                  setIssueFieldValue(
                    input: {
                      issueId: $issueId
                      issueFields: $issueFields
                    }
                  ) {
                    issue {
                      number
                    }
                  }
                }
                `,
                {
                  issueId,
                  issueFields
                }
              );
            }

            /*
             * ============================================================
             * Update GitHub Issue Type
             * ============================================================
             */

              async function updateIssueType(values) {
                const featureType = values["Feature Type"];
              
                if (!featureType) {
                  core.info(
                    "Skipping Issue Type (no Feature Type selected)"
                  );
                  return;
                }
              
                core.info(
                  `Setting Issue Type to "${featureType}"...`
                );
              
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  type: featureType
                });
            }
            
            /*
             * ============================================================
             * Main
             * ============================================================
             */

            async function main() {

              core.info(
                `Initializing Issue #${issueNumber}`
              );

              const values = parseIssueForm();

              logIssueFormValues(
                values
              );

              const issueFields =
                buildIssueFields(values);

              await updateIssueFields(
                issueFields
              );
             
              await updateIssueType(
                values
              );
              
              core.notice(
                `Successfully initialized Issue #${issueNumber}.`
              );
            }

            /*
             * ============================================================
             * Execute
             * ============================================================
             */

            try {
              await main();
              
            } catch (error) {
              core.error(error);

              core.setFailed(
                error.message ?? String(error)
              );
            }
