                      issues,
                      label
                    ) {

                      const td =
                        document
                        .createElement(
                          "td"
                        );


                      td.className =
                        "metric-cell";


                      td.textContent =
                        issues.length;


                      td.onclick =
                        () =>
                          openDrilldown(
                            (
                              `${priority} · `
                              +
                              label
                            ),
                            sprint,
                            issues
                          );


                      row.appendChild(
                        td
                      );

                    }


                    addMetric(
                      openedIssues(
                        sprint,
                        priority
                      ),
                      "Opened"
                    );


                    projectData
                      .statuses
                      .forEach(
                        status => {

                          addMetric(
                            statusIssues(
                              sprint,
                              status,
                              priority
                            ),
                            status
                          );

                        }
                      );


                    addMetric(
                      closedIssues(
                        sprint,
                        priority
                      ),
                      "Closed"
                    );


                    body.appendChild(
                      row
                    );

                  }
                );

              }


