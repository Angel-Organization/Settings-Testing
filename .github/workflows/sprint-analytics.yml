              function renderTypeChart(
                sprint
              ) {

                const counts =
                  {};


                workedIssues(
                  sprint
                )
                .forEach(
                  issue => {

                    const type =
                      (
                        issue.issueType
                        ||
                        "Unspecified"
                      );


                    counts[type] =
                      (
                        counts[type]
                        ||
                        0
                      )
                      +
                      1;

                  }
                );


                const rows =
                  Object
                  .entries(
                    counts
                  )
                  .sort(
                    (a,b) =>
                      b[1]
                      -
                      a[1]
                  );


                typeChart
                  .data
                  .labels =
                    rows.map(
                      row =>
                        row[0]
                    );


                typeChart
                  .data
                  .datasets[0]
                  .data =
                    rows.map(
                      row =>
                        row[1]
                    );


                typeChart
                  .data
                  .datasets[0]
                  .backgroundColor =
                    rows.map(
                      (
                        row,
                        index
                      ) =>
                        TYPE_COLORS[
                          index
                          %
                          TYPE_COLORS.length
                        ]
                    );


                typeChart.update();

              }


