                const metrics = [

                  [
                    "Committed LOE",
                    committedIssues(
                      sprint
                    )
                  ],

                  [
                    "Carryover LOE",
                    carriedOverIssues(
                      sprint
                    )
                  ],

                  [
                    "Added Late LOE",
                    addedLateIssues(
                      sprint
                    )
                  ],

                  [
                    "Removed LOE",
                    removedIssues(
                      sprint
                    )
                  ],

                  [
                    "Completed LOE",
                    completedScopeIssues(
                      sprint
                    )
                  ]

