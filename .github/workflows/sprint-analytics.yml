            <script>

              let projectData =
                null;


              const cacheVersion =
                Date.now();


              const TYPE_COLORS = [

                "#2499e8",
                "#49b94f",
                "#0f5f98",
                "#7bc8f6",
                "#8fd694",
                "#506784",
                "#b8dff7",
                "#86a9c4",
                "#a7d9aa",
                "#36566f",
                "#5ab5ef",
                "#72c879"

              ];


              // ===========================================
              // Basic helpers
              // ===========================================

              function escapeHtml(value) {

                return String(
                  value ?? ""
                )
                .replaceAll(
                  "&",
                  "&amp;"
                )
                .replaceAll(
                  "<",
                  "&lt;"
                )
                .replaceAll(
                  ">",
                  "&gt;"
                )
                .replaceAll(
                  '"',
                  "&quot;"
                )
                .replaceAll(
                  "'",
                  "&#039;"
                );

              }


              function cap(name) {

                return (
                  projectData
                  ?.capabilities
                  ?.[name]
                  ?.available
                  ===
                  true
                );

              }


              function issueId(issue) {

                return (
                  issue.repository
                  +
                  "#"
                  +
                  issue.number
                );

              }


              function within(
                date,
                sprint
              ) {

                return Boolean(
                  date
                  &&
                  date >=
                  sprint.start
                  &&
                  date <=
                  sprint.end
                );

              }


              function selectedSprint() {

                if (!projectData) {

                  return null;

                }


                const index =
                  Number(
                    document
                    .getElementById(
                      "sprintSelect"
                    )
                    .value
                  );


                return (
                  projectData
                  .sprints[index]
                  ||
                  null
                );

              }


              function localToday() {

                const now =
                  new Date();


                const year =
                  now.getFullYear();


                const month =
                  String(
                    now.getMonth()
                    +
                    1
                  )
                  .padStart(
                    2,
                    "0"
                  );


                const day =
                  String(
                    now.getDate()
                  )
                  .padStart(
                    2,
                    "0"
                  );


                return (
                  `${year}-`
                  +
                  `${month}-`
                  +
                  `${day}`
                );

              }


              function addDays(
                dateString,
                days
              ) {

                const [
                  year,
                  month,
                  day
                ] =
                  dateString
                  .split("-")
                  .map(Number);


                const date =
                  new Date(
                    Date.UTC(
                      year,
                      month - 1,
                      day
                    )
                  );


                date.setUTCDate(
                  date.getUTCDate()
                  +
                  days
                );


                return date
                  .toISOString()
                  .slice(
                    0,
                    10
                  );

              }


              function sumLoe(
                issues
              ) {

                return issues.reduce(
                  (
                    total,
                    issue
                  ) => {

                    const value =
                      Number(
                        issue.loe
                      );


                    return (
                      total
                      +
                      (
                        Number.isFinite(
                          value
                        )
                        ?
                        value
                        :
                        0
                      )
                    );

                  },
                  0
                );

              }


              function formatDays(
                value
              ) {

                const numeric =
                  Number(value);


                return (
                  (
                    Number.isFinite(
                      numeric
                    )
                    ?
                    numeric
                    :
                    0
                  )
                  .toFixed(1)
                  .replace(
                    /\.0$/,
                    ""
                  )
                  +
                  " days"
                );

              }


              // ===========================================
              // Sprint history
              // ===========================================

              function transitions(
                issue
              ) {

                return (
                  issue
                  .sprintTransitions
                  ||
                  []
                )
                .slice()
                .sort(
                  (
                    a,
                    b
                  ) =>
                    String(
                      a.createdAt
                      ||
                      a.date
                    )
                    .localeCompare(
                      String(
                        b.createdAt
                        ||
                        b.date
                      )
                    )
                );

              }


              function isBacklog(
                value
              ) {

                return (
                  String(
                    value
                    ||
                    ""
                  )
                  .trim()
                  .toLowerCase()
                  ===
                  "backlog"
                );

              }


              function isSprint(
                value
              ) {

                return /^sprint\b/i
                  .test(
                    String(
                      value
                      ||
                      ""
                    )
                    .trim()
                  );

              }


              function entriesIntoSprint(
                issue,
                sprint
              ) {

                return transitions(
                  issue
                )
                .filter(
                  event =>
                    event.to
                    ===
                    sprint.name
                );

              }


              function exitsFromSprint(
                issue,
                sprint
              ) {

                return transitions(
                  issue
                )
                .filter(
                  event =>
                    event.from
                    ===
                    sprint.name
                    &&
                    event.to
                    !==
                    sprint.name
                );

              }


              function firstEntry(
                issue,
                sprint
              ) {

                const entries =
                  entriesIntoSprint(
                    issue,
                    sprint
                  );


                return (
                  entries.length
                  ?
                  entries[0]
                  :
                  null
                );

              }


              // ===========================================
              // Sprint-scope KPIs
              //
              // IMPORTANT:
              //
              // These overlap intentionally.
              //
              // COMMITTED:
              //   Ever entered this Sprint.
              //
              // CARRIED OVER:
              //   Committed + entered from another Sprint.
              //
              // ADDED LATE:
              //   Committed + first recorded entry was after
              //   the day-one tracker grace period.
              //
              // REMOVED:
              //   Committed + later left this Sprint.
              // ===========================================

              function committedIssues(
                sprint
              ) {

                return projectData
                  .issues
                  .filter(
                    issue =>
                      Boolean(
                        firstEntry(
                          issue,
                          sprint
                        )
                      )
                  );

              }


              function carriedOverIssues(
                sprint
              ) {

                return committedIssues(
                  sprint
                )
                .filter(
                  issue => {

                    const entry =
                      firstEntry(
                        issue,
                        sprint
                      );


                    return Boolean(
                      entry
                      &&
                      isSprint(
                        entry.from
                      )
                      &&
                      entry.from
                      !==
                      sprint.name
                    );

                  }
                );

              }


              /*
               * Tracker runs once daily.
               *
               * Sprint day 1 can therefore be observed
               * on the following day.
               */

              function lateCutoff(
                sprint
              ) {

                return addDays(
                  sprint.start,
                  1
                );

              }


              function addedLateIssues(
                sprint
              ) {

                const cutoff =
                  lateCutoff(
                    sprint
                  );


                return committedIssues(
                  sprint
                )
                .filter(
                  issue => {

                    const entry =
                      firstEntry(
                        issue,
                        sprint
                      );


                    return Boolean(
                      entry
                      &&
                      entry.date
                      >
                      cutoff
                    );

                  }
                );

              }


              function removedIssues(
                sprint
              ) {

                return committedIssues(
                  sprint
                )
                .filter(
                  issue => {

                    const entry =
                      firstEntry(
                        issue,
                        sprint
                      );


                    if (!entry) {

                      return false;

                    }


                    return exitsFromSprint(
                      issue,
                      sprint
                    )
                    .some(
                      exit =>
                        String(
                          exit.createdAt
                          ||
                          exit.date
                        )
                        >
                        String(
                          entry.createdAt
                          ||
                          entry.date
                        )
                    );

                  }
                );

              }


              function sprintEntryLabel(
                issue,
                sprint
              ) {

                const entry =
                  firstEntry(
                    issue,
                    sprint
                  );


                if (!entry) {

                  return "";

                }


                const late =
                  (
                    entry.date
                    >
                    lateCutoff(
                      sprint
                    )
                  );


                if (
                  isSprint(
                    entry.from
                  )
                ) {

                  return (
                    late
                    ?
                    "Late Carryover"
                    :
                    "Carryover"
                  );

                }


                return (
                  late
                  ?
                  "Added Late"
                  :
                  "Committed"
                );

              }


              function carriedFrom(
                issue,
                sprint
              ) {

                const entry =
                  firstEntry(
                    issue,
                    sprint
                  );


                if (
                  !entry
                  ||
                  !isSprint(
                    entry.from
                  )
                ) {

                  return "";

                }


                return entry.from;

              }


              // ===========================================
              // Open / Closed
              // ===========================================

              function openedIssues(
                sprint,
                priority = null
              ) {

                return projectData
                  .issues
                  .filter(
                    issue =>
                      (
                        priority
                        ===
                        null
                        ||
                        issue.priority
                        ===
                        priority
                      )
                      &&
                      within(
                        issue.opened,
                        sprint
                      )
                  );

              }


              function closedIssues(
                sprint,
                priority = null
              ) {

                return projectData
                  .issues
                  .filter(
                    issue =>
                      (
                        priority
                        ===
                        null
                        ||
                        issue.priority
                        ===
                        priority
                      )
                      &&
                      within(
                        issue.closed,
                        sprint
                      )
                  );

              }


              function completedCommittedIssues(
                sprint
              ) {

                const ids =
                  new Set(
                    committedIssues(
                      sprint
                    )
                    .map(
                      issueId
                    )
                  );


                return closedIssues(
                  sprint
                )
                .filter(
                  issue =>
                    ids.has(
                      issueId(issue)
                    )
                );

              }


              function completionRate(
                sprint
              ) {

                const committed =
                  committedIssues(
                    sprint
                  );


                if (!committed.length) {

                  return 0;

                }


                return (
                  completedCommittedIssues(
                    sprint
                  ).length
                  /
                  committed.length
                  *
                  100
                );

              }


              // ===========================================
              // Status flow
              // ===========================================

              function statusIssues(
                sprint,
                status,
                priority = null
              ) {

                return projectData
                  .issues
                  .filter(
                    issue =>
                      (
                        priority
                        ===
                        null
                        ||
                        issue.priority
                        ===
                        priority
                      )
                      &&
                      (
                        issue.statusEvents
                        ||
                        []
                      )
                      .some(
                        event =>
                          event.status
                          ===
                          status
                          &&
                          within(
                            event.date,
                            sprint
                          )
                      )
                  );

              }


              function statusDates(
                issue,
                status
              ) {

                return (
                  issue.statusEvents
                  ||
                  []
                )
                .filter(
                  event =>
                    event.status
                    ===
                    status
                )
                .map(
                  event =>
                    event.date
                )
                .sort();

              }


              function workedIssues(
                sprint
              ) {

                const ids =
                  new Set();


                committedIssues(
                  sprint
                )
                .forEach(
                  issue =>
                    ids.add(
                      issueId(issue)
                    )
                );


                projectData
                  .issues
                  .forEach(
                    issue => {

                      if (
                        within(
                          issue.closed,
                          sprint
                        )
                      ) {

                        ids.add(
                          issueId(issue)
                        );

                      }


                      (
                        issue.statusEvents
                        ||
                        []
                      )
                      .forEach(
                        event => {

                          if (
                            within(
                              event.date,
                              sprint
                            )
                          ) {

                            ids.add(
                              issueId(issue)
                            );

                          }

                        }
                      );

                    }
                  );


                return projectData
                  .issues
                  .filter(
                    issue =>
                      ids.has(
                        issueId(issue)
                      )
                  );

              }


              // ===========================================
              // Bug metrics
              // ===========================================

              function isBug(
                issue
              ) {

                return (
                  String(
                    issue.issueType
                    ||
                    ""
                  )
                  .toLowerCase()
                  ===
                  "bug"
                );

              }


              function bugsOpened(
                sprint,
                priority = null
              ) {

                return openedIssues(
                  sprint,
                  priority
                )
                .filter(
                  isBug
                );

              }


              function bugsClosed(
                sprint,
                priority = null
              ) {

                return closedIssues(
                  sprint,
                  priority
                )
                .filter(
                  isBug
                );

              }


              // ===========================================
              // KPI helper
              // ===========================================

              function addKpi(
                container,
                label,
                value,
                issues = null,
                subtext = ""
              ) {

                const card =
                  document
                  .createElement(
                    "div"
                  );


                card.className =
                  issues
                  ?
                  "card clickable"
                  :
                  "card";


                card.innerHTML = `

                  <div class="label">
                    ${
                      escapeHtml(
                        label
                      )
                    }
                  </div>

                  <div class="number">
                    ${
                      escapeHtml(
                        value
                      )
                    }
                  </div>

                  ${
                    subtext
                    ?
                    `
                    <div class="subnumber">
                      ${
                        escapeHtml(
                          subtext
                        )
                      }
                    </div>
                    `
                    :
                    ""
                  }

                `;


                if (issues) {

                  card.onclick =
                    () =>
                      openDrilldown(
                        label,
                        selectedSprint(),
                        issues
                      );

                }


                container.appendChild(
                  card
                );

              }


              // ===========================================
              // Overview
              // ===========================================

              function renderOverview(
                sprint
              ) {

                const container =
                  document.getElementById(
                    "overviewKpis"
                  );


                container.innerHTML =
                  "";


                const opened =
                  openedIssues(
                    sprint
                  );


                const committed =
                  committedIssues(
                    sprint
                  );


                const carried =
                  carriedOverIssues(
                    sprint
                  );


                const late =
                  addedLateIssues(
                    sprint
                  );


                const removed =
                  removedIssues(
                    sprint
                  );


                const closed =
                  closedIssues(
                    sprint
                  );


                addKpi(
                  container,
                  "Opened",
                  opened.length,
                  opened
                );


                addKpi(
                  container,
                  "Committed",
                  committed.length,
                  committed,
                  cap("loe")
                  ?
                  `${formatDays(
                    sumLoe(
                      committed
                    )
                  )} LOE`
                  :
                  ""
                );


                addKpi(
                  container,
                  "Carried Over",
                  carried.length,
                  carried,
                  cap("loe")
                  ?
                  `${formatDays(
                    sumLoe(
                      carried
                    )
                  )} LOE`
                  :
                  ""
                );


                addKpi(
                  container,
                  "Added Late",
                  late.length,
                  late,
                  cap("loe")
                  ?
                  `${formatDays(
                    sumLoe(
                      late
                    )
                  )} LOE`
                  :
                  ""
                );


                addKpi(
                  container,
                  "Removed",
                  removed.length,
                  removed
                );


                addKpi(
                  container,
                  "Closed",
                  closed.length,
                  closed
                );


                addKpi(
                  container,
                  "Completion",
                  (
                    completionRate(
                      sprint
                    )
                    .toFixed(0)
                    +
                    "%"
                  )
                );


                renderStatuses(
                  sprint
                );


                renderFlow(
                  sprint
                );


                renderType(
                  sprint
                );


                renderPriority(
                  sprint
                );

              }


              // ===========================================
              // Small Status pills
              // ===========================================

              function renderStatuses(
                sprint
              ) {

                const row =
                  document.getElementById(
                    "statusRow"
                  );


                row.innerHTML =
                  "";


                projectData
                  .statuses
                  .forEach(
                    status => {

                      const issues =
                        statusIssues(
                          sprint,
                          status
                        );


                      const button =
                        document
                        .createElement(
                          "button"
                        );


                      button.className =
                        "status-chip";


                      button.innerHTML = `

                        ${
                          escapeHtml(
                            status
                          )
                        }

                        <strong>
                          ${
                            issues.length
                          }
                        </strong>

                      `;


                      button.onclick =
                        () =>
                          openDrilldown(
                            status,
                            sprint,
                            issues
                          );


                      row.appendChild(
                        button
                      );

                    }
                  );

              }


              // ===========================================
              // Sprint Flow
              // ===========================================

              const flowChart =
                new Chart(
                  document.getElementById(
                    "flowChart"
                  ),
                  {

                    type:
                      "bar",

                    data: {

                      labels:
                        [],

                      datasets: [{

                        data:
                          [],

                        backgroundColor:
                          "#2499e8",

                        borderWidth:
                          0

                      }]

                    },

                    options: {

                      responsive:
                        true,

                      maintainAspectRatio:
                        false,

                      resizeDelay:
                        100,

                      plugins: {

                        legend: {
                          display:
                            false
                        }

                      },

                      onClick(
                        event,
                        elements
                      ) {

                        if (
                          !elements.length
                        ) {

                          return;

                        }


                        const descriptor =
                          flowChart
                          ._descriptors[
                            elements[
                              0
                            ]
                            .index
                          ];


                        if (!descriptor) {

                          return;

                        }


                        openDrilldown(
                          descriptor.label,
                          selectedSprint(),
                          descriptor.issues
                        );

                      }

                    }

                  }
                );


              function renderFlow(
                sprint
              ) {

                const descriptors = [

                  {
                    label:
                      "Opened",

                    issues:
                      openedIssues(
                        sprint
                      )
                  },

                  ...projectData
                  .statuses
                  .map(
                    status => ({

                      label:
                        status,

                      issues:
                        statusIssues(
                          sprint,
                          status
                        )

                    })
                  ),

                  {
                    label:
                      "Closed",

                    issues:
                      closedIssues(
                        sprint
                      )
                  }

                ];


                flowChart
                  ._descriptors =
                    descriptors;


                flowChart
                  .data
                  .labels =
                    descriptors
                    .map(
                      item =>
                        item.label
                    );


                flowChart
                  .data
                  .datasets[0]
                  .data =
                    descriptors
                    .map(
                      item =>
                        item
                        .issues
                        .length
                    );


                flowChart.update();

              }


              // ===========================================
              // Work by Type
              // ===========================================

              const typeChart =
                new Chart(
                  document.getElementById(
                    "typeChart"
                  ),
                  {

                    type:
                      "doughnut",

                    data: {

                      labels:
                        [],

                      datasets: [{

                        data:
                          [],

                        backgroundColor:
                          [],

                        borderColor:
                          "#ffffff",

                        borderWidth:
                          2,

                        hoverOffset:
                          8

                      }]

                    },

                    options: {

                      responsive:
                        true,

                      maintainAspectRatio:
                        false,

                      cutout:
                        "58%",

                      plugins: {

                        legend: {

                          position:
                            "bottom",

                          labels: {

                            usePointStyle:
                              true,

                            pointStyle:
                              "circle",

                            padding:
                              14

                          }

                        }

                      },

                      onClick(
                        event,
                        elements
                      ) {

                        if (
                          !elements.length
                        ) {

                          return;

                        }


                        const sprint =
                          selectedSprint();


                        const type =
                          typeChart
                          .data
                          .labels[
                            elements[
                              0
                            ]
                            .index
                          ];


                        const issues =
                          workedIssues(
                            sprint
                          )
                          .filter(
                            issue =>
                              (
                                issue.issueType
                                ||
                                "Unspecified"
                              )
                              ===
                              type
                          );


                        openDrilldown(
                          type,
                          sprint,
                          issues
                        );

                      }

                    }

                  }
                );


              function renderType(
                sprint
              ) {

                const counts =
                  {};


                workedIssues(
                  sprint
                )
                .forEach(
                  issue => {

                    const type =
                      (
                        issue.issueType
                        ||
                        "Unspecified"
                      );


                    counts[type] =
                      (
                        counts[type]
                        ||
                        0
                      )
                      +
                      1;

                  }
                );


                const values =
                  Object
                  .entries(
                    counts
                  )
                  .sort(
                    (
                      a,
                      b
                    ) =>
                      b[1]
                      -
                      a[1]
                  );


                typeChart
                  .data
                  .labels =
                    values.map(
                      value =>
                        value[0]
                    );


                typeChart
                  .data
                  .datasets[0]
                  .data =
                    values.map(
                      value =>
                        value[1]
                    );


                typeChart
                  .data
                  .datasets[0]
                  .backgroundColor =
                    values.map(
                      (
                        value,
                        index
                      ) =>
                        TYPE_COLORS[
                          index
                          %
                          TYPE_COLORS
                          .length
                        ]
                    );


                typeChart.update();

              }


              // ===========================================
              // Flow by Priority
              // ===========================================

              function renderPriority(
                sprint
              ) {

                const card =
                  document.getElementById(
                    "priorityCard"
                  );


                const priorities =
                  (
                    projectData
                    .priorities
                    ||
                    []
                  )
                  .filter(Boolean);


                if (
                  !priorities.length
                ) {

                  card.classList.add(
                    "hidden"
                  );

                  return;

                }


                card.classList.remove(
                  "hidden"
                );


                const header =
                  document.getElementById(
                    "priorityHeader"
                  );


                header.innerHTML =
                  "";


                [
                  "Priority",
                  "Opened",
                  ...projectData.statuses,
                  "Closed"
                ]
                .forEach(
                  heading => {

                    const th =
                      document
                      .createElement(
                        "th"
                      );


                    th.textContent =
                      heading;


                    header.appendChild(
                      th
                    );

                  }
                );


                const body =
                  document.getElementById(
                    "priorityRows"
                  );


                body.innerHTML =
                  "";


                priorities.forEach(
                  priority => {

                    const row =
                      document
                      .createElement(
                        "tr"
                      );


                    const first =
                      document
                      .createElement(
                        "td"
                      );


                    first.innerHTML =
                      `<strong>${
                        escapeHtml(
                          priority
                        )
                      }</strong>`;


                    row.appendChild(
                      first
                    );


                    function addMetric(
                      issues,
                      label
                    ) {

                      const td =
                        document
                        .createElement(
                          "td"
                        );


                      td.className =
                        "metric-cell";


                      td.textContent =
                        issues.length;


                      td.onclick =
                        () =>
                          openDrilldown(
                            `${priority} · ${label}`,
                            sprint,
                            issues
                          );


                      row.appendChild(
                        td
                      );

                    }


                    addMetric(
                      openedIssues(
                        sprint,
                        priority
                      ),
                      "Opened"
                    );


                    projectData
                      .statuses
                      .forEach(
                        status => {

                          addMetric(
                            statusIssues(
                              sprint,
                              status,
                              priority
                            ),
                            status
                          );

                        }
                      );


                    addMetric(
                      closedIssues(
                        sprint,
                        priority
                      ),
                      "Closed"
                    );


                    body.appendChild(
                      row
                    );

                  }
                );

              }


              // ===========================================
              // Quality
              // ===========================================

              function renderQuality(
                sprint
              ) {

                const container =
                  document.getElementById(
                    "qualityKpis"
                  );


                container.innerHTML =
                  "";


                const opened =
                  bugsOpened(
                    sprint
                  );


                const closed =
                  bugsClosed(
                    sprint
                  );


                addKpi(
                  container,
                  "Bugs Opened",
                  opened.length,
                  opened
                );


                addKpi(
                  container,
                  "Bugs Closed",
                  closed.length,
                  closed
                );


                addKpi(
                  container,
                  "Bug C/R",
                  (
                    closed.length
                    ?
                    (
                      opened.length
                      /
                      closed.length
                    )
                    .toFixed(2)
                    +
                    "x"
                    :
                    "—"
                  )
                );


                renderQualityPriority(
                  sprint
                );

              }


              function renderQualityPriority(
                sprint
              ) {

                const card =
                  document.getElementById(
                    "qualityPriorityCard"
                  );


                if (
                  !projectData
                  .priorities
                  .length
                ) {

                  card.classList.add(
                    "hidden"
                  );

                  return;

                }


                card.classList.remove(
                  "hidden"
                );


                const body =
                  document.getElementById(
                    "qualityPriorityRows"
                  );


                body.innerHTML =
                  "";


                projectData
                  .priorities
                  .forEach(
                    priority => {

                      const opened =
                        bugsOpened(
                          sprint,
                          priority
                        );


                      const closed =
                        bugsClosed(
                          sprint,
                          priority
                        );


                      const row =
                        document
                        .createElement(
                          "tr"
                        );


                      const first =
                        document
                        .createElement(
                          "td"
                        );


                      first.innerHTML =
                        `<strong>${
                          escapeHtml(
                            priority
                          )
                        }</strong>`;


                      row.appendChild(
                        first
                      );


                      function addCell(
                        value,
                        issues = null
                      ) {

                        const td =
                          document
                          .createElement(
                            "td"
                          );


                        td.textContent =
                          value;


                        if (issues) {

                          td.className =
                            "metric-cell";


                          td.onclick =
                            () =>
                              openDrilldown(
                                `${priority} Bugs`,
                                sprint,
                                issues
                              );

                        }


                        row.appendChild(
                          td
                        );

                      }


                      addCell(
                        opened.length,
                        opened
                      );


                      addCell(
                        closed.length,
                        closed
                      );


                      addCell(
                        closed.length
                        ?
                        (
                          opened.length
                          /
                          closed.length
                        )
                        .toFixed(2)
                        +
                        "x"
                        :
                        "—"
                      );


                      body.appendChild(
                        row
                      );

                    }
                  );

              }


              // ===========================================
              // Drilldown
              // ===========================================

              function openDrilldown(
                title,
                sprint,
                issues
              ) {

                document
                  .getElementById(
                    "drilldownTitle"
                  )
                  .textContent =
                    title;


                document
                  .getElementById(
                    "drilldownSubtitle"
                  )
                  .textContent =
                    (
                      `${sprint.name} · `
                      +
                      `${issues.length} issue`
                      +
                      (
                        issues.length
                        ===
                        1
                        ?
                        ""
                        :
                        "s"
                      )
                    );


                const columns = [

                  {
                    label:
                      "Issue",

                    render:
                      issue =>
                        `
                        <a
                          class="issue-link"
                          href="${
                            escapeHtml(
                              issue.url
                            )
                          }"
                          target="_blank"
                          rel="noopener noreferrer">

                          ${
                            escapeHtml(
                              issue.repository
                            )
                          }#${
                            issue.number
                          }

                        </a>
                        `
                  },

                  {
                    label:
                      "Title",

                    className:
                      "title-column",

                    render:
                      issue =>
                        escapeHtml(
                          issue.title
                        )
                  },

                  {
                    label:
                      "Type",

                    render:
                      issue =>
                        escapeHtml(
                          issue.issueType
                        )
                  },

                  {
                    label:
                      "Priority",

                    render:
                      issue =>
                        escapeHtml(
                          issue.priority
                        )
                  }

                ];


                if (cap("size")) {

                  columns.push({

                    label:
                      "Size",

                    render:
                      issue =>
                        escapeHtml(
                          issue.size
                          ||
                          ""
                        )

                  });

                }


                if (cap("loe")) {

                  columns.push({

                    label:
                      "LOE",

                    render:
                      issue =>
                        (
                          issue.loe
                          ===
                          null
                          ||
                          issue.loe
                          ===
                          undefined
                          ?
                          ""
                          :
                          formatDays(
                            issue.loe
                          )
                        )

                  });

                }


                columns.push({

                  label:
                    "Sprint Entry",

                  render:
                    issue =>
                      escapeHtml(
                        sprintEntryLabel(
                          issue,
                          sprint
                        )
                      )

                });


                columns.push({

                  label:
                    "Carried From",

                  render:
                    issue =>
                      escapeHtml(
                        carriedFrom(
                          issue,
                          sprint
                        )
                      )

                });


                columns.push({

                  label:
                    "Open Date",

                  render:
                    issue =>
                      escapeHtml(
                        issue.opened
                        ||
                        ""
                      )

                });


                projectData
                  .statuses
                  .forEach(
                    status => {

                      columns.push({

                        label:
                          status,

                        render:
                          issue =>
                            statusDates(
                              issue,
                              status
                            )
                            .map(
                              escapeHtml
                            )
                            .join(
                              "<br>"
                            )

                      });

                    }
                  );


                columns.push({

                  label:
                    "Close Date",

                  render:
                    issue =>
                      escapeHtml(
                        issue.closed
                        ||
                        ""
                      )

                });


                const header =
                  document.getElementById(
                    "drilldownHeader"
                  );


                header.innerHTML =
                  "";


                columns.forEach(
                  column => {

                    const th =
                      document
                      .createElement(
                        "th"
                      );


                    th.textContent =
                      column.label;


                    header.appendChild(
                      th
                    );

                  }
                );


                const body =
                  document.getElementById(
                    "drilldownRows"
                  );


                body.innerHTML =
                  "";


                issues.forEach(
                  issue => {

                    const row =
                      document
                      .createElement(
                        "tr"
                      );


                    columns.forEach(
                      column => {

                        const td =
                          document
                          .createElement(
                            "td"
                          );


                        if (
                          column.className
                        ) {

                          td.className =
                            column.className;

                        }


                        td.innerHTML =
                          column.render(
                            issue
                          );


                        row.appendChild(
                          td
                        );

                      }
                    );


                    body.appendChild(
                      row
                    );

                  }
                );


                document
                  .getElementById(
                    "drilldownBackdrop"
                  )
                  .classList
                  .remove(
                    "hidden"
                  );

              }


              function closeDrilldown() {

                document
                  .getElementById(
                    "drilldownBackdrop"
                  )
                  .classList
                  .add(
                    "hidden"
                  );

              }


              document
                .getElementById(
                  "closeDrilldown"
                )
                .onclick =
                  closeDrilldown;


              document
                .getElementById(
                  "drilldownBackdrop"
                )
                .addEventListener(
                  "click",
                  event => {

                    if (
                      event.target.id
                      ===
                      "drilldownBackdrop"
                    ) {

                      closeDrilldown();

                    }

                  }
                );


              document
                .addEventListener(
                  "keydown",
                  event => {

                    if (
                      event.key
                      ===
                      "Escape"
                    ) {

                      closeDrilldown();

                    }

                  }
                );


              // ===========================================
              // Render
              // ===========================================

              function renderAll() {

                const sprint =
                  selectedSprint();


                if (!sprint) {

                  return;

                }


                renderOverview(
                  sprint
                );


                renderQuality(
                  sprint
                );

              }


              // ===========================================
              // Project loading
              // ===========================================

              function loadProject(
                project
              ) {

                fetch(
                  `data/${project.slug}.json?v=${cacheVersion}`,
                  {
                    cache:
                      "no-store"
                  }
                )

                .then(
                  response => {

                    if (!response.ok) {

                      throw new Error(
                        "Could not load project data."
                      );

                    }


                    return response.json();

                  }
                )

                .then(
                  data => {

                    projectData =
                      data;


                    const sprintSelect =
                      document.getElementById(
                        "sprintSelect"
                      );


                    sprintSelect.innerHTML =
                      "";


                    data.sprints
                      .forEach(
                        (
                          sprint,
                          index
                        ) => {

                          const option =
                            document
                            .createElement(
                              "option"
                            );


                          option.value =
                            index;


                          option.textContent =
                            (
                              `${sprint.name} · `
                              +
                              `${sprint.start} – `
                              +
                              `${sprint.end}`
                            );


                          sprintSelect
                            .appendChild(
                              option
                            );

                        }
                      );


                    const today =
                      localToday();


                    let current =
                      data.sprints
                      .findIndex(
                        sprint =>
                          today
                          >=
                          sprint.start
                          &&
                          today
                          <=
                          sprint.end
                      );


                    if (
                      current
                      <
                      0
                    ) {

                      current =
                        Math.max(
                          data.sprints.length
                          -
                          1,
                          0
                        );

                    }


                    sprintSelect.value =
                      current;


                    renderAll();

                  }
                );

              }


              // ===========================================
              // Bootstrap
              // ===========================================

              fetch(
                `data/projects.json?v=${cacheVersion}`,
                {
                  cache:
                    "no-store"
                }
              )

              .then(
                response =>
                  response.json()
              )

              .then(
                projects => {

                  const select =
                    document.getElementById(
                      "projectSelect"
                    );


                  projects.forEach(
                    (
                      project,
                      index
                    ) => {

                      const option =
                        document
                        .createElement(
                          "option"
                        );


                      option.value =
                        index;


                      option.textContent =
                        (
                          `${project.title} `
                          +
                          `(${project.issueCount} issues)`
                        );


                      select.appendChild(
                        option
                      );

                    }
                  );


                  if (
                    projects.length
                  ) {

                    loadProject(
                      projects[0]
                    );

                  }


                  select.addEventListener(
                    "change",
                    event => {

                      loadProject(
                        projects[
                          Number(
                            event.target.value
                          )
                        ]
                      );

                    }
                  );

                }
              );


              document
                .getElementById(
                  "sprintSelect"
                )
                .addEventListener(
                  "change",
                  renderAll
                );


              // ===========================================
              // Resize
              // ===========================================

              let resizeTimer =
                null;


              window.addEventListener(
                "resize",
                () => {

                  clearTimeout(
                    resizeTimer
                  );


                  resizeTimer =
                    setTimeout(
                      () => {

                        flowChart.resize();
                        typeChart.resize();

                      },
                      150
                    );

                }
              );

            </script>

          </body>

          </html>

          EOF


      - name: Verify dashboard and sprint history

        shell: bash

        run: |

          set -euo pipefail


          echo "Checking dashboard..."

          grep -q "Sprint Analytics" site/index.html
          grep -q "Opened" site/index.html
          grep -q "Committed" site/index.html
          grep -q "Carried Over" site/index.html
          grep -q "Added Late" site/index.html
          grep -q "Removed" site/index.html
          grep -q "Flow by Priority" site/index.html
          grep -q "Work by Type" site/index.html
          grep -q "Bugs by Priority" site/index.html


          echo
          echo "Sprint history sanity check:"


          python3 <<'PY'

          import glob
          import json


          for filename in glob.glob(
              "site/data/project-*.json"
          ):

              with open(
                  filename
              ) as handle:

                  data = json.load(
                      handle
                  )


              print()
              print(
                  filename,
                  "-",
                  data["project"]["title"],
              )


              print(
                  "Priorities:",
                  data.get(
                      "priorities"
                  ),
              )


              tracked = [

                  issue

                  for issue in (
                      data.get(
                          "issues",
                          []
                      )
                  )

                  if issue.get(
                      "sprintTransitions"
                  )

              ]


              print(
                  "Issues with sprint history:",
                  len(tracked),
                  "/",
                  len(
                      data.get(
                          "issues",
                          []
                      )
                  ),
              )


              for issue in tracked[:15]:

                  print(
                      f'  #{issue["number"]} '
                      f'priority='
                      f'{issue["priority"]} '
                      f'current='
                      f'{issue["currentSprint"]}:',
                      [
                          (
                              transition[
                                  "from"
                              ],
                              transition[
                                  "to"
                              ],
                              transition[
                                  "date"
                              ],
                          )

                          for transition in (
                              issue[
                                  "sprintTransitions"
                              ]
                          )
                      ],
                  )

          PY


