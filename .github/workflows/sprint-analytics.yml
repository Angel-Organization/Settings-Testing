            </main>


            <!-- ========================================
                 DRILLDOWN
                 ======================================== -->

            <div
              id="drilldownBackdrop"
              class="modal-backdrop hidden">

              <div class="modal">


                <div class="modal-header">

                  <div>

                    <h2
                      id="drilldownTitle">
                    </h2>

                    <div
                      id="drilldownSubtitle"
                      class="modal-subtitle">
                    </div>

                  </div>


                  <button
                    id="closeDrilldown"
                    class="close-button"
                    type="button">

                    ×

                  </button>

                </div>


                <div class="modal-body">

                  <table
                    class="drilldown-table">

                    <thead>

                      <tr
                        id="drilldownHeader">
                      </tr>

                    </thead>


                    <tbody
                      id="drilldownRows">
                    </tbody>

                  </table>

                </div>


              </div>

            </div>


            <script>

              let projectData =
                null;


              let projectsIndex =
                [];


              const cacheVersion =
                Date.now();


              const TYPE_COLORS = [

                "#2499e8",
                "#49b94f",
                "#0f5f98",
                "#7bc8f6",
                "#8fd694",
                "#506784",
                "#b8dff7",
                "#86a9c4",
                "#a7d9aa",
                "#36566f",
                "#5ab5ef",
                "#72c879"

              ];


              // ===========================================
              // Basic helpers
              // ===========================================

              function escapeHtml(value) {

                return String(
                  value ?? ""
                )
                .replaceAll(
                  "&",
                  "&amp;"
                )
                .replaceAll(
                  "<",
                  "&lt;"
                )
                .replaceAll(
                  ">",
                  "&gt;"
                )
                .replaceAll(
                  '"',
                  "&quot;"
                )
                .replaceAll(
                  "'",
                  "&#039;"
                );

              }


              function cap(name) {

                return (
                  projectData
                  ?.capabilities
                  ?.[name]
                  ?.available
                  ===
                  true
                );

              }


              function issueId(issue) {

                return (
                  issue.repository
                  +
                  "#"
                  +
                  issue.number
                );

              }


              function within(
                date,
                sprint
              ) {

                return Boolean(
                  date
                  &&
                  date >= sprint.start
                  &&
                  date <= sprint.end
                );

              }


              function formatDays(value) {

                const number =
                  Number(value);


                if (
                  !Number.isFinite(
                    number
                  )
                ) {

                  return "0 days";

                }


                return (
                  number
                  .toFixed(1)
                  .replace(
                    /\.0$/,
                    ""
                  )
                  +
                  " days"
                );

              }


              function sumLoe(issues) {

                return issues.reduce(
                  (
                    total,
                    issue
                  ) => {

                    const value =
                      Number(
                        issue.loe
                      );


                    return (
                      total
                      +
                      (
                        Number.isFinite(
                          value
                        )
                        ?
                        value
                        :
                        0
                      )
                    );

                  },
                  0
                );

              }


              function selectedSprint() {

                if (!projectData) {

                  return null;

                }


                const index =
                  Number(
                    document
                    .getElementById(
                      "sprintSelect"
                    )
                    .value
                  );


                return (
                  projectData
                  .sprints[index]
                  ||
                  null
                );

              }


              function localToday() {

                const now =
                  new Date();


                const year =
                  now.getFullYear();


                const month =
                  String(
                    now.getMonth()
                    +
                    1
                  )
                  .padStart(
                    2,
                    "0"
                  );


                const day =
                  String(
                    now.getDate()
                  )
                  .padStart(
                    2,
                    "0"
                  );


                return (
                  `${year}-`
                  +
                  `${month}-`
                  +
                  `${day}`
                );

              }


              // ===========================================
              // Sprint transition reconstruction
              // ===========================================

              function transitions(issue) {

                return (
                  issue.sprintTransitions
                  ||
                  []
                )
                .slice()
                .sort(
                  (a,b) =>
                    a.date.localeCompare(
                      b.date
                    )
                );

              }


              function isBacklog(value) {

                return (
                  String(
                    value
                    ||
                    ""
                  )
                  .trim()
                  .toLowerCase()
                  ===
                  "backlog"
                );

              }


              function isSprintName(value) {

                const normalized =
                  String(
                    value
                    ||
                    ""
                  )
                  .trim();


                if (!normalized) {

                  return false;

                }


                if (
                  projectData
                  .sprints
                  .some(
                    sprint =>
                      sprint.name
                      ===
                      normalized
                  )
                ) {

                  return true;

                }


                // Allows older sprint names which may no
                // longer appear in iteration configuration.

                return /^sprint\b/i
                  .test(
                    normalized
                  );

              }


              function entriesIntoSprint(
                issue,
                sprint
              ) {

                return transitions(
                  issue
                )
                .filter(
                  event =>
                    event.to
                    ===
                    sprint.name
                );

              }


              function departuresFromSprint(
                issue,
                sprint
              ) {

                return transitions(
                  issue
                )
                .filter(
                  event =>
                    event.from
                    ===
                    sprint.name
                    &&
                    event.to
                    !==
                    sprint.name
                );

              }


              /*
               * Find the transition that establishes
               * membership in the selected sprint as of
               * the end of the sprint's first calendar day.
               *
               * Entry on the first day counts as committed.
               */

              function committedEntry(
                issue,
                sprint
              ) {

                const events =
                  transitions(
                    issue
                  )
                  .filter(
                    event =>
                      event.date
                      <=
                      sprint.start
                  );


                let location =
                  null;


                let entry =
                  null;


                events.forEach(
                  event => {

                    if (
                      event.to
                      ===
                      sprint.name
                    ) {

                      location =
                        sprint.name;

                      entry =
                        event;

                      return;

                    }


                    if (
                      event.from
                      ===
                      sprint.name
                    ) {

                      location =
                        event.to;

                      entry =
                        null;

                    }

                  }
                );


                return (
                  location
                  ===
                  sprint.name
                  ?
                  entry
                  :
                  null
                );

              }


              function committedIssues(
                sprint
              ) {

                return projectData
                  .issues
                  .filter(
                    issue =>
                      Boolean(
                        committedEntry(
                          issue,
                          sprint
                        )
                      )
                  );

              }


              /*
               * Carryover is a separate attribute of the
               * sprint entry.
               *
               * Any Sprint -> selected Sprint transition
               * counts, including an older sprint.
               *
               * Backlog -> selected Sprint does not.
               */

              function carryoverEntry(
                issue,
                sprint
              ) {

                const entries =
                  entriesIntoSprint(
                    issue,
                    sprint
                  );


                for (
                  let index =
                    entries.length - 1;

                  index >= 0;

                  index--
                ) {

                  const entry =
                    entries[index];


                  if (
                    isSprintName(
                      entry.from
                    )
                    &&
                    entry.from
                    !==
                    sprint.name
                  ) {

                    return entry;

                  }


                  if (
                    isBacklog(
                      entry.from
                    )
                  ) {

                    return null;

                  }

                }


                return null;

              }


              function carriedOverIssues(
                sprint
              ) {

                return projectData
                  .issues
                  .filter(
                    issue =>
                      Boolean(
                        carryoverEntry(
                          issue,
                          sprint
                        )
                      )
                  );

              }


              /*
               * Added Late:
               *
               * Any transition INTO the selected sprint
               * after the first calendar day of the sprint.
               *
               * This can overlap with Carryover if someone
               * moves an old-sprint issue into the current
               * sprint after day one.
               */

              function addedLateIssues(
                sprint
              ) {

                return projectData
                  .issues
                  .filter(
                    issue =>
                      entriesIntoSprint(
                        issue,
                        sprint
                      )
                      .some(
                        entry =>
                          entry.date
                          >
                          sprint.start
                          &&
                          entry.date
                          <=
                          sprint.end
                      )
                  );

              }


              function removedIssues(
                sprint
              ) {

                return projectData
                  .issues
                  .filter(
                    issue =>
                      departuresFromSprint(
                        issue,
                        sprint
                      )
                      .some(
                        event =>
                          within(
                            event.date,
                            sprint
                          )
                      )
                  );

              }


              function entryDescription(
                issue,
                sprint
              ) {

                const committed =
                  committedEntry(
                    issue,
                    sprint
                  );


                if (committed) {

                  if (
                    isSprintName(
                      committed.from
                    )
                    &&
                    committed.from
                    !==
                    sprint.name
                  ) {

                    return "Carryover";

                  }


                  return "Committed";

                }


                const late =
                  entriesIntoSprint(
                    issue,
                    sprint
                  )
                  .find(
                    entry =>
                      entry.date
                      >
                      sprint.start
                      &&
                      entry.date
                      <=
                      sprint.end
                  );


                if (late) {

                  if (
                    isSprintName(
                      late.from
                    )
                  ) {

                    return "Late Carryover";

                  }


                  return "Added Late";

                }


                return "";

              }


              function carriedFrom(
                issue,
                sprint
              ) {

                const entry =
                  carryoverEntry(
                    issue,
                    sprint
                  );


                return (
                  entry
                  ?
                  entry.from
                  :
                  ""
                );

              }


              // ===========================================
              // Core issue metrics
              // ===========================================

              function openedIssues(
                sprint,
                priority = null
              ) {

                return projectData
                  .issues
                  .filter(
                    issue =>
                      (
                        priority
                        ===
                        null
                        ||
                        issue.priority
                        ===
                        priority
                      )
                      &&
                      within(
                        issue.opened,
                        sprint
                      )
                  );

              }


              function closedIssues(
                sprint,
                priority = null
              ) {

                return projectData
                  .issues
                  .filter(
                    issue =>
                      (
                        priority
                        ===
                        null
                        ||
                        issue.priority
                        ===
                        priority
                      )
                      &&
                      within(
                        issue.closed,
                        sprint
                      )
                  );

              }


              function plannedScopeIssues(
                sprint
              ) {

                const ids =
                  new Set();


                committedIssues(
                  sprint
                )
                .forEach(
                  issue =>
                    ids.add(
                      issueId(issue)
                    )
                );


                addedLateIssues(
                  sprint
                )
                .forEach(
                  issue =>
                    ids.add(
                      issueId(issue)
                    )
                );


                return projectData
                  .issues
                  .filter(
                    issue =>
                      ids.has(
                        issueId(issue)
                      )
                  );

              }


              function completionIssues(
                sprint
              ) {

                const scopeIds =
                  new Set(
                    plannedScopeIssues(
                      sprint
                    )
                    .map(issueId)
                  );


                return closedIssues(
                  sprint
                )
                .filter(
                  issue =>
                    scopeIds.has(
                      issueId(issue)
                    )
                );

              }


              function completionRate(
                sprint
              ) {

                const scope =
                  plannedScopeIssues(
                    sprint
                  );


                if (!scope.length) {

                  return 0;

                }


                return (
                  completionIssues(
                    sprint
                  ).length
                  /
                  scope.length
                  *
                  100
                );

              }


              // ===========================================
              // Status
              // ===========================================

              function statusIssues(
                sprint,
                status,
                priority = null
              ) {

                return projectData
                  .issues
                  .filter(
                    issue =>
                      (
                        priority
                        ===
                        null
                        ||
                        issue.priority
                        ===
                        priority
                      )
                      &&
                      (
                        issue.statusEvents
                        ||
                        []
                      )
                      .some(
                        event =>
                          event.status
                          ===
                          status
                          &&
                          within(
                            event.date,
                            sprint
                          )
                      )
                  );

              }


              function statusDates(
                issue,
                status
              ) {

                return (
                  issue.statusEvents
                  ||
                  []
                )
                .filter(
                  event =>
                    event.status
                    ===
                    status
                )
                .map(
                  event =>
                    event.date
                )
                .sort();

              }


              function workedIssues(
                sprint
              ) {

                const ids =
                  new Set();


                projectData
                  .issues
                  .forEach(
                    issue => {

                      if (
                        within(
                          issue.closed,
                          sprint
                        )
                      ) {

                        ids.add(
                          issueId(issue)
                        );

                      }


                      (
                        issue.statusEvents
                        ||
                        []
                      )
                      .forEach(
                        event => {

                          if (
                            within(
                              event.date,
                              sprint
                            )
                          ) {

                            ids.add(
                              issueId(issue)
                            );

                          }

                        }
                      );

                    }
                  );


                return projectData
                  .issues
                  .filter(
                    issue =>
                      ids.has(
                        issueId(issue)
                      )
                  );

              }


              // ===========================================
              // Bugs
              // ===========================================

              function isBug(issue) {

                return (
                  String(
                    issue.issueType
                    ||
                    ""
                  )
                  .toLowerCase()
                  ===
                  "bug"
                );

              }


              function bugsOpened(
                sprint,
                priority = null
              ) {

                return openedIssues(
                  sprint,
                  priority
                )
                .filter(
                  isBug
                );

              }


              function bugsClosed(
                sprint,
                priority = null
              ) {

                return closedIssues(
                  sprint,
                  priority
                )
                .filter(
                  isBug
                );

              }


              // ===========================================
              // Cards
              // ===========================================

              function addKpi(
                container,
                label,
                value,
                issues = null,
                subtext = ""
              ) {

                const card =
                  document
                  .createElement(
                    "div"
                  );


                card.className =
                  issues
                  ?
                  "card clickable"
                  :
                  "card";


                card.innerHTML = `

                  <div
                    class="label">

                    ${
                      escapeHtml(
                        label
                      )
                    }

                  </div>

                  <div
                    class="number">

                    ${
                      escapeHtml(
                        value
                      )
                    }

                  </div>

                  ${
                    subtext
                    ?
                    `
                    <div
                      class="subnumber">

                      ${
                        escapeHtml(
                          subtext
                        )
                      }

                    </div>
                    `
                    :
                    ""
                  }

                `;


                if (issues) {

                  card.onclick =
                    () =>
                      openDrilldown(
                        label,
                        selectedSprint(),
                        issues
                      );

                }


                container.appendChild(
                  card
                );

              }


