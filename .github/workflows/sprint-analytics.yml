name: Sprint Analytics

on:
  workflow_dispatch:

  schedule:
    # 8:00 AM EDT / 7:00 AM EST
    - cron: "0 12 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ORG: ${{ github.repository_owner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ACTIONS_APP_ID }}
          private-key: ${{ secrets.ACTIONS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build dashboard data
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          mkdir -p site/data

          python3 <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timedelta
          from pathlib import Path

          ORG = os.environ["ORG"]

          DEFAULT_PRIORITIES = [
              "PROD Critical",
              "P1",
              "P2",
              "P3",
              "P4",
          ]


          def graphql(query, variables=None):
              variables = variables or {}

              cmd = [
                  "gh",
                  "api",
                  "graphql",
                  "-f",
                  f"query={query}",
              ]

              for key, value in variables.items():
                  if value is not None:
                      cmd += [
                          "-F",
                          f"{key}={value}",
                      ]

              result = subprocess.run(
                  cmd,
                  check=True,
                  capture_output=True,
                  text=True,
              )

              return json.loads(result.stdout)


          PROJECTS_QUERY = """
          query($org: String!) {
            organization(login: $org) {
              projectsV2(first: 100) {
                nodes {
                  number
                  title
                  shortDescription
                  closed
                  url
                }
              }
            }
          }
          """

          result = graphql(
              PROJECTS_QUERY,
              {"org": ORG},
          )

          projects = [
              p
              for p in (
                  result["data"]
                  ["organization"]
                  ["projectsV2"]
                  ["nodes"]
              )
              if not p["closed"]
          ]

          print(
              f"Found {len(projects)} open projects"
          )


          PROJECT_QUERY = """
          query(
            $org: String!,
            $number: Int!,
            $cursor: String
          ) {
            organization(login: $org) {
              projectV2(number: $number) {

                number
                title
                shortDescription
                url

                fields(first: 100) {
                  nodes {

                    ... on ProjectV2SingleSelectField {
                      name

                      options {
                        name
                      }
                    }

                    ... on ProjectV2IterationField {
                      name

                      configuration {
                        iterations {
                          title
                          startDate
                          duration
                        }

                        completedIterations {
                          title
                          startDate
                          duration
                        }
                      }
                    }
                  }
                }

                items(
                  first: 100,
                  after: $cursor
                ) {
                  pageInfo {
                    hasNextPage
                    endCursor
                  }

                  nodes {
                    fieldValues(first: 50) {
                      nodes {

                        ... on ProjectV2ItemFieldSingleSelectValue {
                          name

                          field {
                            ... on ProjectV2FieldCommon {
                              name
                            }
                          }
                        }

                        ... on ProjectV2ItemFieldIterationValue {
                          title
                          startDate
                          duration

                          field {
                            ... on ProjectV2FieldCommon {
                              name
                            }
                          }
                        }
                      }
                    }

                    content {
                      ... on Issue {
                        number
                        title
                        state
                        createdAt
                        closedAt
                        url

                        repository {
                          nameWithOwner
                        }

                        issueType {
                          name
                        }

                        issueFieldValues(first: 30) {
                          nodes {

                            ... on IssueFieldSingleSelectValue {
                              name

                              field {
                                ... on IssueFieldSingleSelect {
                                  name
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
          """


          TIMELINE_QUERY = """
          query(
            $owner: String!,
            $repo: String!,
            $number: Int!
          ) {
            repository(
              owner: $owner,
              name: $repo
            ) {
              issue(number: $number) {

                timelineItems(
                  first: 250,
                  itemTypes: [
                    PROJECT_V2_ITEM_STATUS_CHANGED_EVENT
                  ]
                ) {
                  nodes {

                    ... on ProjectV2ItemStatusChangedEvent {
                      createdAt
                      previousStatus
                      status
                    }
                  }
                }
              }
            }
          }
          """


          def issue_priority(issue, item):

              for value in (
                  issue
                  .get("issueFieldValues", {})
                  .get("nodes", [])
              ):
                  field = value.get("field") or {}

                  if field.get("name") == "Priority":
                      return (
                          value.get("name")
                          or "Unspecified"
                      )

              for value in (
                  item
                  .get("fieldValues", {})
                  .get("nodes", [])
              ):
                  field = value.get("field") or {}

                  if field.get("name") == "Priority":
                      return (
                          value.get("name")
                          or "Unspecified"
                      )

              return "Unspecified"


          history_cache = {}


          def get_issue_history(repository, number):

              cache_key = (
                  f"{repository}#{number}"
              )

              if cache_key in history_cache:
                  return history_cache[
                      cache_key
                  ]

              owner, repo = (
                  repository.split("/", 1)
              )

              history = graphql(
                  TIMELINE_QUERY,
                  {
                      "owner": owner,
                      "repo": repo,
                      "number": number,
                  },
              )

              nodes = (
                  history["data"]
                  ["repository"]
                  ["issue"]
                  ["timelineItems"]
                  ["nodes"]
              )

              history_cache[
                  cache_key
              ] = nodes

              return nodes


          def load_project(project):

              cursor = None
              issues = []
              sprints = {}
              metadata = None
              statuses = []
              project_priorities = []

              while True:

                  response = graphql(
                      PROJECT_QUERY,
                      {
                          "org": ORG,
                          "number": project["number"],
                          "cursor": cursor,
                      },
                  )

                  pv2 = (
                      response["data"]
                      ["organization"]
                      ["projectV2"]
                  )

                  if metadata is None:

                      metadata = {
                          "number":
                              pv2["number"],

                          "title":
                              pv2["title"],

                          "description":
                              (
                                  pv2.get(
                                      "shortDescription"
                                  )
                                  or ""
                              ),

                          "url":
                              pv2["url"],
                      }

                      for field in (
                          pv2["fields"]["nodes"]
                      ):

                          name = field.get("name")

                          if name == "Status":

                              statuses = [
                                  option["name"]
                                  for option in (
                                      field.get(
                                          "options",
                                          []
                                      )
                                  )
                              ]

                          if name == "Priority":

                              project_priorities = [
                                  option["name"]
                                  for option in (
                                      field.get(
                                          "options",
                                          []
                                      )
                                  )
                              ]

                          config = (
                              field.get(
                                  "configuration"
                              )
                          )

                          if not config:
                              continue

                          iterations = (
                              config.get(
                                  "completedIterations",
                                  []
                              )
                              +
                              config.get(
                                  "iterations",
                                  []
                              )
                          )

                          for sprint in iterations:

                              start = (
                                  sprint["startDate"]
                              )

                              duration = (
                                  sprint["duration"]
                              )

                              end = (
                                  datetime
                                  .fromisoformat(start)
                                  +
                                  timedelta(
                                      days=duration - 1
                                  )
                              ).date().isoformat()

                              sprints[
                                  sprint["title"]
                              ] = {
                                  "name":
                                      sprint["title"],

                                  "start":
                                      start,

                                  "end":
                                      end,

                                  "duration":
                                      duration,
                              }

                  connection = pv2["items"]

                  for item in connection["nodes"]:

                      issue = item.get("content")

                      if not issue:
                          continue

                      if not issue.get("number"):
                          continue

                      repository = (
                          issue
                          .get("repository", {})
                          .get("nameWithOwner")
                      )

                      if not repository:
                          continue

                      issue_type = (
                          (
                              issue.get("issueType")
                              or {}
                          )
                          .get("name")
                          or "Unspecified"
                      )

                      issues.append({
                          "number":
                              issue["number"],

                          "repository":
                              repository,

                          "title":
                              issue["title"],

                          "url":
                              issue["url"],

                          "priority":
                              issue_priority(
                                  issue,
                                  item,
                              ),

                          "issueType":
                              issue_type,

                          "opened":
                              issue["createdAt"][:10],

                          "closed":
                              (
                                  issue["closedAt"][:10]
                                  if issue["closedAt"]
                                  else None
                              ),

                          "events":
                              [],
                      })

                  if not connection[
                      "pageInfo"
                  ][
                      "hasNextPage"
                  ]:
                      break

                  cursor = connection[
                      "pageInfo"
                  ][
                      "endCursor"
                  ]


              for index, issue in enumerate(
                  issues,
                  start=1,
              ):

                  print(
                      f'Project {project["number"]}: '
                      f'[{index}/{len(issues)}] '
                      f'{issue["repository"]}'
                      f'#{issue["number"]}'
                  )

                  try:

                      nodes = get_issue_history(
                          issue["repository"],
                          issue["number"],
                      )

                      for event in nodes:

                          status = (
                              event.get("status")
                          )

                          if not status:
                              continue

                          issue["events"].append({
                              "status":
                                  status,

                              "date":
                                  event[
                                      "createdAt"
                                  ][:10],
                          })

                  except Exception as exc:

                      print(
                          f'Warning reading '
                          f'{issue["repository"]}'
                          f'#{issue["number"]}: '
                          f'{exc}'
                      )


              actual_priorities = []


              for priority in DEFAULT_PRIORITIES:

                  if any(
                      issue["priority"]
                      ==
                      priority
                      for issue in issues
                  ):
                      actual_priorities.append(
                          priority
                      )


              for priority in project_priorities:

                  if (
                      priority
                      not in actual_priorities
                  ):
                      actual_priorities.append(
                          priority
                      )


              extra_priorities = sorted({
                  issue["priority"]
                  for issue in issues
                  if (
                      issue["priority"]
                      not in actual_priorities
                      and
                      issue["priority"]
                      != "Unspecified"
                  )
              })


              actual_priorities.extend(
                  extra_priorities
              )


              if any(
                  issue["priority"]
                  ==
                  "Unspecified"
                  for issue in issues
              ):
                  actual_priorities.append(
                      "Unspecified"
                  )


              return {
                  "project":
                      metadata,

                  "sprints":
                      sorted(
                          sprints.values(),
                          key=lambda x:
                              x["start"],
                      ),

                  "statuses":
                      statuses,

                  "priorities":
                      actual_priorities,

                  "issues":
                      issues,
              }


          output_projects = []


          for project in projects:

              data = load_project(
                  project
              )

              slug = (
                  f'project-'
                  f'{project["number"]}'
              )

              Path(
                  f"site/data/{slug}.json"
              ).write_text(
                  json.dumps(
                      data,
                      indent=2,
                  )
              )

              output_projects.append({
                  "number":
                      project["number"],

                  "title":
                      project["title"],

                  "description":
                      (
                          project.get(
                              "shortDescription"
                          )
                          or ""
                      ),

                  "slug":
                      slug,

                  "issueCount":
                      len(
                          data["issues"]
                      ),

                  "sprintCount":
                      len(
                          data["sprints"]
                      ),

                  "statusCount":
                      len(
                          data["statuses"]
                      ),
              })


          Path(
              "site/data/projects.json"
          ).write_text(
              json.dumps(
                  output_projects,
                  indent=2,
              )
          )

          PY


      - name: Create Sprint Analytics dashboard
        run: |
          cat > site/index.html <<'EOF'
          <!doctype html>

          <html lang="en">

          <head>

            <meta charset="utf-8">

            <meta
              name="viewport"
              content="width=device-width,initial-scale=1"
            >

            <title>
              Sprint Analytics
            </title>

            <script
              src="https://cdn.jsdelivr.net/npm/chart.js">
            </script>


            <style>

              :root {
                --blue: #2499e8;
                --blue-dark: #177fc4;
                --blue-deep: #0f5f98;
                --blue-light: #eaf6fd;

                --green: #49b94f;

                --navy: #172033;
                --text: #172033;
                --muted: #5f6b7a;

                --border: #d7e0e7;

                --page-bg: #f4f6f8;
                --card: #ffffff;
              }


              * {
                box-sizing: border-box;
              }


              html,
              body {
                min-height: 100%;
              }


              body {
                margin: 0;

                background:
                  var(--page-bg);

                color:
                  var(--text);

                font-family:
                  Inter,
                  system-ui,
                  -apple-system,
                  BlinkMacSystemFont,
                  "Segoe UI",
                  sans-serif;
              }


              main {
                max-width: 1600px;

                margin: auto;

                padding:
                  0 32px 40px;
              }


              /* ==========================================
                 HEADER ONLY
                 ========================================== */

              h1 {
                margin:
                  0 -32px;

                padding:
                  28px 32px 24px;

                background:
                  var(--blue-deep);

                color:
                  #ffffff;

                font-size: 30px;

                font-weight: 800;

                border: none;
              }


              h3 {
                margin-top: 0;

                color:
                  var(--navy);
              }


              .muted {
                color:
                  var(--muted);
              }


              /* ==========================================
                 FILTER AREA
                 ========================================== */

              .toolbar {
                display: flex;

                gap: 12px;

                margin:
                  0 -32px 24px;

                padding:
                  18px 32px;

                background:
                  var(--page-bg);

                border-top:
                  none;

                border-bottom:
                  1px solid
                  var(--border);
              }


              select {
                min-width: 220px;

                padding:
                  10px 14px;

                background:
                  #ffffff;

                color:
                  var(--navy);

                border:
                  1px solid
                  var(--border);

                border-radius: 8px;

                font-weight: 700;

                cursor: pointer;
              }


              select:focus {
                outline:
                  3px solid
                  var(--blue-light);

                border-color:
                  var(--blue);
              }


              /* ==========================================
                 KPI cards
                 ========================================== */

              .kpis {
                display: grid;

                grid-template-columns:
                  repeat(
                    auto-fit,
                    minmax(
                      170px,
                      1fr
                    )
                  );

                gap: 15px;

                margin-bottom: 12px;
              }


              .card {
                background:
                  #ffffff;

                color:
                  var(--text);

                border:
                  1px solid
                  var(--border);

                border-radius: 14px;

                padding: 18px;

                box-shadow:
                  0 3px 10px
                  rgba(
                    23,
                    32,
                    51,
                    .08
                  );
              }


              .clickable {
                cursor: pointer;

                transition:
                  transform .12s ease,
                  box-shadow .12s ease;
              }


              .clickable:hover {
                transform:
                  translateY(-2px);

                box-shadow:
                  0 8px 22px
                  rgba(
                    0,
                    0,
                    0,
                    .14
                  );
              }


              .label {
                color:
                  #536174;

                font-size: 11px;

                font-weight: 800;

                text-transform:
                  uppercase;

                letter-spacing:
                  .04em;
              }


              .number {
                margin-top: 6px;

                color:
                  var(--navy);

                font-size: 32px;

                font-weight: 800;
              }


              /* ==========================================
                 Secondary statuses
                 ========================================== */

              .secondary-statuses {
                display: flex;

                flex-wrap: wrap;

                gap: 8px;

                margin:
                  0 0 20px;
              }


              .status-chip {
                display:
                  inline-flex;

                align-items: center;

                gap: 8px;

                padding:
                  7px 11px;

                border:
                  1px solid
                  var(--border);

                border-radius:
                  999px;

                background:
                  #ffffff;

                color:
                  var(--navy);

                font-size:
                  12px;

                font-weight:
                  650;

                cursor:
                  pointer;

                box-shadow:
                  0 2px 5px
                  rgba(
                    0,
                    0,
                    0,
                    .06
                  );
              }


              .status-chip strong {
                color:
                  var(--blue-deep);

                font-weight:
                  800;
              }


              .status-chip:hover {
                background:
                  var(--blue-light);

                border-color:
                  var(--blue);
              }


              /* ==========================================
                 Charts
                 ========================================== */

              .grid {
                display: grid;

                grid-template-columns:
                  2fr 1fr;

                gap: 18px;

                margin-bottom: 18px;
              }


              .chart {
                height: 330px;
              }


              /* ==========================================
                 Priority table
                 ========================================== */

              .table-wrap {
                overflow-x: auto;
              }


              table {
                width: 100%;

                border-collapse:
                  collapse;
              }


              th,
              td {
                padding: 11px;

                border-bottom:
                  1px solid
                  #eef1f5;

                text-align: right;

                vertical-align: top;

                white-space: nowrap;
              }


              th {
                background:
                  var(--blue-light);

                color:
                  var(--blue-deep);

                font-size: 11px;

                font-weight: 800;

                text-transform:
                  uppercase;
              }


              th:first-child,
              td:first-child {
                text-align: left;
              }


              tbody tr:hover {
                background:
                  #f8fbfd;
              }


              .metric-cell {
                cursor: pointer;

                color:
                  var(--blue-deep);

                font-weight: 750;

                text-decoration:
                  underline dotted;

                text-underline-offset:
                  3px;
              }


              .metric-cell:hover {
                background:
                  var(--blue-light);

                color:
                  var(--blue-deep);
              }


              /* ==========================================
                 Drilldown
                 ========================================== */

              .modal-backdrop {
                position: fixed;

                inset: 0;

                z-index: 1000;

                display: flex;

                align-items: center;

                justify-content:
                  center;

                padding: 18px;

                background:
                  rgba(
                    15,
                    23,
                    42,
                    .58
                  );
              }


              .modal-backdrop.hidden {
                display: none;
              }


              .modal {
                width: 98vw;

                max-width: 1900px;

                max-height: 92vh;

                background:
                  #ffffff;

                border-radius: 16px;

                overflow: hidden;

                box-shadow:
                  0 30px 80px
                  rgba(
                    0,
                    0,
                    0,
                    .28
                  );
              }


              .modal-header {
                display: flex;

                justify-content:
                  space-between;

                align-items:
                  center;

                padding:
                  20px 24px;

                background:
                  var(--blue-deep);

                color:
                  #ffffff;

                border: none;
              }


              .modal-header h2 {
                margin:
                  0 0 4px;

                color:
                  #ffffff;
              }


              .modal-header .muted {
                color:
                  rgba(
                    255,
                    255,
                    255,
                    .88
                  );
              }


              .modal-body {
                max-height: 78vh;

                overflow: auto;
              }


              .close-button {
                border: 0;

                background:
                  transparent;

                color:
                  #ffffff;

                font-size: 32px;

                cursor: pointer;
              }


              .drilldown-table th {
                position: sticky;

                top: 0;

                z-index: 3;
              }


              .drilldown-table td {
                font-size: 12px;
              }


              .issue-column {
                min-width: 190px;
              }


              .title-column {
                min-width: 280px;

                max-width: 400px;

                text-align: left;
              }


              .date-column {
                min-width: 120px;

                line-height: 1.6;
              }


              .issue-link {
                color:
                  var(--blue-deep);

                text-decoration: none;

                font-weight: 750;
              }


              .issue-link:hover {
                text-decoration:
                  underline;
              }


              .highlight {
                background:
                  var(--blue-light)
                  !important;

                box-shadow:
                  inset 3px 0 0
                  var(--blue);
              }


              .empty-state {
                padding: 50px;

                text-align: center;

                color:
                  var(--muted);
              }


              @media(max-width:900px) {

                main {
                  padding:
                    0 18px 30px;
                }


                h1 {
                  margin:
                    0 -18px;

                  padding:
                    22px 18px;
                }


                .toolbar {
                  margin:
                    0 -18px 20px;

                  padding:
                    15px 18px;

                  flex-direction:
                    column;
                }


                select {
                  width: 100%;
                }


                .grid {
                  grid-template-columns:
                    1fr;
                }

              }

            </style>

          </head>


          <body>

            <main>

              <h1>
                Sprint Analytics
              </h1>


              <div class="toolbar">

                <select
                  id="projectSelect">
                </select>

                <select
                  id="sprintSelect">
                </select>

              </div>


              <section
                id="statusKpis"
                class="kpis">
              </section>


              <div
                id="secondaryStatuses"
                class="secondary-statuses">
              </div>


              <div class="grid">

                <section class="card">

                  <h3>
                    Sprint Flow
                  </h3>

                  <div class="chart">

                    <canvas
                      id="flowChart">
                    </canvas>

                  </div>

                </section>


                <section class="card">

                  <h3>
                    Bugs vs Enhancements
                  </h3>

                  <div class="chart">

                    <canvas
                      id="mixChart">
                    </canvas>

                  </div>

                </section>

              </div>


              <section class="card">

                <h3>
                  Flow by Priority
                </h3>

                <div class="table-wrap">

                  <table>

                    <thead>

                      <tr
                        id="priorityHeader">
                      </tr>

                    </thead>

                    <tbody
                      id="priorityRows">
                    </tbody>

                  </table>

                </div>

              </section>

            </main>


            <div
              id="drilldownBackdrop"
              class="modal-backdrop hidden">

              <div class="modal">

                <div class="modal-header">

                  <div>

                    <h2
                      id="drilldownTitle">
                    </h2>

                    <div
                      id="drilldownSubtitle"
                      class="muted">
                    </div>

                  </div>


                  <button
                    id="closeDrilldown"
                    class="close-button"
                    type="button">
                    ×
                  </button>

                </div>


                <div class="modal-body">

                  <table
                    class="drilldown-table">

                    <thead>

                      <tr
                        id="drilldownHeader">
                      </tr>

                    </thead>

                    <tbody
                      id="drilldownRows">
                    </tbody>

                  </table>


                  <div
                    id="drilldownEmpty"
                    class="empty-state"
                    style="display:none">

                    No matching issues.

                  </div>

                </div>

              </div>

            </div>


            <script>

              let projectData =
                null;


              function within(
                date,
                sprint
              ) {

                return (
                  date
                  &&
                  date >= sprint.start
                  &&
                  date <= sprint.end
                );

              }


              function escapeHtml(
                value
              ) {

                return String(
                  value ?? ""
                )
                .replaceAll(
                  "&",
                  "&amp;"
                )
                .replaceAll(
                  "<",
                  "&lt;"
                )
                .replaceAll(
                  ">",
                  "&gt;"
                )
                .replaceAll(
                  '"',
                  "&quot;"
                )
                .replaceAll(
                  "'",
                  "&#039;"
                );

              }


              function issueId(
                issue
              ) {

                return (
                  issue.repository
                  +
                  "#"
                  +
                  issue.number
                );

              }


              function isBug(
                issue
              ) {

                return (
                  (
                    issue.issueType
                    ||
                    ""
                  )
                  .toLowerCase()
                  ===
                  "bug"
                );

              }


              function isEnhancement(
                issue
              ) {

                return (
                  (
                    issue.issueType
                    ||
                    ""
                  )
                  .toLowerCase()
                  ===
                  "enhancement"
                );

              }


              function selectedSprint() {

                if (!projectData) {
                  return null;
                }


                const index =
                  Number(
                    document
                    .getElementById(
                      "sprintSelect"
                    )
                    .value
                  );


                return (
                  projectData
                  .sprints[index]
                  ||
                  null
                );

              }


              function statusDates(
                issue,
                status
              ) {

                return issue.events
                  .filter(
                    event =>
                      event.status
                      ===
                      status
                  )
                  .map(
                    event =>
                      event.date
                  )
                  .sort();

              }


              function renderDates(
                dates
              ) {

                return dates
                  .map(
                    date =>
                      escapeHtml(
                        date
                      )
                  )
                  .join("<br>");

              }


              function matchingStatusIssues(
                sprint,
                status,
                priority = null
              ) {

                return (
                  projectData
                  .issues
                  .filter(
                    issue =>
                      (
                        !priority
                        ||
                        issue.priority
                        ===
                        priority
                      )
                      &&
                      issue.events
                      .some(
                        event =>
                          event.status
                          ===
                          status
                          &&
                          within(
                            event.date,
                            sprint
                          )
                      )
                  )
                );

              }


              function openedIssues(
                sprint,
                priority = null
              ) {

                return projectData
                  .issues
                  .filter(
                    issue =>
                      (
                        !priority
                        ||
                        issue.priority
                        ===
                        priority
                      )
                      &&
                      within(
                        issue.opened,
                        sprint
                      )
                  );

              }


              function closedIssues(
                sprint,
                priority = null
              ) {

                return projectData
                  .issues
                  .filter(
                    issue =>
                      (
                        !priority
                        ||
                        issue.priority
                        ===
                        priority
                      )
                      &&
                      within(
                        issue.closed,
                        sprint
                      )
                  );

              }


              function bugOpenedIssues(
                sprint,
                priority = null
              ) {

                return openedIssues(
                  sprint,
                  priority
                )
                .filter(
                  isBug
                );

              }


              function bugClosedIssues(
                sprint,
                priority = null
              ) {

                return closedIssues(
                  sprint,
                  priority
                )
                .filter(
                  isBug
                );

              }


              function workedIssues(
                sprint,
                type
              ) {

                const ids =
                  new Set();


                projectData
                  .issues
                  .forEach(
                    issue => {

                      if (
                        within(
                          issue.closed,
                          sprint
                        )
                      ) {

                        ids.add(
                          issueId(
                            issue
                          )
                        );

                      }


                      issue.events
                        .forEach(
                          event => {

                            if (
                              within(
                                event.date,
                                sprint
                              )
                            ) {

                              ids.add(
                                issueId(
                                  issue
                                )
                              );

                            }

                          }
                        );

                    }
                  );


                return projectData
                  .issues
                  .filter(
                    issue => {

                      if (
                        !ids.has(
                          issueId(
                            issue
                          )
                        )
                      ) {

                        return false;

                      }


                      if (
                        type ===
                        "bug"
                      ) {

                        return isBug(
                          issue
                        );

                      }


                      if (
                        type ===
                        "enhancement"
                      ) {

                        return isEnhancement(
                          issue
                        );

                      }


                      return true;

                    }
                  );

              }


              function renderKpis(
                sprint
              ) {

                const container =
                  document
                  .getElementById(
                    "statusKpis"
                  );


                const secondary =
                  document
                  .getElementById(
                    "secondaryStatuses"
                  );


                container.innerHTML =
                  "";


                secondary.innerHTML =
                  "";


                const statusMetrics =
                  projectData
                  .statuses
                  .map(
                    status => ({

                      status:
                        status,

                      issues:
                        matchingStatusIssues(
                          sprint,
                          status
                        )

                    })
                  );


                const primaryStatuses =
                  statusMetrics
                  .filter(
                    item =>
                      item.issues.length
                      >
                      0
                  )
                  .slice(
                    0,
                    4
                  );


                const primaryItems = [

                  {
                    label:
                      "Opened",

                    issues:
                      openedIssues(
                        sprint
                      ),

                    highlight:
                      "opened"
                  },


                  ...primaryStatuses
                  .map(
                    item => ({

                      label:
                        item.status,

                      issues:
                        item.issues,

                      highlight:
                        item.status

                    })
                  ),


                  {
                    label:
                      "Closed",

                    issues:
                      closedIssues(
                        sprint
                      ),

                    highlight:
                      "closed"
                  }

                ];


                primaryItems
                  .forEach(
                    item => {

                      const card =
                        document
                        .createElement(
                          "div"
                        );


                      card.className =
                        "card clickable";


                      card.innerHTML = `

                        <div
                          class="label">

                          ${
                            escapeHtml(
                              item.label
                            )
                          }

                        </div>

                        <div
                          class="number">

                          ${
                            item
                            .issues
                            .length
                          }

                        </div>

                      `;


                      card.onclick =
                        () =>
                          openDrilldown(

                            item.label,

                            sprint,

                            item.issues,

                            item.highlight

                          );


                      container
                        .appendChild(
                          card
                        );

                    }
                  );


                const primaryNames =
                  new Set(
                    primaryStatuses
                    .map(
                      item =>
                        item.status
                    )
                  );


                statusMetrics
                  .filter(
                    item =>
                      !primaryNames
                      .has(
                        item.status
                      )
                  )
                  .forEach(
                    item => {

                      const chip =
                        document
                        .createElement(
                          "button"
                        );


                      chip.className =
                        "status-chip";


                      chip.type =
                        "button";


                      chip.innerHTML = `

                        <span>

                          ${
                            escapeHtml(
                              item.status
                            )
                          }

                        </span>

                        <strong>

                          ${
                            item
                            .issues
                            .length
                          }

                        </strong>

                      `;


                      chip.onclick =
                        () =>
                          openDrilldown(

                            item.status,

                            sprint,

                            item.issues,

                            item.status

                          );


                      secondary
                        .appendChild(
                          chip
                        );

                    }
                  );

              }


              const flowChart =
                new Chart(
                  document
                  .getElementById(
                    "flowChart"
                  ),
                  {

                    type:
                      "bar",

                    data: {

                      labels:
                        [],

                      datasets: [{

                        label:
                          "Issues",

                        data:
                          [],

                        backgroundColor:
                          "#2499e8",

                        borderWidth:
                          0

                      }]

                    },

                    options: {

                      responsive:
                        true,

                      maintainAspectRatio:
                        false,

                      onClick:
                        (
                          event,
                          elements
                        ) => {

                          if (
                            !elements.length
                          ) {
                            return;
                          }


                          const sprint =
                            selectedSprint();


                          const index =
                            elements[0]
                            .index;


                          const descriptor =
                            flowChart
                            ._metricDescriptors[
                              index
                            ];


                          if (
                            !descriptor
                          ) {
                            return;
                          }


                          openDrilldown(

                            descriptor.label,

                            sprint,

                            descriptor.issues(),

                            descriptor.highlight

                          );

                        }

                    }

                  }
                );


              function renderFlowChart(
                sprint
              ) {

                const descriptors = [

                  {
                    label:
                      "Opened",

                    issues:
                      () =>
                        openedIssues(
                          sprint
                        ),

                    highlight:
                      "opened"
                  },


                  ...projectData
                  .statuses
                  .map(
                    status => ({

                      label:
                        status,

                      issues:
                        () =>
                          matchingStatusIssues(
                            sprint,
                            status
                          ),

                      highlight:
                        status

                    })
                  ),


                  {
                    label:
                      "Closed",

                    issues:
                      () =>
                        closedIssues(
                          sprint
                        ),

                    highlight:
                      "closed"
                  }

                ];


                flowChart
                  ._metricDescriptors =
                    descriptors;


                flowChart
                  .data
                  .labels =
                    descriptors
                    .map(
                      item =>
                        item.label
                    );


                flowChart
                  .data
                  .datasets[0]
                  .data =
                    descriptors
                    .map(
                      item =>
                        item
                        .issues()
                        .length
                    );


                flowChart
                  .data
                  .datasets[0]
                  .backgroundColor =
                    "#2499e8";


                flowChart.update();

              }


              const mixChart =
                new Chart(
                  document
                  .getElementById(
                    "mixChart"
                  ),
                  {

                    type:
                      "doughnut",

                    data: {

                      labels: [
                        "Bugs",
                        "Enhancements"
                      ],

                      datasets: [{

                        data:
                          [],

                        backgroundColor: [
                          "#2499e8",
                          "#49b94f"
                        ],

                        borderColor:
                          "#ffffff",

                        borderWidth:
                          2

                      }]

                    },

                    options: {

                      responsive:
                        true,

                      maintainAspectRatio:
                        false,

                      onClick:
                        (
                          event,
                          elements
                        ) => {

                          if (
                            !elements.length
                          ) {
                            return;
                          }


                          const sprint =
                            selectedSprint();


                          const type =
                            (
                              elements[0]
                              .index
                              ===
                              0
                            )
                            ?
                            "bug"
                            :
                            "enhancement";


                          openDrilldown(

                            type ===
                            "bug"
                            ?
                            "Bugs Worked On"
                            :
                            "Enhancements Worked On",

                            sprint,

                            workedIssues(
                              sprint,
                              type
                            )

                          );

                        }

                    }

                  }
                );


              function renderMixChart(
                sprint
              ) {

                mixChart
                  .data
                  .datasets[0]
                  .data = [

                    workedIssues(
                      sprint,
                      "bug"
                    ).length,

                    workedIssues(
                      sprint,
                      "enhancement"
                    ).length

                  ];


                mixChart.update();

              }


              function renderPriorityTable(
                sprint
              ) {

                const header =
                  document
                  .getElementById(
                    "priorityHeader"
                  );


                header.innerHTML =
                  "";


                const headers = [

                  "Priority",

                  "Opened",

                  ...projectData.statuses,

                  "Closed",

                  "Bug Opened",

                  "Bug Closed",

                  "Bug C/R"

                ];


                headers
                  .forEach(
                    name => {

                      const th =
                        document
                        .createElement(
                          "th"
                        );


                      th.textContent =
                        name;


                      header
                        .appendChild(
                          th
                        );

                    }
                  );


                const tbody =
                  document
                  .getElementById(
                    "priorityRows"
                  );


                tbody.innerHTML =
                  "";


                projectData
                  .priorities
                  .forEach(
                    priority => {

                      const row =
                        document
                        .createElement(
                          "tr"
                        );


                      const priorityCell =
                        document
                        .createElement(
                          "td"
                        );


                      priorityCell.innerHTML =
                        `<strong>${
                          escapeHtml(
                            priority
                          )
                        }</strong>`;


                      row
                        .appendChild(
                          priorityCell
                        );


                      function addMetricCell(
                        count,
                        callback
                      ) {

                        const td =
                          document
                          .createElement(
                            "td"
                          );


                        td.className =
                          "metric-cell";


                        td.textContent =
                          count;


                        td.onclick =
                          callback;


                        row
                          .appendChild(
                            td
                          );

                      }


                      addMetricCell(

                        openedIssues(
                          sprint,
                          priority
                        ).length,

                        () =>
                          openDrilldown(
                            `${priority} · Opened`,
                            sprint,
                            openedIssues(
                              sprint,
                              priority
                            ),
                            "opened"
                          )

                      );


                      projectData
                        .statuses
                        .forEach(
                          status => {

                            const issues =
                              matchingStatusIssues(
                                sprint,
                                status,
                                priority
                              );


                            addMetricCell(

                              issues.length,

                              () =>
                                openDrilldown(
                                  `${priority} · ${status}`,
                                  sprint,
                                  issues,
                                  status
                                )

                            );

                          }
                        );


                      addMetricCell(

                        closedIssues(
                          sprint,
                          priority
                        ).length,

                        () =>
                          openDrilldown(
                            `${priority} · Closed`,
                            sprint,
                            closedIssues(
                              sprint,
                              priority
                            ),
                            "closed"
                          )

                      );


                      const bugsOpened =
                        bugOpenedIssues(
                          sprint,
                          priority
                        );


                      addMetricCell(

                        bugsOpened.length,

                        () =>
                          openDrilldown(
                            `${priority} · Bugs Opened`,
                            sprint,
                            bugsOpened,
                            "opened"
                          )

                      );


                      const bugsClosed =
                        bugClosedIssues(
                          sprint,
                          priority
                        );


                      addMetricCell(

                        bugsClosed.length,

                        () =>
                          openDrilldown(
                            `${priority} · Bugs Closed`,
                            sprint,
                            bugsClosed,
                            "closed"
                          )

                      );


                      const ratioCell =
                        document
                        .createElement(
                          "td"
                        );


                      ratioCell.textContent =
                        bugsClosed.length
                        ===
                        0
                        ?
                        "—"
                        :
                        (
                          bugsOpened.length
                          /
                          bugsClosed.length
                        ).toFixed(2)
                        +
                        "x";


                      row
                        .appendChild(
                          ratioCell
                        );


                      tbody
                        .appendChild(
                          row
                        );

                    }
                  );

              }


              function openDrilldown(
                title,
                sprint,
                issues,
                highlightField = null
              ) {

                document
                  .getElementById(
                    "drilldownTitle"
                  )
                  .textContent =
                    title;


                document
                  .getElementById(
                    "drilldownSubtitle"
                  )
                  .textContent =

                    `${sprint.name} · ` +
                    `${issues.length} issue` +
                    `${
                      issues.length
                      ===
                      1
                      ?
                      ""
                      :
                      "s"
                    }`;


                const header =
                  document
                  .getElementById(
                    "drilldownHeader"
                  );


                header.innerHTML =
                  "";


                const columns = [

                  {
                    label:
                      "Issue",

                    field:
                      null
                  },

                  {
                    label:
                      "Title",

                    field:
                      null
                  },

                  {
                    label:
                      "Priority",

                    field:
                      null
                  },

                  {
                    label:
                      "Type",

                    field:
                      null
                  },

                  {
                    label:
                      "Open Date",

                    field:
                      "opened"
                  },


                  ...projectData
                  .statuses
                  .map(
                    status => ({

                      label:
                        status,

                      field:
                        status

                    })
                  ),


                  {
                    label:
                      "Close Date",

                    field:
                      "closed"
                  }

                ];


                columns
                  .forEach(
                    column => {

                      const th =
                        document
                        .createElement(
                          "th"
                        );


                      th.textContent =
                        column.label;


                      if (
                        column.field
                        ===
                        highlightField
                      ) {

                        th
                          .classList
                          .add(
                            "highlight"
                          );

                      }


                      header
                        .appendChild(
                          th
                        );

                    }
                  );


                const tbody =
                  document
                  .getElementById(
                    "drilldownRows"
                  );


                const empty =
                  document
                  .getElementById(
                    "drilldownEmpty"
                  );


                tbody.innerHTML =
                  "";


                if (
                  !issues.length
                ) {

                  empty.style.display =
                    "block";

                } else {

                  empty.style.display =
                    "none";


                  issues
                    .forEach(
                      issue => {

                        const row =
                          document
                          .createElement(
                            "tr"
                          );


                        function addCell(
                          html,
                          field = null,
                          className = ""
                        ) {

                          const td =
                            document
                            .createElement(
                              "td"
                            );


                          td.innerHTML =
                            html;


                          td.className =
                            className;


                          if (
                            field
                            ===
                            highlightField
                          ) {

                            td
                              .classList
                              .add(
                                "highlight"
                              );

                          }


                          row
                            .appendChild(
                              td
                            );

                        }


                        addCell(

                          `
                          <a
                            class="issue-link"

                            href="${
                              escapeHtml(
                                issue.url
                              )
                            }"

                            target="_blank"

                            rel="noopener noreferrer">

                            ${
                              escapeHtml(
                                issue.repository
                              )
                            }#${
                              escapeHtml(
                                issue.number
                              )
                            }

                          </a>
                          `,

                          null,

                          "issue-column"

                        );


                        addCell(

                          escapeHtml(
                            issue.title
                          ),

                          null,

                          "title-column"

                        );


                        addCell(
                          escapeHtml(
                            issue.priority
                          )
                        );


                        addCell(
                          escapeHtml(
                            issue.issueType
                          )
                        );


                        addCell(

                          escapeHtml(
                            issue.opened
                            ||
                            ""
                          ),

                          "opened",

                          "date-column"

                        );


                        projectData
                          .statuses
                          .forEach(
                            status => {

                              addCell(

                                renderDates(
                                  statusDates(
                                    issue,
                                    status
                                  )
                                ),

                                status,

                                "date-column"

                              );

                            }
                          );


                        addCell(

                          escapeHtml(
                            issue.closed
                            ||
                            ""
                          ),

                          "closed",

                          "date-column"

                        );


                        tbody
                          .appendChild(
                            row
                          );

                      }
                    );

                }


                document
                  .getElementById(
                    "drilldownBackdrop"
                  )
                  .classList
                  .remove(
                    "hidden"
                  );

              }


              function closeDrilldown() {

                document
                  .getElementById(
                    "drilldownBackdrop"
                  )
                  .classList
                  .add(
                    "hidden"
                  );

              }


              document
                .getElementById(
                  "closeDrilldown"
                )
                .onclick =
                  closeDrilldown;


              document
                .getElementById(
                  "drilldownBackdrop"
                )
                .addEventListener(
                  "click",
                  event => {

                    if (
                      event.target.id
                      ===
                      "drilldownBackdrop"
                    ) {

                      closeDrilldown();

                    }

                  }
                );


              document
                .addEventListener(
                  "keydown",
                  event => {

                    if (
                      event.key
                      ===
                      "Escape"
                    ) {

                      closeDrilldown();

                    }

                  }
                );


              function updateSprint() {

                const sprint =
                  selectedSprint();


                if (!sprint) {
                  return;
                }


                renderKpis(
                  sprint
                );


                renderFlowChart(
                  sprint
                );


                renderMixChart(
                  sprint
                );


                renderPriorityTable(
                  sprint
                );

              }


              function loadProject(
                project
              ) {

                fetch(
                  `data/${project.slug}.json`
                )

                .then(
                  response =>
                    response.json()
                )

                .then(
                  data => {

                    projectData =
                      data;


                    const select =
                      document
                      .getElementById(
                        "sprintSelect"
                      );


                    select.innerHTML =
                      "";


                    data.sprints
                      .forEach(
                        (
                          sprint,
                          index
                        ) => {

                          const option =
                            document
                            .createElement(
                              "option"
                            );


                          option.value =
                            index;


                          option.textContent =

                            `${sprint.name} · ` +
                            `${sprint.start} – ` +
                            `${sprint.end}`;


                          select
                            .appendChild(
                              option
                            );

                        }
                      );


                    const today =
                      new Date()
                      .toISOString()
                      .slice(
                        0,
                        10
                      );


                    const currentIndex =
                      data.sprints
                      .findIndex(
                        sprint =>
                          today
                          >=
                          sprint.start
                          &&
                          today
                          <=
                          sprint.end
                      );


                    select.value =
                      currentIndex
                      >=
                      0
                      ?
                      currentIndex
                      :
                      Math.max(
                        data.sprints.length
                        -
                        1,
                        0
                      );


                    updateSprint();

                  }
                );

              }


              fetch(
                "data/projects.json"
              )

              .then(
                response =>
                  response.json()
              )

              .then(
                projects => {

                  const select =
                    document
                    .getElementById(
                      "projectSelect"
                    );


                  projects
                    .forEach(
                      (
                        project,
                        index
                      ) => {

                        const option =
                          document
                          .createElement(
                            "option"
                          );


                        option.value =
                          index;


                        option.textContent =

                          `${project.title} ` +
                          `(${project.issueCount} issues)`;


                        select
                          .appendChild(
                            option
                          );

                      }
                    );


                  if (
                    projects.length
                  ) {

                    loadProject(
                      projects[0]
                    );

                  }


                  select
                    .addEventListener(
                      "change",
                      event => {

                        loadProject(
                          projects[
                            Number(
                              event.target.value
                            )
                          ]
                        );

                      }
                    );

                }
              );


              document
                .getElementById(
                  "sprintSelect"
                )
                .addEventListener(
                  "change",
                  updateSprint
                );

            </script>

          </body>

          </html>
          EOF


      - name: Verify dashboard artifact
        run: |
          echo "Checking generated dashboard..."

          grep -q "Sprint Analytics" site/index.html
          grep -q "statusKpis" site/index.html
          grep -q "secondaryStatuses" site/index.html
          grep -q "projectData.statuses" site/index.html
          grep -q "Open Date" site/index.html
          grep -q "Close Date" site/index.html

          echo "Sprint Analytics dashboard verified."


      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site


  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
