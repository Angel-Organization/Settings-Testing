              function renderQualityPriority(
                sprint
              ) {

                const card =
                  document.getElementById(
                    "qualityPriorityCard"
                  );


                const priorityAvailable =
                  (
                    cap("priority")
                    ||
                    projectData
                    .issues
                    .some(
                      issue =>
                        issue.priority
                        &&
                        issue.priority
                        !==
                        "Unspecified"
                    )
                  );


                if (!priorityAvailable) {

                  card.classList.add(
                    "hidden"
                  );

                  return;

                }


                card.classList.remove(
                  "hidden"
                );


                const rows =
                  document.getElementById(
                    "qualityPriorityRows"
                  );


                rows.innerHTML =
                  "";


                projectData
                  .priorities
                  .forEach(
                    priority => {

                      const opened =
                        bugsOpened(
                          sprint,
                          priority
                        );


                      const closed =
                        bugsClosed(
                          sprint,
                          priority
                        );


                      const tr =
                        document
                        .createElement(
                          "tr"
                        );


                      function cell(
                        content,
                        issues = null
                      ) {

                        const td =
                          document
                          .createElement(
                            "td"
                          );


                        td.textContent =
                          content;


                        if (issues) {

                          td.className =
                            "metric-cell";


                          td.onclick =
                            () =>
                              openDrilldown(
                                `${priority} Bugs`,
                                sprint,
                                issues
                              );

                        }


                        tr.appendChild(
                          td
                        );

                      }


                      cell(
                        priority
                      );


                      cell(
                        opened.length,
                        opened
                      );


                      cell(
                        closed.length,
                        closed
                      );


                      cell(
                        closed.length
                        ?
                        (
                          opened.length
                          /
                          closed.length
                        )
                        .toFixed(2)
                        +
                        "x"
                        :
                        "—"
                      );


                      rows.appendChild(
                        tr
                      );

                    }
                  );

              }


              // ===========================================
              // Drilldown
              // ===========================================

              function openDrilldown(
                title,
                sprint,
                issues
              ) {

                document.getElementById(
                  "drilldownTitle"
                ).textContent =
                  title;


                document.getElementById(
                  "drilldownSubtitle"
                ).textContent =
                  (
                    `${sprint.name} · `
                    +
                    `${issues.length} issue`
                    +
                    (
                      issues.length
                      ===
                      1
                      ?
                      ""
                      :
                      "s"
                    )
                  );


                const columns = [

                  {
                    label:
                      "Issue",

                    className:
                      "",

                    render:
                      issue =>
                        `
                        <a
                          class="issue-link"
                          href="${
                            escapeHtml(
                              issue.url
                            )
                          }"
                          target="_blank"
                          rel="noopener noreferrer">

                          ${
                            escapeHtml(
                              issue.repository
                            )
                          }#${
                            issue.number
                          }

                        </a>
                        `
                  },

                  {
                    label:
                      "Title",

                    className:
                      "title-column",

                    render:
                      issue =>
                        escapeHtml(
                          issue.title
                        )
                  },

                  {
                    label:
                      "Type",

                    render:
                      issue =>
                        escapeHtml(
                          issue.issueType
                        )
                  }

                ];


                if (
                  cap("priority")
                  ||
                  projectData
                  .issues
                  .some(
                    issue =>
                      issue.priority
                      &&
                      issue.priority
                      !==
                      "Unspecified"
                  )
                ) {

                  columns.push({

                    label:
                      "Priority",

                    render:
                      issue =>
                        escapeHtml(
                          issue.priority
                        )

                  });

                }


                if (cap("size")) {

                  columns.push({

                    label:
                      "Size",

                    render:
                      issue =>
                        escapeHtml(
                          issue.size
                          ||
                          ""
                        )

                  });

                }


                if (cap("loe")) {

                  columns.push({

                    label:
                      "LOE",

                    render:
                      issue =>
                        (
                          issue.loe
                          ===
                          null
                          ||
                          issue.loe
                          ===
                          undefined
                          ?
                          ""
                          :
                          formatDays(
                            issue.loe
                          )
                        )

                  });

                }


                columns.push({

                  label:
                    "Sprint Entry",

                  render:
                    issue =>
                      escapeHtml(
                        entryDescription(
                          issue,
                          sprint
                        )
                      )

                });


                columns.push({

                  label:
                    "Carried From",

                  render:
                    issue =>
                      escapeHtml(
                        carriedFrom(
                          issue,
                          sprint
                        )
                      )

                });


                columns.push({

                  label:
                    "Open Date",

                  render:
                    issue =>
                      escapeHtml(
                        issue.opened
                        ||
                        ""
                      )

                });


                if (cap("status")) {

                  projectData
                    .statuses
                    .forEach(
                      status => {

                        columns.push({

                          label:
                            status,

                          render:
                            issue =>
                              statusDates(
                                issue,
                                status
                              )
                              .map(
                                escapeHtml
                              )
                              .join(
                                "<br>"
                              )

                        });

                      }
                    );

                }


                columns.push({

                  label:
                    "Close Date",

                  render:
                    issue =>
                      escapeHtml(
                        issue.closed
                        ||
                        ""
                      )

                });


                const header =
                  document.getElementById(
                    "drilldownHeader"
                  );


                header.innerHTML =
                  "";


                columns.forEach(
                  column => {

                    const th =
                      document
                      .createElement(
                        "th"
                      );


                    th.textContent =
                      column.label;


                    header.appendChild(
                      th
                    );

                  }
                );


                const body =
                  document.getElementById(
                    "drilldownRows"
                  );


                body.innerHTML =
                  "";


                issues.forEach(
                  issue => {

                    const row =
                      document
                      .createElement(
                        "tr"
                      );


                    columns.forEach(
                      column => {

                        const td =
                          document
                          .createElement(
                            "td"
                          );


                        if (
                          column.className
                        ) {

                          td.className =
                            column.className;

                        }


                        td.innerHTML =
                          column.render(
                            issue
                          );


                        row.appendChild(
                          td
                        );

                      }
                    );


                    body.appendChild(
                      row
                    );

                  }
                );


                document.getElementById(
                  "drilldownBackdrop"
                )
                .classList
                .remove(
                  "hidden"
                );

              }


              function closeDrilldown() {

                document.getElementById(
                  "drilldownBackdrop"
                )
                .classList
                .add(
                  "hidden"
                );

              }


              document.getElementById(
                "closeDrilldown"
              )
              .onclick =
                closeDrilldown;


              document.getElementById(
                "drilldownBackdrop"
              )
              .addEventListener(
                "click",
                event => {

                  if (
                    event.target.id
                    ===
                    "drilldownBackdrop"
                  ) {

                    closeDrilldown();

                  }

                }
              );


              document.addEventListener(
                "keydown",
                event => {

                  if (
                    event.key
                    ===
                    "Escape"
                  ) {

                    closeDrilldown();

                  }

                }
              );


              // ===========================================
              // Views
              // ===========================================

              function currentView() {

                const params =
                  new URLSearchParams(
                    window.location.search
                  );


                const view =
                  params.get(
                    "view"
                  );


                return [
                  "overview",
                  "flow",
                  "scope",
                  "quality"
                ]
                .includes(view)
                ?
                view
                :
                "overview";

              }


              function setView(
                view,
                updateUrl = true
              ) {

                document
                  .querySelectorAll(
                    ".view"
                  )
                  .forEach(
                    section =>
                      section
                      .classList
                      .remove(
                        "active"
                      )
                  );


                document
                  .getElementById(
                    `view-${view}`
                  )
                  .classList
                  .add(
                    "active"
                  );


                document
                  .querySelectorAll(
                    ".nav-button"
                  )
                  .forEach(
                    button => {

                      button
                      .classList
                      .toggle(
                        "active",
                        button.dataset.view
                        ===
                        view
                      );

                    }
                  );


                if (updateUrl) {

                  updateUrlState({
                    view
                  });

                }


                requestAnimationFrame(
                  () => {

                    flowChart.resize();
                    typeChart.resize();
                    sizeChart.resize();

                  }
                );

              }


              document
                .querySelectorAll(
                  ".nav-button"
                )
                .forEach(
                  button => {

                    button
                    .addEventListener(
                      "click",
                      () =>
                        setView(
                          button.dataset.view
                        )
                    );

                  }
                );


              function updateUrlState(
                changes = {}
              ) {

                const params =
                  new URLSearchParams(
                    window.location.search
                  );


                Object
                  .entries(
                    changes
                  )
                  .forEach(
                    (
                      [
                        key,
                        value
                      ]
                    ) => {

                      if (
                        value
                        ===
                        null
                        ||
                        value
                        ===
                        undefined
                        ||
                        value
                        ===
                        ""
                      ) {

                        params.delete(
                          key
                        );

                      } else {

                        params.set(
                          key,
                          value
                        );

                      }

                    }
                  );


                const query =
                  params.toString();


                history.replaceState(
                  null,
                  "",
                  (
                    window.location.pathname
                    +
                    (
                      query
                      ?
                      `?${query}`
                      :
                      ""
                    )
                  )
                );

              }


              // ===========================================
              // Main rendering
              // ===========================================

              function renderAll() {

                const sprint =
                  selectedSprint();


                if (!sprint) {

                  return;

                }


                renderOverview(
                  sprint
                );


                renderFlow(
                  sprint
                );


                renderScope(
                  sprint
                );


                renderQuality(
                  sprint
                );


                updateUrlState({

                  sprint:
                    sprint.name

                });


                setView(
                  currentView(),
                  false
                );

              }


              // ===========================================
              // Project loading
              // ===========================================

              function loadProject(
                project,
                requestedSprint = null
              ) {

                fetch(
                  `data/${project.slug}.json?v=${cacheVersion}`,
                  {
                    cache:
                      "no-store"
                  }
                )

                .then(
                  response => {

                    if (!response.ok) {

                      throw new Error(
                        `Unable to load ${project.slug}`
                      );

                    }


                    return response.json();

                  }
                )

                .then(
                  data => {

                    projectData =
                      data;


                    const sprintSelect =
                      document.getElementById(
                        "sprintSelect"
                      );


                    sprintSelect.innerHTML =
                      "";


                    if (
                      !data.sprints
                      ||
                      !data.sprints.length
                    ) {

                      const option =
                        document
                        .createElement(
                          "option"
                        );


                      option.textContent =
                        "No sprint data";


                      sprintSelect.appendChild(
                        option
                      );


                      return;

                    }


                    data.sprints.forEach(
                      (
                        sprint,
                        index
                      ) => {

                        const option =
                          document
                          .createElement(
                            "option"
                          );


                        option.value =
                          index;


                        option.textContent =
                          (
                            `${sprint.name} · `
                            +
                            `${sprint.start} – `
                            +
                            `${sprint.end}`
                          );


                        sprintSelect.appendChild(
                          option
                        );

                      }
                    );


                    let index =
                      -1;


                    if (requestedSprint) {

                      index =
                        data.sprints
                        .findIndex(
                          sprint =>
                            sprint.name
                            ===
                            requestedSprint
                        );

                    }


                    if (index < 0) {

                      const today =
                        localToday();


                      index =
                        data.sprints
                        .findIndex(
                          sprint =>
                            today
                            >=
                            sprint.start
                            &&
                            today
                            <=
                            sprint.end
                        );

                    }


                    if (index < 0) {

                      index =
                        Math.max(
                          data.sprints.length
                          -
                          1,
                          0
                        );

                    }


                    sprintSelect.value =
                      index;


                    updateUrlState({

                      project:
                        String(
                          project.number
                        )

                    });


                    renderAll();

                  }
                );

              }


              // ===========================================
              // Bootstrap
              // ===========================================

              fetch(
                `data/projects.json?v=${cacheVersion}`,
                {
                  cache:
                    "no-store"
                }
              )

              .then(
                response => {

                  if (!response.ok) {

                    throw new Error(
                      "Unable to load projects.json"
                    );

                  }


                  return response.json();

                }
              )

              .then(
                projects => {

                  projectsIndex =
                    projects;


                  const select =
                    document.getElementById(
                      "projectSelect"
                    );


                  select.innerHTML =
                    "";


                  projects.forEach(
                    (
                      project,
                      index
                    ) => {

                      const option =
                        document
                        .createElement(
                          "option"
                        );


                      option.value =
                        index;


                      option.textContent =
                        (
                          `${project.title} `
                          +
                          `(${project.issueCount} issues)`
                        );


                      select.appendChild(
                        option
                      );

                    }
                  );


                  const params =
                    new URLSearchParams(
                      window.location.search
                    );


                  const requestedProject =
                    Number(
                      params.get(
                        "project"
                      )
                    );


                  const requestedSprint =
                    params.get(
                      "sprint"
                    );


                  let projectIndex =
                    projects.findIndex(
                      project =>
                        project.number
                        ===
                        requestedProject
                    );


                  if (projectIndex < 0) {

                    projectIndex =
                      0;

                  }


                  if (projects.length) {

                    select.value =
                      projectIndex;


                    loadProject(
                      projects[
                        projectIndex
                      ],
                      requestedSprint
                    );

                  }


                  select.addEventListener(
                    "change",
                    event => {

                      const project =
                        projects[
                          Number(
                            event.target.value
                          )
                        ];


                      loadProject(
                        project
                      );

                    }
                  );


                  setView(
                    currentView(),
                    false
                  );

                }
              );


              document.getElementById(
                "sprintSelect"
              )
              .addEventListener(
                "change",
                renderAll
              );


              // ===========================================
              // Resize behavior
              // ===========================================

              let resizeTimer =
                null;


              window.addEventListener(
                "resize",
                () => {

                  clearTimeout(
                    resizeTimer
                  );


                  resizeTimer =
                    setTimeout(
                      () => {

                        flowChart.resize();
                        typeChart.resize();
                        sizeChart.resize();

                      },
                      150
                    );

                }
              );

            </script>


          </body>

          </html>

          EOF


      - name: Verify dashboard

        run: |

          echo "Checking generated dashboard..."

          grep -q "Sprint Analytics" site/index.html
          grep -q "Overview" site/index.html
          grep -q "Scope &amp; Carryover" site/index.html
          grep -q "Quality" site/index.html
          grep -q "Added Late" site/index.html
          grep -q "Flow by Priority" site/index.html
          grep -q "committedEntry" site/index.html
          grep -q "carryoverEntry" site/index.html

          echo
          echo "Generated data files:"

          ls -la site/data

          echo
          echo "Projects:"

          cat site/data/projects.json


      - name: Upload Pages artifact

        uses: actions/upload-pages-artifact@v3

        with:
          path: ./site


  deploy:

    environment:

      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}


    runs-on: ubuntu-latest

    needs:
      build


    steps:

      - name: Deploy Pages

        id: deployment

        uses: actions/deploy-pages@v4
