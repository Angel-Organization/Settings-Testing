                text-decoration:
                  none;

                font-weight:
                  750;

              }


              .title-column {

                min-width:
                  280px;

                max-width:
                  420px;

                white-space:
                  normal;

                text-align:
                  left;

              }


              @media(
                max-width: 900px
              ) {

                main {

                  padding:
                    0 18px 30px;

                }


                .header {

                  margin:
                    0 -18px;

                  padding-left:
                    18px;

                  padding-right:
                    18px;

                }


                .toolbar {

                  margin:
                    0 -18px 20px;

                  padding:
                    15px 18px;

                }


                select {

                  width:
                    100%;

                  min-width:
                    0;

                }


                .grid-two,
                .grid-equal {

                  grid-template-columns:
                    minmax(
                      0,
                      1fr
                    );

                }

              }

            </style>

          </head>


          <body>

            <main>


              <header class="header">

                <h1>
                  Sprint Analytics
                </h1>


                <nav class="nav">

                  <button
                    class="nav-button"
                    data-view="overview">

                    Overview

                  </button>


                  <button
                    class="nav-button"
                    data-view="flow">

                    Flow

                  </button>


                  <button
                    class="nav-button"
                    data-view="scope">

                    Scope &amp; Carryover

                  </button>


                  <button
                    class="nav-button"
                    data-view="quality">

                    Quality

                  </button>

                </nav>

              </header>


              <div class="toolbar">

                <select
                  id="projectSelect">
                </select>

                <select
                  id="sprintSelect">
                </select>

              </div>


              <!-- ======================================
                   OVERVIEW
                   ====================================== -->

              <section
                id="view-overview"
                class="view">

                <div class="section-title">
                  Sprint Overview
                </div>


                <div
                  id="overviewKpis"
                  class="kpis">
                </div>


                <div class="grid-two">


                  <div class="card">

                    <h3>
                      Work by Type
                    </h3>

                    <div class="chart">

                      <canvas
                        id="typeChart">
                      </canvas>

                    </div>

                  </div>


                  <div
                    id="sizeCard"
                    class="card">

                    <h3>
                      Work by Size
                    </h3>

                    <div class="chart">

                      <canvas
                        id="sizeChart">
                      </canvas>

                    </div>

                  </div>


                </div>


                <div
                  id="overviewLoeCard"
                  class="card">

                  <h3>
                    Effort Overview
                  </h3>

                  <div
                    id="overviewLoeKpis"
                    class="kpis">
                  </div>

                </div>

              </section>


              <!-- ======================================
                   FLOW
                   ====================================== -->

              <section
                id="view-flow"
                class="view">

                <div class="section-title">
                  Workflow
                </div>


                <div
                  id="statusRow"
                  class="status-row">
                </div>


                <div
                  id="flowChartCard"
                  class="card"
                  style="margin-bottom:18px;">

                  <h3>
                    Sprint Flow
                  </h3>

                  <div class="chart">

                    <canvas
                      id="flowChart">
                    </canvas>

                  </div>

                </div>


                <div
                  id="priorityCard"
                  class="card">

                  <h3>
                    Flow by Priority
                  </h3>


                  <div class="table-wrap">

                    <table>

                      <thead>

                        <tr
                          id="priorityHeader">
                        </tr>

                      </thead>


                      <tbody
                        id="priorityRows">
                      </tbody>

                    </table>

                  </div>

                </div>

              </section>


              <!-- ======================================
                   SCOPE
                   ====================================== -->

              <section
                id="view-scope"
                class="view">

                <div class="section-title">
                  Scope &amp; Carryover
                </div>


                <div
                  id="scopeKpis"
                  class="kpis">
                </div>


                <div
                  id="scopeLoeCard"
                  class="card">

                  <h3>
                    Scope by LOE
                  </h3>

                  <div
                    id="scopeLoeKpis"
                    class="kpis">
                  </div>

                </div>

              </section>


              <!-- ======================================
                   QUALITY
                   ====================================== -->

              <section
                id="view-quality"
                class="view">

                <div class="section-title">
                  Quality
                </div>


                <div
                  id="qualityKpis"
                  class="kpis">
                </div>


                <div
                  id="qualityPriorityCard"
                  class="card">

                  <h3>
                    Bugs by Priority
                  </h3>


                  <div class="table-wrap">

                    <table>

                      <thead>

                        <tr>

                          <th>
                            Priority
                          </th>

                          <th>
                            Bugs Opened
                          </th>

                          <th>
                            Bugs Closed
                          </th>

                          <th>
                            C/R
                          </th>

